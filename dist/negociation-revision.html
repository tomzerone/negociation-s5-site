ents de l’enseigne</strong> et son positionnement. Un bon argument part donc des clients de l’enseigne (attentes, rayon, image) avant de parler des qualités du produit."]]},{id:"rapport",title:"2. Un rapport de force particulier",station:"Rapport de force",src:"Diapos 4–6 + notes",blocks:[["p","Le distributeur <strong>contrôle l’accès à son réseau</strong>, mais <strong>n’est pas automatiquement en position de force</strong>."],["q","« Qui dépend le plus de l’autre ? »"],["p","Le rapport de force dépend de la <strong>dépendance</strong>, des <strong>alternatives</strong> et de l’<strong>attractivité de l’offre</strong>."],["ex","Deux fournisseurs, deux positions","<p>Une PME souhaite être référencée par une grande enseigne.</p><ul><li><strong>Fournisseur A</strong> : 40 % de son chiffre d’affaires provient de cette enseigne — et il n’a quasiment aucune autre possibilité de distribution. <strong>Forte dépendance → position de négociation fragile.</strong></li><li><strong>Fournisseur B</strong> : 10 % de son activité seulement — il travaille déjà avec plusieurs distributeurs en parallèle. <strong>Alternatives crédibles → position de négociation solide.</strong></li></ul>"],["h","Les alternatives : une source de pouvoir"],["cols",[["Alternatives du fournisseur","<p>Autres enseignes, autres circuits, autres clients.</p>"],["Alternatives du distributeur","<p>Autres fournisseurs et produits substituables.</p>"]]],["p","<strong>Plus une alternative est crédible, moins la partie dépend de son interlocuteur.</strong>"],["def","BATNA","Solution de repli en cas d’absence d’accord. (C’est la MESORE de la grille de la séance 1.)"],["expl","Comment évaluer une BATNA au contrôle","<p>Une alternative ne pèse que si elle est <strong>crédible</strong> : existe-t-elle vraiment, est-elle disponible à temps, que rapporte-t-elle, quels risques comporte-t-elle ? Dans le cas MarketOne, l’offre RunSphere est une vraie alternative pour TempoRun (commission plus faible, pas d’abonnement), mais elle n’est <strong>ni acceptée ni garantie</strong> (30 à 45 commandes « sans garantie ») : c’est une solution de repli, pas une certitude.</p>"],["trap","N’écris pas « l’enseigne est en position de force car elle est plus grosse ». Le cours attend un raisonnement : qui dépend de qui (part du chiffre d’affaires), quelles alternatives de chaque côté, quelle attractivité de l’offre."],["link",'S’entraîner : <a href="#exercices-rapport">exercice « Qui dépend le plus de l’autre ? »</a> et <a href="#exercices-batna">« Identifier la BATNA »</a>.']]},{id:"negocier",title:"3. Que négocie-t-on ?",station:"Que négocie-t-on ?",src:"Diapos 7–9 + notes",blocks:[["p","Le référencement <strong>ne se réduit pas au prix</strong>. Les sujets peuvent comprendre : les <strong>références et l’assortiment</strong>, le <strong>prix et les volumes</strong>, les <strong>promotions et la logistique</strong>, les <strong>conditions commerciales</strong> et les <strong>actions de développement des ventes</strong>."],["h","Le prix et les volumes"],["p","Une concession tarifaire peut être <strong>liée à une contrepartie</strong> :"],["q","« Si vous vous engagez sur tel volume, je peux envisager telle condition. »"],["p","La concession devient une <strong>variable d’échange</strong> et non une baisse de prix gratuite."],["h","Le trade marketing"],["def","Trade marketing","Démarche qui vise à <strong>développer les ventes avec le distributeur</strong> en tenant compte du circuit."],["p","Le fournisseur peut proposer <strong>promotion, animation, communication ou opération de lancement</strong>. Enjeu : <strong>transformer le référencement en développement commercial</strong>."],["expl","Pourquoi le trade marketing est une monnaie d’échange","Une animation ou une opération de lancement coûte au fournisseur, mais elle sert aussi l’enseigne (trafic, ventes du rayon). C’est donc une concession que l’on peut échanger contre une contrepartie utile : un emplacement, un élargissement de l’assortiment, un calendrier de déploiement…"]]},{id:"processus",title:"4. Un processus organisé",station:"Processus",src:"Diapos 10–11 + notes",blocks:[["p","<strong>La négociation n’est qu’une étape d’une relation commerciale plus large.</strong> Le cadre et les étapes doivent être anticipés."],["flow",["Préparer l’offre","Présenter les produits","Analyser les attentes","Négocier les conditions","Décider du référencement","Formaliser (convention)","Suivre l’accord"],"Les 7 étapes du processus"],["h","De l’accord à l’exécution"],["ul",["La relation commerciale doit être <strong>formalisée</strong>.","La <strong>convention</strong> formalise notamment le résultat de la négociation et les conditions de la relation commerciale.","Le négociateur doit <strong>anticiper ce que l’entreprise devra réellement exécuter</strong>."]],["q","« Un accord doit être acceptable, économiquement viable et réalisable. »"],["expl","Trois conditions à vérifier","<strong>Acceptable</strong> : chaque partie y trouve son compte. <strong>Économiquement viable</strong> : le prix, les remises et les coûts de promotion ou de logistique laissent une marge. <strong>Réalisable</strong> : l’entreprise a la capacité de production, le stock et l’organisation pour livrer ce qu’elle a promis. Dans le cas TempoRun, c’est tout l’enjeu de la capacité (210 unités par mois, tous canaux) et du stock de lancement (75 unités)."]]},{id:"logiques",title:"5. Deux parties, deux logiques",station:"Deux logiques",src:"Diapos 12–13 + notes",blocks:[["table",["Fournisseur","Distributeur / enseigne"],[["Développer ses ventes","Développer les ventes de l’enseigne"],["Obtenir un référencement","Construire une offre adaptée à ses clients"],["Faire référencer plusieurs références","Sélectionner les références les plus pertinentes"],["Obtenir une présence dans un maximum de magasins","Maîtriser l’assortiment et l’espace disponible"],["Atteindre des volumes de vente importants","S’assurer que les volumes correspondent à la demande"],["Préserver sa rentabilité","Obtenir des conditions commerciales compatibles avec son modèle économique"],["Faire connaître et développer sa marque","Répondre aux attentes des consommateurs et à son positionnement"],["<strong>Logique : maximiser le développement de son offre</strong>","<strong>Logique : optimiser l’offre proposée à ses clients</strong>"]]],["ex","Une nouvelle gamme de jus","<ul><li><strong>Fournisseur</strong> : 3 références dans un maximum de magasins.</li><li><strong>Enseigne</strong> : tester 1 référence dans une partie du réseau.</li><li><strong>Espace de négociation</strong> : référencement progressif, avec élargissement éventuel selon les résultats.</li></ul><p>Le négociateur doit <strong>hiérarchiser ses priorités</strong>.</p>"],["expl","Lire l’exemple des jus","Les deux positions semblent opposées (3 références partout contre 1 référence en test), mais l’espace de négociation existe parce que les deux logiques ont un point commun : chacun veut des ventes. Le référencement progressif réconcilie le besoin de preuve de l’enseigne et le besoin de développement du fournisseur, à condition de négocier dès maintenant les <strong>critères d’élargissement</strong>."],["link",'S’entraîner : <a href="#simulateur-referencement">simulateur « Le rendez-vous à la centrale »</a>.']]},{id:"preparer",title:"6. Préparer la négociation",station:"Préparer",src:"Diapo 14 + notes",blocks:[["p","<strong>Reprendre la grille de la séance 1</strong> : Qui ? Pourquoi ? Rapport de force ? Alternatives ? Variables négociables ?"],["ul",["Identifier <strong>objectifs, priorités et limites</strong>.","Préparer <strong>concessions possibles</strong> et <strong>contreparties recherchées</strong>."]],["q","« Que puis-je concéder, dans quelles limites, et contre quoi ? »"],["app","Un tableau de concessions préparé","<table><thead><tr><th>Ce que je peux concéder</th><th>Limite</th><th>Contre quoi</th></tr></thead><tbody><tr><td>Démarrer par 1 référence en test</td><td>Durée du test limitée</td><td>Critères d’élargissement écrits dans la convention</td></tr><tr><td>Une baisse de prix sur la référence test</td><td>Rester au-dessus du seuil minimal</td><td>Engagement de volume</td></tr><tr><td>Financer une animation en magasin</td><td>Budget de lancement</td><td>Mise en avant ou emplacement</td></tr></tbody></table>"]]},{id:"economie",title:"7. Du prix affiché à l’économie réelle",station:"Économie réelle",src:"Diapo 15 + notes",blocks:[["ex","Prix habituel 10 € → condition demandée 9 €","<p>La question n’est pas seulement : « Puis-je accepter 9 € ? »</p><p>Il faut <strong>mesurer ce que rapporte la concession</strong> : volumes, référencement, développement des ventes, etc. <strong>Raisonner sur l’économie globale de la relation.</strong></p>"],["note","Il faut raisonner sur l’économie globale de la relation et <strong>comparer la valeur de la contrepartie au coût réel de la concession</strong>."],["app","Mesurer le coût réel d’un euro de remise (illustration chiffrée)","<p>Hypothèse de la plateforme : coût de revient de 6 € par unité.</p><ul><li>À 10 €, la marge unitaire est de 4 € ; à 9 €, elle tombe à 3 € : <strong>−1 € de prix = −25 % de marge unitaire</strong>.</li><li>Pour garder la même marge totale qu’avec 1 000 unités à 10 € (4 000 €), il faut vendre 4 000 ÷ 3 ≈ <strong>1 334 unités à 9 €</strong>, soit environ +33 % de volume.</li></ul><p>Conclusion : accepter 9 € n’a de sens que si la contrepartie (volume, référencement de références supplémentaires, développement des ventes) vaut <strong>au moins</strong> ce que la remise coûte.</p>"],["link",'S’entraîner : <a href="#exercices-calculs">exercice « Calculs de négociation »</a>.']]},{id:"retenir",title:"À retenir de la séance 3",station:"À retenir",src:"Diapo 16",blocks:[["key",["Le référencement répond à un <strong>besoin commercial de l’enseigne et de ses clients</strong>.","Le rapport de force dépend de la <strong>dépendance réciproque et des alternatives</strong>.","Plusieurs variables sont négociables : <strong>assortiment, prix, volumes, promotion, logistique, trade marketing…</strong>","Une concession doit être <strong>associée à une contrepartie</strong>.","Le négociateur prépare un accord qu’il devra ensuite <strong>pouvoir exécuter</strong>."]]]}]},{id:"s4",num:4,color:"l4",title:"L’agent sportif : négocier pour son client",short:"Agent sportif",src:"Cours 4 — 22 diapositives (Négociation spécifique TC MDEE & BDMRC). Pas de notes personnelles pour cette séance.",lead:"Négocier pour le compte d’un tiers, dans deux relations successives : obtenir le mandat, puis le valoriser auprès d’un club, d’un sponsor ou d’un partenaire. La méthode reste la même ; la difficulté augmente.",question:"« Cette concession est-elle réellement dans l’intérêt de mon client ? »",objectifs:["Comprendre le double rôle de l’agent : obtenir et sécuriser un mandat, puis défendre les intérêts du sportif.","Analyser le rapport de force à partir des alternatives, de la rareté du profil et de l’information.","Distinguer prix et valeur, et construire une proposition de valeur avec une marque.","Formuler des concessions conditionnelles cohérentes avec les intérêts du mandant.","Connaître l’encadrement du contrat d’agent sportif présenté dans le support."],objectifsNote:"Ce support n’a pas de diapositive « Objectifs » : ces objectifs sont reconstitués par la plateforme à partir des diapositives 21 et 22.",sections:[{id:"roles",title:"Un intermédiaire et un représentant : deux relations",station:"Deux relations",src:"Diapos 2–3",blocks:[["ex","Cristiano Ronaldo, Manchester United → Real Madrid (2009)","<p>La négociation ne portait pas uniquement sur le montant du transfert ou sur le salaire du joueur. <strong>Jorge Mendes</strong>, l’agent de Ronaldo, cherchait notamment à obtenir pour son client une part plus favorable des revenus liés aux <strong>droits à l’image</strong>. Le Real Madrid souhaitait au contraire conserver le modèle qu’il appliquait à ses autres grandes vedettes, avec un partage des revenus. Les discussions opposaient donc des <strong>intérêts différents alors même que les deux parties avaient intérêt à conclure</strong> le transfert.</p>"],["p","L’agent sportif est un intermédiaire et un représentant. Il existe donc <strong>deux relations fondamentales</strong> :"],["table",["Relation","Enjeu pour l’agent"],[["Agent ↔ sportif","L’agent doit <strong>obtenir et sécuriser son mandat</strong>."],["Agent ↔ club / sponsor / partenaire","L’agent <strong>utilise ce mandat pour défendre les intérêts du sportif</strong>."]]],["p","L’agent doit donc être capable de passer d’une <strong>logique de vente de ses services</strong> à une <strong>logique de représentation et de négociation pour le compte d’un tiers</strong>."],["q","« L’agent ne négocie pas seulement une opportunité : il négocie au nom et dans l’intérêt de son mandant. »"],["check","Dans le PDF, la phrase de la diapositive 3 est coupée : « L’agent sportif est un intermédiaire et un re[…] ». La suite du support (rôle « intermédiaire → représentant », diapositive 19) indique qu’il s’agit très probablement de « représentant ». Vérifie sur le diaporama original si tu l’as."],["expl","Le vocabulaire à employer","Le <strong>mandant</strong> est la personne qui confie sa représentation (le sportif) ; le <strong>mandat</strong> est la mission confiée à l’agent ; l’agent est le <strong>mandataire</strong> (ce dernier terme n’est pas dans le support, mais il désigne celui qui reçoit le mandat)."]]},{id:"mandat",title:"La relation agent-sportif est elle-même une négociation",station:"Le mandat",src:"Diapos 4–7",blocks:[["ex","Andy Murray et 19 Entertainment (janvier 2009)","<p>Andy Murray choisit de confier sa représentation à 19 Entertainment, la société dirigée par <strong>Simon Fuller</strong>. Le choix est présenté comme une volonté de développer la <strong>dimension internationale</strong> de sa carrière et sa <strong>valeur commerciale</strong>, sur un modèle comparable à celui développé autour de personnalités comme David Beckham.</p>"],["p","<strong>La relation agent-sportif est elle-même une négociation.</strong> Le mandat ne doit donc pas être considéré comme une formalité : il définit les conditions dans lesquelles l’agent pourra exercer sa mission. Il faut notamment clarifier :"],["ul",["ce que l’agent apporte ;","ce que le sportif attend ;","la durée de la relation ;","l’exclusivité éventuelle ;","les engagements respectifs ;","la rémunération."]],["q","« Avant de négocier pour un sportif, l’agent doit réussir à convaincre le sportif de lui confier sa représentation. »"],["ex","Maria Sharapova et Max Eisenbud","<p>Max Eisenbud rencontre Maria Sharapova alors qu’elle est très jeune à l’<strong>IMG Academy</strong> et devient rapidement son <strong>agent exclusif</strong>. Il accompagne ensuite son développement sportif et commercial pendant de nombreuses années ; les sources soulignent son implication dans les contrats commerciaux et dans la <strong>construction de la marque Sharapova</strong>.</p>"],["h","La confiance : une ressource, pas un contrat"],["p","<strong>La confiance devient une ressource de la négociation.</strong> Mais la confiance ne signifie pas que tout doit rester informel. Au contraire, une relation professionnelle durable nécessite de <strong>clarifier les responsabilités et les attentes</strong>. Le sportif doit savoir ce que l’agent s’engage à faire ; l’agent doit savoir ce que son client attend de lui. La qualité de cette relation conditionne ensuite la qualité des négociations conduites avec les partenaires extérieurs."],["q","« La confiance facilite la relation, mais les engagements doivent être clairement définis. »"]]},{id:"force",title:"Rapport de force, alternatives : prix ou valeur ?",station:"Alternatives",src:"Diapos 8–10",blocks:[["p","Le rapport de force dépend de la <strong>dépendance réciproque</strong> et <strong>surtout des alternatives</strong>. L’agent doit donc identifier :"],["ul",["les alternatives de son client ;","les alternatives de l’autre partie ;","la <strong>rareté du profil</strong> du sportif ;","l’<strong>information</strong> dont dispose chaque acteur."]],["p","<strong>Une offre concurrente crédible peut renforcer la capacité de négociation.</strong>"],["dist","Prix ≠ valeur","L’agent doit éviter de confondre prix et valeur : une proposition <strong>financièrement supérieure n’est pas nécessairement meilleure</strong> si elle offre moins de potentiel de développement ou impose davantage de contraintes."],["q","« Plus les alternatives de son client sont crédibles, plus l’agent dispose de marges de négociation. »"],["ex","Michael Jordan et Nike (1984)","<p>Pour le premier grand contrat de Jordan, son agent <strong>David Falk</strong> ne se contente pas de demander combien Nike est prête à payer : il cherche à faire présenter aux entreprises <strong>ce qu’elles peuvent construire autour de Jordan</strong>. Nike propose initialement une rémunération importante accompagnée d’une ligne de chaussures et d’un intéressement aux revenus. Jordan dispose parallèlement d’une <strong>proposition d’Adidas</strong> : Falk utilise les alternatives existantes pour améliorer la proposition de Nike. Le contrat final associe <strong>rémunération, ligne de produits et participation aux revenus</strong>.</p>"],["ex","Paul Pogba, retour à Manchester United (2016)","<p><strong>Mino Raiola</strong> joue un rôle central dans une opération qui implique <strong>plusieurs intérêts</strong> : ceux du joueur, de Manchester United et de la Juventus. Les négociations et les conditions financières de l’opération ont été largement commentées, notamment en raison de la rémunération de l’agent.</p>"],["expl","Ce que l’exemple Pogba ajoute","C’est une négociation <strong>multi-acteurs</strong> (club vendeur, club acheteur, joueur, agent) où la rémunération de l’agent elle-même devient un sujet. C’est l’une des raisons d’être de l’encadrement légal du contrat d’agent présenté plus loin (durée, plafond de rémunération)."]]},{id:"variables",title:"Ne pas réduire la négociation à la rémunération",station:"Variables",src:"Diapo 11",blocks:[["p","La négociation ne doit pas être réduite à la rémunération. L’agent peut négocier différentes variables :"],["ul",["la durée du contrat ;","la rémunération ;","les primes ; les objectifs ;","les conditions d’évolution ;","la place dans le projet sportif ;","certaines clauses contractuelles."]],["p","Il doit donc <strong>hiérarchiser les priorités de son client</strong>."],["q","« L’agent ne défend pas seulement une demande : il défend les intérêts globaux de son client. »"],["expl","Demande ≠ intérêt","La <strong>demande</strong> est ce que le client réclame (« je veux le meilleur salaire ») ; l’<strong>intérêt</strong> est ce qui compte vraiment pour lui (jouer, progresser, être vu par la sélection, rester près de sa famille…). Un agent qui ne défend que la demande peut obtenir un gros salaire… sur le banc."]]},{id:"valeur",title:"Construire une proposition de valeur avec une marque",station:"Proposition de valeur",src:"Diapos 12–14, 16",blocks:[["ex","Serena Williams et Mission Skincare (2009)","<p>Serena Williams devient à la fois <strong>ambassadrice et partenaire au capital</strong> de l’entreprise. Son agente, <strong>Jill Smoller</strong>, et son avocat négocient les conditions. Le partenariat prévoit qu’elle participe au <strong>développement de produits</strong> et puisse percevoir des <strong>royalties</strong> sur les produits développés avec les athlètes. Le contrat ne se limite donc pas à une rémunération en échange de visibilité.</p>"],["p","Dans une négociation avec une marque, l’agent doit <strong>construire une proposition de valeur</strong>. Il doit répondre à deux questions :"],["q","« Qu’est-ce que le sportif apporte à la marque ? »","<p>« Qu’est-ce que la marque peut apporter au sportif ? »</p>"],["expl","Pistes pour répondre aux deux questions","<p><strong>Ce que le sportif apporte</strong> : image, audience, crédibilité auprès d’une communauté, capacité à produire des contenus, présence lors d’événements. <strong>Ce que la marque apporte</strong> : rémunération, visibilité, produits, développement de la propre marque du sportif (collections, royalties, participation au capital comme pour Serena Williams). Ces pistes sont proposées par la plateforme ; le support pose les deux questions.</p>"],["p","L’agent cherche donc à construire une <strong>relation créatrice de valeur pour les deux parties</strong>. La négociation peut porter sur la rémunération, mais également sur l’<strong>utilisation de l’image</strong>, l’<strong>exclusivité</strong>, la <strong>durée</strong>, la <strong>production de contenus</strong>, les <strong>apparitions</strong>, le <strong>développement de produits</strong> ou la <strong>participation à des campagnes</strong>."],["q","« Une bonne négociation ne consiste pas toujours à augmenter le montant payé : elle consiste à élargir la valeur créée par le partenariat. »"],["ex","Naomi Osaka et Stuart Duguid","<p>Avec <strong>Levi’s</strong>, l’accord conclu en 2021 prévoyait notamment que Naomi Osaka puisse <strong>concevoir sa propre collection au moins une fois par an</strong>. Avec <strong>Nike</strong>, les discussions ont également intégré la création d’une <strong>ligne Sportswear</strong> à laquelle Osaka a apporté une forte contribution.</p>"],["ex","Usain Bolt et Puma (2010)","<p>Bolt renouvelle son partenariat avec Puma <strong>jusqu’à la fin de 2013</strong>. Le contrat fait de lui un acteur majeur des <strong>campagnes mondiales</strong> de la marque et prévoit une collaboration autour de produits, notamment la <strong>collection « Bolt »</strong>, à laquelle il participe.</p>"]]},{id:"preparer",title:"Préparer : méthode générale, stratégie adaptée",station:"Préparer",src:"Diapo 15",blocks:[["p","<strong>La méthode générale de préparation reste identique, mais la stratégie doit être adaptée au contexte.</strong> L’agent doit systématiquement analyser :"],["table",["Question","À préciser"],[["Qui décide ?","Le vrai décideur chez le club, le sponsor ou le partenaire"],["Que recherche le partenaire ?","Ses objectifs, ses besoins"],["Quel rapport de force ?","Quelles sont ses alternatives et celles de mon client ?"],["Quelles informations ?","Que savons-nous sur le partenaire ?"],["Quelles variables ?","Que peut-on réellement négocier ?"],["Quelles contreparties ?","Que peut-on obtenir en échange de chaque concession ?"]]],["expl","C’est la grille de la séance 1, adaptée","On retrouve Qui ? Pourquoi ? Rapport de force ? Alternatives ? Informations ? Variables ? — avec une contrainte en plus : toutes les réponses doivent être évaluées <strong>du point de vue du mandant</strong>."]]},{id:"concessions",title:"Concessions : négocier pour un autre",station:"Concessions",src:"Diapo 17",blocks:[["p","L’agent doit préparer ses marges de manœuvre, et doit connaître : les <strong>objectifs</strong> du sportif ; ses <strong>priorités</strong> ; ses <strong>limites</strong> ; ce qu’il <strong>peut concéder</strong> ; ce qu’il <strong>exige en retour</strong>."],["cols",[["À éviter","<p>« Nous pouvons vous accorder cela. »</p>"],["À privilégier","<p>« Nous pouvons envisager cela <strong>si vous nous accordez telle contrepartie</strong>. »</p>"]]],["q","« Cette concession est-elle réellement dans l’intérêt de mon client ? »","<p>C’est ce qui <strong>différencie la négociation par représentation d’une négociation menée pour soi-même</strong>.</p>"],["key",["Une concession doit <strong>avoir une contrepartie</strong> et <strong>rester cohérente avec les intérêts du mandant</strong>."]],["link",'S’entraîner : <a href="#exercices-concessions">exercice « Concession → contrepartie »</a> et <a href="#simulateur-agent">simulateur « Agent d’une jeune basketteuse »</a>.']]},{id:"opportunites",title:"La valeur de l’agent : créer des opportunités",station:"Valeur de l’agent",src:"Diapos 18–19",blocks:[["ex","Roger Federer, Tony Godsick et Team8","<p>En 2013, Federer et son agent Tony Godsick créent l’agence <strong>Team8</strong>. L’objectif n’était pas simplement de gérer les contrats de Federer : l’agence se positionne comme une <strong>structure sélective de représentation</strong> et développe également des projets dans le sport. L’exemple le plus important est la <strong>Laver Cup</strong>, créée à leur initiative et lancée en <strong>2017</strong> ; Godsick a expliqué que le projet nécessitait de faire travailler ensemble différentes organisations et acteurs du tennis autour d’un événement nouveau.</p>"],["flow",["Information","Réseau","Accès aux décideurs","Expertise","Négociation","Construction de projets"],"Les ressources dont peut provenir la valeur de l’agent"],["flow",["Intermédiaire","Représentant","Conseiller","Développeur d’opportunités"],"L’évolution possible de son rôle"],["p","Le métier ne consiste pas uniquement à négocier des contrats existants : un agent peut également chercher à <strong>créer les conditions de nouvelles négociations</strong>."],["q","« L’agent crée de la valeur non seulement en négociant mieux, mais aussi en créant de nouvelles opportunités pour son client. »"]]},{id:"cadre",title:"Le contrat d’agent sportif en France",station:"Cadre légal",src:"Diapo 20 + vérification des notes",blocks:[["p","Imaginons qu’un agent obtienne un mandat particulièrement intéressant auprès d’un sportif et négocie ensuite un contrat important avec un club. Peut-il fixer librement la durée de son mandat, sa rémunération et les conditions de sa représentation ? <strong>Non.</strong>"],["def","Ce que prévoit le Code du sport, selon le support","<p>« Depuis le 5 août 2026, le Code du sport encadre précisément le contrat d’agent sportif. » Le contrat doit notamment préciser :</p><ul><li>les <strong>services</strong> ;</li><li>leur caractère <strong>exclusif ou non</strong> ;</li><li>sa <strong>durée</strong> ;</li><li>la <strong>rémunération de l’agent</strong> ;</li><li>la <strong>partie qui le rémunère</strong>.</li></ul><p>La durée <strong>ne peut excéder trois ans</strong>. La rémunération de l’agent <strong>ne peut excéder 10 %</strong> du contrat ou de l’accord conclu par les parties qu’il a mises en relation, les <strong>fédérations délégataires pouvant fixer un plafond inférieur</strong>.</p>"],["note","Pour le contrôle, retiens <strong>les chiffres et la formulation exacts du support de cours</strong> : 3 ans maximum, 10 % maximum, plafond inférieur possible fixé par les fédérations délégataires."],["expl","Le lien avec la négociation","Ce cadre est une <strong>règle qui limite les possibilités</strong> (la dimension « Cadre » des notions à réinvestir) : dans la première négociation (agent ↔ sportif), la durée et la rémunération du mandat ne sont pas totalement libres. Proposer un mandat de 5 ans ou une commission de 15 % serait hors du cadre présenté par le cours."]]},{id:"synthese",title:"Les deux métiers de l’agent et les notions à réinvestir",station:"À retenir",src:"Diapos 21–22 + notes",blocks:[["table",["","Première négociation : obtenir et sécuriser le mandat","Deuxième négociation : valoriser le mandat"],[["Qui ?","Agent ↔ Sportif","Agent ↔ Club / Sponsor / Partenaire / Organisateur"],["Ce que fait l’agent","Démontrer sa valeur, comprendre les objectifs du sportif, présenter son offre et négocier les conditions de la relation","Défendre les intérêts de son client, comprendre ceux de l’autre partie, identifier les variables négociables et construire un accord"]]],["q","La compétence fondamentale de l’agent","<p>« Comprendre les intérêts de son client, identifier les intérêts de l’autre partie et construire un accord qui <strong>protège le mandant</strong> tout en donnant à l’autre partie <strong>une raison réelle de conclure</strong>. »</p>"],["h","Les notions de négociation à réinvestir"],["table",["Notion","Question à se poser"],[["Rapport de force","Qui dépend de qui ?"],["Alternatives","Que peut faire chaque partie sans l’autre ?"],["Information","Qui sait quoi ?"],["Objectifs","Que cherche réellement chaque acteur ?"],["Variables","Qu’est-ce qui peut être négocié ?"],["Concessions","Que puis-je faire évoluer ?"],["Contreparties","Qu’est-ce que j’obtiens en échange ?"],["Création de valeur","Comment agrandir l’espace du négociable ?"],["Cadre","Quelles règles limitent les possibilités ?"]]],["key",["L’agent sportif constitue une <strong>excellente illustration d’une négociation spécifique</strong> : la méthode générale reste la même, mais la difficulté augmente parce que le négociateur <strong>agit pour le compte d’un tiers</strong> et dans <strong>plusieurs relations successives</strong>.","Les intérêts du mandant doivent guider les choix."]],["h","Les exemples du support, en un coup d’œil"],["table",["Exemple","Ce qu’il illustre"],[["Ronaldo / Jorge Mendes (2009)","Des intérêts divergents sur les droits à l’image alors que les deux parties veulent conclure"],["Murray / 19 Entertainment, Simon Fuller (2009)","Le choix d’une représentation pour développer la carrière internationale et la valeur commerciale"],["Sharapova / Max Eisenbud","La confiance comme ressource, la construction d’une marque"],["Jordan / Nike, David Falk (1984)","L’utilisation d’une offre concurrente (Adidas) et une proposition élargie : rémunération + ligne de produits + revenus"],["Pogba / Mino Raiola (2016)","Une opération à plusieurs intérêts ; la rémunération de l’agent en débat"],["Serena Williams / Mission Skincare, Jill Smoller (2009)","Un partenariat de marque au-delà de la visibilité : capital, produits, royalties"],["Naomi Osaka / Stuart Duguid (Levi’s 2021, Nike)","La création de collections : élargir la valeur créée"],["Usain Bolt / Puma (2010)","Campagnes mondiales et collection « Bolt »"],["Federer, Tony Godsick / Team8, Laver Cup (2013, 2017)","L’agent développeur d’opportunités"]]]]}]}],ae=[{id:"grille",label:"Grille d’analyse",stations:[["s1","grille"],["s3","preparer"],["s4","preparer"]],text:"Créée en séance 1 (9 questions), reprise explicitement en séance 3 (« reprendre la grille de la séance 1 ») et adaptée à l’agent en séance 4. C’est l’outil de départ de tout cas pratique."},{id:"force",label:"Rapport de force",stations:[["s1","grille"],["s3","rapport"],["s4","force"]],text:"Question 6 de la grille (« dépendances, pouvoir de négociation »). Séance 3 : « Qui dépend le plus de l’autre ? » (dépendance, alternatives, attractivité de l’offre). Séance 4 : dépendance réciproque, alternatives, rareté du profil, information."},{id:"batna",label:"Alternatives / BATNA",stations:[["s1","grille"],["s3","rapport"],["s4","force"]],text:"MESORE dans la grille (question 8), BATNA en séance 3 (« solution de repli en cas d’absence d’accord ») ; en séance 4, « plus les alternatives de son client sont crédibles, plus l’agent dispose de marges de négociation »."},{id:"concession",label:"Concession ↔ contrepartie",stations:[["s2","preparer"],["s3","negocier"],["s3","preparer"],["s4","concessions"]],text:"Séance 2 : « une concession ne doit pas être accordée gratuitement ». Séance 3 : « Si vous vous engagez sur tel volume, je peux envisager telle condition » ; « Que puis-je concéder, dans quelles limites, et contre quoi ? ». Séance 4 : « Nous pouvons envisager cela si… » + « est-ce dans l’intérêt de mon client ? »."},{id:"info",label:"Information",stations:[["s1","dimensions"],["s1","grille"],["s4","synthese"]],text:"« Qui sait quoi ? » : information équilibrée ou asymétrique (séance 1), informations disponibles ou manquantes (grille), information de chaque acteur (séance 4). Dans un cas pratique : informations communes vs confidentielles, faits vs hypothèses."},{id:"variables",label:"Variables négociables",stations:[["s1","grille"],["s2","marges"],["s3","negocier"],["s4","variables"]],text:"Prix, volume, délai, service, exclusivité (grille) ; prix, quantités, périmètre, délais, modalités, options, paiement, niveau de service (appels d’offres) ; assortiment, prix, volumes, promotion, logistique, trade marketing (référencement) ; durée, primes, objectifs, évolution, image, contenus, produits (agent)."},{id:"valeur",label:"Prix ≠ valeur",stations:[["s2","conclure"],["s3","economie"],["s4","force"],["s4","valeur"]],text:"La négociation ne consiste pas uniquement à baisser le prix (séance 2) ; raisonner sur l’économie globale de la relation (séance 3) ; une offre financièrement supérieure n’est pas nécessairement meilleure et une bonne négociation élargit la valeur créée (séance 4)."},{id:"acteurs",label:"Qui décide ?",stations:[["s1","dimensions"],["s1","contextes"],["s2","analyser"],["s4","preparer"]],text:"Négociation individuelle ou multi-acteurs (séance 1) ; acteurs d’un appel d’offres (acheteur, candidats, services techniques, achats/financiers, décideurs, utilisateurs) ; « Qui décide ? » chez le partenaire de l’agent."},{id:"cadre",label:"Cadre et règles",stations:[["s1","dimensions"],["s2","conclure"],["s4","cadre"]],text:"Relativement libre ou fortement encadré (séance 1) ; besoin défini, calendrier, exigences, critères, procédure, limites de négociation (séance 2) ; encadrement légal du contrat d’agent (séance 4)."},{id:"objectifs",label:"Objectifs et limites",stations:[["s2","preparer"],["s3","preparer"],["s4","concessions"]],text:"Objectif idéal, cible réaliste, seuil minimal acceptable (séance 2) ; objectifs, priorités et limites (séance 3) ; objectifs, priorités, limites du sportif, ce qu’il peut concéder et ce qu’il exige en retour (séance 4)."}],ss=[{title:"Séance 2 — Ce qu’il faut connaître avant de proposer un prix",text:"La diapositive 25 cite : coût de revient, marge minimale, prix cible, prix maximal acceptable pour l’acheteur, coûts liés aux concessions. Tes notes citent : coût de revient, marge minimale, stock et prix souhaité. La plateforme suit la diapositive ; cite-la au contrôle.",link:"cours-s2-offre"},{title:"Séance 2 — Numérotation de la diapositive 25",text:"Titrée « 3. Construire une offre économiquement viable » alors qu’elle se trouve dans la partie 4 (Construire une offre) : elle est présentée comme le point 4.3.",link:"cours-s2-offre"},{title:"Séance 2 — « Niveau de service » ou « niveau de suivi »",text:"La diapositive 21 liste « le niveau de service » et « l’organisation du suivi » parmi les variables ; tes notes écrivent « niveau de suivi ». Les deux idées sont gardées.",link:"cours-s2-marges"},{title:"Séance 3 — Pas de diapositive « Objectifs »",text:"Les objectifs affichés pour la séance 3 sont reconstitués par la plateforme à partir de la diapositive « À retenir ».",link:"cours-s3"},{title:"Séance 4 — Phrase coupée (diapositive 3)",text:"« L’agent sportif est un intermédiaire et un re[…] » : la fin manque dans le PDF. La diapositive 19 (« intermédiaire → représentant ») suggère « représentant ».",link:"cours-s4-roles"},{title:"Séance 4 — Cadre légal",text:"Le support indique « depuis le 5 août 2026 » : durée du contrat d’agent ≤ 3 ans, rémunération ≤ 10 % (plafond inférieur possible fixé par les fédérations délégataires). Tes notes recommandent de retenir les chiffres et la formulation exacts du support.",link:"cours-s4-cadre"},{title:"Séance 4 — Pas de notes personnelles",text:"Tu n’as pas pris de notes pour cette séance : tout le contenu vient des 22 diapositives.",link:"cours-s4"},{title:"Séance 1 — Format du contrôle",text:"Tes notes indiquent : « question factuelle, avec une réponse qui commence par l’analyse de la situation et la question de savoir comment on résoudrait le problème. À confirmer avec les consignes définitives du contrôle. »",link:"cours-s1-retenir"},{title:"Cas MarketOne / TempoRun — Annexe MarketOne simulée",text:"Le dossier précise que l’annexe confidentielle MarketOne (camp A) n’a pas été fournie dans les photos : c’est une simulation pédagogique cohérente avec le dossier commun, à ne pas présenter comme le document réel du professeur.",link:"cas-marketone"},{title:"Ajouts de la plateforme",text:"Les encadrés marqués « Plateforme » (Pour comprendre, Application, Piège au contrôle) sont des explications et illustrations ajoutées pour t’aider ; les chiffres qui y figurent (ex. coût de revient de 6 € dans l’exemple 10 € → 9 €, notes pondérées A/B) sont des hypothèses. Les cas pratiques autres que MarketOne / TempoRun et les sujets de contrôle blancs sont des entraînements inventés pour la plateforme.",link:"cours"}];var Ee={s1:{rubriques:[["Définitions","<p><strong>Négociation commerciale</strong> : plusieurs parties, des intérêts au moins partiellement divergents, la recherche d’un accord ; échanges sur les conditions de l’accord ; propositions, contre-propositions, concessions et contreparties ; résultat recherché : un accord acceptable pour les parties.</p><p><strong>Négociation spécifique</strong> : négociation dont les modalités sont fortement influencées par les caractéristiques du contexte. Le contexte n’est pas un simple décor.</p>"],["Idée centrale","<p>Le négociateur doit <strong>d’abord analyser la situation</strong>, avant de choisir sa manière de négocier. Question de départ : « Dans quel contexte suis-je en train de négocier ? »</p>"],["Les 4 dimensions","<ul><li><strong>Cadre</strong> : relativement libre (interlocuteurs, rythme, sujets peuvent évoluer) ↔ fortement encadré (règles, délais, procédures, conditions de réponse définis à l’avance).</li><li><strong>Temporalité</strong> : ponctuelle (prise de contact → échanges → accord → contractualisation) ↔ processus formalisé (préparation → candidature/réponse → sélection → négociation → décision → contractualisation ; on ne maîtrise pas toutes les étapes).</li><li><strong>Acteurs</strong> : individuelle (1 vendeur ↔ 1 acheteur) ↔ multi-acteurs (1 vendeur ↔ comité d’achat) ; mise en concurrence (plusieurs vendeurs ↔ 1 acheteur). Qui participe ? qui influence ? qui décide ?</li><li><strong>Information</strong> : relativement équilibrée ↔ asymétrique (budget maximal de l’acheteur ; coût de revient et marge minimale du vendeur). « Qui sait quoi ? »</li></ul>"],["Les 5 contextes et leurs indices","<ul><li><strong>Appel d’offres</strong> : procédure + cahier des charges + échéance.</li><li><strong>Multi-acteurs</strong> : plusieurs interlocuteurs impliqués dans la décision (acheteur → conditions ; financier → budget ; technique → faisabilité ; utilisateur → usage).</li><li><strong>Référencement / grande distribution</strong> : référencement + acheteur/centrale + conditions imposées ou discutées.</li><li><strong>Enchère inversée</strong> : mise en concurrence + mécanisme d’enchère ; le prix peut devenir déterminant ; comprendre le mécanisme avant de participer.</li><li><strong>Sous contraintes</strong> : une contrainte forte qui pèse directement (délai, budget, urgence, réglementation, capacité de production, disponibilité, dépendance à un fournisseur).</li></ul>"],["Grille des 9 questions","<ol><li>Qui ? — parties prenantes, décideurs, influenceurs</li><li>Pourquoi ? — objectifs et intérêts de chacun</li><li>Avec quelles règles ? — cadre et procédure</li><li>Avec quelles informations ? — disponibles / manquantes</li><li>Quels enjeux ? — ce que chacun risque de gagner ou perdre</li><li>Quel rapport de force ? — dépendances, pouvoir de négociation</li><li>Quelles contraintes ? — budget, délai, réglementation…</li><li>Quelles alternatives ? — solutions de repli, MESORE</li><li>Quelles variables négociables ? — prix, volume, délai, service, exclusivité…</li></ol>"],["Piège à éviter","<p>Identifier un contexte sur un mot-clé. Il faut s’appuyer sur les <strong>caractéristiques de la situation</strong> (indices).</p>"]],express:["Une négociation spécifique = une négociation dont les modalités sont fortement influencées par le contexte.","Le contexte n’est pas un simple décor : le négociateur analyse d’abord la situation.","Question de départ : « Dans quel contexte suis-je en train de négocier ? »","4 dimensions : cadre (libre/encadré), temporalité (ponctuelle/processus formalisé), acteurs (individuelle/multi-acteurs), information (équilibrée/asymétrique).","Information asymétrique : « Qui sait quoi ? » — budget maximal de l’acheteur, coût de revient et marge minimale du vendeur.","5 contextes : appel d’offres, multi-acteurs, référencement, enchère inversée, sous contraintes.","Indices : procédure + cahier des charges + échéance ; plusieurs interlocuteurs ; référencement + centrale ; mise en concurrence + mécanisme d’enchère ; contrainte forte.","Grille : Qui ? Pourquoi ? Règles ? Informations ? Enjeux ? Rapport de force ? Contraintes ? Alternatives (MESORE) ? Variables ?","Ne pas chercher un mot-clé : s’appuyer sur les caractéristiques de la situation.","Au contrôle : commencer par l’analyse de la situation, puis dire comment on résoudrait le problème."]},s2:{rubriques:[["Définition","<p><strong>Appel d’offres</strong> : procédure par laquelle un acheteur met plusieurs fournisseurs en concurrence afin de satisfaire un besoin défini. Ce n’est <strong>pas une simple demande de prix</strong> : l’acheteur attend une réponse structurée, dans le respect de règles et de critères définis à l’avance. C’est à la fois une <strong>opportunité commerciale</strong> et un <strong>cadre de contraintes</strong>.</p>"],["La démarche","<p>Analyser la consultation → décider de répondre → identifier les marges de manœuvre → construire une offre → préparer la négociation éventuelle.</p>"],["Acteurs","<p>Acheteur (exprime le besoin, organise) ; entreprises candidates ; services techniques (qualité, conformité) ; services achats ou financiers (prix, conditions contractuelles) ; décideurs ; éventuellement utilisateurs finaux.</p>"],["Informations à relever","<p>Objet du marché, identité de l’acheteur, lieu d’exécution, date limite, durée, quantités/volumes, exigences techniques, documents demandés, critères de sélection, possibilité ou non de négocier, variantes ou options autorisées.</p><p><em>Exemple</em> : maintenance d’ascenseurs, 48 mois, 240 000 € maximum, prix 50 % / valeur technique 50 %.</p>"],["Go / No-Go","<p><strong>Go</strong> (répondre), <strong>No-Go</strong> (renoncer), <strong>Go sous conditions</strong> (poursuivre l’analyse mais obtenir des informations avant de décider).</p><ul><li><strong>Capacité</strong> : compétences, équipements, personnel, qualifications/certifications, références, zone géographique.</li><li><strong>Rentabilité</strong> : coûts de production/exécution, transport, personnel, préparation, sous-traitance, pénalités, trésorerie, marge prévisible. Le chiffre d’affaires ne suffit pas.</li><li><strong>Chances</strong> : adéquation au besoin, références, avantages concurrentiels, concurrence probable, poids du prix, différenciation possible, qualité de l’information.</li></ul>"],["Les 4 catégories","<ul><li><strong>Exigence obligatoire</strong> (qualification, norme, délai maximal, assurance) : non respectée → offre écartée, même moins chère. Ne jamais la présenter comme négociable.</li><li><strong>Critère d’évaluation</strong> + pondération (ex. prix 40 %, technique 40 %, délais 20 %) : oriente la stratégie ; inutile d’être le moins cher si le prix ne pèse que 40 %.</li><li><strong>Élément différenciant</strong> (interlocuteur unique, suivi en ligne, préventif, disponibilité élargie, formation) : seulement s’il répond à un besoin réel.</li><li><strong>Variable négociable</strong> (prix, quantités, périmètre, délais, modalités, options, paiement, niveau de service, suivi, certaines caractéristiques techniques) : à vérifier dans le dossier ; certains appels d’offres exigent une offre complète et définitive.</li></ul>"],["Construire l’offre","<p>Conforme (le socle : une non-conformité ne se compense pas par un argument commercial), adaptée aux critères, <strong>compétitive et rentable</strong>. Connaître : coût de revient, marge minimale, prix cible, prix maximal acceptable pour l’acheteur, coûts des concessions. Intégrer les risques (délai court → astreinte, stocks, véhicules, organisation).</p>"],["Préparer la négociation","<ul><li>Objectifs : <strong>idéal / cible réaliste / seuil minimal acceptable</strong>.</li><li>Arguments reliés aux attentes : montrer le <strong>bénéfice pour l’acheteur</strong>.</li><li>Concessions : jamais gratuites — <strong>pas de concession sans contrepartie</strong>.</li><li>Questions : comprendre les priorités de l’acheteur pour négocier sur les vrais enjeux plutôt que baisser le prix.</li></ul>"]],express:["Appel d’offres = mise en concurrence de plusieurs fournisseurs pour un besoin défini — pas une simple demande de prix.","Démarche : analyser → décider (Go/No-Go) → marges de manœuvre → construire l’offre → préparer la négociation éventuelle.","Go / No-Go / Go sous conditions : capacité, rentabilité, chances de réussite.","Une entreprise peut être intéressée par un marché sans être capable de l’exécuter.","Une offre peut être remportée mais déficitaire si le prix est trop faible ou les contraintes mal évaluées.","4 catégories : exigence obligatoire, critère d’évaluation, élément différenciant, variable négociable.","Une exigence obligatoire non respectée peut faire écarter l’offre, même moins chère.","La pondération oriente la stratégie : si le prix pèse 40 %, pas besoin d’être le moins cher.","Offre conforme, compétitive et rentable : coût de revient, marge minimale, prix cible, prix maximal acceptable, coût des concessions.","Objectif idéal / cible réaliste / seuil minimal ; arguments = bénéfice acheteur ; pas de concession sans contrepartie ; vérifier que la négociation est autorisée."]},s3:{rubriques:[["Définitions","<p><strong>Référencement</strong> : décision d’intégrer un fournisseur et/ou ses produits dans l’offre. <strong>Assortiment</strong> : références effectivement proposées. <strong>Implantation</strong> : présence concrète du produit dans les magasins.</p><p>Question centrale : <strong>le produit répond-il aux besoins des clients de l’enseigne ?</strong> L’enseigne veut une offre cohérente avec son positionnement, qui réponde aux attentes de sa clientèle, avec un intérêt commercial. Le fournisseur doit démontrer la pertinence de son offre.</p>"],["Rapport de force","<p>Le distributeur contrôle l’accès à son réseau mais <strong>n’est pas automatiquement en position de force</strong>. « Qui dépend le plus de l’autre ? » Le rapport de force dépend de la <strong>dépendance</strong>, des <strong>alternatives</strong> et de l’<strong>attractivité de l’offre</strong>.</p><p>Fournisseur A : 40 % de son CA avec l’enseigne, quasi aucune autre distribution → position fragile. Fournisseur B : 10 %, plusieurs distributeurs → position solide.</p>"],["Alternatives / BATNA","<p>Fournisseur : autres enseignes, autres circuits, autres clients. Distributeur : autres fournisseurs, produits substituables. <strong>Plus une alternative est crédible, moins la partie dépend de son interlocuteur.</strong> BATNA = solution de repli en cas d’absence d’accord.</p>"],["Que négocie-t-on ?","<p>Pas seulement le prix : références et assortiment, prix et volumes, promotions et logistique, conditions commerciales, actions de développement des ventes.</p><p><strong>Prix/volumes</strong> : « Si vous vous engagez sur tel volume, je peux envisager telle condition » → la concession devient une variable d’échange. <strong>Trade marketing</strong> : développer les ventes avec le distributeur en tenant compte du circuit (promotion, animation, communication, opération de lancement) pour transformer le référencement en développement commercial.</p>"],["Processus","<p>Préparer l’offre → présenter les produits → analyser les attentes → négocier les conditions → décider du référencement → formaliser (convention) → suivre l’accord. La négociation n’est qu’une étape. La convention formalise le résultat et les conditions de la relation. Un accord doit être <strong>acceptable, économiquement viable et réalisable</strong>.</p>"],["Deux logiques","<p>Fournisseur : <strong>maximiser le développement de son offre</strong> (ventes, plusieurs références, maximum de magasins, volumes, rentabilité, marque). Distributeur : <strong>optimiser l’offre proposée à ses clients</strong> (références pertinentes, maîtrise de l’assortiment et de l’espace, volumes conformes à la demande, conditions compatibles, positionnement).</p><p>Jus : 3 références partout vs 1 référence en test → référencement progressif, élargissement selon résultats. Hiérarchiser ses priorités.</p>"],["Préparer","<p>Reprendre la grille de la séance 1 (Qui ? Pourquoi ? Rapport de force ? Alternatives ? Variables ?), identifier objectifs, priorités et limites, préparer concessions et contreparties. « <strong>Que puis-je concéder, dans quelles limites, et contre quoi ?</strong> »</p>"],["Économie réelle","<p>10 € → 9 € : la question n’est pas seulement « puis-je accepter 9 € ? » mais <strong>ce que rapporte la concession</strong> (volumes, référencement, développement des ventes). Raisonner sur l’économie globale de la relation ; comparer la valeur de la contrepartie au coût réel de la concession.</p>"]],express:["Référencement = intégrer un fournisseur/des produits ; assortiment = références proposées ; implantation = présence concrète en magasin.","Question centrale : le produit répond-il aux besoins des clients de l’enseigne ?","Le distributeur contrôle l’accès au réseau mais n’est pas automatiquement en position de force.","« Qui dépend le plus de l’autre ? » : dépendance, alternatives, attractivité de l’offre.","A : 40 % du CA, pas d’autre circuit → fragile ; B : 10 %, plusieurs distributeurs → solide.","BATNA = solution de repli en cas d’absence d’accord ; plus elle est crédible, moins on dépend de l’autre.","On négocie assortiment, prix, volumes, promotion, logistique, trade marketing…","Concession liée à une contrepartie : « Si vous vous engagez sur tel volume, je peux envisager telle condition. »","Processus en 7 étapes ; la convention formalise ; un accord doit être acceptable, économiquement viable et réalisable.","« Que puis-je concéder, dans quelles limites, et contre quoi ? » ; 10 € → 9 € : raisonner sur l’économie globale."]},s4:{rubriques:[["Double rôle","<p>Intermédiaire et représentant. Deux relations : <strong>agent ↔ sportif</strong> (obtenir et sécuriser le mandat) et <strong>agent ↔ club / sponsor / partenaire</strong> (utiliser le mandat pour défendre les intérêts du sportif). On passe d’une logique de vente de ses services à une logique de représentation pour le compte d’un tiers. L’agent négocie <strong>au nom et dans l’intérêt de son mandant</strong>.</p>"],["Le mandat","<p>La relation agent-sportif est elle-même une négociation : clarifier ce que l’agent apporte, ce que le sportif attend, la durée, l’exclusivité éventuelle, les engagements respectifs, la rémunération. La confiance est une ressource, mais « les engagements doivent être clairement définis ».</p>"],["Rapport de force","<p>Dépendance réciproque et <strong>surtout les alternatives</strong> : alternatives du client, de l’autre partie, rareté du profil, information de chacun. Une offre concurrente crédible renforce la capacité de négociation (Jordan : Adidas → amélioration de l’offre Nike). Plus les alternatives du client sont crédibles, plus l’agent a de marges.</p>"],["Prix ≠ valeur","<p>Une proposition financièrement supérieure n’est pas nécessairement meilleure si elle offre moins de potentiel ou plus de contraintes. Variables : durée, rémunération, primes, objectifs, conditions d’évolution, place dans le projet sportif, clauses. Hiérarchiser les priorités : défendre les <strong>intérêts globaux</strong>, pas seulement une demande.</p>"],["Proposition de valeur","<p>Deux questions : qu’apporte le sportif à la marque ? qu’apporte la marque au sportif ? Variables : rémunération, utilisation de l’image, exclusivité, durée, contenus, apparitions, développement de produits, campagnes. « Une bonne négociation… consiste à <strong>élargir la valeur créée</strong> par le partenariat » (Serena Williams, Osaka, Bolt).</p>"],["Préparation et concessions","<p>Qui décide ? Que recherche le partenaire ? Quel rapport de force (alternatives des deux) ? Quelles informations ? Quelles variables ? Quelles contreparties ? Connaître objectifs, priorités, limites du sportif, ce qu’il peut concéder et ce qu’il exige. Formuler « Nous pouvons envisager cela <strong>si</strong> vous nous accordez telle contrepartie » et se demander : « <strong>Cette concession est-elle réellement dans l’intérêt de mon client ?</strong> »</p>"],["Valeur de l’agent","<p>Information → réseau → accès aux décideurs → expertise → négociation → construction de projets. Rôle : intermédiaire → représentant → conseiller → développeur d’opportunités (Federer, Godsick, Team8, Laver Cup).</p>"],["Cadre légal (selon le support)","<p>Contrat d’agent : services, exclusivité ou non, durée, rémunération, partie qui le rémunère. <strong>Durée ≤ 3 ans</strong> ; <strong>rémunération ≤ 10 %</strong> du contrat conclu par les parties mises en relation ; plafond inférieur possible fixé par les fédérations délégataires.</p>"]],express:["L’agent est intermédiaire et représentant : il négocie au nom et dans l’intérêt de son mandant.","Deux négociations successives : obtenir/sécuriser le mandat (agent ↔ sportif), puis le valoriser (agent ↔ club, sponsor, partenaire).","Le mandat clarifie : apport de l’agent, attentes du sportif, durée, exclusivité, engagements, rémunération.","La confiance facilite la relation, mais les engagements doivent être clairement définis.","Rapport de force : dépendance réciproque et surtout alternatives ; rareté du profil ; information.","Prix ≠ valeur : une offre plus chère n’est pas forcément meilleure (potentiel, contraintes).","Proposition de valeur : ce que le sportif apporte à la marque / ce que la marque apporte au sportif ; élargir la valeur créée.","« Nous pouvons envisager cela si vous nous accordez telle contrepartie. »","« Cette concession est-elle réellement dans l’intérêt de mon client ? » — c’est ce qui distingue la négociation par représentation.","Selon le support : contrat d’agent ≤ 3 ans, rémunération ≤ 10 %, plafond inférieur possible par les fédérations délégataires."]},cas:{title:"Cas MarketOne / TempoRun",rubriques:[["Les parties","<p><strong>TempoRun</strong> : PME française, accessoires de course ; ceinture de running (poche smartphone/clés, deux porte-bidons souples, détails réfléchissants) à 60 € TTC ; vend déjà sur son site ; veut élargir sa distribution. <strong>MarketOne</strong> : marketplace généraliste qui veut enrichir son offre sport et plein air ; a proposé à TempoRun de rejoindre la plateforme.</p>"],["Dossier commun (chiffres)","<ul><li>60 € TTC = 50 € HT (TVA 20 %).</li><li>Commission 15 % du HT = 7,50 € ; abonnement 49 € HT/mois ; publicité sponsorisée 350 € HT/mois, optionnelle, sans garantie.</li><li>Logistique MarketOne 4,50 €/commande (périmètre à confirmer) ; expédition TempoRun estimée 5,80 €.</li><li>Prévision évoquée : 120 commandes/mois, méthode non communiquée.</li><li>Tarifs standards non négociables individuellement ; test de 3 mois, accompagnement, calendrier, suivi discutables sous réserve de validation. Ni ventes, ni classement, ni visibilité garantis.</li><li>Avis : 4,6/5 sur 38 avis, demandes de précisions sur réglage/taille. Rayon : 8 offres comparables, 25 à 75 € TTC, 3 avec deux porte-bidons, emplacements sponsorisés.</li></ul>"],["Annexe TempoRun (confidentiel)","<ul><li>Objectif : nouvelle clientèle sans dépendre excessivement d’une plateforme ; ne pas confondre CA et rentabilité.</li><li><strong>Contribution minimale 14 €/commande</strong> (après fabrication, emballage, commission, expédition ; avant abonnement, pub, retours, personnel, frais généraux).</li><li>Pub : 200 € HT/mois maximum les 3 premiers mois ; pas d’engagement payant avant test.</li><li>Fabrication 21 € ; emballage 1,50 € ; 65 ventes/mois sur le site ; capacité 210 unités/mois tous canaux.</li><li>Stock : 75 unités pour le nouveau canal ; lot de 100 dans 4 semaines ; 25 unités accélérées en 2 semaines à +2,50 €/unité.</li><li>Retours : 8 % (réglage, taille) ; guide amélioré mais seulement 10 commandes depuis.</li><li>RunSphere (repli) : 12 %, pas d’abonnement, expédition 5,20 €, 30–45 commandes sans garantie, réponse sous 3 semaines.</li></ul>"],["Calculs clés","<ul><li>Contribution avec logistique MarketOne : 50 − 7,50 − 21 − 1,50 − 4,50 = <strong>15,50 €</strong>.</li><li>Si TempoRun expédie : 50 − 7,50 − 21 − 1,50 − 5,80 = <strong>14,20 €</strong>.</li><li>RunSphere : 50 − 6 − 21 − 1,50 − 5,20 = <strong>16,30 €</strong>.</li><li>Unité accélérée : −2,50 € → 13,00 € (logistique MarketOne) ou 11,70 € (expédition TempoRun) : <strong>sous le seuil de 14 €</strong>.</li><li>Les contributions ne sont pas des bénéfices nets.</li></ul>"],["Ce que TempoRun doit préparer","<p>Recommandation (GO, GO sous conditions, NO GO) ; objectif prioritaire ; limite économique et limite opérationnelle ; informations à obtenir ; concessions et contreparties ; conditions d’utilisation de RunSphere ; 3 questions à MarketOne ; 2 faiblesses de la position de MarketOne ; l’information adverse qui ferait évoluer la recommandation. Ne pas révéler automatiquement toutes ses informations, sans déformer les faits.</p>"],["Consignes du dossier","<p>Distinguer faits établis, hypothèses et informations manquantes. Ne pas transformer une estimation en garantie. Ne pas supposer qu’une condition standardisée est négociable. Préparer les questions qui sécurisent une décision. Ne pas remettre les annexes à l’autre camp avant la commission contradictoire.</p>"]],express:["60 € TTC = 50 € HT ; commission 15 % = 7,50 € ; abonnement 49 €/mois ; pub 350 €/mois optionnelle.","Contributions : 15,50 € (logistique MarketOne), 14,20 € (TempoRun expédie), 16,30 € (RunSphere).","Seuil TempoRun : 14 €/commande — un garde-fou de gestion, pas un bénéfice net.","Une unité accélérée (−2,50 €) passe sous le seuil : 13,00 € ou 11,70 €.","Budget pub TempoRun : 200 €/mois max, pas avant un test ; la pub MarketOne coûte 350 €.","120 commandes/mois = estimation sans méthode communiquée, pas une garantie.","Stock : 75 unités tout de suite ; 100 dans 4 semaines ; capacité 210/mois tous canaux (65 déjà sur le site).","Retours 8 % (taille/réglage) ; amélioration récente non encore prouvée (10 commandes).","RunSphere = BATNA réelle mais non garantie (30–45 commandes), réponse exigée sous 3 semaines.","Tarifs standards non négociables : négocier test 3 mois, calendrier, accompagnement, suivi, fiche produit, logistique."]}},ts={intro:"La méthode générale est la même dans tous les contextes ; ce qui change, ce sont les règles, les acteurs, l’information et les variables. Ce tableau compare les contextes étudiés, puis rassemble les outils communs à toutes les séances.",contextes:{head:["","Appel d’offres (S2)","Référencement (S3)","Agent sportif (S4)"],rows:[["Cadre","Fortement encadré : besoin défini, procédure, critères, calendrier, limites de négociation","Encadré : conditions imposées ou discutées, processus en 7 étapes, convention","Encadré par la loi (contrat d’agent : durée ≤ 3 ans, rémunération ≤ 10 % selon le support)"],["Temporalité","Processus formalisé : analyser → décider → marges → offre → négociation éventuelle","Processus : préparer l’offre → … → formaliser → suivre l’accord","Deux négociations successives : le mandat, puis sa valorisation"],["Acteurs","Mise en concurrence + acteurs multiples chez l’acheteur (technique, achats, décideurs, utilisateurs)","Fournisseur ↔ acheteur ou centrale d’achat de l’enseigne","Agent, sportif (mandant), club, sponsor, partenaire, organisateur"],["Information","Asymétrique : l’acheteur connaît son budget, le candidat ses coûts","Dépendances et alternatives souvent connues d’un seul côté","Rareté du profil, offres concurrentes, informations sur le partenaire"],["Rapport de force","Concurrence entre candidats ; pondération des critères","« Qui dépend le plus de l’autre ? » : dépendance, alternatives, attractivité","Dépendance réciproque et surtout alternatives ; rareté du profil"],["Ce qui se négocie","Si la procédure le permet : prix, quantités, périmètre, délais, modalités, options, paiement, niveau de service","Assortiment, prix, volumes, promotion, logistique, trade marketing, conditions commerciales","Durée, rémunération, primes, objectifs, évolution, place dans le projet ; image, exclusivité, contenus, produits"],["Piège principal","Présenter comme négociable une exigence obligatoire ; gagner un marché déficitaire","Accepter une baisse de prix sans contrepartie ; promettre ce qu’on ne peut pas exécuter","Confondre prix et valeur ; concéder ce qui n’est pas dans l’intérêt du client"]]},outils:[["La grille d’analyse (S1)","Qui ? Pourquoi ? Règles ? Informations ? Enjeux ? Rapport de force ? Contraintes ? Alternatives (MESORE/BATNA) ? Variables négociables ?"],["Les objectifs (S2)","Objectif idéal, cible réaliste, seuil minimal acceptable — fixés avant la négociation."],["Le prix (S2)","Coût de revient, marge minimale, prix cible, prix maximal acceptable pour l’acheteur, coûts des concessions."],["La concession conditionnelle (S2, S3, S4)","« Si vous vous engagez sur tel volume, je peux envisager telle condition » ; « Nous pouvons envisager cela si vous nous accordez telle contrepartie. »"],["La question des limites (S3)","« Que puis-je concéder, dans quelles limites, et contre quoi ? »"],["L’argument (S2)","Relier une caractéristique à un bénéfice pour l’acheteur, en lien avec ses attentes."],["Les questions (S2)","Comprendre les priorités de l’autre pour négocier sur les vrais enjeux plutôt que réduire le prix."],["L’économie globale (S3)","Comparer la valeur de la contrepartie au coût réel de la concession."],["La proposition de valeur (S4)","Ce que j’apporte à l’autre / ce qu’il m’apporte ; élargir la valeur créée."],["L’exécution (S3)","Un accord doit être acceptable, économiquement viable et réalisable."]]},de=[{t:"Accord acceptable",s:"s1",d:"Résultat recherché par une négociation commerciale : un accord que chaque partie peut accepter."},{t:"Acteurs (dimension)",s:"s1",d:"Une des quatre dimensions du contexte : négociation individuelle (1 vendeur ↔ 1 acheteur) ou multi-acteurs (comité d’achat) ; mise en concurrence (plusieurs vendeurs ↔ 1 acheteur)."},{t:"Agent sportif",s:"s4",d:"Intermédiaire et représentant qui obtient un mandat auprès d’un sportif puis négocie en son nom et dans son intérêt avec des clubs, sponsors, partenaires ou organisateurs."},{t:"Alternatives",s:"s3",d:"Solutions dont dispose une partie si l’accord échoue. Fournisseur : autres enseignes, circuits, clients ; distributeur : autres fournisseurs, produits substituables. Plus elles sont crédibles, moins on dépend de l’autre."},{t:"Appel d’offres",s:"s2",d:"Procédure par laquelle un acheteur met plusieurs fournisseurs en concurrence afin de satisfaire un besoin défini. Indice : procédure + cahier des charges + échéance."},{t:"Assortiment",s:"s3",d:"Références effectivement proposées par l’enseigne."},{t:"BATNA",s:"s3",d:"Solution de repli en cas d’absence d’accord (Best Alternative To a Negotiated Agreement). Équivalent français : MESORE.",note:"Développé du sigle ajouté par la plateforme."},{t:"Cadre (dimension)",s:"s1",d:"Négociation relativement libre (les échanges peuvent évoluer) ou fortement encadrée (règles, délais, procédures, conditions de réponse définis à l’avance)."},{t:"Cahier des charges",s:"s1",d:"Document auquel le vendeur doit répondre dans un appel d’offres ; il précise le besoin et les exigences."},{t:"Centrale d’achat",s:"s1",d:"Interlocuteur du fournisseur dans le référencement en grande distribution, avec ou à la place de l’acheteur de l’enseigne."},{t:"Comité d’achat",s:"s1",d:"Groupe de décideurs (acheteur, financier, technique…) face auquel le vendeur négocie : configuration multi-acteurs."},{t:"Concession",s:"s2",d:"Ce qu’une partie accepte de céder. Elle ne doit pas être accordée gratuitement : pas de concession sans contrepartie."},{t:"Conformité",s:"s2",d:"Respect précis des exigences du dossier. Socle de l’offre : une non-conformité ne peut pas être compensée par un argument commercial."},{t:"Contexte",s:"s1",d:"Caractéristiques du cadre dans lequel se déroule la négociation ; il influence la manière dont elle est organisée et conduite. « Le contexte n’est pas un simple décor. »"},{t:"Contrepartie",s:"s2",d:"Ce que l’on obtient en échange d’une concession."},{t:"Contribution par commande",s:"cas",d:"Dans le cas TempoRun : ce qui reste du prix HT après fabrication, emballage, commission et expédition/fulfilment, avant abonnement, publicité, retours, personnel et frais généraux. Ce n’est pas un bénéfice net."},{t:"Convention",s:"s3",d:"Document qui formalise notamment le résultat de la négociation et les conditions de la relation commerciale entre fournisseur et enseigne."},{t:"Coût de revient",s:"s2",d:"Coût de production ou d’exécution que l’entreprise doit connaître avant de proposer un prix. Information souvent confidentielle (asymétrie)."},{t:"Création de valeur",s:"s4",d:"Agrandir l’espace du négociable : élargir ce que le partenariat apporte aux deux parties plutôt que seulement augmenter un montant."},{t:"Critère d’évaluation",s:"s2",d:"Élément sur lequel l’acheteur compare les offres, avec sa pondération (ex. prix 40 %, valeur technique 40 %, délais 20 %)."},{t:"Dépendance",s:"s3",d:"Mesure de ce qu’une partie perdrait sans l’autre (ex. part du chiffre d’affaires réalisée avec une enseigne). Forte dépendance → position fragile."},{t:"Élément différenciant",s:"s2",d:"Ce qui rend l’offre plus attractive (interlocuteur unique, suivi en ligne, préventif, disponibilité élargie, formation…). Doit répondre à un besoin réel."},{t:"Enchère inversée",s:"s1",d:"L’acheteur met plusieurs fournisseurs en concurrence selon un mécanisme défini ; ils peuvent modifier leurs propositions pendant une période déterminée. Indice : mise en concurrence + mécanisme d’enchère."},{t:"Exigence obligatoire",s:"s2",d:"Condition de la consultation (qualification, norme, délai maximal, assurance…). Non respectée, elle peut faire écarter l’offre. Ne jamais la présenter comme négociable."},{t:"Exclusivité",s:"s4",d:"Variable négociable : exclusivité du mandat de l’agent, ou exclusivité accordée à une marque. Le contrat d’agent doit préciser le caractère exclusif ou non des services."},{t:"Go / No-Go",s:"s2",d:"Décision de répondre (Go), de renoncer (No-Go) ou de poursuivre l’analyse en obtenant d’abord des informations (Go sous conditions)."},{t:"Implantation",s:"s3",d:"Présence concrète du produit dans les magasins."},{t:"Information asymétrique",s:"s1",d:"Une partie possède des informations importantes auxquelles l’autre n’a pas accès (budget maximal de l’acheteur ; coût de revient et marge minimale du vendeur). « Qui sait quoi ? »"},{t:"Mandant",s:"s4",d:"Personne qui confie sa représentation (le sportif). L’agent négocie au nom et dans l’intérêt de son mandant."},{t:"Mandat",s:"s4",d:"Mission confiée par le sportif à l’agent. Il définit les conditions de la mission : apport de l’agent, attentes, durée, exclusivité, engagements, rémunération."},{t:"Marge de manœuvre",s:"s2",d:"Ce que le négociateur peut réellement faire évoluer. En appel d’offres, on la trouve en distinguant exigences, critères, éléments différenciants et variables négociables."},{t:"Marge minimale",s:"s2",d:"Marge en dessous de laquelle l’offre n’est plus viable ; avec le coût de revient, elle fixe le plancher du prix."},{t:"MESORE",s:"s1",d:"Meilleure solution de rechange : solution de repli si la négociation échoue (question 8 de la grille). Équivalent de la BATNA.",note:"Développé du sigle ajouté par la plateforme."},{t:"Négociation commerciale",s:"s1",d:"Plusieurs parties, des intérêts au moins partiellement divergents, la recherche d’un accord ; échanges sur les conditions ; propositions, contre-propositions, concessions, contreparties ; accord acceptable."},{t:"Négociation par représentation",s:"s4",d:"Négociation menée pour le compte d’un tiers (le mandant). Chaque concession doit rester cohérente avec les intérêts du mandant."},{t:"Négociation ponctuelle",s:"s1",d:"Échanges concentrés sur une période courte : prise de contact → échanges → accord → contractualisation."},{t:"Négociation sous contraintes",s:"s1",d:"Négociation dominée par une contrainte forte (délai, budget, urgence, réglementation, capacité de production, disponibilité, dépendance à un fournisseur)."},{t:"Négociation spécifique",s:"s1",d:"Négociation dont les modalités sont fortement influencées par les caractéristiques du contexte dans lequel elle se déroule."},{t:"Objectif idéal / cible réaliste / seuil minimal",s:"s2",d:"Les trois niveaux d’objectifs à définir avant de négocier : le meilleur résultat espéré, ce qu’on vise raisonnablement, la limite en dessous de laquelle on ne conclut pas."},{t:"Pondération",s:"s2",d:"Poids de chaque critère dans la note d’un appel d’offres ; elle donne une indication sur la stratégie à adopter."},{t:"Processus formalisé",s:"s1",d:"Négociation inscrite dans plusieurs étapes organisées (préparation → candidature/réponse → sélection → négociation → décision → contractualisation) ; le négociateur ne les maîtrise pas toutes."},{t:"Proposition de valeur",s:"s4",d:"Réponse à deux questions : qu’apporte le sportif à la marque, qu’apporte la marque au sportif ? Elle fonde une relation créatrice de valeur pour les deux."},{t:"Prix cible",s:"s2",d:"Prix visé, entre le plancher (coût de revient + marge minimale) et le prix maximal acceptable pour l’acheteur."},{t:"Rapport de force",s:"s3",d:"Pouvoir de négociation de chaque partie ; il dépend de la dépendance réciproque, des alternatives et de l’attractivité de l’offre (et, pour un sportif, de la rareté de son profil)."},{t:"Référencement",s:"s3",d:"Décision d’intégrer un fournisseur et/ou ses produits dans l’offre d’une enseigne."},{t:"Temporalité (dimension)",s:"s1",d:"Négociation ponctuelle ou processus formalisé."},{t:"Trade marketing",s:"s3",d:"Démarche visant à développer les ventes avec le distributeur en tenant compte du circuit : promotion, animation, communication, opération de lancement."},{t:"Variable négociable",s:"s1",d:"Ce qui peut être discuté dans la négociation : prix, volume, délai, service, exclusivité… (en appel d’offres, seulement si la procédure le permet)."}];var zt=[["Définis la négociation commerciale (4 éléments du cours).","Plusieurs parties, des intérêts <strong>au moins partiellement divergents</strong> et la recherche d’un accord ; les parties échangent sur les conditions de l’accord ; elle mobilise propositions, contre-propositions, concessions et contreparties ; le résultat recherché est un <strong>accord acceptable pour les parties</strong>."],["Qu’est-ce qu’une négociation spécifique ?","Une négociation dont les <strong>modalités sont fortement influencées par les caractéristiques du contexte</strong> dans lequel elle se déroule."],["Complète : « Le contexte n’est pas… »","« … un simple décor. » Il influence la manière dont la négociation est organisée et conduite."],["Quelle est l’idée centrale du module ?","<strong>Le négociateur doit d’abord analyser la situation</strong> (avant de choisir sa manière de négocier)."],["Quelle est la question de départ du négociateur ?","« Dans quel contexte suis-je en train de négocier ? »"],["Quelles sont les quatre dimensions qui caractérisent un contexte ?","Le <strong>cadre</strong> (libre ↔ encadré), la <strong>temporalité</strong> (ponctuelle ↔ processus formalisé), les <strong>acteurs</strong> (individuelle ↔ multi-acteurs), l’<strong>information</strong> (équilibrée ↔ asymétrique)."],["Qu’est-ce qu’une négociation fortement encadrée ?","Une partie du processus est <strong>définie à l’avance</strong> : règles, délais, procédures ou conditions de réponse doivent être respectés. Ex. : appel d’offres, référencement, procédure d’achat, enchère inversée."],["Qu’est-ce qu’une négociation relativement libre ?","Le cadre laisse une marge de manœuvre : interlocuteurs, rythme, sujets, propositions et contre-propositions <strong>peuvent évoluer</strong>."],["Étapes d’une négociation ponctuelle ?","Prise de contact → échanges → accord → contractualisation."],["Étapes d’un processus formalisé ?","Préparation → candidature/réponse → sélection → négociation → décision → contractualisation. Le négociateur ne maîtrise pas nécessairement toutes les étapes."],["Trois configurations d’acteurs du cours ?","Individuelle (1 vendeur ↔ 1 acheteur) ; comité / multi-acteurs (1 vendeur ↔ comité d’achat) ; mise en concurrence (plusieurs vendeurs ↔ 1 acheteur)."],["Que faut-il identifier dans une négociation multi-acteurs ?","Qui participe ? Qui décide ? Quels sont les rôles ? (et, d’après tes notes, qui influence). Distinguer utilisateurs, prescripteurs, acheteurs, influenceurs, décideurs."],["Information équilibrée : les parties savent-elles la même chose ?","Non : elles disposent d’informations <strong>assez proches</strong> sur les principaux éléments, sans savoir exactement la même chose."],["Donne deux exemples d’information asymétrique.","Le <strong>budget maximal de l’acheteur</strong> ; le <strong>coût de revient et la marge minimale du vendeur</strong>."],["Quelle est la question clé de la dimension « information » ?","« Qui sait quoi ? »"],["Les cinq contextes spécifiques du cours ?","Appel d’offres, négociation multi-acteurs, grande distribution / référencement, enchère inversée, négociation sous contraintes."],["Indice d’un appel d’offres ?","Procédure + cahier des charges + échéance."],["Indice d’un référencement ?","Référencement + acheteur/centrale + conditions imposées ou discutées."],["Indice d’une enchère inversée ?","Mise en concurrence + mécanisme d’enchère."],["Indice d’une négociation sous contraintes ?","Une contrainte forte qui pèse directement sur la négociation (délai, budget, urgence, réglementation, capacité, disponibilité, dépendance à un fournisseur)."],["Enchère inversée : que doit faire le négociateur avant de participer ?","<strong>Comprendre le mécanisme</strong> avant de décider de sa participation ; le prix peut y devenir particulièrement déterminant."],["Multi-acteurs : préoccupations types de chaque interlocuteur ?","Acheteur → conditions commerciales ; financier → budget ; technique → faisabilité ; utilisateur → usage."],["Cite les 9 questions de la grille d’analyse.","Qui ? Pourquoi ? Avec quelles règles ? Avec quelles informations ? Quels enjeux ? Quel rapport de force ? Quelles contraintes ? Quelles alternatives ? Quelles variables négociables ?"],["Grille : que cherche-t-on avec « Quel rapport de force ? »","Les <strong>dépendances</strong> et le <strong>pouvoir de négociation</strong>."],["Grille : que cherche-t-on avec « Quelles alternatives ? »","Les <strong>solutions de repli</strong>, la <strong>MESORE</strong>."],["Grille : que cherche-t-on avec « Quels enjeux ? »","Ce que chacun <strong>risque de gagner ou perdre</strong>."],["Activité du cours : un client doit remplacer une machine en panne sous 48 heures. Type ?","Négociation <strong>sous contrainte</strong> : une contrainte forte (délai) influence la négociation."],["Activité du cours : un commercial présente son offre à l’acheteur, au financier et au technique. Type ?","<strong>Comité d’achat</strong> (multi-acteurs) : plusieurs interlocuteurs dans la décision."],["Consigne de l’activité pour identifier un type de négociation ?","Ne pas chercher uniquement un mot-clé : s’appuyer sur les <strong>caractéristiques de la situation</strong> (relever un indice)."],["Format de l’évaluation annoncé (d’après tes notes) ?","Question factuelle, avec une réponse qui commence par l’<strong>analyse de la situation</strong> puis <strong>comment on résoudrait le problème</strong> (à confirmer)."]],Bt=[["Définis l’appel d’offres.","Procédure par laquelle un acheteur <strong>met plusieurs fournisseurs en concurrence</strong> afin de satisfaire un <strong>besoin défini</strong>."],["Un appel d’offres est-il une demande de prix ?","Non : l’acheteur attend une <strong>réponse structurée à un besoin</strong>, dans le respect de règles et de critères préalablement définis."],["« Un appel d’offres est à la fois… »","« … une opportunité commerciale et un cadre de contraintes. »"],["Les 5 étapes de la démarche (séance 2) ?","Analyser la consultation → décider de répondre → identifier les marges de manœuvre → construire une offre → préparer la négociation éventuelle."],["Sur quoi peut porter un appel d’offres ?","Un produit, une prestation de service, des travaux, une solution technique, une prestation globale associant plusieurs éléments."],["Critères qui peuvent intéresser l’acheteur ?","Prix, qualité, valeur technique, délais, sécurité, fiabilité, performance environnementale, accompagnement."],["Les acteurs d’un appel d’offres ?","L’acheteur, les entreprises candidates, les services techniques, les services achats ou financiers, les décideurs, éventuellement les utilisateurs finaux."],["Rôle des services techniques dans un appel d’offres ?","Vérifier la <strong>qualité et la conformité</strong> des solutions."],["Cite au moins 8 informations essentielles à relever dans une consultation.","Objet, identité de l’acheteur, lieu d’exécution, date limite, durée, quantités/volumes, exigences techniques, documents demandés, critères de sélection, possibilité de négocier, variantes/options."],["Exemple des ascenseurs : durée, montant, critères ?","48 mois ; montant maximal de 240 000 € ; prix 50 %, valeur technique 50 %."],["Go, No-Go, Go sous conditions : définitions ?","Go : répondre. No-Go : renoncer. Go sous conditions : poursuivre l’analyse mais <strong>obtenir certaines informations</strong> avant une décision définitive."],["Les trois vérifications avant de décider de répondre ?","La <strong>capacité</strong> de l’entreprise, la <strong>rentabilité</strong> potentielle, les <strong>chances de réussite</strong>."],["Complète : « Une entreprise peut être intéressée par un marché… »","« … sans être réellement capable de l’exécuter. »"],["Pourquoi le chiffre d’affaires attendu ne suffit-il pas ?","Il faut estimer les coûts (production/exécution, transport, personnel, préparation, sous-traitance, pénalités), les besoins de trésorerie et la marge prévisible : une offre <strong>remportée peut être déficitaire</strong>."],["Éléments pour évaluer ses chances de réussite ?","Adéquation offre/besoin, références, avantages concurrentiels, niveau de concurrence, poids du prix dans la notation, possibilité de se différencier, qualité des informations disponibles."],["Quand une rentabilité modérée peut-elle être acceptée ?","Si l’<strong>intérêt stratégique est réel</strong> (potentiel commercial : développement, références)."],["Les 4 catégories d’éléments à distinguer ?","Exigence obligatoire, critère d’évaluation, élément différenciant, variable négociable."],["À quel moment l’entreprise commence-t-elle réellement à préparer la négociation ?","À l’étape « <strong>identifier les marges de manœuvre</strong> »."],["Exemples d’exigences obligatoires ?","Une qualification, une norme, un délai maximal, une assurance…"],["Que risque une offre qui ne respecte pas une exigence essentielle ?","D’être <strong>écartée, même si elle présente un prix intéressant</strong>."],["Que dit la pondération des critères ?","Elle donne une <strong>indication sur la stratégie</strong> à adopter."],["Prix à 40 % : faut-il être le moins cher ?","Pas nécessairement : on peut améliorer sa note par une meilleure organisation, des délais plus courts, une méthode plus fiable, une assistance plus performante, une meilleure qualité de suivi."],["Exemples d’éléments différenciants ?","Interlocuteur unique, outil de suivi en ligne, intervention préventive, disponibilité élargie, formation des utilisateurs…"],["Limite de la différenciation ?","Elle doit répondre à un <strong>besoin réel de l’acheteur

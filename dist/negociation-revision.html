de négocier. Ne révèle pas l’annexe à l’autre camp avant le débrief.</p>",camps:[{id:"A",name:"CycloPro Mobilités",label:"Camp A — CycloPro (candidat)",color:"l4",mission:"Remporter ce premier marché public sans sacrifier la rentabilité : préparer objectifs, arguments, concessions et questions pour l’entretien de négociation.",annexe:"<h3>Coûts et prix</h3><ul><li>Coût complet : <strong>46 € par vélo et par mois</strong> (amortissement du vélo et de la batterie, entretien, assurance, gestion), dont <strong>1,50 €</strong> pour le casque et l’antivol.</li><li>Seuil minimal acceptable fixé par la direction : <strong>51 € par vélo et par mois</strong> pour le périmètre complet (environ 10 % de marge).</li><li>Offre déposée : 58 € ; prix cible en négociation : <strong>56 €</strong>.</li><li>Coût de préparation de la réponse : 1 500 €.</li></ul><h3>Organisation</h3><ul><li>Six vélos de réserve : remplacement garanti en <strong>48 heures</strong>. Passer à <strong>24 heures</strong> exigerait un technicien d’astreinte : surcoût estimé de <strong>3 € par vélo et par mois</strong>.</li><li>Trois techniciens, occupés à 70 % ; ce marché représenterait environ 20 % de charge supplémentaire.</li><li>Deux sessions de formation incluses (coût interne : 600 € au total).</li></ul><h3>Enjeux et alternatives</h3><ul><li>Premier marché public : une référence auprès d’une ville permettrait de répondre aux <strong>deux consultations</strong> attendues dans le département l’an prochain.</li><li>Deux contrats d’entreprises privées en discussion (30 vélos au total), <strong>non signés</strong>.</li><li>Rumeur non vérifiée : VéloFlotte, acteur national, pratiquerait des prix autour de 52 €, avec une maintenance sous-traitée et un remplacement en 72 heures.</li></ul>"},{id:"B",name:"Ville de Montferrand",label:"Camp B — la Ville (acheteur)",color:"l1",mission:"Obtenir une offre qui tienne dans le budget voté, sans dégrader la qualité de service attendue, dans le respect du règlement de la consultation.",annexe:'<h3>Budget</h3><p>Budget voté pour ce marché : <strong>100 000 € HT</strong> sur 36 mois (le montant maximal affiché de 110 000 € inclut une marge de sécurité). Soit environ 55,55 € par vélo et par mois pour 50 vélos.</p><h3>Classement provisoire (note sur 100)</h3><table class="calc"><thead><tr><th>Candidat</th><th>Prix / vélo / mois</th><th>Note prix (40)</th><th>Technique (40)</th><th>Délai (20)</th><th>Total</th></tr></thead><tbody><tr><td>CycloPro</td><td>58 €</td><td>35,9</td><td>32 (16/20)</td><td>20 (48 h)</td><td><strong>87,9</strong></td></tr><tr><td>Mobilia</td><td>57 €</td><td>36,5</td><td>26 (13/20)</td><td>13,3 (72 h)</td><td>75,8</td></tr><tr><td>VéloFlotte</td><td>52 €</td><td>40</td><td>22 (11/20)</td><td>13,3 (72 h)</td><td>75,3</td></tr></tbody></table><p class="small">Note prix = 40 × prix le plus bas ÷ prix du candidat ; délai = 20 × 48 ÷ délai proposé.</p><h3>Attentes internes</h3><ul><li><strong>Service technique</strong> : fiabilité et rapidité de remplacement ; lors du précédent contrat, des vélos sont restés immobilisés jusqu’à dix jours, provoquant des plaintes d’agents.</li><li><strong>DRH</strong> : sécurité des agents ; au moins deux sessions de formation.</li><li><strong>Élus</strong> : un lancement visible au printemps, avec une communication sur la mobilité durable.</li><li><strong>Finances</strong> : tenir le budget voté.</li></ul><h3>Marges de manœuvre</h3><ul><li>La Ville a acheté <strong>50 casques</strong> pour un projet abandonné : l’option casque peut être retirée du marché.</li><li>Le nombre de vélos peut descendre à 46, mais le service technique le déconseille.</li><li>Relancer une consultation repousserait le lancement après le printemps.</li></ul>'}],steps:[{id:"v-contexte",camp:null,title:"Situer le contexte",seances:["s1","s2"],q:"Quel est le contexte de cette négociation ? Caractérise-le avec les dimensions du cours.",keys:["Appel d’offres : procédure + cahier des charges + échéance, mise en concurrence","Fortement encadré : exigences, critères pondérés, négociation limitée par le règlement","Processus formalisé : réponse → sélection → négociation → décision","Multi-acteurs côté acheteur : commande publique, service technique, DRH, élus, finances","Information asymétrique : budget de la Ville / coûts du candidat"],model:"<p>C’est un <strong>appel d’offres</strong> (besoin défini, critères pondérés, exigences, échéance, mise en concurrence de trois candidats) avec une <strong>phase de négociation autorisée</strong> par le règlement. Le cadre est <strong>fortement encadré</strong> : on ne négocie que le prix, le délai de remplacement, les modalités d’exécution et les options ; les exigences (72 heures maximum, entretien trimestriel, livraison avant le 1er mars, assurance) restent obligatoires. La temporalité est un <strong>processus formalisé</strong>. Côté acheteur, la négociation est <strong>multi-acteurs</strong> : commande publique, service technique, DRH, et derrière eux les élus et les finances. L’information est <strong>asymétrique</strong> : la Ville connaît son budget et le classement ; CycloPro connaît ses coûts et son seuil.</p>",pitfalls:["Oublier que la négociation ne peut porter que sur ce que le règlement prévoit."]},{id:"v-gonogo",camp:"A",title:"Le Go était-il justifié ?",seances:["s2"],q:"Justifie la décision de CycloPro de répondre (Go), en examinant capacité, rentabilité et chances de réussite. Chiffre l’offre déposée et la marge.",keys:["Capacité : vélos de réserve, 3 techniciens à 70 % + 20 % de charge, zone couverte","Rentabilité : 58 − 46 = 12 € par vélo et par mois, soit 21 600 € sur 36 mois (offre : 104 400 € HT)","Seuil 51 € : marge de manœuvre de 7 € par vélo et par mois","Chances : délai 48 h et formation incluse → bons points technique et délai ; prix pèse 40 %","Intérêt stratégique : première référence publique (deux consultations attendues)"],model:"<p><strong>Capacité</strong> : CycloPro a les vélos, six vélos de réserve et trois techniciens occupés à 70 % ; le marché ajoute environ 20 % de charge : c’est absorbable. <strong>Rentabilité</strong> : offre de 58 € × 50 vélos × 36 mois = <strong>104 400 € HT</strong> ; marge de 58 − 46 = 12 € par vélo et par mois, soit 21 600 € sur la durée, pour un coût de réponse de 1 500 €. Le seuil de 51 € laisse une marge de négociation de 7 € par vélo et par mois. <strong>Chances</strong> : le prix ne pèse que 40 % ; avec un remplacement en 48 heures (mieux que les 72 heures exigées) et la formation incluse, CycloPro peut bien noter sur la valeur technique et le délai. <strong>Intérêt stratégique</strong> : une première référence publique, alors que deux consultations sont attendues l’an prochain. Le Go était donc justifié.</p>",pitfalls:["Raisonner sur le chiffre d’affaires sans calculer la marge."]},{id:"v-categories",camp:"A",title:"Ce qui est obligatoire, noté, différenciant, négociable",seances:["s2"],q:"Classe les éléments de la consultation dans les quatre catégories du cours.",keys:["Exigences : 72 h maximum, assurance RC pro, entretien trimestriel, livraison avant le 1er mars","Critères : prix 40 %, valeur technique 40 %, délai de remplacement 20 %","Différenciants : remplacement en 48 h, formation incluse, vélos de réserve…","Négociables (selon le règlement) : prix, délai de remplacement, modalités d’exécution, options","Ne jamais présenter une exigence comme négociable (ex. passer à un entretien semestriel)"],model:"<ul><li><strong>Exigences obligatoires</strong> : remplacement sous 72 heures maximum, assurance RC professionnelle, entretien préventif trimestriel, livraison avant le 1er mars.</li><li><strong>Critères d’évaluation</strong> : prix 40 %, valeur technique 40 %, délai de remplacement 20 %.</li><li><strong>Éléments différenciants</strong> : remplacement en 48 heures grâce aux vélos de réserve, deux sessions de formation incluses — ils répondent à des besoins réels (fiabilité, sécurité).</li><li><strong>Variables négociables</strong> : prix, délai de remplacement (dans la limite des 72 heures), modalités d’exécution (calendrier de livraison, organisation des formations), options (casque et antivol, formation).</li></ul><p>Proposer d’espacer l’entretien préventif pour baisser le prix rendrait l’offre non conforme.</p>",pitfalls:["Classer le délai de 72 h parmi les variables négociables."]},{id:"v-preparation",camp:"A",title:"Objectifs et arguments",seances:["s2"],q:"Fixe les objectifs de CycloPro (idéal, cible, seuil) et prépare un argument par interlocuteur présent à l’entretien, en reliant une caractéristique à un bénéfice.",keys:["Idéal 58 € / cible 56 € / seuil 51 € (périmètre complet)","Argument service technique : 48 h grâce aux vélos de réserve → pas de vélos immobilisés","Argument DRH : deux formations incluses → sécurité des agents","Argument commande publique / finances : coût maîtrisé, pas de surcoût caché","Chaque argument formulé en bénéfice pour l’interlocuteur"],model:"<p><strong>Objectifs</strong> : objectif idéal 58 € (maintenir l’offre), cible réaliste 56 €, seuil minimal 51 € par vélo et par mois pour le périmètre complet.</p><ul><li><strong>Responsable du service technique</strong> : « Nos six vélos de réserve nous permettent de remplacer un vélo immobilisé en 48 heures : vos agents ne restent jamais sans vélo plus de deux jours. »</li><li><strong>DRH</strong> : « Les deux sessions de formation incluses apprennent aux agents à circuler en sécurité et à faire les vérifications de base : moins de risques d’accident et une adoption plus rapide. »</li><li><strong>Commande publique</strong> : « Un prix mensuel tout compris, entretien et remplacement inclus : pas de surcoût en cours de marché, un budget prévisible sur 36 mois. »</li></ul>",pitfalls:["Des arguments génériques (« nous sommes sérieux ») sans bénéfice."]},{id:"v-concessions",camp:"A",title:"Concessions, contreparties et questions",seances:["s2","s3"],q:"Prépare le tableau des concessions possibles (avec leur coût) et des contreparties recherchées, puis trois questions à poser à la Ville.",keys:["Prix : de 58 à 56 € (−2 €), jamais sous 51 € ; chaque baisse conditionnée","Option casque/antivol retirable (économie de 1,50 €) → baisse de prix sans perte de marge","Remplacement en 24 h : +3 € → ne pas l’offrir gratuitement","Contreparties : être cité comme référence, communication commune au lancement, calendrier de livraison réaliste…","Questions : priorités réelles, difficultés du contrat précédent, besoin réel des options (casques)"],model:'<table class="calc"><thead><tr><th>Concession possible</th><th>Coût pour CycloPro</th><th>Contrepartie recherchée</th></tr></thead><tbody><tr><td>Baisse de 58 à 56 €</td><td>−2 € par vélo et par mois (−3 600 € sur 36 mois)</td><td>Attribution du marché + accord pour citer la Ville comme référence</td></tr><tr><td>Retirer casque et antivol si la Ville n’en a pas besoin</td><td>Économie de 1,50 € → prix réduit sans perte de marge</td><td>—</td></tr><tr><td>Remplacement en 24 heures</td><td>+3 € par vélo et par mois</td><td>Prix ajusté en conséquence (sinon, rester à 48 heures)</td></tr><tr><td>Une troisième session de formation</td><td>≈ 300 €</td><td>Communication commune au lancement du printemps</td></tr></tbody></table><p><strong>Questions</strong> : « Quel critère est aujourd’hui le plus sensible pour vos services ? » ; « Qu’est-ce qui n’a pas fonctionné dans le précédent contrat ? » ; « Toutes les options vous sont-elles utiles, notamment les casques ? »</p>',pitfalls:["Offrir le remplacement en 24 heures sans le chiffrer.","Baisser le prix sans demander de contrepartie."]},{id:"v-forceA",camp:"A",title:"Rapport de force et alternatives",seances:["s3","s2"],q:"Évalue le rapport de force entre CycloPro et la Ville, et les alternatives de chacun.",keys:["CycloPro : BATNA faible (contrats privés non signés), fort intérêt stratégique pour ce marché","Ville : peut retenir un autre candidat (VéloFlotte, Mobilia) ou relancer","Atouts CycloPro : meilleure valeur technique et meilleur délai (40 + 20 % de la note)","Inconnues : classement réel, budget de la Ville → à explorer par des questions","Conclusion nuancée"],model:"<p><strong>CycloPro</strong> tient beaucoup à ce marché (première référence publique) et ses alternatives sont faibles : deux contrats privés non signés. Mais elle a des atouts : sa valeur technique et son délai de 48 heures pèsent pour 60 % de la note. <strong>La Ville</strong> peut retenir un autre candidat — VéloFlotte serait moins cher selon la rumeur, mais avec un remplacement en 72 heures et une maintenance sous-traitée — ou relancer la consultation. CycloPro ignore son classement et le budget réel : il faut les explorer par des questions plutôt que supposer qu’elle est en position de faiblesse et brader son prix.</p>",pitfalls:["Conclure trop vite que le moins cher va gagner."]},{id:"v-acteurs",camp:"B",title:"Les acteurs de la Ville et leurs attentes",seances:["s1","s2"],q:"Identifie les acteurs internes de la Ville, leurs attentes, et explique pourquoi l’acheteur doit les concilier.",keys:["Commande publique : organise, respecte le règlement","Service technique : fiabilité, délai de remplacement (expérience des 10 jours)","DRH : sécurité, au moins 2 formations","Élus : lancement visible au printemps ; finances : budget voté de 100 000 €","Concilier : une offre dans le budget sans sacrifier fiabilité et formation"],model:"<ul><li><strong>Commande publique</strong> : conduit la procédure, veille au respect du règlement.</li><li><strong>Service technique</strong> : fiabilité et rapidité de remplacement — le précédent contrat a laissé des vélos immobilisés jusqu’à dix jours.</li><li><strong>DRH</strong> : sécurité des agents, au moins deux sessions de formation.</li><li><strong>Élus</strong> : un lancement visible au printemps.</li><li><strong>Finances</strong> : tenir le budget voté de 100 000 € HT.</li></ul><p>C’est une négociation multi-acteurs : la meilleure offre sur le prix (VéloFlotte) ne satisfait pas le service technique ; la meilleure offre technique (CycloPro) dépasse le budget. L’acheteur doit trouver l’accord qui satisfait chaque attente essentielle.</p>",pitfalls:["Ne considérer que le prix."]},{id:"v-classement",camp:"B",title:"Pourquoi le plus cher est en tête",seances:["s2"],q:"Explique, chiffres à l’appui, pourquoi CycloPro est en tête du classement alors qu’elle est la plus chère.",keys:["Prix 40 % seulement : CycloPro perd ~4 points sur le prix","Elle gagne 6 à 10 points sur la valeur technique (16/20)","Elle gagne 6,7 points sur le délai (48 h vs 72 h)","Total 87,9 contre 75,8 et 75,3","Lien avec le cours : la pondération oriente la stratégie ; le moins cher ne gagne pas forcément"],model:"<p>Le prix ne pèse que 40 % de la note. CycloPro y obtient 35,9 points contre 40 pour VéloFlotte : elle ne perd que 4,1 points. En revanche, elle obtient 32 points sur la valeur technique (16/20) contre 22 pour VéloFlotte et 26 pour Mobilia, et 20 points sur le délai (48 heures) contre 13,3 pour ses concurrents (72 heures). Total : <strong>87,9</strong> contre 75,8 (Mobilia) et 75,3 (VéloFlotte). C’est l’illustration de la séance 2 : quand le prix pèse 40 %, une entreprise n’a pas besoin d’être la moins chère pour l’emporter.</p>",pitfalls:["Oublier de pondérer les notes."]},{id:"v-budget",camp:"B",title:"Le problème du budget",seances:["s2","s3"],q:"L’offre de CycloPro dépasse-t-elle le budget ? Fixe l’objectif de la Ville et les leviers utilisables dans le cadre du règlement.",keys:["104 400 € > 100 000 € : dépassement de 4 400 € (≈ 4,2 %)","Objectif : ≤ 55,55 € par vélo et par mois pour 50 vélos","Levier : retirer l’option casque (la Ville en a déjà 50)","Autres leviers : nombre de vélos (46), négociation du prix contre des contreparties (référence, communication)","Ne pas toucher aux exigences essentielles (72 h, entretien, livraison) ni demander 24 h gratuitement"],model:"<p>L’offre de CycloPro représente 58 € × 50 × 36 = <strong>104 400 € HT</strong>, soit 4 400 € au-dessus du budget voté (environ 4,2 %). Objectif : <strong>55,55 € par vélo et par mois au maximum</strong> pour 50 vélos.</p><p><strong>Leviers</strong> (le règlement autorise la négociation du prix et des options) : retirer l’option casque et antivol, puisque la Ville possède déjà 50 casques — CycloPro économise un coût et peut baisser son prix sans perdre de marge ; proposer des contreparties qui ont de la valeur pour une PME qui répond à son premier marché public (accord pour être citée en référence, communication commune au lancement) ; en dernier recours, réduire à 46 vélos, ce que le service technique déconseille. La Ville ne doit pas « acheter » la baisse en sacrifiant ce qui compte pour ses services (délai, formation) ni exiger un remplacement en 24 heures sans contrepartie.</p>",pitfalls:["Demander une baisse sans proposer de levier.","Révéler le budget exact dès l’ouverture."]},{id:"v-batnaB",camp:"B",title:"Alternatives de la Ville et questions à poser",seances:["s3","s2"],q:"Quelle est la BATNA de la Ville ? Est-elle solide ? Quelles questions poser à CycloPro ?",keys:["BATNA : retenir VéloFlotte (93 600 €, dans le budget) ou Mobilia (102 600 €, hors budget)","Faiblesse : VéloFlotte mal notée techniquement, 72 h — risque de revivre les pannes","Relancer : délai incompatible avec le printemps","Conclusion : BATNA peu attractive → la Ville a intérêt à conclure avec CycloPro","Questions : coût des options, marges de manœuvre sur le prix, intérêt pour une référence publique, calendrier de livraison"],model:"<p>Sans accord avec CycloPro, la Ville peut retenir <strong>VéloFlotte</strong> (52 € → 93 600 €, dans le budget mais technique faible et remplacement en 72 heures, le risque de revivre les pannes du précédent contrat) ou <strong>Mobilia</strong> (57 € → 102 600 €, hors budget aussi). Relancer la consultation repousserait le lancement après le printemps. Sa BATNA est donc <strong>peu attractive</strong> : elle a intérêt à conclure avec CycloPro, sans le montrer.</p><p><strong>Questions</strong> : « Que représente l’option casque et antivol dans votre prix ? » ; « Sur quels éléments votre offre peut-elle évoluer ? » ; « Quel intérêt voyez-vous à ce premier marché public ? » ; « Pouvez-vous garantir la livraison avant le 1er mars ? »</p>",pitfalls:["Croire que la Ville est en position de force simplement parce qu’elle est l’acheteur."]}],debrief:{A:"<p><strong>Ce que tu découvres dans l’annexe de la Ville</strong> : CycloPro est <strong>largement en tête</strong> (87,9 contre 75,8 et 75,3) — sa position est bien plus forte qu’elle ne le pensait ; le budget voté est de 100 000 €, soit environ 55,55 € par vélo et par mois ; la Ville possède déjà 50 casques ; ses alternatives sont faibles (VéloFlotte mal notée, relance incompatible avec le printemps).</p><p><strong>Conséquence</strong> : inutile de brader son prix. En retirant l’option casque (−1,50 € de coût), CycloPro peut descendre à 55,50 € en ne perdant qu’un euro de marge par vélo et par mois, et demander en échange d’être citée en référence. Questionner sur les options avant de céder sur le prix était la clé.</p>",B:"<p><strong>Ce que révèle l’annexe de CycloPro</strong> : un seuil à 51 € — il existe donc une vraie zone d’accord sous 55,55 € ; le casque et l’antivol coûtent 1,50 € à CycloPro ; un remplacement en 24 heures lui coûterait 3 € de plus ; surtout, ce marché est sa <strong>première référence publique</strong> et ses alternatives sont faibles.</p><p><strong>Conséquence</strong> : la Ville peut obtenir une offre dans son budget sans rien sacrifier, en retirant l’option casque et en offrant ce qui a de la valeur pour CycloPro sans rien lui coûter : être citée en référence et une communication commune au printemps.</p>"},synthese:"<p><strong>Un accord réaliste</strong> : 55,50 € HT par vélo et par mois sans l’option casque (la Ville utilise ses propres casques), remplacement en 48 heures, deux sessions de formation, livraison avant le 1er mars, accord de la Ville pour être citée comme référence et communication commune au lancement. Total : 55,50 × 50 × 36 = <strong>99 900 € HT</strong>, dans le budget. Pour CycloPro, la marge passe de 12 € (58 − 46) à 11 € (55,50 − 44,50) par vélo et par mois : une concession limitée, compensée par une référence stratégique.</p><p>Ce cas montre que la négociation d’un appel d’offres se gagne d’abord par l’<strong>analyse</strong> (critères pondérés, exigences, options) et par des <strong>questions</strong> qui font apparaître des variables (ici l’option casque) permettant un accord gagnant-gagnant plutôt qu’une simple baisse de prix.</p>"};var Gs={id:"biscuits",title:"La Biscuiterie Duval chez Primeo",badge:"Cas d’entraînement",level:3,context:"Référencement en grande distribution",seances:["s3","s1"],pitch:"Une biscuiterie bio familiale veut entrer dans les 140 supermarchés d’une enseigne régionale. L’enseigne veut un test, un prix plus bas et une participation à son opération de printemps. Dépendance, alternatives, capacité de production : l’accord doit être acceptable, économiquement viable… et réalisable.",intro:"Cas inventé pour l’entraînement (entreprises fictives). Il applique la séance 3 : rapport de force, variables, concessions et contreparties, économie globale, exécution.",commun:[{id:"D1",title:"Les parties",html:"<p><strong>Biscuiterie Duval</strong> : PME familiale de 35 salariés, biscuits au beurre bio, quatre références (sablés nature, sablés caramel, galettes, palets chocolat). Distribuée dans des magasins bio indépendants et deux enseignes régionales. Prix de cession habituel : <strong>2,40 € HT le paquet</strong>.</p><p><strong>Primeo</strong> : enseigne de <strong>140 supermarchés</strong> de proximité dans le Grand Ouest, centrale d’achat à Rennes. Elle développe un rayon « bio et régional » et organise chaque printemps l’opération commerciale « Saveurs de chez nous ».</p>"},{id:"D2",title:"La proposition de Duval et les conditions de Primeo",html:"<p><strong>Proposition écrite de Duval</strong> : référencement des <strong>4 références dans les 140 magasins</strong>, à 2,40 € HT le paquet.</p><p><strong>Conditions générales de Primeo</strong> (communiquées à tous ses fournisseurs) : livraison sur l’entrepôt central sous 48 heures après commande ; participation des fournisseurs aux opérations promotionnelles ; tout nouveau produit est d’abord testé dans une partie du réseau.</p><p>Rendez-vous de référencement avec l’acheteuse bio de la centrale dans dix jours.</p>"}],consignes:"<p>Chaque camp prépare le rendez-vous à partir du dossier commun et de son annexe. Pense en termes de rapport de force, d’alternatives, de variables et de contreparties. Ne révèle pas ton annexe avant le débrief.</p>",camps:[{id:"A",name:"Biscuiterie Duval",label:"Camp A — Biscuiterie Duval (fournisseur)",color:"l3",mission:"Entrer chez Primeo dans des conditions rentables et réalisables, et réduire la dépendance de l’entreprise.",annexe:"<h3>Coûts et prix</h3><ul><li>Coût de revient : <strong>1,75 €</strong> le paquet. Prix cible : <strong>2,30 €</strong>. Seuil minimal acceptable : <strong>2,05 €</strong>.</li><li>Livrer l’entrepôt Primeo sous 48 heures impose un stock tampon : surcoût de <strong>0,03 €</strong> par paquet.</li></ul><h3>Dépendance</h3><p>L’enseigne régionale Marché Plus représente <strong>45 % du chiffre d’affaires</strong> de Duval et durcit ses conditions chaque année. Objectif stratégique de la direction : réduire cette dépendance.</p><h3>Capacité de production</h3><ul><li>Production actuelle : <strong>600 000 paquets par an</strong>.</li><li>Sans investissement, la biscuiterie peut produire <strong>30 % de plus</strong> (soit 180 000 paquets par an).</li><li>Au-delà, il faut une deuxième équipe (embauches, investissement) : pas avant six mois.</li><li>Rotation observée dans les enseignes régionales : environ <strong>12 paquets par référence, par magasin et par semaine</strong>.</li></ul><h3>Trade marketing</h3><p>Budget de lancement : <strong>6 000 € par an</strong>. Une journée de dégustation en magasin coûte <strong>150 €</strong> (animatrice et produits).</p><h3>Alternative</h3><p>La chaîne bio spécialisée <strong>Natura Plus</strong> propose par écrit de référencer <strong>2 références dans 60 magasins à 2,35 €</strong>. Offre valable <strong>un mois</strong>.</p>"},{id:"B",name:"Primeo",label:"Camp B — Primeo (centrale d’achat)",color:"l1",mission:"Construire un rayon bio et régional attractif pour les clients, avec des produits qui se vendent, à des conditions compatibles avec le modèle de l’enseigne.",annexe:"<h3>Besoin</h3><ul><li>Le rayon bio manque d’un <strong>biscuit premium régional</strong> : dans la dernière enquête, un client sur trois demande plus de produits locaux.</li><li>Une enseigne concurrente vient de référencer une biscuiterie régionale et communique beaucoup dessus.</li><li>L’acheteuse doit présenter des nouveautés régionales pour l’opération « Saveurs de chez nous », dans <strong>quatre mois</strong>.</li></ul><h3>Contraintes</h3><ul><li>Linéaire limité : <strong>au maximum 2 nouvelles références bio par magasin</strong> cette année.</li><li>Prix d’achat visé : <strong>2,20 € maximum</strong> (prix de vente conseillé : 3,49 €). La direction accepte jusqu’à <strong>2,30 €</strong> si le fournisseur finance des animations en magasin.</li><li>Procédure : test de 3 mois dans <strong>40 magasins</strong>, puis élargissement si la rotation atteint au moins <strong>10 paquets par référence, par magasin et par semaine</strong>.</li></ul><h3>Alternatives</h3><ul><li><strong>BioCroq</strong>, marque nationale : 2,00 € le paquet, mais aucune image régionale.</li><li>Une autre petite biscuiterie régionale : 2,15 €, mais des ruptures de stock répétées l’an dernier.</li></ul>"}],steps:[{id:"r-contexte",camp:null,title:"Situer le contexte",seances:["s1","s3"],q:"Caractérise cette négociation avec les notions des séances 1 et 3 (contexte, dimensions, processus).",keys:["Référencement : intégrer un fournisseur et ses produits dans l’assortiment d’une enseigne","Indices : enseigne, centrale d’achat, conditions générales imposées","Cadre encadré : conditions générales, test obligatoire","Processus : préparer → présenter → analyser les attentes → négocier → décider → formaliser → suivre","Information asymétrique : dépendances, capacité, budget et contraintes d’assortiment"],model:"<p>C’est un <strong>référencement en grande distribution</strong> : Duval veut intégrer ses produits dans l’assortiment de Primeo ; elle négocie avec l’acheteuse de la centrale (indice : référencement + centrale + conditions imposées ou discutées). Le cadre est <strong>encadré</strong> : conditions générales (livraison sous 48 heures, participation aux promotions, test préalable). La négociation s’inscrit dans un <strong>processus organisé</strong> en sept étapes, de la préparation de l’offre au suivi de l’accord. L’information est <strong>asymétrique</strong> : Duval ignore le prix visé et les contraintes de linéaire de Primeo ; Primeo ignore les coûts, la capacité et la dépendance de Duval.</p>",pitfalls:["Confondre référencement et implantation."]},{id:"r-force",camp:"A",title:"Qui dépend le plus de l’autre ?",seances:["s3"],q:"Analyse le rapport de force entre Duval et Primeo : dépendance, alternatives, attractivité de l’offre.",keys:["Duval dépend fortement de Marché Plus (45 %) : enjeu stratégique de diversification","Face à Primeo, Duval n’est pas dépendante (Primeo = nouveau client)","Alternative crédible : offre écrite de Natura Plus (2 réf., 60 magasins, 2,35 €), valable un mois","Attractivité : bio, premium, régional — répond aux attentes des clients de l’enseigne","Primeo contrôle l’accès au réseau et peut imposer un test : rapport plutôt équilibré"],model:"<p><strong>Dépendance</strong> : Duval est fragile vis-à-vis de Marché Plus (45 % de son chiffre d’affaires) — c’est précisément pourquoi elle veut Primeo. Mais <strong>face à Primeo</strong>, elle n’est pas dépendante : Primeo serait un nouveau client.</p><p><strong>Alternatives</strong> : Duval dispose d’une alternative crédible et écrite — Natura Plus, 2 références dans 60 magasins à 2,35 € (valable un mois). Primeo a sûrement d’autres fournisseurs de biscuits (produits substituables).</p><p><strong>Attractivité</strong> : un biscuit bio, premium et régional correspond au développement du rayon « bio et régional » de l’enseigne.</p><p><strong>Conclusion</strong> : Primeo contrôle l’accès à ses 140 magasins et impose un test, mais n’est pas « automatiquement en position de force » : l’attractivité de l’offre et l’alternative Natura Plus donnent à Duval une position correcte, à condition de ne pas négocier sous la pression de sa dépendance à Marché Plus.</p>",pitfalls:["Conclure que Duval est faible à cause de Marché Plus, sans distinguer les deux relations."]},{id:"r-realisable",camp:"A",title:"La proposition initiale est-elle réalisable ?",seances:["s3"],q:"Calcule le volume annuel qu’impliquerait la proposition initiale (4 références × 140 magasins) et compare-le à la capacité de production. Qu’en conclus-tu ?",keys:["4 × 140 × 12 × 52 = 349 440 paquets par an","Soit environ +58 % de la production actuelle (600 000)","Capacité sans investissement : +30 % = 180 000 paquets","Proposition irréalisable à court terme (deuxième équipe pas avant 6 mois)","Conclusion : un référencement progressif sert aussi Duval ; l’accord doit être réalisable"],model:"<p>4 références × 140 magasins × 12 paquets × 52 semaines = <strong>349 440 paquets par an</strong>, soit environ <strong>+58 %</strong> de la production actuelle (600 000). Or, sans investissement, Duval ne peut produire que 30 % de plus (180 000 paquets). Sa propre proposition est donc <strong>irréalisable</strong> avant six mois. En comparaison, 2 références dans 140 magasins représentent 174 720 paquets (+29 %) : tout juste dans la capacité.</p><p>Conclusion : un <strong>référencement progressif</strong> n’est pas seulement une exigence de Primeo, c’est aussi une nécessité pour Duval. Le cours le rappelle : le négociateur doit anticiper ce que l’entreprise devra réellement exécuter ; un accord doit être acceptable, économiquement viable et <strong>réalisable</strong>.</p>",pitfalls:["Défendre l’objectif « 4 références partout » sans vérifier la capacité."]},{id:"r-economie",camp:"A",title:"Prix affiché et économie réelle",seances:["s3","s2"],q:"Primeo demandera sans doute un prix plus bas. Calcule la marge unitaire à 2,40 € et à 2,25 € (livraison 48 h comprise), puis raisonne sur l’économie globale d’un test et d’un élargissement. Compare avec Natura Plus.",keys:["Marge à 2,40 € : 2,40 − 1,75 − 0,03 = 0,62 € ; à 2,25 € : 0,47 €","Test (2 réf. × 40 magasins × 12 × 13 semaines) : 12 480 paquets × 0,47 ≈ 5 866 €, à peu près absorbés par 6 000 € de dégustations","Élargissement (2 réf. × 140 magasins) : 174 720 paquets × 0,47 ≈ 82 118 € par an","Natura Plus : 74 880 paquets × 0,60 ≈ 44 928 € par an, plus sûr mais plus petit","Conclusion : la concession de prix vaut si elle achète l’élargissement (critères écrits)"],model:"<p><strong>Marge unitaire</strong> : à 2,40 €, 2,40 − 1,75 − 0,03 = 0,62 € ; à 2,25 €, <strong>0,47 €</strong>. La baisse de 0,15 € coûte environ un quart de la marge unitaire.</p><p><strong>Test</strong> : 2 références × 40 magasins × 12 paquets × 13 semaines = 12 480 paquets, soit environ 5 866 € de marge — presque entièrement absorbés par une journée de dégustation dans chacun des 40 magasins (6 000 €). Le test seul ne rapporte rien : c’est un <strong>investissement</strong>.</p><p><strong>Élargissement</strong> : 2 références × 140 magasins × 12 × 52 = 174 720 paquets par an, soit environ <strong>82 118 €</strong> de marge annuelle.</p><p><strong>Natura Plus</strong> : 2 × 60 × 12 × 52 = 74 880 paquets à 0,60 € (2,35 − 1,75) ≈ 44 928 € par an — plus sûr (offre écrite) mais deux fois plus petit.</p><p>Conclusion, à la manière du 10 € → 9 € du cours : accepter 2,25 € n’a de sens que si cette concession <strong>achète l’élargissement</strong>, c’est-à-dire si les critères d’élargissement et le calendrier sont écrits dans la convention.</p>",pitfalls:["Raisonner seulement sur le prix unitaire.","Oublier le coût des animations."]},{id:"r-concessions",camp:"A",title:"Concessions, contreparties, arguments",seances:["s3","s2"],q:"Prépare le tableau « que puis-je concéder, dans quelles limites, et contre quoi ? », puis un argument principal relié aux besoins des clients de l’enseigne.",keys:["Accepter un test (2 références, 40 magasins) contre des critères d’élargissement écrits","Baisse de prix limitée (≥ 2,05 €, viser 2,25–2,30 €) contre l’élargissement / un engagement","Dégustations (budget 6 000 €) contre une mise en avant pendant l’opération de printemps","Livraison 48 h (coût 0,03 €) intégrée au prix","Argument : biscuit bio et régional = réponse aux attentes des clients et au positionnement du rayon"],model:'<table class="calc"><thead><tr><th>Ce que Duval peut concéder</th><th>Limite</th><th>Contre quoi</th></tr></thead><tbody><tr><td>Un test : 2 références dans 40 magasins</td><td>3 mois</td><td>Critères et calendrier d’élargissement écrits dans la convention</td></tr><tr><td>Une baisse de prix (de 2,40 à 2,25–2,30 €)</td><td>Jamais sous 2,05 €</td><td>Élargissement aux 140 magasins si le critère est atteint</td></tr><tr><td>Une journée de dégustation par magasin test</td><td>Budget de 6 000 €</td><td>Une mise en avant (tête de gondole) pendant « Saveurs de chez nous »</td></tr><tr><td>La livraison sous 48 heures</td><td>+0,03 € par paquet</td><td>Intégrée au prix, prévisions de commandes partagées</td></tr></tbody></table><p><strong>Argument</strong> : « Nos biscuits bio sont fabriqués dans la région avec du beurre local : ils donnent à votre rayon “bio et régional” un produit premium que vos clients réclament, et ils seront prêts pour “Saveurs de chez nous”, avec des dégustations dans vos magasins. »</p>',pitfalls:["Accepter le test sans critères d’élargissement."]},{id:"r-batna",camp:"A",title:"Utiliser l’alternative Natura Plus",seances:["s3"],q:"Comment Duval doit-elle utiliser l’offre de Natura Plus ? Peut-elle accepter les deux à plein régime ?",keys:["Natura Plus = BATNA crédible (écrite, chiffrée), à évoquer sans la dévoiler entièrement","Elle justifie de ne pas descendre trop bas et d’obtenir une décision rapide","Échéance d’un mois vs résultat du test dans 3 mois : arbitrage de calendrier","Capacité : Primeo élargi (174 720) + Natura (74 880) = 249 600 > 180 000","Prioriser ou investir (deuxième équipe à 6 mois) ; les deux options réduisent la dépendance à Marché Plus"],model:"<p>L’offre de Natura Plus est une <strong>BATNA crédible</strong> : écrite, chiffrée, à 2,35 €. Duval peut indiquer qu’elle a « d’autres propositions de distribution » pour ne pas descendre trop bas et pour obtenir des engagements précis — sans en dévoiler le détail.</p><p>Mais il y a deux difficultés. Le <strong>calendrier</strong> : Natura Plus attend une réponse sous un mois, alors que le test Primeo ne donnera ses résultats qu’après trois mois. Et la <strong>capacité</strong> : Primeo élargi (174 720 paquets) + Natura Plus (74 880) = 249 600 paquets, au-delà des 180 000 possibles sans investissement. Duval doit donc <strong>prioriser</strong> ou décider d’investir dans une deuxième équipe (pas avant six mois). Dans tous les cas, chacune des deux options réduit sa dépendance à Marché Plus.</p>",pitfalls:["Accepter les deux offres sans vérifier la capacité."]},{id:"r-besoin",camp:"B",title:"Les besoins et les contraintes de Primeo",seances:["s3"],q:"Formule les intérêts de Primeo dans ce référencement, et les contraintes qui encadrent ce que l’acheteuse peut accepter.",keys:["Construire une offre cohérente avec le positionnement « bio et régional »","Répondre à la demande des clients (1 sur 3) et à la concurrence","Calendrier : produits prêts pour « Saveurs de chez nous » (4 mois)","Contraintes : 2 nouvelles références bio par magasin maximum ; prix ≤ 2,20 € (2,30 € avec animations)","Procédure : test 40 magasins, critère ≥ 10 paquets/réf./magasin/semaine"],model:"<p><strong>Intérêts</strong> : optimiser l’offre proposée aux clients — un biscuit bio premium et régional renforce le positionnement du rayon, répond à la demande (un client sur trois réclame du local) et permet de suivre l’enseigne concurrente qui communique sur un produit similaire. L’acheteuse doit aussi présenter des nouveautés pour « Saveurs de chez nous » dans quatre mois.</p><p><strong>Contraintes</strong> : au maximum deux nouvelles références bio par magasin cette année ; un prix d’achat visé de 2,20 € (2,30 € si le fournisseur finance des animations) ; un test de trois mois dans 40 magasins avant tout élargissement, sur le critère de 10 paquets par référence, par magasin et par semaine.</p>",pitfalls:["Raisonner uniquement en prix d’achat."]},{id:"r-forceB",camp:"B",title:"Rapport de force et alternatives de Primeo",seances:["s3"],q:"Primeo est-elle en position de force face à Duval ? Évalue ses alternatives.",keys:["Primeo contrôle l’accès à ses 140 magasins et impose le test","BioCroq : moins chère (2,00 €) mais sans image régionale → ne répond pas au besoin","Petite biscuiterie : 2,15 € mais ruptures de stock → peu fiable","Duval est attractive : bio, régional, premium → difficilement substituable pour ce besoin","Conclusion : pas automatiquement en position de force ; intérêt à conclure vite (opération de printemps)"],model:"<p>Primeo contrôle l’accès à ses 140 magasins et impose un test, mais ses alternatives sont <strong>faibles pour ce besoin précis</strong> : BioCroq est moins chère (2,00 €) mais n’a aucune image régionale — elle ne répond pas à la question centrale (« le produit répond-il aux besoins des clients de l’enseigne ? ») ; l’autre biscuiterie régionale (2,15 €) a connu des ruptures répétées. L’offre de Duval est donc attractive et peu substituable, et le calendrier (opération de printemps, concurrent) pousse Primeo à conclure. Primeo n’est pas « automatiquement en position de force » : elle a intérêt à sécuriser Duval à des conditions raisonnables.</p>",pitfalls:["Croire que la taille de l’enseigne suffit à imposer ses conditions."]},{id:"r-propB",camp:"B",title:"La proposition de Primeo",seances:["s3"],q:"Construis la proposition de Primeo : assortiment, test, prix, promotion, logistique, et les questions à poser à Duval.",keys:["2 références (contrainte de linéaire) en test dans 40 magasins pendant 3 mois","Prix : viser 2,20 €, accepter jusqu’à 2,30 € contre des animations financées","Participation à « Saveurs de chez nous » : dégustations contre mise en avant","Élargissement aux 140 magasins si ≥ 10 paquets/réf./magasin/semaine, écrit dans la convention","Questions : capacité de production, fiabilité des livraisons 48 h, rotation chez les autres enseignes"],model:"<p><strong>Proposition</strong> : référencer <strong>2 références</strong> (la contrainte de linéaire l’impose) en test dans <strong>40 magasins pendant trois mois</strong> ; prix visé 2,20 €, avec possibilité d’aller jusqu’à 2,30 € si Duval finance des dégustations pendant « Saveurs de chez nous » ; en échange, une mise en avant des produits pendant l’opération ; élargissement aux 140 magasins si la rotation atteint 10 paquets par référence, par magasin et par semaine, écrit dans la convention.</p><p><strong>Questions à Duval</strong> : « Quelle capacité de production pouvez-vous nous garantir si nous élargissons à 140 magasins ? » ; « Comment assurez-vous la livraison de notre entrepôt sous 48 heures ? » ; « Quelles rotations observez-vous dans les autres enseignes ? » ; « Quelles animations pouvez-vous proposer pour le lancement ? »</p>",pitfalls:["Imposer 2,00 € en citant BioCroq : ce n’est pas le même produit."]}],debrief:{A:"<p><strong>Ce que révèle l’annexe de Primeo</strong> : l’enseigne a un vrai besoin de biscuit régional (demande des clients, concurrent, opération de printemps) et ses alternatives sont faibles ; elle ne peut référencer que 2 nouvelles références bio par magasin ; elle vise 2,20 € mais accepte 2,30 € si le fournisseur finance des animations ; son critère d’élargissement est de 10 paquets par semaine — en dessous de la rotation de 12 observée ailleurs.</p><p><strong>Conséquence</strong> : Duval pouvait obtenir 2,25 à 2,30 € en finançant les dégustations, et exiger que l’élargissement soit écrit. Insister sur 4 références était inutile (et irréalisable).</p>",B:"<p><strong>Ce que révèle l’annexe de Duval</strong> : son seuil est à 2,05 € ; elle dépend à 45 % de Marché Plus et veut se diversifier — elle a donc envie de conclure ; elle ne peut pas produire 4 références pour 140 magasins, mais 2 références oui ; elle a une offre écrite de Natura Plus valable un mois.</p><p><strong>Conséquence</strong> : Primeo pouvait conclure vite sur 2 références, mais pousser trop loin le prix risquait de faire choisir Natura Plus à Duval. Un engagement écrit d’élargissement rassure un fournisseur qui investit dans un test.</p>"},synthese:"<p><strong>Un accord réaliste</strong> : 2 références (sablés nature et caramel) en test dans 40 magasins pendant trois mois, à <strong>2,25 € HT</strong> ; une journée de dégustation par magasin test financée par Duval (6 000 €) pendant « Saveurs de chez nous », contre une mise en avant en tête de gondole ; livraison de l’entrepôt sous 48 heures ; élargissement aux 140 magasins si la rotation atteint 10 paquets par référence, par magasin et par semaine — le tout écrit dans la convention, avec un point de suivi à la fin du test. Duval vérifie que l’élargissement (174 720 paquets par an) reste dans sa capacité et arbitre en conséquence sur Natura Plus.</p><p>Ce cas mobilise toute la séance 3 : <strong>rapport de force</strong> (dépendance, alternatives, attractivité), <strong>référencement progressif</strong>, <strong>concessions contre contreparties</strong>, <strong>trade marketing</strong>, <strong>économie globale</strong> et accord <strong>réalisable</strong>.</p>"};var Vs={id:"handball",title:"Lina Haddad, ailière convoitée",badge:"Cas d’entraînement",level:3,context:"Négociation par représentation, trois parties",seances:["s4","s3","s1"],pitch:"Une ailière de handball en fin de contrat, son agente, un club ambitieux qui doit remplacer sa titulaire, un équipementier qui lance sa gamme handball : trois camps, des intérêts liés, et une agente qui doit défendre les intérêts globaux de sa cliente — pas seulement le plus gros chèque.",intro:"Cas inventé pour l’entraînement (personnes, clubs et marque fictifs). Il applique la séance 4 : deux négociations successives, rapport de force, prix et valeur, proposition de valeur, concessions dans l’intérêt du mandant, cadre légal présenté par le support.",commun:[{id:"D1",title:"La joueuse et son agente",html:"<p><strong>Lina Haddad</strong>, 23 ans, ailière gauche en première division française, deuxième meilleure marqueuse du championnat, déjà sélectionnée en équipe de France jeunes. Son contrat avec son club actuel se termine en juin. Elle compte <strong>45 000 abonnés</strong> sur les réseaux sociaux, surtout âgés de 15 à 24 ans.</p><p>En mars, Lina a confié sa représentation à <strong>Julie Marchal</strong> (agence JM Sports).</p>"},{id:"D2",title:"Le club et la marque",html:"<p><strong>Atlantique Handball Club (AHC)</strong> : club ambitieux, qualifié en Ligue des champions. Son ailière gauche titulaire (31 ans) a annoncé sa retraite sportive à la fin de la saison. L’équipementier officiel du club est <strong>Kinéo Sport</strong>.</p><p><strong>Kinéo Sport</strong> : équipementier français qui lance une gamme handball et cherche des ambassadrices.</p>"},{id:"D3",title:"Les offres sur la table",html:'<table class="calc"><tbody><tr><th>AHC</th><td>Contrat de 3 ans, 4 200 € brut par mois, prime de qualification européenne</td></tr><tr><th>Kinéo Sport</th><td>15 000 € par an, 3 ans, exclusivité totale (tous équipements et produits), 6 apparitions par an</td></tr></tbody></table><p><strong>Rappel du cadre (selon le support de cours)</strong> : le contrat d’agent sportif précise les services, leur caractère exclusif ou non, la durée, la rémunération de l’agent et la partie qui le rémunère ; durée de 3 ans maximum ; rémunération de 10 % maximum du contrat conclu.</p>'}],consignes:"<p>Trois camps : l’agente (pour le compte de Lina), le club AHC, la marque Kinéo Sport. Chacun prépare sa négociation à partir du dossier commun et de son annexe. L’agente doit défendre les intérêts globaux de sa cliente et vérifier que chaque concession est dans son intérêt.</p>",camps:[{id:"A",name:"L’agente (JM Sports)",label:"Camp A — Julie Marchal, agente de Lina",color:"l4",mission:"Défendre les intérêts globaux de Lina auprès du club et de la marque, dans le cadre de son mandat.",annexe:"<h3>Le mandat</h3><p>Mandat exclusif de <strong>2 ans</strong> signé en mars. Services : recherche de club, négociation des contrats de club et des partenariats. Rémunération : <strong>7 %</strong> des contrats de club et <strong>10 %</strong> des contrats de partenariat négociés, à la charge de Lina.</p><h3>Les priorités de Lina (par ordre)</h3><ol><li>Jouer un rôle de <strong>titulaire en Ligue des champions</strong> pour viser l’équipe de France A d’ici deux ans.</li><li>Préparer l’après-carrière : elle suit une licence à distance et souhaite des <strong>aménagements d’entraînement</strong> pendant ses deux sessions d’examens par an.</li><li>Un salaire d’au moins <strong>4 000 € brut par mois</strong>.</li><li>Développer sa propre image : elle rêve de lancer d’ici deux ans une <strong>ligne de vêtements de handball pour les jeunes</strong>.</li></ol><h3>Alternatives</h3><ul><li><strong>US Côte d’Opale</strong> : offre écrite de 4 800 € brut par mois, 2 ans, place de titulaire assurée, pas de coupe d’Europe.</li><li>Un club allemand : intérêt informel, pas d’offre.</li></ul><h3>Information non vérifiée</h3><p>Selon un contact, AHC aurait aussi approché une joueuse danoise plus expérimentée.</p><h3>Point de vigilance</h3><p>Ta rémunération augmente avec les montants négociés : chaque arbitrage doit servir l’intérêt de Lina, pas ta commission.</p>"},{id:"B",name:"Atlantique HC",label:"Camp B — Atlantique Handball Club",color:"l2",mission:"Recruter l’ailière qui remplacera la titulaire, dans le budget du club et en sécurisant l’investissement.",annexe:"<h3>Qui décide ?</h3><p>La <strong>présidente</strong> (budget), le <strong>directeur sportif</strong> (conduit la négociation), l’<strong>entraîneur</strong> (Lina est son premier choix pour remplacer la titulaire).</p><h3>Contraintes</h3><ul><li>Masse salariale : <strong>5 000 € brut par mois au maximum</strong> pour ce poste.</li><li>La présidente veut des contrats de <strong>3 ans</strong> pour les jeunes talents, afin de sécuriser l’investissement.</li></ul><h3>Alternative</h3><p>Une joueuse danoise de 29 ans, expérimentée, demande <strong>5 500 € par mois</strong>, au-dessus du budget. Aucune autre ailière de ce niveau n’est disponible.</p><h3>Leviers</h3><ul><li>Primes : qualification européenne, matchs joués.</li><li>Revalorisation en deuxième saison en cas de sélection en équipe de France A.</li><li>Aménagements d’entraînement ponctuels : faciles à organiser.</li><li>Place dans le projet : l’entraîneur veut faire de Lina sa titulaire.</li></ul><h3>Lien avec Kinéo</h3><p>Kinéo, équipementier du club, a laissé entendre qu’un contrat individuel avec Lina renforcerait son partenariat avec AHC.</p>"},{id:"C",name:"Kinéo Sport",label:"Camp C — Kinéo Sport (marque)",color:"l1",mission:"Recruter une ambassadrice crédible pour lancer la gamme handball auprès des 12–20 ans.",annexe:"<h3>Objectifs</h3><p>Lancer la gamme handball en France, cible <strong>12–20 ans</strong> ; besoin de contenus sur les réseaux sociaux et d’une figure crédible.</p><h3>Marges</h3><ul><li>Budget ambassadrice : jusqu’à <strong>25 000 € par an</strong> pour un profil fort.</li><li>Possibilité d’une <strong>collection capsule</strong> avec <strong>5 % de royalties</strong> sur les ventes (l’équipe commerciale préfère un fixe).</li><li>Exclusivité : au minimum sur les <strong>chaussures et le textile sportif</strong> ; l’exclusivité totale est souhaitée mais pas indispensable.</li><li>Durée : 3 ans souhaités, 2 ans acceptables.</li></ul><h3>Alternatives</h3><p>Deux autres joueuses, dont une au profil proche mais moins suivie (12 000 abonnés) et qui ne joue pas la Ligue des champions.</p><h3>Lien avec AHC</h3><p>Si Lina signe à AHC, club équipé par Kinéo, sa visibilité en Ligue des champions sous les couleurs de la marque augmente la valeur du partenariat : la direction est alors prête à monter à 20 000 € par an et à proposer la collection capsule.</p>"}],steps:[{id:"g-contexte",camp:null,title:"Situer le contexte",seances:["s4","s1"],q:"En quoi cette situation est-elle une négociation spécifique ? Identifie les relations en jeu et le cadre.",keys:["Négociation par représentation : l’agente négocie au nom et dans l’intérêt de sa mandante","Deux négociations successives : mandat (déjà signé) puis valorisation auprès du club et de la marque","Multi-acteurs et parties liées : club et marque sont partenaires","Cadre : contrat d’agent encadré (≤ 3 ans, ≤ 10 %) selon le support","Information asymétrique : priorités de Lina, budget du club, marges de la marque"],model:"<p>C’est une <strong>négociation par représentation</strong> : Julie Marchal négocie au nom et dans l’intérêt de sa mandante, Lina. Comme le résume la séance 4, il y a <strong>deux négociations successives</strong> : la première (obtenir le mandat) est faite ; la seconde consiste à valoriser ce mandat auprès du club et de la marque. Elle est <strong>multi-acteurs</strong> et les parties sont <strong>liées</strong> : Kinéo est l’équipementier d’AHC, donc les deux accords s’influencent. Le <strong>cadre</strong> limite certaines possibilités (contrat d’agent : 3 ans maximum, 10 % maximum selon le support). L’<strong>information est asymétrique</strong> : chacun connaît ses priorités, son budget et ses marges.</p>",pitfalls:["Analyser comme si Lina négociait seule pour elle-même."]},{id:"g-mandat",camp:"A",title:"Le mandat est-il conforme ?",seances:["s4"],q:"Vérifie que le mandat respecte le cadre présenté par le support et explique ce qu’il clarifie.",keys:["Durée 2 ans ≤ 3 ans","Rémunération 7 % et 10 % ≤ 10 %","Services précisés, exclusivité, partie qui rémunère (Lina)","Clarifie ce que l’agente apporte et ce que la joueuse attend","La confiance ne dispense pas d’engagements clairs"],model:"<p>Le mandat est conforme au cadre présenté par le support : sa <strong>durée</strong> (2 ans) ne dépasse pas 3 ans ; la <strong>rémunération</strong> (7 % des contrats de club, 10 % des partenariats) ne dépasse pas 10 % des contrats conclus ; il précise les <strong>services</strong> (recherche de club, négociation des contrats et des partenariats), leur caractère <strong>exclusif</strong> et la <strong>partie qui rémunère</strong> (Lina). Il clarifie ainsi ce que l’agente apporte et ce que la joueuse attend : comme le dit le cours, la confiance facilite la relation, mais les engagements doivent être clairement définis.</p>",pitfalls:["Oublier de vérifier qui rémunère l’agent."]},{id:"g-offres",camp:"A",title:"AHC ou Côte d’Opale : prix ou valeur ?",seances:["s4"],q:"Compare les offres d’AHC et de l’US Côte d’Opale au regard des priorités de Lina. Laquelle privilégier, et comment utiliser l’autre ?",keys:["Côte d’Opale paie plus (4 800 € vs 4 200 €) mais sans coupe d’Europe","Priorité n°1 : titulaire en Ligue des champions → AHC sert mieux l’objectif équipe de France","Prix ≠ valeur : l’offre la plus chère n’est pas la meilleure","Côte d’Opale = alternative crédible (offre écrite) pour améliorer l’offre d’AHC","Le salaire AHC respecte le minimum de 4 000 € mais peut être amélioré"],model:"<p>L’US Côte d’Opale paie davantage (4 800 € contre 4 200 €) et garantit une place de titulaire, mais sans coupe d’Europe. Or la priorité n°1 de Lina est d’être <strong>titulaire en Ligue des champions</strong> pour viser l’équipe de France A : AHC, qui doit remplacer sa titulaire, sert mieux cet objectif. C’est la distinction du cours : une proposition financièrement supérieure n’est pas nécessairement meilleure si elle offre moins de potentiel de développement.</p><p>L’agente privilégie donc AHC, mais l’offre écrite de Côte d’Opale est une <strong>alternative crédible</strong> : comme David Falk avec l’offre d’Adidas, elle s’en sert pour améliorer celle d’AHC (salaire, primes, place dans le projet).</p>",pitfalls:["Choisir Côte d’Opale pour le salaire.","Choisir AHC sans utiliser l’offre concurrente."]},{id:"g-forceA",camp:"A",title:"Rapport de force avec AHC",seances:["s4","s3"],q:"Évalue le rapport de force entre Lina (et son agente) et AHC.",keys:["Rareté du profil : 2e meilleure marqueuse, équipe de France jeunes","Besoin d’AHC : remplacer une titulaire qui part (information publique)","Alternatives de Lina : Côte d’Opale (écrite), club allemand (informel, à ne pas surestimer)","Alternatives d’AHC : inconnues (rumeur d’une joueuse danoise) → à explorer","Conclusion : position favorable à Lina, sans excès"],model:"<p>Le profil de Lina est <strong>rare</strong> (deuxième meilleure marqueuse, déjà en équipe de France jeunes) et AHC a un <strong>besoin pressant</strong> : sa titulaire part à la retraite. Lina dispose d’une <strong>alternative crédible</strong> (Côte d’Opale, offre écrite) ; l’intérêt du club allemand est informel et ne doit pas être surestimé. Les alternatives d’AHC sont inconnues : la rumeur d’une joueuse danoise est à vérifier par des questions, pas à prendre pour un fait. Conclusion : le rapport de force penche en faveur de Lina, ce qui donne de la marge à l’agente — à utiliser pour ses priorités, pas seulement pour le salaire.</p>",pitfalls:["Prendre la rumeur pour un fait."]},{id:"g-prepAHC",camp:"A",title:"Préparer la négociation avec AHC",seances:["s4"],q:"Quelles variables négocier avec AHC, et quelles concessions conditionnelles prévoir ? Vérifie chacune avec la question du cours.",keys:["Variables : rôle de titulaire, salaire, primes, revalorisation, durée, aménagements pour les examens","Durée de 3 ans (souhait du club) : envisageable si contreparties","Formulation : « Nous pouvons envisager trois ans si… » (revalorisation, place dans le projet, aménagements)","Test : « Cette concession est-elle dans l’intérêt de Lina ? » (oui : 3 ans en Ligue des champions sert sa priorité)","Ne pas sacrifier la priorité sportive pour un salaire plus élevé"],model:"<p><strong>Variables</strong> : place de titulaire dans le projet (priorité n°1), salaire, primes (qualification européenne, matchs joués), revalorisation en cas de sélection en équipe de France A, durée, aménagements d’entraînement pendant les examens (priorité n°2).</p><p><strong>Concessions conditionnelles</strong> : « Nous pouvons envisager un contrat de trois ans <strong>si</strong> le salaire est porté à 4 600 €, avec une revalorisation en cas de sélection en équipe de France A, et des aménagements pendant ses examens. » ; « Nous pouvons renoncer à une partie du salaire fixe <strong>si</strong> des primes par match joué récompensent son temps de jeu. »</p><p><strong>Test</strong> : trois ans dans un club de Ligue des champions sert sa priorité n°1 — la concession est dans son intérêt. Accepter le plus gros salaire dans un rôle de remplaçante ne le serait pas.</p>",pitfalls:["Négocier seulement le salaire.","Oublier la question de l’intérêt du client."]},{id:"g-kineo",camp:"A",title:"Une proposition de valeur pour Kinéo",seances:["s4"],q:"Construis la proposition de valeur de Lina face à Kinéo et propose une contre-offre.",keys:["Ce que Lina apporte : audience 15–24 ans (45 000 abonnés), crédibilité sportive, visibilité si Ligue des champions","Ce que Kinéo apporte : rémunération, équipement, développement de sa propre marque","Intégrer le projet de ligne junior dans une collection capsule avec royalties","Exclusivité limitée (chaussures et textile sportif) et durée plus courte (2 ans)","Élargir la valeur créée plutôt que seulement augmenter le montant"],model:"<p><strong>Ce que Lina apporte à Kinéo</strong> : une audience de 45 000 abonnés âgés de 15 à 24 ans — la cible de la gamme —, la crédibilité d’une joueuse de haut niveau, et, si elle signe à AHC, une visibilité en Ligue des champions sous les couleurs de Kinéo. <strong>Ce que Kinéo peut lui apporter</strong> : une rémunération, l’équipement, et surtout un moyen de réaliser son projet de ligne de vêtements pour les jeunes.</p><p><strong>Contre-offre</strong> : une collection capsule junior co-conçue par Lina, avec royalties sur les ventes ; une exclusivité limitée aux chaussures et au textile sportif (au lieu de l’exclusivité totale) ; 2 ans ; des contenus réguliers et 4 apparitions par an ; une rémunération fixe revue à la hausse. C’est la logique Osaka / Levi’s : élargir la valeur créée par le partenariat.</p>",pitfalls:["Accepter l’exclusivité totale de 3 ans pour 15 000 €.","Demander seulement plus d’argent."]},{id:"g-besoinB",camp:"B",title:"Besoin, décideurs et alternatives du club",seances:["s4","s1"],q:"Analyse la situation d’AHC : qui décide, quel est son besoin, quelle est sa BATNA ?",keys:["Décideurs : présidente (budget), directeur sportif (négocie), entraîneur (veut Lina)","Besoin : remplacer la titulaire qui part ; Lina est le premier choix","BATNA : joueuse danoise à 5 500 € (hors budget) → faible","Contrainte : 5 000 € maximum ; volonté de contrats de 3 ans","Conclusion : le club a intérêt à conclure avec Lina"],model:"<p>Trois acteurs : la <strong>présidente</strong> tient le budget, le <strong>directeur sportif</strong> conduit la négociation, l’<strong>entraîneur</strong> veut Lina comme titulaire. Le besoin est réel et pressant : remplacer une titulaire qui part. La <strong>BATNA</strong> du club est faible : la joueuse danoise demande 5 500 €, au-dessus du plafond de 5 000 €, et aucune autre ailière de ce niveau n’est disponible. Le club a donc intérêt à conclure avec Lina, en restant sous 5 000 € et en obtenant si possible 3 ans.</p>",pitfalls:["Croire que le club est en position de force parce qu’il paie."]},{id:"g-propB",camp:"B",title:"La proposition du club",seances:["s4"],q:"Construis la proposition d’AHC : ce que le club peut offrir, ce qu’il demande en échange, et comment parler à l’agente.",keys:["Rester sous 5 000 € : salaire fixe + primes + revalorisation conditionnelle","Offrir ce qui coûte peu : place de titulaire, aménagements pour les examens","Demander 3 ans en contrepartie","Comprendre les priorités de la joueuse par des questions","Valoriser le lien avec Kinéo (partenariat individuel facilité)"],model:"<p>AHC peut proposer un salaire de <strong>4 500 à 4 600 €</strong>, une revalorisation jusqu’à 5 000 € en cas de sélection en équipe de France A, des primes (qualification européenne, matchs joués), la <strong>place de titulaire</strong> dans le projet de l’entraîneur et des <strong>aménagements</strong> pendant les examens — ces deux derniers points coûtent peu au club mais valent beaucoup pour la joueuse. En contrepartie, le club demande un engagement de <strong>3 ans</strong>. Le directeur sportif commence par des questions (« Qu’est-ce qui compte le plus pour Lina ? ») et peut mentionner que Kinéo, équipementier du club, s’intéresse à elle.</p>",pitfalls:["Proposer d’emblée le maximum (5 000 €)."]},{id:"g-valeurC",camp:"C",title:"Pourquoi Lina, et quelle offre ?",seances:["s4"],q:"Pour Kinéo : pourquoi Lina plutôt qu’une autre joueuse ? Construis une offre qui crée de la valeur pour les deux parties.",keys:["Lina : audience plus forte (45 000) et ciblée 15–24 ans, Ligue des champions possible","Autre joueuse : moins suivie, pas de Ligue des champions → alternative moins attractive","Offre : fixe (jusqu’à 20 000 € si AHC) + capsule avec 5 % de royalties","Exclusivité minimale : chaussures et textile sportif (totale non indispensable)","Contenus et apparitions, durée 2 à 3 ans"],model:"<p>Lina est la meilleure option : une audience plus forte (45 000 abonnés contre 12 000) et exactement sur la cible, une crédibilité sportive supérieure, et la Ligue des champions si elle signe à AHC, club équipé par Kinéo. L’autre joueuse est une alternative, mais moins attractive.</p><p><strong>Offre</strong> : un fixe pouvant aller jusqu’à 20 000 € par an si Lina rejoint AHC, une collection capsule junior avec 5 % de royalties (ce qui aligne la rémunération sur les ventes et répond au projet de la joueuse), une exclusivité sur les chaussures et le textile sportif, des contenus mensuels et quelques apparitions, sur 2 ou 3 ans. Kinéo n’a pas besoin de l’exclusivité totale pour atteindre ses objectifs : la céder rend l’accord plus acceptable.</p>",pitfalls:["S’accrocher à l’exclusivité totale alors qu’elle n’est pas indispensable."]}],debrief:{A:"<p><strong>Ce que révèlent les autres annexes</strong> : AHC est plafonné à 5 000 € mais n’a pas d’alternative crédible (la joueuse danoise est hors budget) ; il veut 3 ans et peut offrir facilement la place de titulaire et des aménagements. Kinéo peut monter jusqu’à 20 000 € (25 000 € au maximum) et proposer une capsule avec royalties ; l’exclusivité totale n’est pas indispensable ; et la signature à AHC augmente la valeur de Lina pour la marque.</p><p><strong>Conséquence</strong> : les deux accords se renforcent mutuellement. En acceptant 3 ans à AHC contre une revalorisation et sa place de titulaire, l’agente sert la priorité n°1 de Lina et augmente sa valeur pour Kinéo, qui peut alors financer la capsule — le projet n°4 de sa cliente.</p>",B:"<p><strong>Ce que révèlent les autres annexes</strong> : la priorité n°1 de Lina est d’être titulaire en Ligue des champions — AHC est son premier choix sportif ; elle a une offre écrite à 4 800 € de Côte d’Opale ; elle a besoin d’aménagements pendant ses examens ; Kinéo est prêt à investir davantage si elle signe à AHC.</p><p><strong>Conséquence</strong> : AHC pouvait conclure sous 5 000 € en misant sur ce qui compte pour la joueuse (projet sportif, aménagements, revalorisation) plutôt que sur le seul salaire.</p>",C:"<p><strong>Ce que révèlent les autres annexes</strong> : Lina rêve de lancer une ligne de vêtements pour les jeunes — une capsule co-conçue est pour elle une valeur bien supérieure à quelques milliers d’euros de fixe ; son agente touche 10 % des partenariats et doit vérifier que l’exclusivité ne bloque pas ses projets ; AHC veut aussi la signer.</p><p><strong>Conséquence</strong> : la capsule avec royalties et une exclusivité limitée créent plus de valeur qu’une hausse du fixe — et coûtent moins à Kinéo.</p>"},synthese:"<p><strong>Des accords réalistes</strong> — <em>AHC</em> : 3 ans, 4 600 € brut par mois, revalorisation à 5 000 € en cas de sélection en équipe de France A, prime de qualification européenne et prime par match joué, rôle de titulaire dans le projet, aménagements d’entraînement pendant les examens. <em>Kinéo</em> : 2 ans (une saison supplémentaire en option), 20 000 € par an, collection capsule junior co-conçue par Lina avec 5 % de royalties, exclusivité limitée aux chaussures et au textile sportif, contenus mensuels et 4 apparitions par an. L’agente perçoit 7 % du contrat de club et 10 % du partenariat, dans le cadre présenté par le support.</p><p>Ce cas illustre la compétence fondamentale de l’agent selon le cours : <strong>comprendre les intérêts de son client, identifier ceux de l’autre partie et construire un accord qui protège le mandant tout en donnant à l’autre partie une raison réelle de conclure</strong>.</p>"};var Js={id:"clinique",title:"Le comité de la clinique des Tilleuls",badge:"Cas d’entraînement",level:2,context:"Comité d’achat (multi-acteurs) sous contrainte de délai",seances:["s1","s2"],pitch:"Le logiciel de planning d’une clinique ne sera plus maintenu dans quatre mois. Un éditeur présente sa solution à un comité de quatre personnes aux préoccupations très différentes. Qui décide, qui influence, et comment une contrainte de délai pèse-t-elle sur la négociation ?",intro:"Cas inventé pour l’entraînement (organisations fictives). Il applique la séance 1 (négociation multi-acteurs, sous contrainte, information asymétrique) et les outils de préparation de la séance 2.",commun:[{id:"D1",title:"La situation",html:"<p>La <strong>clinique des Tilleuls</strong> (180 salariés) planifie le travail de ses équipes avec un logiciel dont l’éditeur arrête la maintenance le <strong>31 mars</strong>, dans quatre mois. Elle consulte deux éditeurs. Il ne s’agit pas d’un marché public : la clinique est privée et organise librement sa consultation. Décision prévue en comité dans <strong>trois semaines</strong>.</p><p><strong>Le comité</strong> : la directrice, le directeur administratif et financier (DAF), le responsable informatique et la cadre de santé, qui représente les infirmières et aides-soignantes.</p>"},{id:"D2",title:"La proposition de PlanéoSanté",html:'<table class="calc"><tbody><tr><th>Abonnement</th><td>1 900 € HT par mois</td></tr><tr><th>Frais de déploiement</th><td>9 000 € HT</td></tr><tr><th>Déploiement</th><td>6 semaines</td></tr><tr><th>Formation</th><td>3 jours (horaires de jour)</td></tr><tr><th>Engagement</th><td>36 mois</td></tr></tbody></table><p>PlanéoSanté, éditeur de 25 salariés, est reçue par le comité la semaine prochaine.</p>'}],consignes:"<p>Le camp PlanéoSanté prépare la présentation au comité ; le camp de la clinique prépare la position commune du comité. Ne révèle pas ton annexe avant le débrief.</p>",camps:[{id:"A",name:"PlanéoSanté",label:"Camp A — PlanéoSanté (éditeur)",color:"l3",mission:"Convaincre le comité et signer dans de bonnes conditions, en ouvrant la porte du groupe.",annexe:"<h3>Coûts et marges</h3><ul><li>Abonnement plancher : <strong>1 600 € par mois</strong> (en dessous, le contrat n’est pas rentable).</li><li>Le déploiement coûte <strong>6 000 €</strong> en interne (facturé 9 000 €).</li><li>Une journée de formation supplémentaire (par exemple de nuit) coûte <strong>800 €</strong>.</li><li>PlanéoSanté peut offrir jusqu’à 50 % des frais de déploiement en échange d’un engagement de 36 mois.</li></ul><h3>Atouts</h3><ul><li>Application mobile simple, avec échange de gardes entre soignants.</li><li>Deux cliniques de la région déjà équipées (références).</li><li>Déploiement terminé avant mi-mars si la commande est signée dans les trois semaines.</li></ul><h3>Enjeux</h3><p>La clinique appartient à un <strong>groupe de six cliniques</strong> : une réussite ici ouvrirait les cinq autres.</p><h3>Concurrence</h3><p>Selon un ancien client, MedPlan (grand éditeur) propose environ 1 700 € par mois, mais ses déploiements durent <strong>environ trois mois</strong>.</p>"},{id:"B",name:"Clinique des Tilleuls",label:"Camp B — le comité de la clinique",color:"l1",mission:"Choisir une solution fiable avant le 31 mars, dans le budget, qui sera réellement utilisée par les équipes.",annexe:"<h3>Les positions des membres du comité</h3><ul><li><strong>La directrice</strong> (décide) : assurer la continuité avant le 31 mars ; faire de ce projet une réussite visible auprès du groupe.</li><li><strong>Le DAF</strong> : budget d’abonnement de <strong>21 000 € par an</strong> au maximum (1 750 € par mois) ; limiter les frais de déploiement ; engagement de <strong>24 mois</strong> au maximum.</li><li><strong>Le responsable informatique</strong> : interface avec le logiciel de paie et hébergement certifié pour les données de santé <strong>indispensables</strong> ; reprise des plannings existants souhaitée.</li><li><strong>La cadre de santé</strong> : les équipes ont rejeté le dernier outil, jugé trop compliqué ; elle veut une application mobile simple, l’échange de gardes, et une formation aussi pour les équipes de nuit.</li></ul><h3>Alternatives</h3><ul><li><strong>MedPlan</strong> : 1 700 € par mois, 4 000 € de frais, 24 mois d’engagement, mais un déploiement d’environ trois mois : fin probable <strong>après le 31 mars</strong>.</li><li>Prolonger l’ancien logiciel : impossible.</li></ul>"}],steps:[{id:"k-contexte",camp:null,title:"Situer le contexte",seances:["s1"],q:"Caractérise ce contexte avec les notions de la séance 1.",keys:["Négociation multi-acteurs : un vendeur face à un comité","Rôles : décideur (directrice), financier, technique, utilisatrice","Négociation sous contrainte : fin de maintenance au 31 mars","Cadre relativement libre (clinique privée, pas d’appel d’offres) mais mise en concurrence de deux éditeurs","Information asymétrique : budget et contraintes du comité / coûts et marges de l’éditeur"],model:"<p>C’est une <strong>négociation multi-acteurs</strong> : un vendeur face à un comité où chacun a son rôle — la directrice décide, le DAF pèse sur le budget, le responsable informatique sur la faisabilité, la cadre de santé sur l’usage (exactement les préoccupations types du cours). C’est aussi une <strong>négociation sous contrainte</strong> : l’arrêt de la maintenance au 31 mars pèse directement sur la négociation. Le cadre est <strong>relativement libre</strong> (clinique privée, pas d’appel d’offres), mais deux éditeurs sont mis en concurrence. L’information est <strong>asymétrique</strong> : la clinique connaît son budget et ses exigences ; l’éditeur connaît ses coûts et ses marges.</p>",pitfalls:["Qualifier d’appel d’offres une consultation privée sans procédure."]},{id:"k-roles",camp:"A",title:"Parler à chaque membre du comité",seances:["s1","s2"],q:"Pour chaque membre du comité, identifie sa préoccupation probable, un argument (caractéristique → bénéfice) et une question à lui poser.",keys:["Directrice (décideuse) : continuité avant le 31 mars → déploiement terminé mi-mars","DAF (financier) : budget → coût total maîtrisé ; question sur son budget et sa durée d’engagement","Responsable informatique (technique) : faisabilité → interface paie, hébergement, reprise des données","Cadre de santé (utilisatrice) : usage → appli mobile simple, échange de gardes, références de soignants","Préoccupations formulées comme hypothèses à vérifier par des questions"],model:'<table class="calc"><thead><tr><th>Membre</th><th>Préoccupation probable</th><th>Argument</th><th>Question</th></tr></thead><tbody><tr><td>Directrice (décide)</td><td>Continuité, réussite du projet</td><td>« Signé dans trois semaines, le déploiement est terminé avant mi-mars : aucun risque de trou de planning au 31 mars. »</td><td>« Quels seraient pour vous les signes d’une réussite ? »</td></tr><tr><td>DAF</td><td>Budget</td><td>« Un abonnement tout compris : pas de coûts cachés de maintenance. »</td><td>« Quelle enveloppe et quelle durée d’engagement envisagez-vous ? »</td></tr><tr><td>Responsable informatique</td><td>Faisabilité</td><td>« Notre interface avec les logiciels de paie évite les doubles saisies. »</td><td>« Quels sont vos impératifs d’intégration et d’hébergement ? »</td></tr><tr><td>Cadre de santé</td><td>Usage</td><td>« L’application mobile permet aux soignants d’échanger leurs gardes en quelques clics : moins d’appels au cadre. »</td><td>« Qu’est-ce qui n’a pas fonctionné avec l’outil précédent ? »</td></tr></tbody></table><p>Ces préoccupations restent des <strong>hypothèses</strong> tirées des rôles (séance 1) : les questions servent à les vérifier.</p>',pitfalls:["Présenter les attentes de chacun comme des faits.","Ne s’adresser qu’à la directrice."]},{id:"k-contrainte",camp:"A",title:"La contrainte de délai : un levier ?",seances:["s1","s3"],q:"En quoi la contrainte du 31 mars modifie-t-elle le rapport de force ? Comment PlanéoSanté doit-elle l’utiliser ?",keys:["La contrainte réduit les alternatives de la clinique (MedPlan : environ 3 mois de déploiement)","Avantage pour PlanéoSanté : capacité à livrer à temps (si signature sous 3 semaines)","Utiliser la contrainte en démontrant la capacité, pas en menaçant","Information à vérifier : délai réel de MedPlan (témoignage d’un ancien client)","Ne pas surexploiter l’urgence : relation et potentiel du groupe (6 cliniques)"],model:"<p>La contrainte du 31 mars <strong>réduit les alternatives</strong> de la clinique : si MedPlan met environ trois mois à déployer, il risque de finir après la date limite. PlanéoSanté, qui peut terminer avant mi-mars si la commande est signée sous trois semaines, gagne donc en pouvoir de négociation.</p><p>Mais elle doit l’utiliser avec méthode : en <strong>démontrant</strong> sa capacité (planning de déploiement, références de cliniques équipées) plutôt qu’en faisant pression ; en vérifiant l’information sur MedPlan, qui n’est qu’un témoignage ; et sans surexploiter l’urgence, car l’enjeu véritable est le <strong>groupe de six cliniques</strong> : une relation dégradée fermerait cette porte.</p>",pitfalls:["Augmenter son prix « parce qu’ils sont pressés »."]},{id:"k-concessions",camp:"A",title:"Concessions et contreparties",seances:["s2","s3"],q:"Prépare les concessions possibles de PlanéoSanté, leur coût, et les contreparties à demander.",keys:["Abonnement : marge entre 1 900 € et le plancher de 1 600 €","Frais de déploiement : jusqu’à −50 % contre un engagement de 36 mois (coût réel 6 000 €)","Formation de nuit : 800 € → contrepartie à obtenir","Contreparties : engagement, signature rapide, statut de pilote / référence auprès du groupe","Rester au-dessus du plancher et chiffrer chaque concession"],model:'<table class="calc"><thead><tr><th>Concession</th><th>Coût / limite</th><th>Contrepartie</th></tr></thead><tbody><tr><td>Baisser l’abonnement de 1 900 € vers 1 750 €</td><td>Plancher : 1 600 €</td><td>Signature dans les trois semaines</td></tr><tr><td>Réduire les frais de déploiement (jusqu’à 4 500 €)</td><td>Coût réel : 6 000 €</td><td>Engagement de 36 mois — ou, si le DAF refuse, une réduction moindre</td></tr><tr><td>Une journée de formation de nuit</td><td>800 €</td><td>Être présenté au groupe comme clinique pilote / référence</td></tr></tbody></table><p>Chaque concession est chiffrée et liée à une contrepartie ; l’objectif stratégique (le groupe) justifie un effort sur ce premier contrat, sans descendre sous le plancher.</p>',pitfalls:["Offrir la formation de nuit sans contrepartie."]},{id:"k-aligner",camp:"B",title:"Aligner le comité",seances:["s1","s2"],q:"Avant de rencontrer l’éditeur, le comité doit adopter une position commune. Distingue ce qui est indispensable de ce qui est souhaitable, et identifie les tensions internes.",keys:["Indispensables : déploiement avant le 31 mars, interface paie, hébergement certifié","Budget : 1 750 € par mois maximum, frais limités","Souhaitables : reprise des plannings, formation de nuit, appli mobile simple (adoption)","Tension : DAF (24 mois max) vs remise de l’éditeur liée à 36 mois ; coût vs usage","La directrice arbitre ; l’adoption par les équipes est un enjeu majeur (outil précédent rejeté)"],model:"<p><strong>Indispensable</strong> : un déploiement terminé avant le 31 mars ; l’interface avec le logiciel de paie et un hébergement certifié pour les données de santé (exigences du responsable informatique). <strong>Budget</strong> : 1 750 € par mois au maximum, des frais de déploiement limités. <strong>Souhaitable</strong> : la reprise des plannings existants, une application mobile simple avec échange de gardes, une formation aussi de nuit — ce n’est pas accessoire, car l’outil précédent a été rejeté par les équipes : un logiciel non utilisé serait un échec.</p><p><strong>Tensions</strong> : le DAF veut 24 mois au plus, alors qu’un éditeur peut lier ses remises à un engagement plus long ; le coût et l’usage peuvent s’opposer. La directrice, qui décide, doit arbitrer avant la réunion pour que le comité parle d’une seule voix.</p>",pitfalls:["Laisser chaque membre négocier sa priorité séparément."]},{id:"k-batnaB",camp:"B",title:"Alternative et coût total",seances:["s3","s2"],q:"Compare le coût total sur 24 mois de PlanéoSanté (offre initiale) et de MedPlan, puis évalue la BATNA de la clinique.",keys:["PlanéoSanté (offre initiale) sur 24 mois : 1 900 × 24 + 9 000 = 54 600 €","MedPlan : 1 700 × 24 + 4 000 = 44 800 €","Mais MedPlan : déploiement de 3 mois → après le 31 mars : risque de trou de planning","BATNA faible au regard de la contrainte ; prix ≠ valeur","La clinique a intérêt à négocier avec PlanéoSanté sans dévoiler sa contrainte de budget"],model:"<p>Sur 24 mois : PlanéoSanté (offre initiale) = 1 900 × 24 + 9 000 = <strong>54 600 €</strong> (et l’offre impose 36 mois) ; MedPlan = 1 700 × 24 + 4 000 = <strong>44 800 €</strong>. MedPlan semble moins cher, mais son déploiement d’environ trois mois risque de dépasser le 31 mars : la clinique se retrouverait sans planning maintenu. Sa BATNA est donc <strong>faible au regard de la contrainte</strong> — le moins cher n’est pas forcément le meilleur.</p><p>La clinique a intérêt à négocier avec PlanéoSanté : obtenir un abonnement dans son budget, réduire les frais et limiter la durée, en échange de ce qui a de la valeur pour l’éditeur (signature rapide, référence auprès du groupe) — sans révéler d’emblée sa contrainte budgétaire.</p>",pitfalls:["Choisir MedPlan sur le seul prix."]},{id:"k-propB",camp:"B",title:"La position du comité",seances:["s2","s3"],q:"Formule la proposition du comité et les questions à poser à PlanéoSanté.",keys:["Abonnement 1 750 € maximum, frais de déploiement réduits","Engagement 24 mois (ou plus seulement contre une vraie contrepartie)","Formation de nuit et reprise des plannings incluses","Contrepartie offerte : signature rapide, rôle de clinique pilote / référence auprès du groupe","Questions : garanties sur le délai de déploiement, interface paie, hébergement, références de soignants"],model:"<p><strong>Proposition</strong> : un abonnement à 1 750 € par mois, des frais de déploiement réduits, un engagement de 24 mois, la formation des équipes de nuit et la reprise des plannings incluses. En contrepartie, la clinique peut offrir ce qui coûte peu et vaut beaucoup pour l’éditeur : une <strong>signature rapide</strong> et le statut de <strong>clinique pilote</strong> présentée au groupe si le déploiement réussit.</p><p><strong>Questions</strong> : « Pouvez-vous vous engager par écrit sur une fin de déploiement avant le 31 mars ? » ; « Comment fonctionne l’interface avec notre logiciel de paie ? » ; « Où et comment sont hébergées les données ? » ; « Pouvons-nous échanger avec les soignants d’une clinique déjà équipée ? »</p>",pitfalls:["Annoncer d’emblée le budget maximal."]}],debrief:{A:"<p><strong>Ce que révèle l’annexe de la clinique</strong> : budget de 1 750 € par mois, engagement de 24 mois maximum, interface paie et hébergement indispensables, rejet du précédent outil par les équipes, et une alternative (MedPlan) qui risque de dépasser le 31 mars. La clinique a besoin de PlanéoSanté — mais le DAF bloquera un engagement de 36 mois.</p><p><strong>Conséquence</strong> : plutôt que de lier la remise à 36 mois, l’éditeur gagnait à demander ce que la clinique peut donner facilement : une signature rapide et le statut de pilote auprès du groupe.</p>",B:"<p><strong>Ce que révèle l’annexe de PlanéoSanté</strong> : son plancher est à 1 600 € par mois ; le déploiement lui coûte 6 000 € ; elle tient surtout au <strong>groupe de six cliniques</strong>.</p><p><strong>Conséquence</strong> : le statut de clinique pilote était la meilleure monnaie d’échange du comité — elle ne coûte rien et vaut beaucoup pour l’éditeur.</p>"},synthese:"<p><strong>Un accord réaliste</strong> : abonnement de 1 750 € par mois sur 24 mois, frais de déploiement ramenés à 6 000 €, déploiement terminé avant mi-mars (engagement écrit), formation de jour et une journée de nuit, reprise des plannings, interface paie et hébergement conformes ; en contrepartie, signature dans les trois semaines et statut de cliniq

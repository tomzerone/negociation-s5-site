ue pilote présentée au groupe. Coût sur 24 mois : 1 750 × 24 + 6 000 = <strong>48 000 €</strong> — plus que MedPlan (44 800 €), mais sans risque de trou de planning et avec un outil conçu pour être adopté par les équipes.</p><p>Ce cas illustre la négociation <strong>multi-acteurs</strong> (identifier les rôles et parler à chacun), le poids d’une <strong>contrainte</strong> sur le rapport de force, et la recherche de <strong>contreparties à forte valeur et faible coût</strong>.</p>"};var O=[Bs,Gs,Hs,Vs,Js];var le=[{id:"ex1",title:"Contrôle blanc n°1 — Contextes et référencement",duration:90,desc:"Questions de cours sur les séances 1 et 3, puis un cas de référencement en grande distribution.",parts:[{title:"Partie 1 — Questions de cours",questions:[{id:"e1q1",points:2,seances:["s1"],q:"Définissez la négociation spécifique et expliquez pourquoi « le contexte n’est pas un simple décor ».",criteria:[["Définition exacte : modalités fortement influencées par les caractéristiques du contexte",1],["Le contexte influence l’organisation et la conduite de la négociation (règles, acteurs, information, temporalité) ; d’où l’analyse préalable",1]],model:"<p>Une négociation spécifique est une négociation dont les <strong>modalités sont fortement influencées par les caractéristiques du contexte</strong> dans lequel elle se déroule. Le contexte n’est pas un simple décor car il <strong>influence la manière dont la négociation est organisée et conduite</strong> : il fixe les règles (une procédure d’appel d’offres, des conditions imposées par une enseigne), le déroulement (ponctuel ou processus formalisé), les acteurs (un interlocuteur ou un comité) et l’information disponible. C’est pourquoi le négociateur doit d’abord analyser la situation avant de choisir sa manière de négocier.</p>"},{id:"e1q2",points:2,seances:["s1"],q:"Citez les quatre dimensions qui permettent de caractériser le contexte d’une négociation et illustrez l’une d’elles par un exemple.",criteria:[["Les quatre dimensions avec leurs pôles (cadre, temporalité, acteurs, information)",1],["Un exemple pertinent et correctement expliqué",1]],model:"<p>Le <strong>cadre</strong> (relativement libre ↔ fortement encadré), la <strong>temporalité</strong> (ponctuelle ↔ processus formalisé), les <strong>acteurs</strong> (individuelle ↔ multi-acteurs) et l’<strong>information</strong> (relativement équilibrée ↔ asymétrique). Exemple : l’information est asymétrique lorsque l’acheteur connaît son budget maximal et le vendeur son coût de revient et sa marge minimale, sans que l’autre partie y ait accès ; la question clé est alors « Qui sait quoi ? ».</p>"},{id:"e1q3",points:2,seances:["s3"],q:"Distinguez référencement, assortiment et implantation.",criteria:[["Référencement : décision d’intégrer un fournisseur et/ou ses produits dans l’offre",.75],["Assortiment : références effectivement proposées",.5],["Implantation : présence concrète du produit dans les magasins",.75]],model:"<p>Le <strong>référencement</strong> est la décision d’intégrer un fournisseur et/ou ses produits dans l’offre de l’enseigne. L’<strong>assortiment</strong> désigne les références effectivement proposées. L’<strong>implantation</strong> est la présence concrète du produit dans les magasins. Être référencé ne garantit donc pas d’être implanté partout.</p>"},{id:"e1q4",points:2,seances:["s3","s1"],q:"Qu’est-ce qu’une BATNA ? Montrez son lien avec le rapport de force à l’aide de l’exemple du cours.",criteria:[["Définition : solution de repli en cas d’absence d’accord (MESORE)",.75],["Lien : plus une alternative est crédible, moins on dépend de l’autre",.5],["Exemple des fournisseurs A (40 %, fragile) et B (10 %, solide)",.75]],model:"<p>La <strong>BATNA</strong> (MESORE dans la grille de la séance 1) est la <strong>solution de repli en cas d’absence d’accord</strong>. Elle fonde le rapport de force : <strong>plus une alternative est crédible, moins la partie dépend de son interlocuteur</strong>. Dans l’exemple du cours, le fournisseur A, qui réalise 40 % de son chiffre d’affaires avec l’enseigne et n’a quasiment aucune autre distribution, est en position fragile ; le fournisseur B, pour qui l’enseigne ne pèse que 10 % et qui travaille avec plusieurs distributeurs, est en position solide.</p>"}]},{title:"Partie 2 — Cas pratique : les Confitures Lemoine",enonce:"<p><strong>Les Confitures Lemoine</strong> (entreprise fictive), PME angevine de 12 salariés, fabrique des confitures artisanales en six parfums (200 000 pots par an). Elle vend <strong>70 % de sa production</strong> à une seule enseigne régionale, Super Loire. Prix de cession habituel : <strong>3,20 € HT</strong> le pot ; coût de revient : <strong>2,30 €</strong>. Elle peut produire 25 % de plus sans investir.</p><p>Elle a obtenu un rendez-vous avec l’acheteuse de <strong>Natéa</strong>, enseigne bio de 80 magasins qui veut développer les produits de « petits producteurs ». L’acheteuse annonce : 2 parfums en test dans 25 magasins pendant 4 mois, un prix de <strong>2,90 €</strong>, et une participation à l’opération « Petits producteurs » (une animation par magasin et 10 % de remise promotionnelle pendant 3 semaines). Une autre enseigne bio s’est dite intéressée, oralement, sans proposition écrite.</p>",questions:[{id:"e1q5",points:3,seances:["s3","s1"],q:"Analysez le contexte de cette négociation et le rapport de force entre Lemoine et Natéa.",criteria:[["Contexte : référencement en grande distribution (enseigne, acheteuse, conditions proposées), processus avec test",1],["Dépendance de Lemoine à Super Loire (70 %) : enjeu de diversification, besoin de conclure",.75],["Alternatives : intérêt oral d’une autre enseigne → peu crédible ; Natéa a des fournisseurs substituables",.75],["Attractivité de l’offre (artisanal, petits producteurs) et conclusion nuancée",.5]],model:"<p>Il s’agit d’un <strong>référencement</strong> : Lemoine veut intégrer ses produits dans l’assortiment de Natéa et négocie avec l’acheteuse, qui propose des conditions (test, prix, promotion) dans un processus organisé.</p><p><strong>Rapport de force</strong> : Lemoine est très dépendante de Super Loire (70 % de sa production) — d’où un fort intérêt à diversifier ses débouchés, ce qui la pousse à conclure. Son alternative (une enseigne intéressée oralement) n’est pas crédible tant qu’aucune proposition n’est écrite. Natéa, elle, peut se tourner vers d’autres fournisseurs. Mais l’offre de Lemoine est <strong>attractive</strong> pour une enseigne qui veut développer les « petits producteurs ». Le rapport de force est plutôt favorable à Natéa ; Lemoine doit compenser par la pertinence de son offre et éviter de négocier sous la pression de sa dépendance.</p>"},{id:"e1q6",points:3,seances:["s3","s2"],q:"Calculez la marge unitaire de Lemoine à 3,20 € et à 2,90 €, puis pendant la promotion. La concession demandée est-elle acceptable ? Raisonnez sur l’économie globale de la relation.",criteria:[["Marges : 0,90 € à 3,20 € ; 0,60 € à 2,90 € (−33 %)",1],["Promotion : 2,90 × 0,9 = 2,61 € → marge 0,31 €",.5],["Volume nécessaire pour compenser : +50 % (0,90 / 0,60)",.5],["Raisonnement : la concession ne vaut que contre une contrepartie (élargissement, volume) — économie globale",1]],model:"<p>À 3,20 €, la marge unitaire est de 3,20 − 2,30 = <strong>0,90 €</strong> ; à 2,90 €, elle tombe à <strong>0,60 €</strong>, soit un tiers de moins. Pendant la promotion de 10 %, le prix devient 2,61 € et la marge <strong>0,31 €</strong>. Pour conserver la même marge totale, il faudrait vendre 0,90 / 0,60 = 1,5 fois plus, soit <strong>+50 % de volume</strong>.</p><p>Comme dans l’exemple 10 € → 9 € du cours, la question n’est pas seulement « puis-je accepter 2,90 € ? » mais « que rapporte cette concession ? ». Elle n’est acceptable que si elle est liée à une contrepartie qui compense son coût : un engagement d’élargissement (plus de parfums, plus de magasins) en cas de succès, ou un volume garanti. Sans contrepartie, c’est une baisse gratuite.</p>"},{id:"e1q7",points:3,seances:["s3","s2"],q:"Proposez trois concessions possibles de Lemoine, chacune associée à une contrepartie.",criteria:[["Trois concessions réalistes (test, prix, animation/promotion, livraison…)",1],["Chacune liée à une contrepartie précise (critères d’élargissement écrits, volume, mise en avant…)",1.5],["Formulation conditionnelle (« si vous… je peux envisager… ») et respect des limites (marge, capacité)",.5]],model:"<ul><li>« J’accepte de démarrer par un test de 2 parfums dans 25 magasins <strong>si</strong> les critères d’élargissement (ventes à atteindre, calendrier, nombre de magasins) sont écrits dans la convention. »</li><li>« Je peux envisager un prix de 3,00 € sur les parfums du test <strong>si</strong> vous vous engagez sur l’élargissement à 4 parfums et 80 magasins en cas de succès. »</li><li>« Je finance une animation par magasin pendant l’opération “Petits producteurs” <strong>en échange</strong> d’une mise en avant des produits, plutôt qu’une remise de 10 % qui réduirait ma marge à 0,31 €. »</li></ul><p>Chaque concession est chiffrée, reste au-dessus du coût de revient et compatible avec la capacité (+25 %).</p>"},{id:"e1q8",points:3,seances:["s3","s2","s1"],q:"Rédigez la recommandation et la stratégie de Lemoine pour le rendez-vous : objectifs, argument principal, questions à poser, points de vigilance.",criteria:[["Recommandation argumentée (aller au rendez-vous et accepter un test sous conditions)",.75],["Objectifs : idéal / cible réaliste / seuil minimal chiffrés",.75],["Argument relié aux besoins des clients de l’enseigne (petits producteurs) + questions sur les priorités et critères",.75],["Vigilance : marge pendant la promotion, capacité, formalisation (convention), ne pas dépendre d’une nouvelle enseigne",.75]],model:"<p><strong>Recommandation</strong> : accepter le principe d’un test, qui sert la diversification de Lemoine, mais <strong>sous conditions</strong>.</p><p><strong>Objectifs</strong> : idéal 3,20 € ; cible réaliste 3,00 € ; seuil minimal 2,90 € et seulement contre un élargissement écrit. <strong>Argument</strong> : « Nos confitures artisanales, produites à moins de 100 km, incarnent exactement les “petits producteurs” que vos clients recherchent : elles donnent du sens à votre opération. » <strong>Questions</strong> : « Quels résultats attendez-vous pour élargir le référencement ? », « Quels parfums correspondent le mieux à vos clients ? », « Comment se déroule l’opération “Petits producteurs” ? »</p><p><strong>Vigilance</strong> : la remise promotionnelle réduirait la marge à 0,31 € ; la capacité (+25 %, soit 50 000 pots) limite l’élargissement ; tout doit être formalisé dans la convention ; enfin, l’objectif est de réduire la dépendance, pas d’en créer une nouvelle.</p>"}]}]},{id:"ex2",title:"Contrôle blanc n°2 — Appels d’offres",duration:90,desc:"Questions de cours sur la séance 2, puis un cas d’appel d’offres à analyser de A à Z.",parts:[{title:"Partie 1 — Questions de cours",questions:[{id:"e2q1",points:2,seances:["s2"],q:"Qu’est-ce qu’un appel d’offres ? Pourquoi n’est-ce pas une simple demande de prix ?",criteria:[["Définition : mise en concurrence de plusieurs fournisseurs pour satisfaire un besoin défini",1],["Réponse structurée à un besoin, règles et critères définis à l’avance, critères multiples",1]],model:"<p>Un appel d’offres est une <strong>procédure par laquelle un acheteur met plusieurs fournisseurs en concurrence afin de satisfaire un besoin défini</strong>. Ce n’est pas une simple demande de prix : l’acheteur attend une <strong>réponse structurée</strong> à son besoin, dans le respect de règles et de critères définis à l’avance (prix, qualité, valeur technique, délais, sécurité, fiabilité, performance environnementale, accompagnement), généralement pondérés.</p>"},{id:"e2q2",points:2,seances:["s2"],q:"Expliquez la logique « Go / No-Go » et les éléments sur lesquels repose la décision.",criteria:[["Go / No-Go / Go sous conditions correctement définis",1],["Capacité, rentabilité, chances de réussite (avec quelques éléments)",1]],model:"<p>L’entreprise évalue si l’effort de réponse est justifié : <strong>Go</strong> (elle répond), <strong>No-Go</strong> (elle renonce), <strong>Go sous conditions</strong> (elle poursuit l’analyse mais doit obtenir des informations avant de décider). La décision repose sur la <strong>capacité</strong> (compétences, moyens, personnel, certifications, références, zone), la <strong>rentabilité</strong> (coûts, pénalités, trésorerie, marge prévisible — le chiffre d’affaires ne suffit pas) et les <strong>chances de réussite</strong> (adéquation, références, concurrence, poids du prix, différenciation, information).</p>"},{id:"e2q3",points:2,seances:["s2"],q:"Pourquoi une entreprise ne doit-elle jamais présenter une exigence obligatoire comme négociable ? Donnez deux exemples d’exigences.",criteria:[["Une offre qui ne respecte pas une exigence essentielle peut être écartée, même moins chère",1],["La conformité est le socle : non compensable par un argument commercial",.5],["Deux exemples (qualification, norme, délai maximal, assurance)",.5]],model:"<p>Parce qu’<strong>une offre qui ne respecte pas une exigence essentielle peut être écartée, même si elle présente un prix intéressant</strong>. La conformité est le socle de l’offre : une non-conformité ne peut pas être compensée par un argument commercial. Exemples d’exigences : une qualification, une norme, un délai maximal, une assurance.</p>"},{id:"e2q4",points:2,seances:["s2"],q:"Quels objectifs l’entreprise doit-elle fixer avant de négocier, et que doit-elle connaître avant de proposer un prix ?",criteria:[["Objectif idéal, cible réaliste, seuil minimal acceptable",1],["Coût de revient, marge minimale, prix cible, prix maximal acceptable, coûts des concessions",1]],model:"<p>Avant de négocier, elle fixe un <strong>objectif idéal</strong>, une <strong>cible réaliste</strong> et un <strong>seuil minimal acceptable</strong>. Avant de proposer un prix, elle doit connaître son <strong>coût de revient</strong>, sa <strong>marge minimale</strong>, son <strong>prix cible</strong>, le <strong>prix maximal acceptable pour l’acheteur</strong> et les <strong>coûts liés aux éventuelles concessions</strong>, en intégrant les risques du marché.</p>"}]},{title:"Partie 2 — Cas pratique : les espaces verts des Trois Rivières",enonce:"<p>La <strong>communauté de communes des Trois Rivières</strong> (fictive) publie un appel d’offres pour l’entretien des espaces verts de <strong>14 sites</strong> pendant <strong>24 mois</strong>. Montant maximal : <strong>160 000 € HT</strong>. Critères : prix <strong>50 %</strong>, valeur technique <strong>30 %</strong>, performance environnementale <strong>20 %</strong>. Exigences : aucun produit phytosanitaire, intervention sous 48 heures après une tempête, personnel qualifié. Le règlement prévoit une négociation avec les trois premiers candidats sur le prix et les modalités d’exécution. Date limite dans quatre semaines ; questions écrites possibles jusqu’à quinze jours avant.</p><p><strong>Paysages Vert-Avenir</strong> (fictive), PME de 9 salariés (deux équipes), siège à 35 km. Matériel 100 % électrique. Références : deux marchés privés. Le dossier ne précise pas la <strong>fréquence des tontes en été</strong> : selon qu’elle est hebdomadaire ou tous les quinze jours, Vert-Avenir estime le coût du marché entre <strong>120 000 € et 150 000 €</strong> sur 24 mois, recrutement d’un saisonnier compris. Sa direction exige une marge minimale de <strong>8 % du prix</strong>.</p>",questions:[{id:"e2q5",points:3,seances:["s2"],q:"Relevez les informations essentielles de la consultation et classez les éléments dans les quatre catégories du cours.",criteria:[["Informations essentielles relevées (objet, durée, montant, critères, date, négociation)",1],["Exigences : zéro phytosanitaire, 48 h après tempête, personnel qualifié",.75],["Critères : prix 50 %, technique 30 %, environnement 20 %",.5],["Différenciants (matériel électrique…) et variables (prix, modalités) correctement placés",.75]],model:"<p><strong>Informations essentielles</strong> : objet (entretien des espaces verts de 14 sites), acheteur (communauté de communes), durée (24 mois), montant maximal (160 000 € HT), critères pondérés, exigences, négociation possible avec les trois premiers, date limite et période de questions.</p><ul><li><strong>Exigences obligatoires</strong> : aucun produit phytosanitaire, intervention sous 48 heures après une tempête, personnel qualifié.</li><li><strong>Critères</strong> : prix 50 %, valeur technique 30 %, performance environnementale 20 %.</li><li><strong>Éléments différenciants</strong> : matériel 100 % électrique (performance environnementale), organisation en deux équipes, proximité.</li><li><strong>Variables négociables</strong> (selon le règlement) : le prix et les modalités d’exécution (calendrier, fréquences, organisation).</li></ul>"},{id:"e2q6",points:3,seances:["s2"],q:"Go, No-Go ou Go sous conditions ? Justifiez par la capacité, la rentabilité (calcul) et les chances de réussite.",criteria:[["Prix plancher : coût ÷ 0,92 → ≈ 130 435 € (tontes tous les 15 jours) à ≈ 163 043 € (hebdomadaires)",1],["Constat : dans l’hypothèse haute, le plancher dépasse le montant maximal (160 000 €) → marché non rentable",.75],["Décision : Go sous conditions — poser la question de la fréquence des tontes avant de décider",.75],["Capacité (2 équipes, saisonnier, 35 km, 48 h) et chances (électrique → 20 %, prix 50 %) évoquées",.5]],model:"<p><strong>Rentabilité</strong> : avec une marge minimale de 8 % du prix, le prix plancher vaut coût ÷ 0,92. Si les tontes sont bimensuelles (coût 120 000 €), le plancher est d’environ <strong>130 435 €</strong> : sous le maximum de 160 000 €, le marché est jouable. Si elles sont hebdomadaires (coût 150 000 €), le plancher atteint environ <strong>163 043 €</strong> : <strong>au-dessus du montant maximal</strong>, le marché ne pourrait pas être rentable.</p><p><strong>Capacité</strong> : deux équipes plus un saisonnier pour 14 sites, siège à 35 km : l’intervention sous 48 heures après une tempête est faisable mais doit être organisée (astreinte). <strong>Chances</strong> : le matériel électrique est un atout sur les 20 % environnementaux, mais le prix pèse 50 %.</p><p><strong>Décision</strong> : <strong>Go sous conditions</strong> — Vert-Avenir poursuit l’analyse mais doit obtenir, par une question écrite, la fréquence des tontes estivales avant de décider définitivement.</p>"},{id:"e2q7",points:3,seances:["s2"],q:"Le prix compte pour 50 %. Comment Vert-Avenir peut-elle construire une offre compétitive sans se mettre en danger ?",criteria:[["Conformité d’abord (exigences), offre construite selon les critères",.75],["Différenciation utile : matériel électrique → performance environnementale ; organisation → valeur technique",.75],["Prix compétitif mais ≥ plancher ; risques intégrés (astreinte 48 h tempête, saisonnier)",1],["Ne pas viser à tout prix le moins cher : 50 % de la note ailleurs",.5]],model:"<p>D’abord, garantir la <strong>conformité</strong> : zéro phytosanitaire, 48 heures après une tempête, personnel qualifié. Ensuite, construire l’offre <strong>selon les critères</strong> : le prix pèse 50 %, mais 50 % se jouent ailleurs. Le matériel 100 % électrique répond directement au critère environnemental (20 %), et un mémoire technique solide (organisation des deux équipes, planning des 14 sites, gestion des tempêtes) vise les 30 % de valeur technique. Le <strong>prix</strong> doit être compétitif mais jamais sous le plancher, en <strong>intégrant les risques</strong> : astreinte pour les tempêtes, saisonnier, déplacements. Être le moins cher n’est pas nécessaire et pourrait conduire à un marché déficitaire.</p>"},{id:"e2q8",points:3,seances:["s2","s3"],q:"Préparez la négociation éventuelle : objectifs, deux arguments orientés bénéfice, deux concessions avec contreparties, deux questions.",criteria:[["Objectifs idéal / cible / seuil cohérents avec les calculs",.75],["Deux arguments caractéristique → bénéfice pour l’acheteur",.75],["Deux concessions chacune liée à une contrepartie, sans toucher aux exigences",.75],["Deux questions sur les priorités réelles de l’acheteur",.75]],model:"<p><strong>Objectifs</strong> (hypothèse de tontes bimensuelles) : idéal autour de 150 000 €, cible réaliste 142 000 €, seuil minimal 131 000 €.</p><p><strong>Arguments</strong> : « Notre matériel 100 % électrique supprime le bruit et les émissions près des écoles et des habitations : vos habitants ne sont plus gênés et vous atteignez vos objectifs environnementaux. » ; « Notre siège à 35 km et nos deux équipes nous permettent d’intervenir dans les 48 heures après une tempête sur les 14 sites. »</p><p><strong>Concessions</strong> : « Nous pouvons ajuster le calendrier des interventions à vos événements <strong>si</strong> le planning annuel est fixé en début d’année. » ; « Nous pouvons consentir un effort de prix <strong>si</strong> la fréquence des tontes est adaptée selon les sites. »</p><p><strong>Questions</strong> : « Quels sites sont prioritaires pour vous ? » ; « Qu’attendez-vous concrètement sur la performance environnementale ? »</p>"}]}]},{id:"ex3",title:"Contrôle blanc n°3 — Agent sportif et synthèse",duration:90,desc:"Questions de cours sur la séance 4 et une question transversale, puis un cas d’agent sportif face à deux marques.",parts:[{title:"Partie 1 — Questions de cours",questions:[{id:"e3q1",points:2,seances:["s4"],q:"Quelles sont les deux relations fondamentales de l’agent sportif ? Quelle logique l’agent doit-il adopter dans chacune ?",criteria:[["Agent ↔ sportif : obtenir et sécuriser le mandat (vente de ses services)",1],["Agent ↔ club/sponsor/partenaire : utiliser le mandat pour défendre les intérêts du sportif (représentation, au nom et dans l’intérêt du mandant)",1]],model:"<p>Première relation, <strong>agent ↔ sportif</strong> : l’agent doit obtenir et sécuriser son mandat — il est dans une logique de vente de ses services (démontrer sa valeur, comprendre les objectifs du sportif, négocier les conditions de la relation). Seconde relation, <strong>agent ↔ club / sponsor / partenaire</strong> : il utilise ce mandat pour défendre les intérêts du sportif — il passe à une logique de représentation et négocie <strong>au nom et dans l’intérêt de son mandant</strong>.</p>"},{id:"e3q2",points:2,seances:["s4"],q:"Qu’est-ce qu’une proposition de valeur dans la négociation avec une marque ? Illustrez par un exemple du cours.",criteria:[["Les deux questions (ce que le sportif apporte / ce que la marque apporte) ; relation créatrice de valeur",1],["Exemple du cours pertinent (Serena Williams, Osaka, Bolt, Jordan) et élargir la valeur créée",1]],model:"<p>C’est la réponse à deux questions : <strong>qu’est-ce que le sportif apporte à la marque ?</strong> et <strong>qu’est-ce que la marque peut apporter au sportif ?</strong> L’agent cherche une relation créatrice de valeur pour les deux parties, en négociant au-delà de la rémunération (image, exclusivité, durée, contenus, apparitions, produits, campagnes). Exemple : Serena Williams devient en 2009 ambassadrice et partenaire au capital de Mission Skincare, participe au développement de produits et perçoit des royalties — « une bonne négociation… consiste à élargir la valeur créée par le partenariat ».</p>"},{id:"e3q3",points:2,seances:["s4"],q:"Que prévoit le support de cours sur le contrat d’agent sportif en France ?",criteria:[["Le contrat précise services, exclusivité ou non, durée, rémunération, partie qui rémunère",1],["Durée ≤ 3 ans ; rémunération ≤ 10 % ; plafond inférieur possible (fédérations délégataires)",1]],model:"<p>Selon le support, le Code du sport encadre le contrat d’agent sportif : il doit préciser les <strong>services</strong>, leur caractère <strong>exclusif ou non</strong>, sa <strong>durée</strong>, la <strong>rémunération</strong> de l’agent et la <strong>partie qui le rémunère</strong>. La durée ne peut excéder <strong>3 ans</strong> et la rémunération <strong>10 %</strong> du contrat conclu par les parties mises en relation, les fédérations délégataires pouvant fixer un plafond inférieur.</p>"},{id:"e3q4",points:2,seances:["s2","s3","s4"],q:"Montrez que le principe « pas de concession sans contrepartie » traverse les séances 2, 3 et 4.",criteria:[["Séance 2 : concession jamais gratuite, chiffrée",.5],["Séance 3 : « si vous vous engagez sur tel volume… » ; « que puis-je concéder… contre quoi ? »",.75],["Séance 4 : « nous pouvons envisager cela si… » + intérêt du mandant",.75]],model:"<p><strong>Séance 2</strong> : « une concession ne doit pas être accordée gratuitement » ; elle est reliée à une contrepartie recherchée et son coût est connu avant de proposer un prix. <strong>Séance 3</strong> : la concession tarifaire devient une variable d’échange (« si vous vous engagez sur tel volume, je peux envisager telle condition ») et l’on se demande « que puis-je concéder, dans quelles limites, et contre quoi ? ». <strong>Séance 4</strong> : « nous pouvons envisager cela si vous nous accordez telle contrepartie », avec un filtre supplémentaire — la concession doit être dans l’intérêt du mandant.</p>"}]},{title:"Partie 2 — Cas pratique : Maëlle Garnier, grimpeuse",enonce:"<p><strong>Maëlle Garnier</strong> (personnage fictif), 19 ans, championne de France junior d’escalade, <strong>80 000 abonnés</strong> sur les réseaux sociaux. Elle vient de confier sa représentation à un agent, qui lui propose un mandat exclusif de <strong>4 ans</strong> rémunéré <strong>15 %</strong> des contrats négociés.</p><p><strong>Ses priorités</strong> : (1) se qualifier pour la Coupe du monde, donc protéger son temps d’entraînement (6 apparitions par an au maximum) ; (2) construire à long terme sa propre marque ; (3) financer ses déplacements en compétition : au moins 10 000 € par an.</p><p><strong>Deux offres</strong> : <em>Verticale</em> (fabricant français de chaussons, fictif) : 8 000 € par an, matériel fourni, 2 ans, exclusivité chaussons et baudriers, co-développement d’un chausson signature avec 4 % de royalties. <em>MegaSport</em> (grande enseigne d’articles de sport, fictive) : 20 000 € par an, 3 ans, exclusivité totale (toutes catégories), 12 apparitions en magasin par an, pas de développement de produit.</p>",questions:[{id:"e3q5",points:3,seances:["s4"],q:"Le mandat proposé par l’agent est-il conforme au cadre présenté par le support ? Que doit-il préciser, et que révèle cette première négociation ?",criteria:[["Non conforme : 4 ans > 3 ans ; 15 % > 10 %",1],["Le contrat doit préciser services, exclusivité, durée, rémunération, partie qui rémunère",1],["Première négociation : convaincre et clarifier ; la confiance n’empêche pas des engagements clairs",1]],model:"<p>Le mandat n’est <strong>pas conforme</strong> au cadre présenté par le support : sa durée (4 ans) dépasse le maximum de <strong>3 ans</strong>, et sa rémunération (15 %) dépasse le plafond de <strong>10 %</strong> du contrat conclu. Il doit préciser les services, leur caractère exclusif ou non, la durée, la rémunération et la partie qui rémunère l’agent.</p><p>C’est la <strong>première négociation</strong> de l’agent : obtenir et sécuriser son mandat en démontrant sa valeur et en clarifiant les engagements. Proposer des conditions hors cadre fragilise d’emblée la confiance — or la confiance est une ressource, à condition que les engagements soient clairement définis.</p>"},{id:"e3q6",points:3,seances:["s4"],q:"Comparez les deux offres au regard des priorités de Maëlle.",criteria:[["MegaSport : montant supérieur mais 12 apparitions (> 6), exclusivité totale, 3 ans, pas de produit → contraire aux priorités 1 et 2",1],["Verticale : moins d’argent (8 000 € < 10 000 €) mais chausson signature + royalties, exclusivité limitée, 2 ans → sert la priorité 2",1],["Conclusion : prix ≠ valeur ; aucune offre n’est parfaite → négocier (Verticale de préférence, MegaSport comme levier)",1]],model:"<p><strong>MegaSport</strong> paie davantage (20 000 € par an) et couvre largement le besoin de financement, mais impose <strong>12 apparitions</strong> (le double du maximum compatible avec l’entraînement), une <strong>exclusivité totale</strong> pendant 3 ans et aucun développement de produit : elle contredit les priorités 1 et 2. <strong>Verticale</strong> paie moins (8 000 €, sous le besoin de 10 000 €), mais offre un <strong>chausson signature avec royalties</strong> — un premier pas vers la propre marque de Maëlle —, une exclusivité limitée et une durée courte.</p><p>Conclusion : <strong>prix ≠ valeur</strong>. Verticale crée plus de valeur pour les priorités de Maëlle, mais doit être améliorée sur le montant ; l’offre de MegaSport est une alternative crédible pour y parvenir.</p>"},{id:"e3q7",points:3,seances:["s4"],q:"Construisez la contre-proposition de l’agent à l’une des deux marques : variables, concessions conditionnelles, et vérification de l’intérêt de la cliente.",criteria:[["Choix argumenté de la marque et variables mobilisées (fixe, royalties, exclusivité, durée, apparitions, contenus)",1],["Au moins deux concessions formulées « nous pouvons envisager… si… »",1],["Test explicite : chaque concession est-elle dans l’intérêt de Maëlle ?",1]],model:"<p><strong>Contre-proposition à Verticale</strong> : un fixe porté à 11 000 € pour couvrir les déplacements, le chausson signature avec royalties, une exclusivité limitée aux chaussons et baudriers, 4 apparitions par an et des contenus réguliers.</p><ul><li>« Nous pouvons envisager une durée de 3 ans <strong>si</strong> le fixe atteint 11 000 € dès la première année. »</li><li>« Nous pouvons envisager deux contenus par mois sur ses réseaux <strong>si</strong> les royalties sur le chausson passent à 5 %. »</li></ul><p><strong>Test</strong> : 3 ans chez un fabricant qui développe son chausson sert sa priorité 2 sans gêner l’entraînement — c’est dans son intérêt ; acc

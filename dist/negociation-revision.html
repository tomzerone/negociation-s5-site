<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Négociation spécifique — Révision</title>
<meta name="description" content="Plateforme personnelle de révision — Négociation spécifique (BUT TC, MDEE) : cours, fiches, flashcards, QCM, exercices, simulateur, cas pratiques et contrôles blancs.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='white' stroke='%230b0d10' stroke-width='5'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='800' font-size='13' text-anchor='middle' fill='%230b0d10'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>/* VOICE   : un carnet de négociateur, net et dense, qui donne envie de s'entraîner.
   IDEA    : le plan de métro de la négociation — chaque séance est une ligne colorée, chaque notion une station,
             les notions transversales sont des correspondances.
   PICTURE : le réseau des quatre lignes sur le tableau de bord ; des lignes de processus (flow) dans le cours.
   COLOUR  : blanc, encre noire ; lignes bleu #0a5cff, rouge #e6261f, ambre #ffb400, vert #00a05a ; nuit #0e1116.
   TYPE    : Figtree 800 pour les titres, Figtree pour le texte. LAYOUT : navigation à gauche, contenu jusqu'à 1180 px. */

:root {
  --bg: #FFFFFF; --surface: #FFFFFF; --sunk: #F3F4F6; --sunk-2: #E8EAEE;
  --ink: #0B0D10; --ink-2: #3E4552; --ink-3: #667080;
  --line: #E3E5E9; --line-2: #C8CDD5;
  --l1: #0A5CFF; --l1-soft: #E8F0FF; --l1-ink: #0046D1; --on-l1: #FFFFFF;
  --l2: #E6261F; --l2-soft: #FDECEB; --l2-ink: #BF1A14; --on-l2: #FFFFFF;
  --l3: #FFB400; --l3-soft: #FFF4D6; --l3-ink: #7F5200; --on-l3: #0B0D10;
  --l4: #00A05A; --l4-soft: #E2F4EA; --l4-ink: #007A45; --on-l4: #FFFFFF;
  --l5: #0B0D10; --l5-soft: #EEEFF2; --l5-ink: #0B0D10; --on-l5: #FFFFFF;
  --ok: #00A05A; --ok-soft: #E2F4EA; --ok-ink: #007A45;
  --ko: #E6261F; --ko-soft: #FDECEB; --ko-ink: #BF1A14;
  --mid: #B87300; --mid-soft: #FFF4D6; --mid-ink: #7F5200;
  --mark: #FFE45C;
  --sans: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r-s: 6px; --r-m: 10px; --r-l: 16px;
  --side: 272px;
  --shadow: 0 1px 2px rgba(11, 13, 16, .06), 0 8px 22px rgba(11, 13, 16, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1116; --surface: #161A21; --sunk: #1C2129; --sunk-2: #252B35;
    --ink: #EEF0F3; --ink-2: #BAC1CC; --ink-3: #8C95A3; --line: #272D37; --line-2: #3A4350;
    --l1: #4D8DFF; --l1-soft: #15223B; --l1-ink: #93B8FF; --on-l1: #0E1116;
    --l2: #FF5A52; --l2-soft: #381918; --l2-ink: #FF968F; --on-l2: #0E1116;
    --l3: #FFC233; --l3-soft: #352A10; --l3-ink: #FFD56E; --on-l3: #0E1116;
    --l4: #2BC77E; --l4-soft: #122E1F; --l4-ink: #72E0AA; --on-l4: #0E1116;
    --l5: #EEF0F3; --l5-soft: #252B35; --l5-ink: #EEF0F3; --on-l5: #0E1116;
    --ok: #2BC77E; --ok-soft: #122E1F; --ok-ink: #72E0AA; --ko: #FF5A52; --ko-soft: #381918; --ko-ink: #FF968F;
    --mid: #FFC233; --mid-soft: #352A10; --mid-ink: #FFD56E; --mark: #6B5A12;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1116; --surface: #161A21; --sunk: #1C2129; --sunk-2: #252B35;
  --ink: #EEF0F3; --ink-2: #BAC1CC; --ink-3: #8C95A3; --line: #272D37; --line-2: #3A4350;
  --l1: #4D8DFF; --l1-soft: #15223B; --l1-ink: #93B8FF; --on-l1: #0E1116;
  --l2: #FF5A52; --l2-soft: #381918; --l2-ink: #FF968F; --on-l2: #0E1116;
  --l3: #FFC233; --l3-soft: #352A10; --l3-ink: #FFD56E; --on-l3: #0E1116;
  --l4: #2BC77E; --l4-soft: #122E1F; --l4-ink: #72E0AA; --on-l4: #0E1116;
  --l5: #EEF0F3; --l5-soft: #252B35; --l5-ink: #EEF0F3; --on-l5: #0E1116;
  --ok: #2BC77E; --ok-soft: #122E1F; --ok-ink: #72E0AA; --ko: #FF5A52; --ko-soft: #381918; --ko-ink: #FF968F;
  --mid: #FFC233; --mid-soft: #352A10; --mid-ink: #FFD56E; --mark: #6B5A12;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28); color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

/* Couleur de ligne contextuelle */
.l1 { --c: var(--l1); --c-soft: var(--l1-soft); --c-ink: var(--l1-ink); --on-c: var(--on-l1); }
.l2 { --c: var(--l2); --c-soft: var(--l2-soft); --c-ink: var(--l2-ink); --on-c: var(--on-l2); }
.l3 { --c: var(--l3); --c-soft: var(--l3-soft); --c-ink: var(--l3-ink); --on-c: var(--on-l3); }
.l4 { --c: var(--l4); --c-soft: var(--l4-soft); --c-ink: var(--l4-ink); --on-c: var(--on-l4); }
.l5 { --c: var(--l5); --c-soft: var(--l5-soft); --c-ink: var(--l5-ink); --on-c: var(--on-l5); }

/* ───────── Base */
*, *::before, *::after { box-sizing: border-box; min-width: 0; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: clip; }
a { color: var(--l1-ink); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
h1, h2, h3, h4 { line-height: 1.15; margin: 0 0 .5em; letter-spacing: -.015em; text-wrap: balance; }
h1 { font-size: clamp(1.9rem, 1.4rem + 2vw, 2.75rem); font-weight: 800; letter-spacing: -.025em; }
h2 { font-size: 1.4rem; font-weight: 800; }
h3 { font-size: 1.12rem; font-weight: 700; }
h4 { font-size: 1rem; font-weight: 700; }
p { margin: 0 0 1em; }
ul, ol { padding-left: 1.3em; margin: 0 0 1em; }
li { margin: .3em 0; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; color: var(--ink); }
[tabindex="-1"]:focus { outline: none; }
:focus-visible { outline: 3px solid var(--l1); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; flex: none; vertical-align: -4px; }
.muted { color: var(--ink-3); }
.small { font-size: .875rem; }
.lead { font-size: 1.1rem; color: var(--ink-2); max-width: 70ch; }
.nowrap { white-space: nowrap; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 100; background: var(--ink); color: var(--bg); border: 0; padding: 8px 14px; border-radius: var(--r-s); }
.skip:focus { top: 12px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ───────── Coquille */
.side { position: fixed; inset: 0 auto 0 0; width: var(--side); background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 14px 14px; z-index: 40; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 6px 16px; }
.brand strong { display: block; font-size: 1.08rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }
.brand span { font-size: .8rem; color: var(--ink-3); font-weight: 500; }
.logo { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 5px solid var(--ink); font: 800 1.05rem/1 var(--sans); color: var(--ink); flex: none; background: var(--surface); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--l1); }
.logo.sm { width: 28px; height: 28px; border-width: 3.5px; font-size: .78rem; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--l1); }
.brand .close-side { margin-left: auto; display: none; }
.side-search { position: relative; margin: 0 2px 10px; }
.side-search .ic { position: absolute; left: 11px; top: 11px; color: var(--ink-3); }
.side-search input { width: 100%; padding: 10px 10px 10px 38px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--sunk); font-size: .95rem; }
.side-search input:focus { outline: none; border-color: var(--ink); background: var(--surface); }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-g { font-size: .76rem; font-weight: 700; color: var(--ink-3); padding: 14px 10px 4px; }
.nav-i { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: var(--r-s); color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: .95rem; }
.nav-i:hover { background: var(--sunk); color: var(--ink); text-decoration: none; }
.nav-i.on { background: var(--ink); color: var(--bg); }
.nav-i.small { font-size: .88rem; padding: 6px 10px; font-weight: 500; }
.side-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.sync { display: flex; gap: 8px; align-items: center; font-size: .78rem; color: var(--ink-3); padding: 8px 10px 0; }
.sync .ic { width: 16px; height: 16px; }
.topbar, .tabbar, .scrim { display: none; }
main { margin-left: var(--side); min-height: 100vh; padding: 36px clamp(18px, 4vw, 56px) 90px; outline: none; }
.view { max-width: 1180px; margin: 0 auto; }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r-m); border: 1px solid transparent; background: none; color: var(--ink-2); cursor: pointer; text-decoration: none; }
.icon-btn:hover:not(:disabled) { background: var(--sunk); color: var(--ink); }
.icon-btn:disabled { opacity: .35; cursor: default; }
@media (max-width: 1023px) {
  main { margin-left: 0; padding: calc(78px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom)); }
  .side { transform: translateX(-102%); transition: transform .22s ease; box-shadow: var(--shadow); width: min(86vw, 320px); padding-top: calc(18px + env(safe-area-inset-top)); }
  body.drawer .side { transform: none; }
  .brand .close-side { display: inline-grid; }
  .scrim { display: block; position: fixed; inset: 0; background: rgba(8, 10, 12, .4); z-index: 35; opacity: 0; pointer-events: none; transition: opacity .2s; }
  body.drawer .scrim { opacity: 1; pointer-events: auto; }
  .topbar { display: flex; position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: calc(60px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 8px 0; align-items: center; justify-content: space-between; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.08rem; color: var(--ink); text-decoration: none; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; min-height: 50px; font-size: .72rem; font-weight: 600; color: var(--ink-3); text-decoration: none; border: 0; background: none; cursor: pointer; border-radius: var(--r-s); }
  .tab.on { color: var(--ink); }
  .tab.on .ic { color: var(--l1); }
  .tab .ic { width: 22px; height: 22px; }
}

/* ───────── Boutons et contrôles */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 9px 18px; border-radius: 999px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 700; font-size: .95rem; text-decoration: none; cursor: pointer; transition: background .15s, border-color .15s, transform .05s; text-align: center; }
.btn:hover { border-color: var(--ink); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn.line { background: var(--c, var(--l1)); border-color: var(--c, var(--l1)); color: var(--on-c, #fff); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 5px 14px; font-size: .86rem; }
.btn.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok-ink); }
.btn.ko { background: var(--ko-soft); border-color: var(--ko); color: var(--ko-ink); }
.btn.danger { color: var(--ko-ink); border-color: var(--ko); background: transparent; }
.btn kbd { font: 700 .72rem var(--sans); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; opacity: .7; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; align-items: center; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-3); text-decoration: none; font-size: .92rem; font-weight: 600; margin-bottom: 14px; }
.back:hover { color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
.chip { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: .9rem; font-weight: 600; text-decoration: none; cursor: pointer; }
.chip:hover { border-color: var(--ink-3); color: var(--ink); text-decoration: none; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip em { font-style: normal; color: var(--ink-3); font-size: .8rem; font-weight: 500; }
.chip.on em { color: inherit; opacity: .7; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.seg { display: inline-flex; border: 1.5px solid var(--line-2); border-radius: 999px; padding: 3px; background: var(--surface); gap: 2px; flex-wrap: wrap; }
.seg button { padding: 7px 15px; border-radius: 999px; border: 0; background: none; font-weight: 600; font-size: .9rem; color: var(--ink-2); cursor: pointer; min-height: 36px; }
.seg button.on { background: var(--ink); color: var(--bg); }
textarea, input[type=text], input[type=number], input[type=date], input[type=search], select { border: 1.5px solid var(--line-2); border-radius: var(--r-m); background: var(--surface); font-size: 1rem; }
textarea { width: 100%; line-height: 1.6; padding: 12px 14px; resize: vertical; }
input[type=text], input[type=number], input[type=date], select { padding: 9px 12px; min-height: 44px; }
textarea:focus, input:focus, select:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--l1-soft); }

/* ───────── Éléments partagés */
.page-h { margin-bottom: 26px; }
.page-h h1 { margin-bottom: .3em; }
.kicker { font-size: .9rem; font-weight: 700; color: var(--ink-3); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 20px 22px; margin-bottom: 18px; }
.panel h2 { font-size: 1.1rem; margin-bottom: .7em; }
.panel > :last-child { margin-bottom: 0; }
.panel.soft { background: var(--sunk); border-color: transparent; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .three { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) { .two { grid-template-columns: minmax(0, 1fr); } }
.note { display: flex; gap: 10px; align-items: flex-start; background: var(--sunk); border-radius: var(--r-m); padding: 12px 16px; font-size: .94rem; color: var(--ink-2); margin-bottom: 18px; }
.note .ic { color: var(--ink-3); margin-top: 2px; }
.note p:last-child { margin: 0; }
.rows { list-style: none; padding: 0; margin: 0; }
.rows li { display: flex; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; margin: 0; }
.rows li:last-child { border-bottom: 0; }
.rows li > span, .rows li > a { flex: 1 1 auto; }
.rows li strong { font-variant-numeric: tabular-nums; white-space: nowrap; }
.rows li em { font-style: normal; font-size: .8rem; color: var(--ink-3); width: 100%; }
.rows li.empty { color: var(--ink-3); font-size: .92rem; }
.bar { display: block; height: 8px; background: var(--sunk-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c, var(--ink)); border-radius: 99px; }
.rd { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 99px; background: var(--c); color: var(--on-c); font: 800 .95rem/1 var(--sans); flex: none; }
.rd.lg { min-width: 54px; height: 54px; font-size: 1.6rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 700 .76rem/1 var(--sans); padding: 5px 10px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.pill.c { background: var(--c-soft); color: var(--c-ink); }
.pill.ok { background: var(--ok-soft); color: var(--ok-ink); }
.pill.ko { background: var(--ko-soft); color: var(--ko-ink); }
.pill.mid { background: var(--mid-soft); color: var(--mid-ink); }
.pill.dark { background: var(--ink); color: var(--bg); }
.loading { color: var(--ink-2); padding: 14px 0; }
.loading::before { content: ''; display: inline-block; width: 14px; height: 14px; margin-right: 10px; border: 2px solid var(--line-2); border-top-color: var(--l1); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.err-box { background: var(--mid-soft); color: var(--mid-ink); padding: 12px 14px; border-radius: var(--r-m); }
#toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-size: .92rem; font-weight: 600; z-index: 90; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 1023px) { #toast { bottom: calc(92px + env(safe-area-inset-bottom)); } }
.dlg-wrap { position: fixed; inset: 0; background: rgba(8, 10, 12, .45); display: grid; place-items: center; z-index: 95; padding: 18px; }
.dlg { background: var(--surface); border-radius: var(--r-l); padding: 24px; max-width: 440px; width: 100%; box-shadow: var(--shadow); }
.dlg-a { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.empty-big { padding: 40px 0; color: var(--ink-2); }
.tbl-wrap { overflow-x: auto; margin: 1.1em 0 1.5em; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .93rem; line-height: 1.5; }
th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--line); }
thead th { background: var(--sunk); font-weight: 700; font-size: .86rem; }
tbody th { font-weight: 700; min-width: 120px; }
tbody tr:last-child > * { border-bottom: 0; }
td + td, th + td { border-left: 1px solid var(--line); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 640px) {
  .tbl-wrap { border: 0; background: none; overflow: visible; }
  .tbl-wrap table.stack, .tbl-wrap table.stack tbody, .tbl-wrap table.stack tr, .tbl-wrap table.stack th, .tbl-wrap table.stack td { display: block; }
  .tbl-wrap table.stack thead { display: none; }
  .tbl-wrap table.stack tr { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); margin-bottom: 10px; overflow: hidden; }
  .tbl-wrap table.stack tbody th { background: var(--sunk); border-bottom: 1px solid var(--line); }

}

/* Lignes de processus (style plan de métro) */
.flow { margin: 1.2em 0 1.6em; }
.flow-l { font-size: .84rem; font-weight: 700; color: var(--ink-3); margin-bottom: 8px; }
.flow-line { list-style: none; padding: 0; margin: 0; display: flex; position: relative; }
.flow-line::before { content: ''; position: absolute; left: 12px; right: 12px; top: 10px; height: 8px; border-radius: 8px; background: var(--c, var(--ink)); }
.flow-line li { flex: 1 1 0; position: relative; padding-top: 30px; margin: 0; text-align: center; font-size: .86rem; font-weight: 600; line-height: 1.3; padding-inline: 4px; }
.flow-line li::before { content: ''; position: absolute; top: 3px; left: 50%; transform: translateX(-50%); width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 4px solid var(--c, var(--ink)); box-sizing: border-box; }
.flow-line li:first-child { text-align: left; padding-left: 0; } .flow-line li:first-child::before { left: 0; transform: none; }
.flow-line li:last-child { text-align: right; padding-right: 0; } .flow-line li:last-child::before { left: auto; right: 0; transform: none; }
@media (max-width: 700px) {
  .flow-line { flex-direction: column; gap: 10px; padding-left: 4px; }

  .flow-line li, .flow-line li:first-child, .flow-line li:last-child { text-align: left; padding: 2px 0 2px 36px; }
  .flow-line li::before, .flow-line li:first-child::before, .flow-line li:last-child::before { top: 2px; left: 5px; right: auto; transform: none; }
}
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 1em 0 1.4em; }
.col { border: 1.5px solid var(--line); border-radius: var(--r-m); padding: 14px 16px; background: var(--surface); }
.col h4 { margin-bottom: .5em; font-size: .98rem; }
.col > :last-child { margin-bottom: 0; }

/* Encadrés : Cours (trait plein) / Plateforme (pointillés) */
.box { margin: 1.2em 0; padding: 14px 18px; border-radius: var(--r-m); border: 1.5px solid var(--line); background: var(--surface); }
.box-l { display: flex; align-items: center; gap: 8px; font: 700 .8rem var(--sans); margin-bottom: 6px; color: var(--ink-2); flex-wrap: wrap; }
.tag { font: 800 .66rem/1 var(--sans); padding: 4px 7px; border-radius: 4px; background: var(--ink); color: var(--bg); letter-spacing: .02em; }
.box.pf .tag { background: transparent; color: var(--ink-2); border: 1.5px dashed var(--ink-3); }
.box-t { font-weight: 800; font-size: 1.04rem; margin-bottom: 4px; }
.box-b > :last-child, .box ul:last-child, .box ol:last-child { margin-bottom: 0; }
.box table { font-size: .88rem; margin: 6px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.box.c { border-left: 6px solid var(--c, var(--ink)); }
.box.def { background: var(--c-soft, var(--sunk)); border-color: transparent; border-left-color: var(--c, var(--ink)); }
.box.key { border: 2px solid var(--ink); border-left-width: 6px; box-shadow: var(--shadow); }
.box.qk { background: var(--sunk); border-color: transparent; border-left-color: var(--c, var(--ink)); }
.qk-t { font-size: 1.1rem; font-weight: 700; }
.box.warn { background: var(--ko-soft); border-color: transparent; border-left-color: var(--ko); }
.box.note { background: var(--surface); border-left-color: var(--ink-3); }
.box.ex { border-left-color: var(--c, var(--ink)); }
.box.dist { border-left-color: var(--mid); }
.box.pf { border-style: dashed; border-color: var(--line-2); background: transparent; }
.box.trap { border-color: var(--ko); }
.box.check { border-color: var(--mid); }
.train-l { display: flex; gap: 8px; align-items: flex-start; font-size: .93rem; color: var(--ink-2); background: var(--sunk); padding: 10px 14px; border-radius: var(--r-m); }
.train-l .ic { color: var(--ink-3); margin-top: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .86rem; color: var(--ink-2); margin: 0 0 24px; align-items: center; }
.legend span { display: inline-flex; gap: 7px; align-items: center; }
.legend .tag.pfx { background: transparent; color: var(--ink-2); border: 1.5px dashed var(--ink-3); }

/* ───────── Tableau de bord */
.home-h { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 360px); gap: 26px; align-items: end; margin-bottom: 26px; }
.home-h h1 { font-size: clamp(2.1rem, 1.4rem + 2.6vw, 3.3rem); margin-bottom: .2em; }

@media (max-width: 880px) { .home-h { grid-template-columns: minmax(0, 1fr); } }
.resume { display: grid; gap: 2px; background: var(--ink); color: var(--bg); padding: 16px 20px; border-radius: var(--r-l); text-decoration: none; position: relative; overflow: hidden; }
.resume::after { content: ''; position: absolute; right: 18px; top: 50%; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%; border: 5px solid var(--l1); background: var(--ink); }
.resume:hover { text-decoration: none; filter: brightness(1.15); }
.resume-k { font-size: .82rem; opacity: .75; font-weight: 600; }
.resume-t { font-size: 1.08rem; font-weight: 800; line-height: 1.3; padding-right: 40px; }
.resume-d { font-size: .82rem; opacity: .75; }
.countdown { display: block; font-weight: 700; color: var(--ink-2); margin: 8px 0 0; }
.countdown b { font-size: 1.3rem; color: var(--ink); }

/* Le réseau (plan des lignes) */
.net { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 22px 22px 10px; margin-bottom: 26px; }
.net-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.net-h h2 { margin: 0; font-size: 1.2rem; }
.ln { display: grid; grid-template-columns: 210px minmax(0, 1fr) 64px; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.ln:last-child { border-bottom: 0; }
.ln-t { display: flex; gap: 12px; align-items: center; text-decoration: none; color: var(--ink); }
.ln-t strong { display: block; font-weight: 800; line-height: 1.2; font-size: .98rem; }
.ln-t .ln-n span { font-size: .8rem; color: var(--ink-3); font-weight: 600; display: block; }
.ln-t:hover strong { text-decoration: underline; }
.ln-track { list-style: none; margin: 0; padding: 0 0 0; display: flex; position: relative; }
.ln-track::before { content: ''; position: absolute; left: 10px; right: 10px; top: 9px; height: 8px; border-radius: 8px; background: var(--c); }
.ln-track li { flex: 1 1 0; position: relative; margin: 0; display: flex; justify-content: center; }
.ln-track li:first-child { justify-content: flex-start; } .ln-track li:last-child { justify-content: flex-end; }
.st { display: block; position: relative; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 5px solid var(--c); text-decoration: none; transition: transform .12s; }
.st:hover { transform: scale(1.18); }
.st.seen { background: var(--c); }
.st.x { border-color: var(--ink); border-width: 4px; box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--ink); }
.st.x.seen { background: var(--ink); }
.st-l { position: absolute; top: 31px; left: 50%; transform: translateX(-50%); font-size: .72rem; font-weight: 600; color: var(--ink-2); line-height: 1.15; text-align: center; width: max-content; max-width: 92px; pointer-events: none; }
.ln-track li:first-child .st-l { left: 0; transform: none; text-align: left; } .ln-track li:last-child .st-l { left: auto; right: 0; transform: none; text-align: right; }
.ln-wrap { padding: 30px 0 30px; }

.ln-m { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.ln-m small { display: block; font-size: .7rem; color: var(--ink-3); font-weight: 600; }
.net-k { display: flex; flex-wrap: wrap; gap: 16px; font-size: .8rem; color: var(--ink-3); padding: 12px 0 8px; }
.net-k span { display: inline-flex; gap: 7px; align-items: center; }
.net-k i { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--ink-3); display: inline-block; }
.net-k i.f { background: var(--ink-3); }
.net-k i.x { border-color: var(--ink); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink); }
@media (max-width: 860px) {
  .ln { grid-template-columns: minmax(0, 1fr) auto; }
  .ln-wrap { grid-column: 1 / -1; grid-row: 2; padding-bottom: 6px; }
  .st-l { display: none; }
  .ln-m { grid-row: 1; grid-column: 2; }
}
.figures { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 3px solid var(--ink); border-bottom: 1px solid var(--line); margin-bottom: 28px; }
.fig { padding: 14px 14px 12px 0; text-decoration: none; color: var(--ink); border-right: 1px solid var(--line); margin-right: 14px; }
.fig:last-child { border-right: 0; margin-right: 0; }
.fig b { display: block; font: 800 1.85rem/1.1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.fig b small { font-size: .5em; color: var(--ink-3); font-weight: 700; }
.fig span { font-size: .84rem; color: var(--ink-2); line-height: 1.35; display: block; }
.fig em { font-style: normal; color: var(--ko-ink); font-weight: 700; }
.fig:hover b { color: var(--l1); }
@media (max-width: 1100px) { .figures { grid-template-columns: repeat(3, minmax(0, 1fr)); } .fig:nth-child(3) { border-right: 0; margin-right: 0; } .fig:nth-child(-n+3) { border-bottom: 1px solid var(--line); } }
@media (max-width: 560px) { .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fig { border-right: 0 !important; margin-right: 0 !important; border-bottom: 1px solid var(--line); padding-right: 8px; } .fig:nth-last-child(-n+2) { border-bottom: 0; } }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 960px) { .home-grid { grid-template-columns: minmax(0, 1fr); } }
.path { list-style: none; padding: 0; margin: 0; counter-reset: p; }
.path li { counter-increment: p; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); margin: 0; }
.path li:last-child { border-bottom: 0; }
.path li::before { content: counter(p); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--ink); font-weight: 800; font-size: .9rem; }
.path li.done::before { background: var(--ink); color: var(--bg); content: '✓'; }
.path a { font-weight: 700; color: var(--ink); text-decoration: none; }
.path a:hover { text-decoration: underline; }
.path span { display: block; font-size: .84rem; color: var(--ink-3); }
.path em { font-style: normal; font-size: .8rem; color: var(--ink-3); font-weight: 700; white-space: nowrap; }
.home-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 8px; align-items: start; }
@media (max-width: 1000px) { .home-cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 620px) { .home-cols { grid-template-columns: minmax(0, 1fr); } }

/* ───────── Cours */
.se-list { display: grid; gap: 14px; margin-bottom: 30px; }
.se-card { display: grid; grid-template-columns: 64px minmax(0, 1fr) 160px; gap: 18px; padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface); text-decoration: none; color: var(--ink); align-items: center; position: relative; overflow: hidden; }
.se-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--c); }
.se-card:hover { border-color: var(--ink-3); text-decoration: none; }
.se-card strong { display: block; font-size: 1.15rem; font-weight: 800; line-height: 1.25; }
.se-card p { margin: 4px 0 0; color: var(--ink-2); font-size: .94rem; }
.se-card .meta { font-size: .8rem; color: var(--ink-3); font-weight: 600; }
.se-card .prog { display: grid; gap: 6px; font-size: .8rem; color: var(--ink-3); font-weight: 600; }
@media (max-width: 700px) { .se-card { grid-template-columns: 54px minmax(0, 1fr); } .se-card .prog { grid-column: 1 / -1; } }
.reader { display: grid; grid-template-columns: 238px minmax(0, 1fr); gap: 40px; }
.se-nav { position: sticky; top: 24px; align-self: start; max-height: calc(100vh - 48px); overflow-y: auto; padding-right: 4px; }
.se-nav-h { display: flex; gap: 10px; align-items: center; padding: 4px 4px 12px; font-weight: 800; font-size: .95rem; line-height: 1.2; }
.stations { list-style: none; padding: 0; margin: 0; position: relative; }
.stations::before { content: ''; position: absolute; left: 14px; top: 14px; bottom: 14px; width: 8px; border-radius: 8px; background: var(--c); }
.stations li { margin: 0; }
.stations a { display: flex; gap: 12px; align-items: center; padding: 7px 8px 7px 8px; border-radius: var(--r-s); color: var(--ink-2); text-decoration: none; font-size: .9rem; font-weight: 600; position: relative; line-height: 1.25; }
.stations a::before { content: ''; flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 4px solid var(--c); box-sizing: border-box; position: relative; z-index: 1; }
.stations a.seen::before { background: var(--c); }
.stations a:hover { background: var(--sunk); color: var(--ink); }
.stations a.on { color: var(--ink); background: var(--c-soft); }
.se-other { margin-top: 18px; display: grid; gap: 6px; }
.se-other a { display: flex; gap: 10px; align-items: center; font-size: .86rem; font-weight: 600; color: var(--ink-2); text-decoration: none; padding: 4px; }
.se-other a:hover { color: var(--ink); }
.se-other .rd { min-width: 24px; height: 24px; font-size: .78rem; }
.se-pick { display: none; margin-bottom: 18px; border: 1.5px solid var(--line); border-radius: var(--r-m); background: var(--surface); }
.se-pick summary { padding: 11px 14px; cursor: pointer; font-weight: 700; display: flex; gap: 10px; align-items: center; list-style: none; }
.se-pick summary::-webkit-details-marker { display: none; }
.se-pick > div { padding: 0 8px 10px; }
@media (max-width: 1180px) { .reader { grid-template-columns: minmax(0, 1fr); } .se-nav { display: none; } .se-pick { display: block; } }
.ch { max-width: 76ch; font-size: 1.04rem; line-height: 1.7; }
.ch-h { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: start; padding-bottom: 20px; border-bottom: 3px solid var(--c); margin-bottom: 18px; }
.ch-h h1 { margin-bottom: .3em; font-size: clamp(1.7rem, 1.3rem + 1.8vw, 2.4rem); }
.ch-h .lead { font-size: 1.02rem; margin-bottom: .6em; }
.src { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: .8rem; color: var(--ink-3); margin: 0; font-weight: 600; }
.src span { border: 1px solid var(--line-2); border-radius: 999px; padding: 1px 9px; }
@media (max-width: 560px) { .ch-h { grid-template-columns: minmax(0, 1fr); gap: 8px; } }
.obj { background: var(--sunk); border-radius: var(--r-m); padding: 14px 18px; margin: 0 0 8px; }
.obj h2 { font-size: .95rem; margin-bottom: .4em; }
.obj ul { margin: 0; font-size: .97rem; }
.obj .muted { font-size: .82rem; margin: 6px 0 0; }
.sec-toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 6px; }
.sec-toc a { font-size: .82rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--line); color: var(--ink-2); text-decoration: none; }
.sec-toc a:hover { border-color: var(--c); color: var(--ink); }
.c-sec { padding-top: 26px; }
.c-sec > h2 { font-size: 1.45rem; margin: .3em 0 .7em; display: flex; gap: 12px; align-items: center; }
.c-sec > h2::before { content: ''; flex: none; width: 22px; height: 22px; border-radius: 50%; border: 5px solid var(--c); background: var(--surface); }
.c-sec .sec-src { display: block; font-size: .78rem; color: var(--ink-3); font-weight: 600; margin: -10px 0 12px 34px; }
.subh { font-size: 1.06rem; font-weight: 800; margin: 1.5em 0 .5em; }
.ch li::marker { color: var(--c, var(--ink)); font-weight: 700; }
.ch strong { font-weight: 700; }
.ch-f { margin-top: 40px; padding-top: 20px; border-top: 3px solid var(--ink); }
.train { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; align-items: center; }
.pn { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-top: 18px; }
.pn-a { display: flex; gap: 10px; align-items: center; padding: 14px; border: 1.5px solid var(--line); border-radius: var(--r-m); text-decoration: none; color: var(--ink); background: var(--surface); }
.pn-a:hover { border-color: var(--ink); text-decoration: none; }
.pn-a.r { justify-content: flex-end; text-align: right; }
.pn-a span { display: grid; font-weight: 800; font-size: .98rem; }
.pn-a em { font-style: normal; font-weight: 600; font-size: .78rem; color: var(--ink-3); }
@media (max-width: 560px) { .pn { grid-template-columns: minmax(0, 1fr); } }
.flash { animation: flash 2s ease; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--mark); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* ───────── Fiches et lexique */
.fiche { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 24px clamp(16px, 3vw, 32px); max-width: 900px; box-shadow: var(--shadow); margin-bottom: 22px; }

.f-rub > div > :last-child { margin-bottom: 0; }
@media (max-width: 680px) { .f-rub { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.express { list-style: none; padding: 0; margin: 10px 0 0; counter-reset: e; }
.express li { counter-increment: e; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 1.02rem; margin: 0; }
.express li:last-child { border-bottom: 0; }
.express li::before { content: counter(e); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--c, var(--ink)); color: var(--on-c, var(--bg)); font-weight: 800; font-size: .85rem; }
.lex-letters { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 18px; }

.lex { margin: 0; max-width: 860px; }
.lex-i { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.lex-i dt { font-weight: 800; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }

@media (max-width: 640px) { .lex-i { grid-template-columns: minmax(0, 1fr); gap: 4px; } }

/* ───────── Flashcards */
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-bottom: 26px; }
.deck { display: grid; gap: 8px; padding: 16px 18px; border: 1.5px solid var(--line); border-radius: var(--r-l); background: var(--surface); text-decoration: none; color: var(--ink); cursor: pointer; text-align: left; position: relative; overflow: hidden; }
.deck::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--c); }
.deck:hover { border-color: var(--ink); text-decoration: none; }
.deck strong { font-size: 1.02rem; font-weight: 800; line-height: 1.25; }
.deck span { font-size: .84rem; color: var(--ink-3); font-weight: 600; }
.deck em { font-style: normal; color: var(--ko-ink); }
.fc-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.fc-prog { flex: 1 1 200px; display: grid; gap: 6px; font-size: .84rem; color: var(--ink-3); font-weight: 600; }
.fc { perspective: 1400px; max-width: 760px; margin: 0 auto; }

/* ───────── Cas pratiques */
.case-list { display: grid; gap: 14px; margin-bottom: 26px; }

uis-je en train de négocier ? »",objectifs:["Comprendre qu’une négociation doit être adaptée au cadre dans lequel elle se déroule.","Identifier ce qui caractérise une négociation spécifique.","Distinguer plusieurs contextes de négociation.","Commencer à analyser une situation avant de choisir une manière de négocier."],sections:[{id:"situations",title:"Est-ce toujours la même négociation ?",station:"Même négo ?",src:"Diapos 3–4",blocks:[["p","Le cours s’ouvre sur cinq situations. Toutes sont des négociations, mais elles ne se déroulent pas du tout dans le même cadre :"],["table",["Situation","Ce qui se passe"],[["A","Un commercial négocie avec un client le <strong>prix</strong>, le <strong>volume</strong> et le <strong>délai de livraison</strong> d’une commande importante."],["B","Une entreprise souhaite être <strong>référencée par une grande enseigne</strong> et doit présenter son offre selon les conditions imposées."],["C","Une <strong>collectivité lance un appel d’offres</strong> pour choisir son prestataire informatique."],["D","Un acheteur industriel organise une <strong>enchère inversée</strong>."],["E","Un commercial présente une proposition à un <strong>comité composé de plusieurs décideurs</strong>."]]],["q","« Dans ces situations, peut-on négocier exactement de la même manière ? »","« Qu’est-ce qui change d’une situation à l’autre ? »"],["expl","Ce qui change d’une situation à l’autre","En A, les deux interlocuteurs organisent librement leurs échanges. En B, l’enseigne impose des conditions. En C, une procédure fixe les règles avant même la discussion. En D, un mécanisme d’enchère met plusieurs fournisseurs en concurrence. En E, plusieurs personnes pèsent sur la décision. Ce sont précisément ces différences — les règles, le déroulement dans le temps, le nombre d’acteurs, l’information disponible — que la séance apprend à repérer."]]},{id:"definitions",title:"Négociation commerciale et négociation spécifique",station:"Définitions",src:"Diapos 5–8 + notes",blocks:[["def","Négociation commerciale","<ul><li>Plusieurs parties, des intérêts <strong>au moins partiellement divergents</strong>, et la recherche d’un accord.</li><li>Les parties échangent sur les <strong>conditions de l’accord</strong>.</li><li>La négociation peut mobiliser <strong>propositions, contre-propositions, concessions et contreparties</strong>.</li><li>Le résultat recherché est un <strong>accord acceptable pour les parties</strong>.</li></ul>"],["def","Négociation spécifique","Une négociation dont les <strong>modalités sont fortement influencées par les caractéristiques du contexte</strong> dans lequel elle se déroule."],["p","<strong>Le contexte n’est pas un simple décor.</strong> Il influence la manière dont la négociation est organisée et conduite. Avant de négocier, il faut donc <strong>identifier le cadre spécifique</strong>."],["q","Idée centrale du module : « Le négociateur doit d’abord analyser la situation. »"],["expl","Pourquoi « au moins partiellement divergents » ?","Si les intérêts étaient totalement opposés, aucun accord ne serait possible ; s’ils étaient identiques, il n’y aurait rien à négocier. La négociation existe parce que les parties ont à la fois un intérêt commun (conclure) et des intérêts qui s’opposent sur certaines conditions. Le cas Ronaldo de la séance 4 l’illustre : le joueur et le Real Madrid veulent tous deux le transfert, mais s’opposent sur le partage des droits à l’image."],["trap","Ne définis pas la négociation spécifique comme « une négociation difficile » ou « une négociation dans un secteur particulier ». Le critère du cours est précis : ce sont les <strong>modalités</strong> de la négociation qui sont fortement influencées par le <strong>contexte</strong>."]]},{id:"dimensions",title:"Les quatre dimensions à repérer",station:"4 dimensions",src:"Diapos 9–13 + notes",blocks:[["p","Pour caractériser un contexte, le cours propose quatre axes. Chacun oppose deux pôles : une situation se place plus ou moins près de l’un ou de l’autre."],["h","A. Cadre : relativement libre ↔ fortement encadré"],["cols",[["Négociation relativement libre","<p>Le cadre laisse une marge de manœuvre pour organiser les échanges.</p><p>Interlocuteurs, rythme, sujets, propositions et contre-propositions <strong>peuvent évoluer</strong>.</p>"],["Négociation fortement encadrée","<p>Une partie du processus est <strong>définie à l’avance</strong>.</p><p>Règles, délais, procédures ou conditions de réponse <strong>doivent être respectés</strong>.</p><p>Exemples : appel d’offres • référencement • procédure d’achat • enchère inversée.</p>"]]],["h","B. Temporalité : négociation ponctuelle ↔ processus formalisé"],["cols",[["Négociation ponctuelle","<p>Échanges concentrés sur une <strong>période relativement courte</strong>. Les parties cherchent directement un accord sur une offre ou une transaction.</p>"],["Processus formalisé","<p>La négociation s’inscrit dans <strong>plusieurs étapes organisées</strong>.</p><p>Le négociateur <strong>ne maîtrise pas nécessairement toutes les étapes</strong> du processus.</p>"]]],["flow",["Prise de contact","Échanges","Accord","Contractualisation"],"Négociation ponctuelle"],["flow",["Préparation","Candidature / réponse","Sélection","Négociation","Décision","Contractualisation"],"Processus formalisé"],["h","C. Acteurs : négociation individuelle ↔ multi-acteurs"],["table",["Configuration","Qui face à qui ?","Ce qui la caractérise"],[["Individuelle","1 vendeur ↔ 1 acheteur","Échanges directs entre deux interlocuteurs."],["Comité / multi-acteurs","1 vendeur ↔ comité d’achat","Plusieurs interlocuteurs peuvent avoir des rôles et attentes différents."],["Mise en concurrence","Plusieurs vendeurs ↔ 1 acheteur","Plusieurs fournisseurs sont en concurrence."]]],["q","À identifier : « Qui participe ? Qui décide ? Quels sont les rôles ? »","<p>Tes notes ajoutent : il faut identifier qui participe, <strong>qui influence</strong> et qui décide.</p>"],["h","D. Information : relativement équilibrée ↔ asymétrique"],["cols",[["Information relativement équilibrée","<p>Les parties disposent d’informations <strong>assez proches</strong> sur les principaux éléments de la négociation.</p><p>Cela ne signifie pas qu’elles savent exactement la même chose.</p>"],["Information asymétrique","<p>Une partie possède des <strong>informations importantes auxquelles l’autre n’a pas accès</strong>.</p><p>Ex. : <strong>budget maximal</strong> de l’acheteur ; <strong>coût de revient</strong> et <strong>marge minimale</strong> du vendeur.</p>"]]],["q","« Qui sait quoi ? »"],["table",["Dimension","Pôle 1","Pôle 2"],[["Cadre","Relativement libre","Fortement encadré"],["Temporalité","Ponctuelle","Processus formalisé"],["Acteurs","Individuelle","Multi-acteurs"],["Information","Relativement équilibrée","Asymétrique"]]],["app","Les quatre dimensions sur le cas MarketOne / TempoRun","<p><strong>Cadre</strong> : plutôt encadré — commission, abonnement et tarifs standards ne sont pas négociables individuellement ; seuls le test de trois mois, l’accompagnement, le calendrier et le suivi sont discutables. <strong>Temporalité</strong> : processus (proposition écrite, préparation, commission contradictoire, test éventuel). <strong>Acteurs</strong> : deux organisations, mais côté MarketOne un responsable commercial dont la proposition reste « sous réserve de validation ». <strong>Information</strong> : nettement asymétrique — chaque camp a une annexe confidentielle (coûts, seuil de 14 €, RunSphere côté TempoRun ; méthode de la prévision côté MarketOne).</p>"],["link",'S’entraîner : <a href="#exercices-dimensions">exercice « Les quatre dimensions »</a>.']]},{id:"contextes",title:"Les principaux contextes spécifiques",station:"5 contextes",src:"Diapos 14–20 + notes",blocks:[["p","Le cours retient cinq contextes spécifiques. Pour chacun, il donne un <strong>indice à repérer</strong> dans un énoncé."],["table",["Contexte","Formule du cours","Indice à repérer"],[["Appel d’offres","Besoin défini + cadre de consultation + concurrence","Procédure + cahier des charges + échéance"],["Négociation multi-acteurs","Plusieurs personnes participent à la décision","Plusieurs interlocuteurs impliqués dans la décision"],["Grande distribution / référencement","Référencement + poids de l’enseigne + conditions commerciales","Référencement + acheteur/centrale + conditions imposées ou discutées"],["Enchère inversée","Mise en concurrence + mécanisme d’enchère","Mise en concurrence + mécanisme d’enchère"],["Sous contraintes","Délai, budget, urgence, réglementation…","Une contrainte forte qui pèse directement sur la négociation"]]],["h","Appel d’offres"],["ul",["L’acheteur définit un <strong>besoin</strong> et un <strong>cadre de consultation</strong>.","Plusieurs fournisseurs peuvent être <strong>en concurrence</strong>.","Le vendeur doit répondre à un <strong>cahier des charges</strong> et respecter les modalités prévues.","Le contexte est <strong>fortement structuré avant même les échanges commerciaux</strong>."]],["h","Négociation multi-acteurs"],["ul",["Plusieurs personnes participent à la négociation ou à la décision.","Elles peuvent avoir des <strong>préoccupations différentes</strong>.","Exemple : acheteur → conditions commerciales ; financier → budget ; technique → faisabilité ; utilisateur → usage.","Le négociateur doit <strong>identifier les rôles de chacun</strong>."]],["note","Il faut distinguer <strong>utilisateurs, prescripteurs, acheteurs, influenceurs et décideurs</strong> lorsque ces rôles existent dans le cas."],["h","Grande distribution / référencement"],["ul",["Le fournisseur cherche à <strong>intégrer ou maintenir son offre dans l’assortiment</strong> d’une enseigne.","La négociation implique notamment un <strong>acheteur ou une centrale d’achat</strong>.","Les échanges peuvent porter sur prix, volumes, conditions commerciales, promotions, logistique, assortiment…","Le contexte est marqué par le <strong>poids économique de l’enseigne</strong>."]],["note","L’enseigne contrôle l’accès à son réseau, mais le rapport de force dépend aussi de la <strong>dépendance</strong> et des <strong>alternatives</strong> (développé en séance 3)."],["h","Enchère inversée"],["ul",["Un acheteur met plusieurs fournisseurs en concurrence selon un <strong>mécanisme défini</strong>.","Les fournisseurs peuvent <strong>modifier leurs propositions pendant une période déterminée</strong>.","Le <strong>prix</strong> peut devenir une variable particulièrement déterminante.","Le négociateur doit <strong>comprendre le mécanisme avant de décider de sa participation</strong>."]],["note","Les modalités du mécanisme influencent fortement la marge de manœuvre."],["h","Négociation sous contraintes"],["ul",["La négociation se déroule avec une <strong>contrainte particulièrement forte</strong>.","Exemples : délai, budget, urgence, réglementation, capacité de production, disponibilité, dépendance à un fournisseur.","La contrainte constitue un <strong>élément central du contexte</strong> à identifier."]],["note","Il faut identifier <strong>précisément</strong> la contrainte et ses effets sur les marges de manœuvre."],["trap","Un contexte peut en cumuler plusieurs : un appel d’offres est souvent aussi multi-acteurs (acheteur, services techniques, financiers, décideurs — séance 2), et une enchère inversée est une forme de mise en concurrence. Au contrôle, cite le contexte principal <strong>et</strong> les autres caractéristiques présentes, en t’appuyant sur les indices."]]},{id:"grille",title:"Ce qui change : la grille d’analyse",station:"Grille 9 questions",src:"Diapos 21–23 + notes",blocks:[["p","Ce qui change par rapport à une négociation classique, c’est l’obligation de comprendre la situation avant d’agir. Le cours donne pour cela un <strong>outil simple à conserver</strong>."],["q","« Avant de choisir comment négocier, il faut comprendre la situation. »","<ul><li>Qui intervient ?</li><li>Quel est l’objectif de chacun ?</li><li>Quelles règles encadrent les échanges ?</li><li>Quelles informations sont disponibles ?</li><li>Quelles contraintes structurent la situation ?</li></ul>"],["h","La grille d’analyse en 9 questions"],["table",["Question","Ce qu’on cherche"],[["1. Qui ?","Parties prenantes, décideurs, influenceurs"],["2. Pourquoi ?","Objectifs et intérêts de chacun"],["3. Avec quelles règles ?","Cadre et procédure"],["4. Avec quelles informations ?","Informations disponibles / manquantes"],["5. Quels enjeux ?","Ce que chacun risque de gagner ou perdre"],["6. Quel rapport de force ?","Dépendances, pouvoir de négociation"],["7. Quelles contraintes ?","Budget, délai, réglementation…"],["8. Quelles alternatives ?","Solutions de repli, MESORE"],["9. Quelles variables négociables ?","Prix, volume, délai, service, exclusivité…"]]],["expl","MESORE et BATNA : la même idée","<p>MESORE signifie « meilleure solution de rechange ». C’est l’équivalent français de la <strong>BATNA</strong> (<em>Best Alternative To a Negotiated Agreement</em>), que le cours définit en séance 3 comme la <strong>solution de repli en cas d’absence d’accord</strong>. Retiens les deux sigles : MESORE apparaît dans la grille de la séance 1, BATNA dans la séance 3.</p>"],["expl","Comment utiliser la grille au contrôle","<p>La grille est ta colonne vertébrale pour <strong>tout</strong> cas pratique : la séance 3 demande explicitement de la reprendre (« Qui ? Pourquoi ? Rapport de force ? Alternatives ? Variables négociables ? ») et la séance 4 en propose une version adaptée à l’agent sportif. Applique-la à <strong>chaque partie</strong>, pas seulement à la tienne : l’analyse du rapport de force et des alternatives n’a de sens que si tu compares les deux camps.</p>"],["link",'S’entraîner : <a href="#exercices-grille">exercice « À quelle question de la grille ? »</a> et la <a href="#methode">méthode d’analyse</a>.']]},{id:"activite",title:"Activité — Quel type de négociation ?",station:"Activité",src:"Diapos 24–26",blocks:[["p","Travail individuel ou en binôme. Pour chaque situation : 1) identifier le type de négociation ; 2) relever un <strong>indice</strong> qui permet de le déterminer."],["warn","Ne cherchez pas uniquement un mot-clé. Appuyez-vous sur les <strong>caractéristiques de la situation</strong>. (La grille d’analyse complète n’est pas encore à remplir à ce stade.)"],["table",["Situation","Type de négociation","Indice"],[["Un commercial rencontre directement le responsable d’une PME. Ils discutent du prix, des quantités et du délai de livraison.","Négociation commerciale classique","Échange direct et relativement libre"],["Une collectivité publie un dossier précisant ses besoins, les conditions de réponse et une date limite.","Appel d’offres","Procédure + cahier des charges + échéance"],["Une entreprise souhaite vendre ses produits dans une grande enseigne et rencontre l’acheteur de la centrale.","Référencement","Référencement + centrale/acheteur"],["Un acheteur met plusieurs fournisseurs en concurrence sur une plateforme ; ils peuvent modifier leurs prix pendant une période déterminée.","Enchère inversée","Mise en concurrence + mécanisme d’enchère"],["Un commercial présente son offre à l’acheteur, au responsable financier et au responsable technique.","Comité d’achat","Plusieurs interlocuteurs dans la décision"],["Un client doit remplacer une machine en panne sous 48 heures.","Sous contrainte","Contrainte forte influençant la négociation"]]],["link",'Refais l’activité, puis des situations inédites : <a href="#exercices-contexte">exercice « Quel type de négociation ? »</a>.']]},{id:"retenir",title:"À retenir de la séance 1",station:"À retenir",src:"Diapo 27 + notes",blocks:[["key",["Une négociation spécifique est <strong>fortement influencée par son contexte</strong>.","Le contexte peut varier selon <strong>les règles, la temporalité, le nombre d’acteurs et l’information disponible</strong>.","Les appels d’offres, le référencement, les enchères inversées, les comités d’achat et les situations sous contraintes sont des <strong>contextes spécifiques</strong>.","La première étape du négociateur est d’<strong>analyser la situation avant de choisir sa manière de négocier</strong>.","La question de départ : <strong>« Dans quel contexte suis-je en train de négocier ? »</strong>"]],["note","<strong>Évaluation annoncée</strong> : question factuelle, avec une réponse qui commence par <strong>l’analyse de la situation</strong> et la question de savoir <strong>comment on résoudrait le problème</strong>. À confirmer avec les consignes définitives du contrôle."],["expl","Ce que cela implique pour ta façon de répondre",'Même pour une question de cours, ne te contente pas de réciter : commence par situer le contexte (quelles dimensions, quel type de négociation, quels indices), puis explique comment tu agirais. La page <a href="#methode">Méthode</a> détaille cette structure de réponse.']]}]},{id:"s2",num:2,color:"l2",title:"Les appels d’offres : analyser, décider et préparer la négociation",short:"Appels d’offres",src:"Cours 2 — 29 diapositives (TC 3, séance 2) + compléments de tes notes",lead:"Comment un commercial transforme une consultation en décision, puis en stratégie de réponse. Une démarche en cinq étapes, du « Go / No-Go » à la préparation d’une négociation… quand elle est autorisée.",question:"« Que peut-elle réellement modifier dans son offre ? »",objectifs:["Comprendre le fonctionnement général d’un appel d’offres.","Repérer les informations essentielles dans une consultation.","Évaluer l’intérêt commercial d’une opportunité.","Distinguer les éléments obligatoires des éléments négociables.","Construire les premières bases d’une stratégie de réponse.","Préparer une négociation lorsque celle-ci est autorisée."],flow:["Analyser la consultation","Décider de répondre","Identifier les marges de manœuvre","Construire une offre","Préparer la négociation éventuelle"],sections:[{id:"intro",title:"Introduction : une opportunité et un cadre de contraintes",station:"Introduction",src:"Diapos 1–3 + notes",blocks:[["p","Une entreprise reçoit un <strong>avis de consultation</strong> concernant la fourniture de matériel, une prestation de maintenance ou la réalisation de travaux. À première vue, cette consultation semble correspondre à son activité. Pourtant, plusieurs questions se posent :"],["ul",["L’entreprise possède-t-elle les compétences nécessaires ?","Peut-elle respecter les délais ?","Le marché est-il rentable ?","Les critères de sélection lui sont-ils favorables ?","Peut-elle se différencier ?","La négociation est-elle autorisée ?","Que peut-elle réellement modifier dans son offre ?"]],["q","« Un appel d’offres est à la fois une opportunité commerciale et un cadre de contraintes. »"],["flow",["Analyser la consultation","Décider de répondre","Identifier les marges de manœuvre","Construire une offre","Préparer la négociation éventuelle"],"La démarche de la séance (fil conducteur de chaque diapositive)"]]},{id:"analyser",title:"1. Analyser la consultation",station:"Analyser",src:"Diapos 4–9 + notes",blocks:[["h","1.1 Comprendre ce qu’est un appel d’offres"],["def","Appel d’offres","Une procédure par laquelle un acheteur <strong>met plusieurs fournisseurs en concurrence</strong> afin de satisfaire un <strong>besoin défini</strong>."],["p","<strong>L’appel d’offres n’est pas simplement une demande de prix.</strong> L’acheteur attend une <strong>réponse structurée à un besoin</strong>, dans le respect de règles et de critères préalablement définis."],["cols",[["Il peut porter sur…","<ul><li>un produit ;</li><li>une prestation de service ;</li><li>des travaux ;</li><li>une solution technique ;</li><li>une prestation globale associant plusieurs éléments.</li></ul>"],["L’acheteur peut s’intéresser au…","<ul><li>prix ;</li><li>qualité ;</li><li>valeur technique ;</li><li>délais ;</li><li>sécurité ;</li><li>fiabilité ;</li><li>performance environnementale ;</li><li>accompagnement.</li></ul>"]]],["h","1.2 Identifier les acteurs"],["table",["Acteur","Rôle dans la procédure"],[["L’acheteur","Exprime le besoin et organise la consultation"],["Les entreprises candidates","Préparent et déposent une offre"],["Les services techniques","Vérifient la qualité et la conformité des solutions"],["Les services achats ou financiers","Analysent notamment les prix et les conditions contractuelles"],["Les décideurs","Choisissent l’offre retenue"],["Éventuellement, les utilisateurs finaux","Leurs attentes peuvent influencer le choix"]]],["expl","Un appel d’offres est aussi une négociation multi-acteurs","Derrière « l’acheteur » se cachent plusieurs personnes aux préoccupations différentes (séance 1 : acheteur → conditions commerciales ; financier → budget ; technique → faisabilité ; utilisateur → usage). Une bonne réponse parle à chacune."],["h","1.3 Repérer les informations essentielles"],["p","Lorsqu’une entreprise reçoit une consultation, elle doit relever <strong>immédiatement</strong> :"],["ol",["l’objet du marché ;","l’identité de l’acheteur ;","le lieu d’exécution ;","la date limite de réponse ;","la durée du contrat ;","les quantités ou volumes prévus ;","les exigences techniques ;","les documents demandés ;","les critères de sélection ;","la possibilité ou non de négocier ;","les éventuelles variantes ou options autorisées."]],["ex","Un marché de maintenance d’ascenseurs","<p>Une consultation publiée sur une plateforme spécialisée porte sur la <strong>maintenance préventive et corrective</strong> d’ascenseurs, de monte-charges et de plateformes élévatrices. Le marché est prévu pour <strong>48 mois</strong>, avec un <strong>montant maximal de 240 000 €</strong>. Le <strong>prix compte pour 50 %</strong> de la note et la <strong>valeur technique pour les 50 %</strong> restants.</p>"],["table",["Information à rechercher","Exemple dans la consultation","Utilité"],[["Objet de la prestation","Maintenance préventive et corrective d’ascenseurs et plateformes élévatrices","Comprendre précisément ce qui est demandé"],["Client","Organisme à l’origine de la consultation","Identifier le donneur d’ordre"],["Durée du marché","48 mois","Repérer la période d’engagement"],["Montant du marché","Montant maximal de 240 000 €","Situer l’ordre de grandeur du contrat"],["Critères d’attribution","Prix : 50 % ; valeur technique : 50 %","Comprendre comment l’offre sera évaluée"],["Prestations attendues","Maintenance préventive, dépannage et interventions correctives","Déterminer ce qui doit être chiffré et décrit"],["Exigences techniques","Organisation, moyens humains et matériels, méthode d’intervention","Identifier les éléments à démontrer dans le mémoire technique"],["Documents à fournir","Offre financière, mémoire technique et pièces administratives","Vérifier la complétude du dossier"],["Contraintes particulières","Délais d’intervention, pénalités, qualifications éventuelles","Repérer les obligations à respecter"],["Modalités de réponse","Date limite, plateforme de dépôt, éventuelle négociation","Savoir comment et quand répondre"]]],["link",'S’entraîner : <a href="#exercices-consultation">exercice « Décortiquer une consultation »</a>.']]},{id:"gonogo",title:"2. Décider de répondre : la logique « Go / No-Go »",station:"Go / No-Go",src:"Diapos 10–15 + notes",blocks:[["p","L’entreprise doit évaluer si <strong>l’effort de réponse est justifié</strong>. La décision peut être :"],["table",["Décision","Signification"],[["Go","L’entreprise décide de répondre. <em>(Notes : elle estime disposer des compétences et moyens nécessaires, et considère pouvoir construire une offre compétitive et rentable.)</em>"],["No-Go","Elle renonce à répondre."],["Go sous conditions","Elle poursuit l’analyse, mais doit <strong>obtenir certaines informations</strong> avant de prendre une décision définitive."]]],["h","2.1 Vérifier la capacité de l’entreprise"],["ul",["Possède-t-elle les compétences nécessaires ?","Dispose-t-elle des équipements adaptés ?","Peut-elle mobiliser suffisamment de personnel ?","Possède-t-elle les qualifications ou certifications demandées ?","A-t-elle les références nécessaires ?","Peut-elle intervenir dans la zone géographique concernée ?"]],["q","« Une entreprise peut être intéressée par un marché sans être réellement capable de l’exécuter. »"],["h","2.2 Vérifier la rentabilité potentielle"],["p","<strong>Le chiffre d’affaires attendu ne suffit pas.</strong> L’entreprise doit estimer : les coûts de production ou d’exécution ; les coûts de transport ; les coûts de personnel ; les coûts de préparation ; les coûts de sous-traitance ; les éventuelles pénalités ; les besoins de trésorerie ; la marge prévisible."],["warn","Une offre peut être <strong>remportée mais se révéler déficitaire</strong> si le prix proposé est trop faible ou si les contraintes ont été mal évaluées."],["h","2.3 Évaluer ses chances de réussite"],["ul",["L’adéquation entre son offre et le besoin ;","ses références ;","ses avantages concurrentiels ;","le niveau de concurrence probable ;","le poids du prix dans la notation ;","la possibilité de proposer une solution différenciante ;","la qualité des informations disponibles."]],["ex","Les critères de décision appliqués aux ascenseurs","<p>Le cours applique la grille Go / No-Go au marché de maintenance d’ascenseurs (48 mois, prix 50 %, valeur technique 50 %).</p>"],["table",["Critère de décision","Question à se poser","Conséquence possible"],[["Compétences techniques","L’entreprise maîtrise-t-elle la maintenance des ascenseurs, monte-charges et plateformes élévatrices ?","Si certaines compétences manquent, elle peut renoncer ou rechercher un partenaire."],["Moyens humains et matériels","Dispose-t-elle de techniciens, d’outils et de pièces suffisants pour assurer les interventions ?","Des moyens insuffisants peuvent rendre la réponse irréaliste."],["Capacité d’engagement","Peut-elle assurer la prestation pendant 48 mois ?","Une durée longue nécessite de sécuriser les ressources disponibles."],["Rentabilité","Le prix proposé peut-il couvrir les coûts de maintenance préventive et corrective ?","Un marché important peut être déficitaire si le chiffrage est insuffisant."],["Compétitivité","Peut-elle proposer un prix suffisamment compétitif tout en préservant sa marge ?","La pondération du prix à 50 % impose une vigilance particulière."],["Qualité de l’offre","Peut-elle obtenir une bonne note sur la valeur technique, également pondérée à 50 % ?","Elle doit être capable de présenter une organisation et des moyens convaincants."],["Risques contractuels","Les délais d’intervention, pénalités ou obligations particulières sont-ils acceptables ?","Des contraintes trop fortes peuvent justifier un No-Go."],["Potentiel commercial","Le marché présente-t-il un intérêt pour son développement ou ses références ?","L’entreprise peut accepter une rentabilité modérée si l’intérêt stratégique est réel."]]],["trap","Le « Go sous conditions » n’est pas un « peut-être » de confort : il s’accompagne toujours de la <strong>liste précise des informations à obtenir</strong> (et auprès de qui) avant de trancher. Au contrôle, une recommandation « GO sous conditions » sans conditions explicites perd l’essentiel de sa valeur."],["link",'S’entraîner : <a href="#exercices-gonogo">exercice « Go, No-Go ou Go sous conditions ? »</a>.']]},{id:"marges",title:"3. Identifier les marges de manœuvre",station:"Marges de manœuvre",src:"Diapos 16–22 + notes",blocks:[["p","<strong>C’est à cette étape que l’entreprise commence réellement à préparer la négociation.</strong> Elle distingue quatre catégories d’éléments :"],["table",["Catégorie","Ce que c’est","Exemples du cours"],[["Exigence obligatoire","Condition à respecter : une offre qui ne la respecte pas peut être écartée","Une qualification, une norme, un délai maximal, une assurance…"],["Critère d’évaluation","Élément sur lequel l’acheteur compare les offres (avec sa pondération)","Prix 40 %, valeur technique 40 %, délais 20 %"],["Élément différenciant","Ce qui peut rendre l’offre plus attractive","Interlocuteur unique, outil de suivi en ligne, intervention préventive, disponibilité élargie, formation des utilisateurs…"],["Variable négociable","Ce qui peut éventuellement être discuté, si la procédure le permet","Prix, quantités, périmètre, délais, modalités d’exécution, options, conditions de paiement, niveau de service…"]]],["h","3.1 Les exigences obligatoires"],["p","Une exigence peut concerner : une qualification ; une norme ; un délai maximal ; une assurance ; …"],["warn","Une offre qui ne respecte pas une exigence essentielle <strong>peut être écartée, même si elle présente un prix intéressant</strong>. Le commercial doit donc <strong>éviter de présenter comme négociable ce qui constitue une condition obligatoire</strong> de la consultation."],["h","3.2 Les critères d’évaluation"],["p","Les critères indiquent les éléments sur lesquels l’acheteur va comparer les offres. <strong>Cette pondération donne une indication sur la stratégie à adopter.</strong>"],["table",["Critère","Pondération"],[["Prix","40 %"],["Valeur technique","40 %"],["Délais","20 %"]]],["p","Si le prix représente 40 %, l’entreprise <strong>ne doit pas nécessairement chercher à être la moins chère</strong>. Elle peut améliorer sa note grâce à : une meilleure organisation ; des délais plus courts ; une méthode plus fiable ; une assistance plus performante ; une meilleure qualité de suivi."],["app","Pourquoi le moins cher ne gagne pas forcément (illustration chiffrée)","<p>Hypothèse de la plateforme, avec la pondération du cours (prix 40 %, technique 40 %, délais 20 %) et des notes sur 10 :</p><ul><li>Offre A, la moins chère : prix 8, technique 6, délais 5 → 0,4×8 + 0,4×6 + 0,2×5 = <strong>6,6</strong></li><li>Offre B, plus chère : prix 6, technique 9, délais 8 → 0,4×6 + 0,4×9 + 0,2×8 = <strong>7,6</strong></li></ul><p>B l’emporte : son avance sur la valeur technique et les délais compense largement son prix. C’est exactement le sens de la diapositive 19.</p>"],["h","3.3 Les éléments différenciants"],["p","Une entreprise doit rechercher ce qui peut rendre son offre plus attractive : interlocuteur unique ; outil de suivi en ligne ; intervention préventive ; disponibilité élargie ; formation des utilisateurs ; …"],["warn","La différenciation doit toutefois <strong>répondre à un besoin réel de l’acheteur</strong>. Une innovation inutile ne constitue pas nécessairement un avantage commercial."],["h","3.4 Les variables potentiellement négociables"],["p","Selon la procédure, la négociation peut éventuellement porter sur : le prix ; les quantités ; le périmètre de la prestation ; les délais ; les modalités d’exécution ; les options ; les conditions de paiement ; le niveau de service ; l’organisation du suivi ; certaines caractéristiques techniques. <strong>Mais cette possibilité doit être vérifiée dans le dossier de consultation.</strong>"],["warn","<strong>Tous les appels d’offres ne permettent pas de négocier.</strong> Dans certains cas, l’entreprise doit remettre dès le départ une <strong>offre complète et définitive</strong>."],["note","Règle de négociation : <strong>pas de concession sans contrepartie</strong>. Toute concession faite doit être reliée à une contrepartie recherchée."],["link",'S’entraîner : <a href="#exercices-consultation">exercice « Décortiquer une consultation »</a> (les quatre catégories).']]},{id:"offre",title:"4. Construire une offre",station:"Construire l’offre",src:"Diapos 23–25 + notes",blocks:[["q","« Une offre ne doit pas seulement être conforme. Elle doit aussi être compétitive et rentable. »"],["h","4.1 Garantir la conformité"],["p","L’entreprise doit répondre précisément aux exigences du dossier. <strong>La conformité constitue le socle de l’offre.</strong> Une entreprise <strong>ne peut pas compenser une non-conformité par un argument commercial</strong>."],["h","4.2 Adapter l’offre aux critères"],["p","La réponse doit être <strong>construite en fonction des critères de sélection</strong>."],["h","4.3 Construire une offre économiquement viable"],["p","Avant de proposer un prix, l’entreprise doit connaître :"],["ul",["son <strong>coût de revient</strong> ;","sa <strong>marge minimale</strong> ;","son <strong>prix cible</strong> ;","son <strong>prix maximal acceptable pour l’acheteur</strong> ;","les <strong>coûts liés aux éventuelles concessions</strong>."]],["p","<strong>Le prix proposé doit intégrer les risques du marché.</strong> Par exemple, un délai d’intervention très court peut nécessiter : du personnel d’astreinte ; des stocks disponibles ; des véhicules supplémentaires ; une organisation spécifique. <strong>Ces coûts doivent être pris en compte dans la proposition.</strong>"],["check","Tes notes formulent cette liste un peu différemment : « coût de revient, marge minimale, <em>stock</em> et <em>prix souhaité</em> ». La plateforme suit la diapositive (liste ci-dessus), plus complète. Au contrôle, cite la version de la diapositive ; tu peux ajouter le stock si la situation s’y prête. Par ailleurs, la diapositive est numérotée « 3. » alors qu’elle appartient à la partie 4 : elle est présentée ici comme le point 4.3."],["expl","Relier les notions de prix","Coût de revient + marge minimale donnent le <strong>plancher</strong> en dessous duquel l’offre n’est plus viable ; le prix maximal acceptable pour l’acheteur donne le <strong>plafond</strong> ; le prix cible se situe entre les deux. Chaque concession a un coût qu’il faut avoir chiffré <em>avant</em> la négociation, sinon on risque de franchir le plancher sans s’en rendre compte."]]},{id:"preparer",title:"5. Préparer la négociation éventuelle",station:"Préparer la négo",src:"Diapos 26–28 + notes",blocks:[["q","« La négociation doit être préparée avant même que l’acheteur propose un échange. »"],["h","5.1 Définir ses objectifs"],["table",["Niveau","Signification"],[["L’objectif idéal","Ce que l’on obtiendrait dans le meilleur des cas"],["La cible réaliste","Ce que l’on vise raisonnablement"],["Le seuil minimal acceptable","La limite en dessous de laquelle on ne signe pas"]]],["h","5.2 Préparer ses arguments"],["p","Les arguments doivent être <strong>reliés aux attentes de l’acheteur</strong>. Un argument efficace ne consiste pas seulement à présenter une caractéristique de l’entreprise : <strong>il doit montrer le bénéfice pour l’acheteur</strong>."],["app","De la caractéristique au bénéfice","<p><em>Caractéristique seule</em> : « Nous avons douze techniciens. »<br><em>Argument relié aux attentes</em> : « Nos douze techniciens couvrent votre secteur : en cas de panne, un ascenseur est remis en service plus vite, ce qui limite la gêne pour vos usagers et les risques de pénalités. »</p>"],["h","5.3 Préparer ses concessions"],["p","<strong>Une concession ne doit pas être accordée gratuitement.</strong>"],["note","<strong>Pas de concession sans contrepartie.</strong> Toute concession faite doit être reliée à une contrepartie recherchée."],["h","5.4 Préparer les questions à poser"],["p","Le commercial doit chercher à <strong>comprendre les priorités de l’acheteur</strong>. Ces questions permettent de <strong>négocier sur les véritables enjeux plutôt que de réduire immédiatement le prix</strong>."],["app","Des questions qui ouvrent la négociation","<ul><li>« Parmi les critères, lequel pose aujourd’hui le plus de difficultés à vos services ? »</li><li>« Qu’est-ce qui n’a pas fonctionné avec le prestataire précédent ? »</li><li>« Si vous deviez choisir entre un prix plus bas et un délai d’intervention plus court, que privilégieriez-vous ? »</li></ul>"],["warn","Tous les appels d’offres ne permettent pas la négociation : <strong>vérifier le cadre avant de proposer une modification</strong>."],["link",'S’entraîner : <a href="#exercices-concessions">« Concession → contrepartie »</a>, <a href="#exercices-arguments">« Caractéristique → bénéfice »</a>, <a href="#exercices-questions">« Questions stratégiques »</a> et le <a href="#simulateur-ao">simulateur « Négociation après remise des offres »</a>.']]},{id:"conclure",title:"Pour conclure",station:"À retenir",src:"Diapo 29",blocks:[["q","Idée essentielle : « Dans un appel d’offres, la qualité de la négociation dépend d’abord de la qualité de l’analyse et de la préparation de la réponse. »"],["p","La négociation ne consiste pas uniquement à obtenir ou à accorder une baisse de prix ➔ <strong>rechercher un accord sur les conditions de l’offre, tout en préservant la satisfaction de l’acheteur et la rentabilité de l’entreprise</strong>."],["flow",["Analyser la consultation","Décider de répondre","Identifier les marges de manœuvre","Construire une offre","Préparer la négociation éventuelle"],"La démarche professionnelle"],["p","L’entreprise ne dispose pas toujours d’une liberté totale. Elle doit respecter : <strong>un besoin défini, un calendrier, des exigences, des critères, une procédure, des limites de négociation</strong>."],["key",["Un appel d’offres est une procédure de <strong>mise en concurrence</strong> pour satisfaire un <strong>besoin défini</strong> — pas une simple demande de prix.","Décider de répondre (Go / No-Go / Go sous conditions) suppose de vérifier <strong>capacité, rentabilité et chances de réussite</strong>.","Distinguer <strong>exigences obligatoires, critères d’évaluation, éléments différenciants et variables négociables</strong>.","L’offre doit être <strong>conforme, compétitive et rentable</strong> ; la conformité est le socle.","Préparer : objectif idéal / cible réaliste / seuil minimal, arguments orientés bénéfice, concessions avec contreparties, questions.","<strong>Un appel d’offres ne se traite pas comme une négociation commerciale classique.</strong>"]]]}]},{id:"s3",num:3,color:"l3",title:"Le référencement en grande distribution",short:"Référencement",src:"Cours 3 — 16 diapositives + compléments de tes notes",lead:"Entrer dans l’assortiment d’une enseigne : un rapport de force qui dépend de la dépendance et des alternatives, des variables bien au-delà du prix, et un accord qu’il faudra ensuite exécuter.",question:"« Qui dépend le plus de l’autre ? »",objectifs:["Distinguer référencement, assortiment et implantation.","Analyser le rapport de force entre un fournisseur et une enseigne (dépendance, alternatives, BATNA).","Identifier les variables négociables : assortiment, prix, volumes, promotion, logistique, trade marketing…","Lier chaque concession à une contrepartie et raisonner sur l’économie globale de la relation."],objectifsNote:"Ce support n’a pas de diapositive « Objectifs » : ces objectifs sont reconstitués par la plateforme à partir de la diapositive « À retenir ».",sections:[{id:"comprendre",title:"1. Comprendre le référencement",station:"Comprendre",src:"Diapos 2–3 + notes",blocks:[["def","Référencement","Décision d’<strong>intégrer un fournisseur et/ou ses produits dans l’offre</strong>."],["def","Assortiment","Références <strong>effectivement proposées</strong>."],["def","Implantation","Présence <strong>concrète du produit dans les magasins</strong>."],["dist","Trois étapes qu’on confond souvent","Être <strong>référencé</strong> (l’enseigne décide d’intégrer le produit) ne garantit pas d’être dans l’<strong>assortiment</strong> de chaque magasin, ni d’y être réellement <strong>implanté</strong> en rayon. Le cas MarketOne en donne un équivalent : « le référencement donne accès à la plateforme, mais ne garantit pas un volume de commandes ni une position précise dans les résultats »."],["q","« Le produit répond-il aux besoins des clients de l’enseigne ? »"],["h","Ce que recherche l’enseigne"],["ul",["Construire une offre <strong>cohérente avec son positionnement</strong>.","Répondre aux <strong>attentes de sa clientèle</strong>.","Sélectionner les produits présentant un <strong>intérêt commercial</strong>."]],["p","<strong>Le fournisseur doit démontrer la pertinence de son offre.</strong>"],["expl","Ce que cela change pour l’argumentation","Le fournisseur ne « vend » pas seulement un produit à l’acheteur : il montre que ce produit servira <strong>les cli

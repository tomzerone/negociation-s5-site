</strong> : une innovation inutile n’est pas nécessairement un avantage."],["Variables potentiellement négociables en appel d’offres ?","Prix, quantités, périmètre, délais, modalités d’exécution, options, conditions de paiement, niveau de service, organisation du suivi, certaines caractéristiques techniques — <strong>si la procédure le permet</strong>."],["Tous les appels d’offres permettent-ils de négocier ?","Non : parfois l’entreprise doit remettre dès le départ une <strong>offre complète et définitive</strong>."],["Les trois qualités d’une offre ?","<strong>Conforme</strong>, <strong>compétitive</strong> et <strong>rentable</strong>."],["Pourquoi la conformité est-elle le socle de l’offre ?","Une entreprise <strong>ne peut pas compenser une non-conformité par un argument commercial</strong>."],["Que connaître avant de proposer un prix (diapositive) ?","Coût de revient, marge minimale, prix cible, prix maximal acceptable pour l’acheteur, coûts liés aux éventuelles concessions."],["Un délai d’intervention très court peut nécessiter… ?","Du personnel d’astreinte, des stocks disponibles, des véhicules supplémentaires, une organisation spécifique — <strong>coûts à intégrer au prix</strong>."],["Les trois niveaux d’objectifs à définir ?","L’<strong>objectif idéal</strong>, la <strong>cible réaliste</strong>, le <strong>seuil minimal acceptable</strong>."],["Qu’est-ce qu’un argument efficace ?","Un argument relié aux attentes de l’acheteur qui montre le <strong>bénéfice pour l’acheteur</strong>, pas seulement une caractéristique de l’entreprise."],["Règle des concessions (séance 2) ?","Une concession ne doit pas être accordée gratuitement : <strong>pas de concession sans contrepartie</strong>."],["À quoi servent les questions à préparer ?","Comprendre les <strong>priorités de l’acheteur</strong> pour négocier sur les véritables enjeux plutôt que de réduire immédiatement le prix."],["Idée essentielle de la séance 2 ?","La qualité de la négociation dépend d’abord de la <strong>qualité de l’analyse et de la préparation</strong> de la réponse."],["Que doit respecter l’entreprise dans un appel d’offres ?","Un besoin défini, un calendrier, des exigences, des critères, une procédure, des limites de négociation."]],Ht=[["Définis le référencement.","Décision d’<strong>intégrer un fournisseur et/ou ses produits</strong> dans l’offre."],["Définis l’assortiment.","Les références <strong>effectivement proposées</strong>."],["Définis l’implantation.","La présence <strong>concrète du produit dans les magasins</strong>."],["Question centrale du référencement ?","« Le produit répond-il aux besoins des clients de l’enseigne ? »"],["Que recherche l’enseigne ?","Une offre cohérente avec son <strong>positionnement</strong>, qui réponde aux <strong>attentes de sa clientèle</strong>, avec des produits présentant un <strong>intérêt commercial</strong>."],["Qui doit démontrer la pertinence de l’offre ?","Le <strong>fournisseur</strong>."],["Le distributeur est-il automatiquement en position de force ?","Non : il contrôle l’accès à son réseau, mais le rapport de force dépend de la dépendance, des alternatives et de l’attractivité de l’offre."],["Question clé du rapport de force en séance 3 ?","« Qui dépend le plus de l’autre ? »"],["Les trois facteurs du rapport de force (séance 3) ?","La <strong>dépendance</strong>, les <strong>alternatives</strong>, l’<strong>attractivité de l’offre</strong>."],["Fournisseur A de l’exemple : situation et position ?","40 % de son CA avec l’enseigne, quasiment aucune autre distribution → forte dépendance → <strong>position fragile</strong>."],["Fournisseur B de l’exemple : situation et position ?","10 % de son activité, plusieurs distributeurs → alternatives crédibles → <strong>position solide</strong>."],["Alternatives du fournisseur ?","Autres enseignes, autres circuits, autres clients."],["Alternatives du distributeur ?","Autres fournisseurs et produits substituables."],["Définis la BATNA.","La <strong>solution de repli en cas d’absence d’accord</strong>."],["Complète : « Plus une alternative est crédible… »","« … moins la partie dépend de son interlocuteur. »"],["Que négocie-t-on dans un référencement ?","Références et assortiment, prix et volumes, promotions et logistique, conditions commerciales, actions de développement des ventes."],["Formule de concession liée aux volumes ?","« Si vous vous engagez sur tel volume, je peux envisager telle condition. » La concession devient une <strong>variable d’échange</strong>."],["Définis le trade marketing.","Démarche qui vise à <strong>développer les ventes avec le distributeur</strong> en tenant compte du circuit."],["Que peut proposer le fournisseur en trade marketing ? Pour quel enjeu ?","Promotion, animation, communication, opération de lancement — pour <strong>transformer le référencement en développement commercial</strong>."],["Les 7 étapes du processus de référencement ?","Préparer l’offre → présenter les produits → analyser les attentes → négocier les conditions → décider du référencement → formaliser (convention) → suivre l’accord."],["Rôle de la convention ?","Formaliser notamment le <strong>résultat de la négociation</strong> et les <strong>conditions de la relation commerciale</strong>."],["Les trois qualités d’un accord (séance 3) ?","<strong>Acceptable, économiquement viable et réalisable.</strong>"],["Logique du fournisseur vs logique du distributeur ?","Fournisseur : <strong>maximiser le développement de son offre</strong>. Distributeur : <strong>optimiser l’offre proposée à ses clients</strong>."],["Exemple des jus : positions et espace de négociation ?","Fournisseur : 3 références dans un maximum de magasins ; enseigne : tester 1 référence dans une partie du réseau → <strong>référencement progressif</strong> avec élargissement selon les résultats."],["Comment préparer la négociation de référencement ?","Reprendre la grille (Qui ? Pourquoi ? Rapport de force ? Alternatives ? Variables ?), identifier objectifs, priorités et limites, préparer concessions et contreparties."],["Question centrale de la préparation (séance 3) ?","« Que puis-je concéder, dans quelles limites, et contre quoi ? »"],["10 € → 9 € : quelle est la bonne question ?","Pas seulement « puis-je accepter 9 € ? » mais <strong>ce que rapporte la concession</strong> (volumes, référencement, développement des ventes) : raisonner sur l’<strong>économie globale de la relation</strong>."],["Que comparer avant d’accepter une concession tarifaire ?","La <strong>valeur de la contrepartie</strong> et le <strong>coût réel de la concession</strong>."]],Gt=[["Les deux relations fondamentales de l’agent sportif ?","Agent ↔ sportif (obtenir et sécuriser son mandat) ; agent ↔ club / sponsor / partenaire (utiliser ce mandat pour défendre les intérêts du sportif)."],["De quelle logique à quelle logique l’agent doit-il passer ?","D’une logique de <strong>vente de ses services</strong> à une logique de <strong>représentation et de négociation pour le compte d’un tiers</strong>."],["Complète : « L’agent ne négocie pas seulement une opportunité… »","« … il négocie au nom et dans l’intérêt de son mandant. »"],["Exemple Ronaldo (2009) : quel sujet opposait les parties ?","Les <strong>droits à l’image</strong> : Jorge Mendes voulait une part plus favorable ; le Real voulait garder son modèle de partage — alors que les deux voulaient conclure."],["Que doit clarifier le mandat ?","Ce que l’agent apporte, ce que le sportif attend, la durée, l’exclusivité éventuelle, les engagements respectifs, la rémunération."],["Pourquoi le mandat n’est-il pas une formalité ?","Il <strong>définit les conditions</strong> dans lesquelles l’agent pourra exercer sa mission ; la relation agent-sportif est elle-même une négociation."],["Exemple Murray (2009) : qui et pourquoi ?","19 Entertainment (Simon Fuller) : développer la dimension internationale et la valeur commerciale de sa carrière."],["Exemple Sharapova : qui et quoi ?","Max Eisenbud, rencontré à l’IMG Academy, devenu son agent exclusif ; impliqué dans les contrats et la construction de la marque Sharapova."],["La confiance suffit-elle entre l’agent et le sportif ?","Non : c’est une ressource, mais « <strong>les engagements doivent être clairement définis</strong> » (responsabilités et attentes clarifiées)."],["Ce que l’agent doit identifier pour évaluer le rapport de force ?","Les alternatives de son client, celles de l’autre partie, la <strong>rareté du profil</strong>, l’information de chaque acteur."],["Complète : « Plus les alternatives de son client sont crédibles… »","« … plus l’agent dispose de marges de négociation. »"],["Prix et valeur : quelle confusion éviter ?","Croire qu’une offre <strong>financièrement supérieure</strong> est meilleure : elle peut offrir moins de potentiel de développement ou imposer plus de contraintes."],["Exemple Jordan / Nike (1984) : quel rôle a joué Adidas ?","L’<strong>offre concurrente d’Adidas</strong> a servi d’alternative à David Falk pour améliorer la proposition de Nike."],["Contenu du contrat final Jordan / Nike ?","Rémunération + ligne de produits + participation aux revenus."],["Exemple Pogba (2016) : qu’illustre-t-il ?","Une opération à <strong>plusieurs intérêts</strong> (joueur, Manchester United, Juventus) menée par Mino Raiola, dont la rémunération a été commentée."],["Variables qu’un agent peut négocier avec un club ?","Durée, rémunération, primes, objectifs, conditions d’évolution, place dans le projet sportif, certaines clauses."],["Complète : « L’agent ne défend pas seulement une demande… »","« … il défend les intérêts globaux de son client. »"],["Les deux questions de la proposition de valeur ?","Qu’est-ce que le sportif apporte à la marque ? Qu’est-ce que la marque peut apporter au sportif ?"],["Variables d’une négociation avec une marque ?","Rémunération, utilisation de l’image, exclusivité, durée, production de contenus, apparitions, développement de produits, participation à des campagnes."],["Complète : « Une bonne négociation ne consiste pas toujours à augmenter le montant payé… »","« … elle consiste à élargir la valeur créée par le partenariat. »"],["Exemple Serena Williams / Mission Skincare (2009) ?","Ambassadrice <strong>et partenaire au capital</strong>, développement de produits, royalties ; négocié par Jill Smoller et son avocat."],["Exemple Naomi Osaka (Stuart Duguid) ?","Levi’s (2021) : concevoir sa propre collection au moins une fois par an ; Nike : ligne Sportswear avec une forte contribution d’Osaka."],["Exemple Usain Bolt / Puma (2010) ?","Renouvellement jusqu’à fin 2013, acteur majeur des campagnes mondiales, collection « Bolt »."],["Questions de préparation de l’agent (diapo 15) ?","Qui décide ? Que recherche le partenaire ? Quel rapport de force ? Quelles alternatives (les siennes et celles du client) ? Quelles informations ? Quelles variables ? Quelles contreparties ?"],["Que doit connaître l’agent pour préparer ses marges de manœuvre ?","Les objectifs du sportif, ses priorités, ses limites, ce qu’il peut concéder, ce qu’il exige en retour."],["Formulation d’une concession recommandée ?","« Nous pouvons envisager cela <strong>si vous nous accordez telle contrepartie</strong>. » (et non « Nous pouvons vous accorder cela »)"],["Question qui distingue la négociation par représentation ?","« Cette concession est-elle réellement dans l’intérêt de mon client ? »"],["Les ressources dont provient la valeur de l’agent ?","Information → réseau → accès aux décideurs → expertise → négociation → construction de projets."],["L’évolution possible du rôle de l’agent ?","Intermédiaire → représentant → conseiller → développeur d’opportunités."],["Exemple Federer / Godsick ?","Agence Team8 (2013), structure sélective ; création de la Laver Cup (lancée en 2017)."],["Contrat d’agent (selon le support) : ce qu’il doit préciser ?","Les services, leur caractère exclusif ou non, la durée, la rémunération de l’agent, la partie qui le rémunère."],["Contrat d’agent (selon le support) : durée et rémunération maximales ?","Durée ≤ <strong>3 ans</strong> ; rémunération ≤ <strong>10 %</strong> du contrat conclu par les parties mises en relation (plafond inférieur possible fixé par les fédérations délégataires)."],["La compétence fondamentale de l’agent ?","Comprendre les intérêts de son client, identifier ceux de l’autre partie et construire un accord qui <strong>protège le mandant</strong> tout en donnant à l’autre partie <strong>une raison réelle de conclure</strong>."],["Pourquoi l’agent sportif illustre-t-il une négociation spécifique ?","La méthode reste la même mais la difficulté augmente : il agit <strong>pour le compte d’un tiers</strong> et dans <strong>plusieurs relations successives</strong>."]],Vt=[["Cas : prix public et prix HT de la ceinture TempoRun ?","60 € TTC, soit <strong>50 € HT</strong> (TVA 20 %)."],["Cas : commission MarketOne par commande ?","15 % × 50 € HT = <strong>7,50 €</strong>."],["Cas : coûts fixes proposés par MarketOne ?","Abonnement <strong>49 € HT/mois</strong> ; publicité sponsorisée <strong>350 € HT/mois</strong>, optionnelle et sans garantie de résultat."],["Cas : logistique MarketOne vs expédition TempoRun ?","4,50 € par commande (périmètre à confirmer) vs 5,80 € estimés (vérifier que le périmètre est comparable)."],["Cas : la prévision de 120 commandes/mois est-elle une garantie ?","Non : une estimation du responsable commercial, <strong>méthode non communiquée</strong>. Ne pas transformer une estimation en garantie."],["Cas : qu’est-ce qui n’est pas négociable ?","Commission, abonnement, tarifs standards de logistique et de publicité : <strong>non négociables individuellement</strong>."],["Cas : qu’est-ce qui est discutable ?","Un test de lancement de 3 mois, l’accompagnement technique, le calendrier de lancement, le suivi de performance — sous réserve de validation."],["Cas : seuil de contribution exigé par TempoRun ?","<strong>14 € par commande</strong> après fabrication, emballage, commission et expédition — un garde-fou de gestion, pas un bénéfice net."],["Cas : contribution avec la logistique MarketOne ?","50 − 7,50 − 21 − 1,50 − 4,50 = <strong>15,50 €</strong>."],["Cas : contribution si TempoRun expédie ?","50 − 7,50 − 21 − 1,50 − 5,80 = <strong>14,20 €</strong>."],["Cas : contribution avec RunSphere ?","50 − 6 − 21 − 1,50 − 5,20 = <strong>16,30 €</strong> (commission 12 %, pas d’abonnement)."],["Cas : effet d’une unité de production accélérée ?","−2,50 € par unité : 13,00 € (logistique MarketOne) ou 11,70 € (TempoRun expédie) → <strong>sous le seuil de 14 €</strong>."],["Cas : budget publicitaire de TempoRun ?","<strong>200 € HT/mois maximum</strong> les 3 premiers mois, et pas d’engagement payant avant d’avoir mesuré un test."],["Cas : stock et capacité de TempoRun ?","75 unités mobilisables tout de suite ; lot de 100 dans 4 semaines ; 25 unités accélérables en 2 semaines (+2,50 €) ; capacité 210 unités/mois tous canaux ; 65 ventes/mois sur le site."],["Cas : retours de TempoRun ?","<strong>8 %</strong> au dernier trimestre (réglage, taille) ; guide amélioré mais seulement 10 commandes depuis : pas de conclusion possible."],["Cas : la solution de repli de TempoRun ?","<strong>RunSphere</strong> : 12 %, sans abonnement, expédition 5,20 €, 30–45 commandes/mois sans garantie, pas d’emplacement garanti, réponse sous 3 semaines."],["Cas : ce que montre l’observation du rayon MarketOne ?","8 offres comparables, 25 à 75 € TTC, 3 ceintures à deux porte-bidons, emplacements sponsorisés : la présence au catalogue ne garantit pas une place en haut des résultats."],["Cas : les trois recommandations possibles ?","GO, GO sous conditions, NO GO."],["Cas : ce que TempoRun ne doit pas faire avec ses informations internes ?","Les révéler automatiquement ; mais elle ne doit pas cacher une contrainte <strong>directement pertinente</strong> ni déformer les faits."]],Jt=[["Point commun des séances 2, 3 et 4 sur les concessions ?","Une concession n’est jamais gratuite : elle est liée à une <strong>contrepartie</strong> (S2 : « pas de concession sans contrepartie » ; S3 : « contre quoi ? » ; S4 : « si vous nous accordez… » + intérêt du client)."],["MESORE et BATNA : quel lien ?","Deux noms de la même idée : la <strong>meilleure solution de repli</strong> si aucun accord n’est trouvé (MESORE dans la grille S1, BATNA en S3)."],["Trois façons du cours de dire que la négociation ne se réduit pas au prix ?","S2 : « pas uniquement obtenir ou accorder une baisse de prix » ; S3 : raisonner sur l’économie globale ; S4 : prix ≠ valeur, élargir la valeur créée."],["Qui décide ? Où le cours pose-t-il cette question ?","S1 (qui participe, qui décide, quels rôles), S2 (décideurs, services techniques, achats), S4 (« Qui décide ? » chez le partenaire)."],["Les 9 notions à réinvestir (séance 4) ?","Rapport de force, alternatives, information, objectifs, variables, concessions, contreparties, création de valeur, cadre."]],pe=(e,t)=>t.map(([s,n],r)=>({id:`f-${e}-${String(r+1).padStart(2,"0")}`,s:e,q:s,a:n})),R=[...pe("s1",zt),...pe("s2",Bt),...pe("s3",Ht),...pe("s4",Gt),...pe("cas",Vt),...pe("x",Jt)];var _=(e,t)=>[["Vrai",e,t],["Faux",!e,t]],Kt=[{t:"single",q:"Selon le cours, une négociation spécifique est une négociation…",o:[["dont les modalités sont fortement influencées par les caractéristiques du contexte.",!0,"C’est la définition exacte du cours."],["qui porte sur un produit technique ou spécifique.",!1,"Le cours ne définit pas la négociation spécifique par l’objet vendu mais par le contexte."],["qui se déroule toujours avec plusieurs décideurs.",!1,"Le multi-acteurs n’est qu’un des contextes spécifiques possibles."],["dans laquelle le prix n’est pas négociable.",!1,"Rien de tel dans le cours ; le prix peut même devenir déterminant (enchère inversée)."]]},{t:"multi",q:"Quels éléments font partie de la définition de la négociation commerciale donnée en cours ?",o:[["Des intérêts au moins partiellement divergents.",!0,"Oui : sans divergence, il n’y aurait rien à négocier."],["La recherche d’un accord acceptable pour les parties.",!0,"Oui : c’est le résultat recherché."],["Des propositions, contre-propositions, concessions et contreparties.",!0,"Oui : ce sont les moyens mobilisés."],["L’obligation de conclure un accord.",!1,"Non : on recherche un accord, mais aucune partie n’est obligée de conclure (d’où l’importance des alternatives)."]]},{t:"tf",q:"« Le contexte est un simple décor : il ne change pas la façon de négocier. »",o:_(!1,"Le cours affirme l’inverse : « Le contexte n’est pas un simple décor. Il influence la manière dont la négociation est organisée et conduite. »")},{t:"single",q:"Quelle est l’idée centrale du module ?",o:[["Le négociateur doit d’abord analyser la situation.",!0,"C’est la diapositive « Idée centrale du module »."],["Le négociateur doit obtenir le prix le plus élevé possible.",!1,"Le cours insiste au contraire sur le fait que la négociation ne se réduit pas au prix."],["Le négociateur doit toujours faire la première offre.",!1,"Le cours ne pose pas cette règle."],["Le négociateur doit éviter toute concession.",!1,"Les concessions font partie de la négociation, à condition d’obtenir une contrepartie."]]},{t:"single",q:"Les quatre dimensions qui caractérisent un contexte sont…",o:[["le cadre, la temporalité, les acteurs et l’information.",!0,"Ce sont les quatre « premières dimensions à repérer »."],["le prix, le volume, le délai et le service.",!1,"Ce sont des variables négociables, pas des dimensions du contexte."],["l’acheteur, le vendeur, le produit et le marché.",!1,"Ce n’est pas la grille du cours."],["les objectifs, les enjeux, les contraintes et les alternatives.",!1,"Ce sont des questions de la grille d’analyse, pas les quatre dimensions."]]},{t:"single",q:"Dans une négociation fortement encadrée…",o:[["une partie du processus est définie à l’avance (règles, délais, procédures, conditions de réponse).",!0,"C’est la définition du cours."],["les interlocuteurs et les sujets peuvent librement évoluer.",!1,"C’est la négociation relativement libre."],["il n’y a aucune marge de négociation.",!1,"Le cadre réduit la marge de manœuvre, mais ne la supprime pas forcément (ex. variables négociables en appel d’offres si la procédure le permet)."],["une seule personne décide.",!1,"Le cadre ne dit rien du nombre de décideurs (c’est la dimension « acteurs »)."]]},{t:"multi",q:"Quels exemples le cours donne-t-il de négociations fortement encadrées ?",o:[["Appel d’offres",!0,"Exemple cité."],["Référencement",!0,"Exemple cité."],["Procédure d’achat",!0,"Exemple cité."],["Enchère inversée",!0,"Exemple cité."],["Rencontre directe avec le responsable d’une PME",!1,"C’est l’exemple de négociation classique, relativement libre."]]},{t:"single",q:"Quelle séquence correspond à un processus formalisé ?",o:[["Préparation → candidature/réponse → sélection → négociation → décision → contractualisation",!0,"C’est la séquence du cours."],["Prise de contact → échanges → accord → contractualisation",!1,"C’est la négociation ponctuelle."],["Analyser → décider → marges → offre → négociation",!1,"C’est la démarche de réponse à un appel d’offres (séance 2), pas la définition du processus formalisé."],["Préparer l’offre → présenter → analyser → négocier → décider → formaliser → suivre",!1,"C’est le processus de référencement (séance 3)."]]},{t:"tf",q:"Dans un processus formalisé, le négociateur maîtrise toutes les étapes.",o:_(!1,"Le cours précise : « Le négociateur ne maîtrise pas nécessairement toutes les étapes du processus. »")},{t:"single",q:"« Plusieurs vendeurs ↔ 1 acheteur » correspond à…",o:[["une mise en concurrence.",!0,"C’est la troisième configuration d’acteurs du cours."],["un comité d’achat.",!1,"Le comité, c’est 1 vendeur face à plusieurs interlocuteurs côté acheteur."],["une négociation individuelle.",!1,"Individuelle = 1 vendeur ↔ 1 acheteur."],["une négociation sous contrainte.",!1,"Ce n’est pas une configuration d’acteurs."]]},{t:"single",q:"Une information « relativement équilibrée » signifie que…",o:[["les parties disposent d’informations assez proches, sans savoir exactement la même chose.",!0,"Le cours précise que cela ne signifie pas qu’elles savent exactement la même chose."],["les parties savent exactement la même chose.",!1,"C’est précisément ce que le cours exclut."],["aucune partie n’a d’information confidentielle.",!1,"Il peut rester des informations propres à chacun."],["toutes les informations sont publiques.",!1,"Ce n’est pas la définition."]]},{t:"multi",q:"Quels exemples d’information asymétrique le cours donne-t-il ?",o:[["Le budget maximal de l’acheteur.",!0,"Exemple du cours."],["Le coût de revient et la marge minimale du vendeur.",!0,"Exemple du cours."],["Le prix public affiché du produit.",!1,"Un prix affiché est connu des deux parties."],["La date limite d’un appel d’offres publié.",!1,"Elle figure dans le dossier, accessible à tous les candidats."]]},{t:"single",q:"Quel indice permet de reconnaître un appel d’offres ?",o:[["Procédure + cahier des charges + échéance",!0,"Indice exact du cours."],["Référencement + centrale d’achat",!1,"C’est l’indice du référencement."],["Mise en concurrence + mécanisme d’enchère",!1,"C’est l’indice de l’enchère inversée."],["Plusieurs interlocuteurs dans la décision",!1,"C’est l’indice du multi-acteurs."]]},{t:"single",q:"Dans une enchère inversée, que doit faire le négociateur en priorité ?",o:[["Comprendre le mécanisme avant de décider de sa participation.",!0,"C’est ce que demande le cours."],["Proposer immédiatement le prix le plus bas possible.",!1,"Sans analyse du mécanisme (et de son seuil), c’est le risque de vendre à perte."],["Refuser de participer car le prix est la seule variable.",!1,"Le prix peut devenir déterminant, mais le cours ne recommande pas de refuser par principe."],["Demander un rendez-vous individuel à l’acheteur.",!1,"Ce n’est pas ce que le cours met en avant."]]},{t:"multi",q:"Quelles contraintes le cours cite-t-il pour une négociation « sous contraintes » ?",o:[["Délai",!0,"Citée."],["Budget",!0,"Citée."],["Réglementation",!0,"Citée."],["Capacité de production",!0,"Citée."],["Dépendance à un fournisseur",!0,"Citée."],["Couleur du produit",!1,"Non citée, et ce n’est pas une contrainte qui structure la négociation."]]},{t:"single",q:"Dans une négociation multi-acteurs, le responsable financier s’intéresse surtout…",o:[["au budget.",!0,"Exemple du cours : financier → budget."],["à la faisabilité.",!1,"C’est le responsable technique."],["à l’usage.",!1,"C’est l’utilisateur."],["aux conditions commerciales.",!1,"C’est l’acheteur."]]},{t:"single",q:"Question 8 de la grille d’analyse : « Quelles alternatives ? » — que cherche-t-on ?",o:[["Les solutions de repli, la MESORE.",!0,"Formulation exacte du cours."],["Les variables négociables.",!1,"C’est la question 9."],["Les dépendances et le pouvoir de négociation.",!1,"C’est la question 6 (rapport de force)."],["Les informations manquantes.",!1,"C’est la question 4."]]},{t:"single",q:"Question 5 de la grille : « Quels enjeux ? » — que cherche-t-on ?",o:[["Ce que chacun risque de gagner ou de perdre.",!0,"Formulation du cours."],["Les objectifs et intérêts de chacun.",!1,"C’est la question 2 (Pourquoi ?)."],["Le budget et les délais.",!1,"Ce sont des contraintes (question 7)."],["Les parties prenantes.",!1,"C’est la question 1 (Qui ?)."]]},{t:"single",q:"Activité : « Une collectivité publie un dossier précisant ses besoins, les conditions de réponse et une date limite. » Type ?",o:[["Appel d’offres",!0,"Indice : procédure + cahier des charges + échéance."],["Négociation commerciale classique",!1,"Il n’y a pas d’échange direct et libre : tout est cadré par le dossier."],["Comité d’achat",!1,"Rien n’indique ici plusieurs interlocuteurs dans la décision."],["Référencement",!1,"Pas d’enseigne ni de centrale d’achat."]]},{t:"tf",q:"Pour identifier un type de négociation, il suffit de repérer un mot-clé dans l’énoncé.",o:_(!1,"La consigne du cours : « Ne cherchez pas uniquement un mot-clé. Appuyez-vous sur les caractéristiques de la situation. »")},{t:"single",q:"Quelle est la question de départ du négociateur selon le cours ?",o:[["« Dans quel contexte suis-je en train de négocier ? »",!0,"Dernière diapositive « À retenir »."],["« Quel est mon prix plancher ? »",!1,"Important, mais ce n’est pas la question de départ."],["« Qui dépend le plus de l’autre ? »",!1,"C’est la question du rapport de force (séance 3)."],["« Que puis-je concéder ? »",!1,"C’est une question de préparation (séance 3)."]]}],_t=[{t:"single",q:"Un appel d’offres est…",o:[["une procédure par laquelle un acheteur met plusieurs fournisseurs en concurrence afin de satisfaire un besoin défini.",!0,"Définition exacte du cours."],["une simple demande de prix envoyée à plusieurs fournisseurs.",!1,"Le cours insiste : ce n’est pas simplement une demande de prix."],["une négociation libre entre un acheteur et son fournisseur habituel.",!1,"C’est l’inverse : mise en concurrence et cadre défini."],["une vente aux enchères où le prix monte.",!1,"Confusion : dans une enchère inversée, ce sont les prix des fournisseurs qui baissent."]]},{t:"single",q:"Dans quel ordre se déroule la démarche de la séance 2 ?",o:[["Analyser la consultation → décider de répondre → identifier les marges de manœuvre → construire une offre → préparer la négociation éventuelle",!0,"C’est le fil conducteur de toutes les diapositives."],["Construire une offre → analyser la consultation → décider → négocier",!1,"On ne construit pas l’offre avant d’avoir analysé et décidé."],["Décider de répondre → analyser la consultation → négocier → construire une offre",!1,"On analyse avant de décider."],["Préparer la négociation → identifier les marges → analyser → décider",!1,"Ordre inversé."]]},{t:"multi",q:"Quels acteurs peuvent intervenir dans un appel d’offres selon le cours ?",o:[["Les services techniques",!0,"Ils vérifient la qualité et la conformité."],["Les services achats ou financiers",!0,"Ils analysent prix et conditions contractuelles."],["Les décideurs",!0,"Ils choisissent l’offre retenue."],["Les utilisateurs finaux",!0,"Éventuellement : leurs attentes peuvent influencer le choix."],["Les concurrents du candidat, pour noter les offres",!1,"Les entreprises candidates déposent une offre ; elles ne notent pas."]]},{t:"single",q:"Dans l’exemple des ascenseurs, comment est réparti le poids des critères ?",o:[["Prix 50 %, valeur technique 50 %",!0,"Chiffres de l’exemple."],["Prix 40 %, valeur technique 40 %, délais 20 %",!1,"C’est l’exemple de pondération de la diapositive 19, différent de celui des ascenseurs."],["Prix 60 %, valeur technique 40 %",!1,"Non."],["Prix 100 %",!1,"Non."]]},{t:"single",q:"Maintenance d’ascenseurs : quels sont la durée et le montant maximal du marché ?",o:[["48 mois, 240 000 €",!0,"Chiffres de l’exemple."],["36 mois, 240 000 €",!1,"La durée est de 48 mois."],["48 mois, 420 000 €",!1,"Le montant maximal est de 240 000 €."],["24 mois, 120 000 €",!1,"Non."]]},{t:"single",q:"« Go sous conditions » signifie que l’entreprise…",o:[["poursuit l’analyse, mais doit obtenir certaines informations avant de prendre une décision définitive.",!0,"Définition du cours."],["répond, à condition que l’acheteur baisse ses exigences.",!1,"L’entreprise ne peut pas imposer de modifier une exigence obligatoire."],["renonce sauf si un concurrent se retire.",!1,"Non."],["répond avec une offre incomplète.",!1,"Une offre incomplète risque d’être écartée."]]},{t:"multi",q:"Pour vérifier la capacité de l’entreprise, quelles questions le cours pose-t-il ?",o:[["Possède-t-elle les compétences nécessaires ?",!0,"Citée."],["Peut-elle mobiliser suffisamment de personnel ?",!0,"Citée."],["Possède-t-elle les qualifications ou certifications demandées ?",!0,"Citée."],["Peut-elle intervenir dans la zone géographique concernée ?",!0,"Citée."],["Le prix pèse-t-il plus de 50 % dans la note ?",!1,"C’est un élément des chances de réussite (poids du prix), pas de la capacité."]]},{t:"tf",q:"Si le chiffre d’affaires attendu est élevé, le marché est forcément intéressant.",o:_(!1,"« Le chiffre d’affaires attendu ne suffit pas » : il faut estimer coûts, pénalités, trésorerie et marge ; une offre remportée peut être déficitaire.")},{t:"multi",q:"Quels coûts l’entreprise doit-elle estimer pour vérifier la rentabilité ?",o:[["Coûts de préparation de la réponse",!0,"Cités."],["Coûts de sous-traitance",!0,"Cités."],["Éventuelles pénalités",!0,"Citées."],["Besoins de trésorerie",!0,"Cités."],["Le salaire du négociateur de l’acheteur",!1,"Non pertinent."]]},{t:"single",q:"Selon le tableau Go/No-Go des ascenseurs, une entreprise à qui il manque certaines compétences peut…",o:[["renoncer ou rechercher un partenaire.",!0,"Conséquence indiquée dans le tableau."],["répondre quand même et apprendre en cours de marché.",!1,"Risque de non-exécution : « intéressée sans être capable d’exécuter »."],["négocier la suppression de l’exigence.",!1,"On ne négocie pas une exigence obligatoire."],["baisser son prix pour compenser.",!1,"Un prix bas ne compense pas une incapacité technique."]]},{t:"single",q:"Pourquoi une entreprise peut-elle accepter une rentabilité modérée ?",o:[["Si l’intérêt stratégique du marché est réel (développement, références).",!0,"Ligne « Potentiel commercial » du tableau."],["Si elle n’a pas calculé ses coûts.",!1,"Au contraire : il faut toujours chiffrer."],["Si le prix compte pour 50 % de la note.",!1,"Ce n’est pas la justification donnée."],["Jamais : la marge doit toujours être maximale.",!1,"Le cours admet une rentabilité modérée en cas d’intérêt stratégique."]]},{t:"single",q:"À quelle étape l’entreprise commence-t-elle réellement à préparer la négociation ?",o:[["Identifier les marges de manœuvre",!0,"« C’est à cette étape que l’entreprise commence réellement à préparer la négociation. »"],["Analyser la consultation",!1,"C’est l’étape de compréhension du dossier."],["Construire une offre",!1,"Elle vient après l’identification des marges."],["Décider de répondre",!1,"C’est le Go/No-Go."]]},{t:"single",q:"Un délai d’intervention maximal imposé par le dossier est…",o:[["une exigence obligatoire.",!0,"Le cours cite « un délai maximal » parmi les exigences."],["un élément différenciant.",!1,"Proposer mieux que le maximum peut l’être, mais le maximum lui-même est obligatoire."],["une variable négociable.",!1,"Une exigence obligatoire ne se présente pas comme négociable."],["un critère facultatif.",!1,"Non."]]},{t:"tf",q:"Une offre très bon marché qui ne respecte pas une exigence essentielle sera tout de même retenue grâce à son prix.",o:_(!1,"Elle « peut être écartée, même si elle présente un prix intéressant ».")},{t:"single",q:"Prix 40 %, valeur technique 40 %, délais 20 %. Quelle stratégie le cours suggère-t-il ?",o:[["Ne pas nécessairement chercher à être le moins cher, et améliorer sa note par l’organisation, les délais, la méthode, l’assistance ou le suivi.",!0,"C’est la conclusion de la diapositive 19."],["Être absolument le moins cher.",!1,"Le prix ne pèse que 40 %."],["Ignorer le prix.",!1,"Il pèse tout de même 40 %."],["Négocier la pondération avec l’acheteur.",!1,"Les critères sont fixés par la consultation."]]},{t:"single",q:"Quelle condition doit remplir un élément différenciant ?",o:[["Répondre à un besoin réel de l’acheteur.",!0,"« Une innovation inutile ne constitue pas nécessairement un avantage commercial. »"],["Être une innovation technologique.",!1,"L’innovation n’est pas un avantage en soi."],["Être gratuit.",!1,"Ce n’est pas une condition du cours."],["Figurer dans les exigences obligatoires.",!1,"Une exigence est obligatoire pour tous : elle ne différencie pas."]]},{t:"multi",q:"Quelles variables peuvent éventuellement être négociées dans un appel d’offres (si la procédure le permet) ?",o:[["Le périmètre de la prestation",!0,"Cité."],["Les conditions de paiement",!0,"Citées."],["Les modalités d’exécution",!0,"Citées."],["Le niveau de service",!0,"Cité."],["Les exigences obligatoires du dossier",!1,"Jamais : elles ne sont pas négociables."]]},{t:"tf",q:"Tous les appels d’offres permettent une phase de négociation.",o:_(!1,"« Tous les appels d’offres ne permettent pas de négocier. Dans certains cas, l’entreprise doit remettre dès le départ une offre complète et définitive. »")},{t:"single",q:"Pourquoi la conformité est-elle le « socle » de l’offre ?",o:[["Parce qu’une non-conformité ne peut pas être compensée par un argument commercial.",!0,"Formulation du cours."],["Parce qu’elle permet d’augmenter le prix.",!1,"Non."],["Parce qu’elle remplace le mémoire technique.",!1,"Non."],["Parce qu’elle est le seul critère noté.",!1,"Les critères notés sont le prix, la valeur technique, etc."]]},{t:"multi",q:"Avant de proposer un prix, l’entreprise doit connaître (diapositive) :",o:[["son coût de revient",!0,"Cité."],["sa marge minimale",!0,"Citée."],["son prix cible",!0,"Cité."],["le prix maximal acceptable pour l’acheteur",!0,"Cité."],["les coûts liés aux éventuelles concessions",!0,"Cités."],["le salaire moyen des concurrents",!1,"Non cité."]]},{t:"single",q:"Les trois niveaux d’objectifs à définir avant de négocier sont…",o:[["l’objectif idéal, la cible réaliste, le seuil minimal acceptable.",!0,"Diapositive 27."],["le prix public, le prix remisé, le prix de revient.",!1,"Non."],["Go, No-Go, Go sous conditions.",!1,"Ce sont les décisions de réponse."],["court, moyen et long terme.",!1,"Non."]]},{t:"single",q:"Quel argument correspond le mieux à la recommandation du cours ?",o:[["« Notre astreinte 24 h/24 garantit qu’un ascenseur en panne le week-end est remis en service rapidement, ce qui évite la gêne des usagers. »",!0,"Il relie une caractéristique à un bénéfice pour l’acheteur."],["« Nous sommes leaders depuis 30 ans. »",!1,"C’est une caractéristique de l’entreprise sans bénéfice explicite."],["« Nos techniciens sont très compétents. »",!1,"Affirmation générale sans bénéfice concret."],["« Notre prix est le plus bas du marché. »",!1,"Le cours recommande de ne pas tout ramener au prix."]]},{t:"single",q:"Pourquoi préparer des questions à poser à l’acheteur ?",o:[["Pour comprendre ses priorités et négocier sur les véritables enjeux plutôt que de réduire immédiatement le prix.",!0,"Diapositive 28."],["Pour gagner du temps.",!1,"Non."],["Pour connaître le prix des concurrents.",!1,"Ce n’est pas l’objectif affiché."],["Pour éviter de présenter son offre.",!1,"Non."]]}],Wt=[{t:"single",q:"Le référencement est…",o:[["la décision d’intégrer un fournisseur et/ou ses produits dans l’offre.",!0,"Définition du cours."],["la présence concrète du produit dans les magasins.",!1,"C’est l’implantation."],["l’ensemble des références effectivement proposées.",!1,"C’est l’assortiment."],["une opération promotionnelle en magasin.",!1,"C’est du trade marketing."]]},{t:"single",q:"La présence concrète d’un produit dans les magasins s’appelle…",o:[["l’implantation.",!0,"Définition du cours."],["le référencement.",!1,"Le référencement est la décision d’intégrer."],["l’assortiment.",!1,"L’assortiment désigne les références proposées."],["le trade marketing.",!1,"Non."]]},{t:"single",q:"Quelle est la question centrale du référencement ?",o:[["Le produit répond-il aux besoins des clients de l’enseigne ?",!0,"Diapositive 2."],["Quel est le prix le plus bas possible ?",!1,"Le prix n’est qu’une variable."],["Le fournisseur est-il une grande marque ?",!1,"Non."],["Combien de magasins compte l’enseigne ?",!1,"Non."]]},{t:"tf",q:"Le distributeur est automatiquement en position de force parce qu’il contrôle l’accès à son réseau.",o:_(!1,"Il contrôle l’accès au réseau mais « n’est pas automatiquement en position de force » : tout dépend de la dépendance, des alternatives et de l’attractivité de l’offre.")},{t:"single",q:"Fournisseur A : 40 % de son chiffre d’affaires avec l’enseigne et quasiment aucune autre distribution. Sa position est…",o:[["fragile, car il est fortement dépendant.",!0,"Conclusion du cours."],["solide, car il pèse lourd chez l’enseigne.",!1,"Le cours raisonne sur la dépendance du fournisseur, pas sur son poids chez l’enseigne."],["équilibrée.",!1,"Non : forte dépendance."],["impossible à évaluer.",!1,"Le cours conclut clairement."]]},{t:"single",q:"Qu’est-ce qui rend la position du fournisseur B solide ?",o:[["Il a des alternatives crédibles : l’enseigne ne pèse que 10 % de son activité et il travaille avec plusieurs distributeurs.",!0,"Exemple du cours."],["Il propose le prix le plus bas.",!1,"Le prix n’est pas évoqué dans l’exemple."],["Il est plus gros que l’enseigne.",!1,"Non."],["Il a signé une convention.",!1,"Non."]]},{t:"multi",q:"Quelles sont les alternatives du distributeur citées en cours ?",o:[["D’autres fournisseurs",!0,"Cité."],["Des produits substituables",!0,"Cité."],["D’autres enseignes",!1,"Ce sont les alternatives du fournisseur."],["D’autres circuits de distribution",!1,"Alternative du fournisseur."]]},{t:"single",q:"La BATNA est…",o:[["la solution de repli en cas d’absence d’accord.",!0,"Définition du cours."],["le meilleur prix obtenu pendant la négociation.",!1,"Non."],["l’objectif idéal du négociateur.",!1,"Non."],["un type de remise commerciale.",!1,"Non."]]},{t:"tf",q:"Plus une alternative est crédible, plus la partie dépend de son interlocuteur.",o:_(!1,"C’est l’inverse : « Plus une alternative est crédible, moins la partie dépend de son interlocuteur. »")},{t:"multi",q:"Que peut-on négocier dans un référencement ?",o:[["L’assortiment",!0,"Cité."],["Les volumes",!0,"Cités."],["La logistique",!0,"Citée."],["Le trade marketing",!0,"Cité."],["La promotion",!0,"Citée."]],x:"Le référencement ne se réduit pas au prix : toutes ces variables figurent dans le cours."},{t:"single",q:"« Si vous vous engagez sur tel volume, je peux envisager telle condition. » Ce principe signifie que…",o:[["la concession tarifaire devient une variable d’échange, liée à une contrepartie.",!0,"Formulation du cours."],["le fournisseur doit toujours baisser son prix.",!1,"Non : la baisse est conditionnée."],["les volumes ne sont pas négociables.",!1,"Ils le sont."],["l’enseigne fixe seule le prix.",!1,"Non."]]},{t:"single",q:"Le trade marketing vise à…",o:[["développer les ventes avec le distributeur en tenant compte du circuit.",!0,"Définition du cours."],["négocier le prix d’achat le plus bas.",!1,"Non."],["remplacer le référencement.",!1,"Il le prolonge : transformer le référencement en développement commercial."],["gérer la logistique des entrepôts.",!1,"Non."]]},{t:"single",q:"Quelle est la sixième étape du processus de référencement ?",o:[["Formaliser (convention)",!0,"Préparer → présenter → analyser → négocier → décider → formaliser → suivre."],["Négocier les conditions",!1,"C’est la quatrième."],["Suivre l’accord",!1,"C’est la septième."],["Décider du référencement",!1,"C’est la cinquième."]]},{t:"multi",q:"Selon le cours, un accord doit être…",o:[["acceptable",!0,"Cité."],["économiquement viable",!0,"Cité."],["réalisable",!0,"Cité."],["exclusif",!1,"Non cité."]]},{t:"single",q:"Quelle est la logique du distributeur ?",o:[["Optimiser l’offre proposée à ses clients.",!0,"Tableau « deux parties, deux logiques »."],["Maximiser le développement de son offre.",!1,"C’est la logique du fournisseur."],["Référencer un maximum de produits.",!1,"Il sélectionne les plus pertinents et maîtrise l’espace."],["Acheter au prix le plus bas quel que soit le produit.",!1,"Non."]]},{t:"single",q:"Exemple des jus (3 références partout vs 1 référence en test). Quel espace de négociation le cours propose-t-il ?",o:[["Un référencement progressif, avec élargissement éventuel selon les résultats.",!0,"Formulation du cours."],["Les 3 références dans tous les magasins à prix réduit.",!1,"Non."],["Le refus du référencement.",!1,"Non."],["Une seule référence, définitivement.",!1,"Non : élargissement possible."]]},{t:"single",q:"Quelle question centrale le cours pose-t-il pour préparer la négociation de référencement ?",o:[["« Que puis-je concéder, dans quelles limites, et contre quoi ? »",!0,"Diapositive 14."],["« Combien puis-je baisser mon prix ? »",!1,"Trop réducteur."],["« Qui a raison ? »",!1,"Non."],["« Comment éviter toute concession ? »",!1,"Non."]]},{t:"single",q:"10 € → 9 € demandés. Quel raisonnement le cours recommande-t-il ?",o:[["Mesurer ce que rapporte la concession (volumes, référencement, développement des ventes) et raisonner sur l’économie globale.",!0,"Diapositive 15."],["Refuser toute baisse.",!1,"Le cours n’exclut pas la concession ; il demande de la mesurer."],["Accepter pour conserver la relation.",!1,"Sans contrepartie, c’est une baisse gratuite."],["Proposer 9,50 € pour couper la poire en deux.",!1,"Ce n’est pas le raisonnement du cours."]]}],Xt=[{t:"single",q:"Quelles sont les deux relations fondamentales de l’agent sportif ?",o:[["Agent ↔ sportif (obtenir et sécuriser le mandat) et agent ↔ club / sponsor / partenaire (défendre les intérêts du sportif).",!0,"Diapositive 3."],["Agent ↔ fédération et agent ↔ médias.",!1,"Non."],["Agent ↔ club et club ↔ sponsor.",!1,"Non."],["Sportif ↔ club et sportif ↔ sponsor, sans agent.",!1,"Non."]]},{t:"single",q:"Dans le transfert de Ronaldo au Real Madrid (2009), qu’est-ce qui opposait les parties ?",o:[["Le partage des revenus liés aux droits à l’image.",!0,"Jorge Mendes voulait une part plus favorable ; le Real voulait garder son modèle."],["Le montant du transfert uniquement.",!1,"Le cours insiste : la négociation ne portait pas uniquement sur le montant."],["La durée du mandat de l’agent.",!1,"Non."],["Le choix du club.",!1,"Les deux parties voulaient conclure."]]},{t:"tf",q:"La relation entre l’agent et le sportif est elle-même une négociation.",o:_(!0,"Diapositive 5 : le mandat définit les conditions de la mission ; ce n’est pas une formalité.")},{t:"multi",q:"Que faut-il clarifier dans le mandat ?",o:[["Ce que l’agent apporte",!0,"Cité."],["La durée de la relation",!0,"Cité."],["L’exclusivité éventuelle",!0,"Cité."],["La rémunération",!0,"Cité."],["Le salaire que le sportif obtiendra à coup sûr",!1,"L’agent ne peut pas garantir un résultat."]]},{t:"single",q:"Que dit le cours de la confiance entre agent et sportif ?",o:[["C’est une ressource de la négociation, mais les engagements doivent être clairement définis.",!0,"Diapositive 7."],["Elle dispense de contrat écrit.",!1,"Au contraire."],["Elle n’a aucune importance.",!1,"Elle conditionne la qualité des négociations extérieures."],["Elle remplace la rémunération.",!1,"Non."]]},{t:"multi",q:"Pour évaluer le rapport de force, l’agent doit identifier…",o:[["les alternatives de son client",!0,"Cité."],["les alternatives de l’autre partie",!0,"Cité."],["la rareté du profil du sportif",!0,"Cité."],["l’information dont dispose chaque acteur",!0,"Cité."],["la popularité de l’agent sur les réseaux sociaux",!1,"Non cité."]]},{t:"single",q:"Pourquoi une offre financièrement supérieure n’est-elle pas forcément la meilleure ?",o:[["Elle peut offrir moins de potentiel de développement ou imposer davantage de contraintes.",!0,"Distinction prix / valeur."],["Parce que l’agent touche moins.",!1,"Raisonnement contraire à l’intérêt du mandant."],["Parce que la loi l’interdit.",!1,"Non."],["Elle l’est toujours.",!1,"Non."]]},{t:"single",q:"Dans la négociation Jordan / Nike (1984), comment David Falk a-t-il amélioré la proposition de Nike ?",o:[["En utilisant l’alternative existante : la proposition d’Adidas.",!0,"Exemple du cours."],["En menaçant de faire arrêter Jordan.",!1,"Non."],["En baissant la commission de l’agent.",!1,"Non."],["En acceptant la première offre.",!1,"Non."]]},{t:"single",q:"Que contenait le contrat final Jordan / Nike ?",o:[["Rémunération, ligne de produits et participation aux revenus.",!0,"Exemple du cours."],["Uniquement une rémunération fixe.",!1,"Non."],["Une participation au capital de Nike.",!1,"C’est l’exemple de Serena Williams (Mission Skincare)."],["Une exclusivité de 10 ans sans rémunération.",!1,"Non."]]},{t:"multi",q:"Avec un club, l’agent peut négocier…",o:[["la durée du contrat",!0,"Cité."],["les primes et objectifs",!0,"Cités."],["les conditions d’évolution",!0,"Citées."],["la place dans le projet sportif",!0,"Citée."]]},{t:"single",q:"Complète : « L’agent ne défend pas seulement une demande : il défend… »",o:[["les intérêts globaux de son client.",!0,"Diapositive 11."],["sa propre rémunération.",!1,"Non."],["les intérêts du club.",!1,"Non."],["le prix le plus élevé.",!1,"Non."]]},{t:"single",q:"Les deux questions de la proposition de valeur dans une négociation avec une marque sont…",o:[["Qu’apporte le sportif à la marque ? Qu’apporte la marque au sportif ?",!0,"Diapositive 13."],["Combien paie la marque ? Combien touche l’agent ?",!1,"Réducteur."],["Qui décide ? Quand signe-t-on ?",!1,"Non."],["Quel est le prix ? Quelle est la remise ?",!1,"Non."]]},{t:"single",q:"Qu’illustre l’accord Serena Williams / Mission Skincare (2009) ?",o:[["Un partenariat qui va au-delà de la visibilité : ambassadrice, partenaire au capital, développement de produits, royalties.",!0,"Exemple du cours."],["Un transfert entre deux clubs.",!1,"Non."],["Une enchère inversée.",!1,"Non."],["Un refus de mandat.",!1,"Non."]]},{t:"single",q:"Selon le cours, une bonne négociation avec une marque consiste surtout à…",o:[["élargir la valeur créée par le partenariat.",!0,"« … pas toujours à augmenter le montant payé. »"],["augmenter le montant payé.",!1,"Pas toujours."],["obtenir l’exclusivité totale.",!1,"Non."],["réduire la durée.",!1,"Non."]]},{t:"single",q:"Quelle formulation de concession correspond au cours ?",o:[["« Nous pouvons envisager cela si vous nous accordez telle contrepartie. »",!0,"Formulation recommandée (diapositive 17)."],["« Nous pouvons vous accorder cela. »",!1,"C’est la formulation à éviter."],["« C’est à prendre ou à laisser. »",!1,"Non."],["« Faites-nous une proposition. »",!1,"Non."]]},{t:"single",q:"Quelle question distingue la négociation par représentation d’une négociation menée pour soi-même ?",o:[["« Cette concession est-elle réellement dans l’intérêt de mon client ? »",!0,"Diapositive 17."],["« Quel est mon prix plancher ? »",!1,"Non."],["« Qui dépend le plus de l’autre ? »",!1,"Question du rapport de force (séance 3)."],["« Dans quel contexte suis-je ? »",!1,"Question de départ (séance 1)."]]},{t:"single",q:"Dans quel ordre le cours présente-t-il l’évolution possible du rôle de l’agent ?",o:[["Intermédiaire → représentant → conseiller → développeur d’opportunités",!0,"Diapositive 19."],["Conseiller → intermédiaire → représentant → développeur",!1,"Non."],["Représentant → intermédiaire → développeur → conseiller",!1,"Non."],["Développeur → conseiller → représentant → intermédiaire",!1,"Ordre inversé."]]},{t:"single",q:"Selon le support de cours, la durée d’un contrat d’agent sportif ne peut excéder…",o:[["3 ans",!0,"Chiffre du support (diapositive 20)."],["2 ans",!1,"Non."],["5 ans",!1,"Non."],["la durée du contrat du joueur",!1,"Non."]]},{t:"single",q:"Selon le support, la rémunération de l’agent ne peut excéder…",o:[["10 % du contrat ou de l’accord conclu par les parties qu’il a mises en relation (plafond inférieur possible fixé par les fédérations délégataires).",!0,"Chiffre du support."],["15 % du contrat.",!1,"Non."],["5 % du contrat, sans exception.",!1,"Non."],["librement fixée par les parties.",!1,"Non : la réponse du support est « Non », la rémunération est encadrée."]]},{t:"single",q:"Qu’illustre l’exemple Federer / Godsick (Team8, Laver Cup) ?",o:[["L’agent qui crée de nouvelles opportunités, au-delà de la négociation de contrats existants.",!0,"Diapositives 18–19."],["Un conflit sur les droits à l’image.",!1,"C’est Ronaldo."],["L’utilisation d’une offre concurrente.",!1,"C’est Jordan."],["Une relation de confiance née à l’IMG Academy.",!1,"C’est Sharapova."]]}],Yt=[{t:"single",q:"Cas MarketOne / TempoRun : quelle est la commission par commande ?",o:[["7,50 €",!0,"15 % × 50 € HT."],["9,00 €",!1,"Ce serait 15 % du prix TTC (60 €) : la commission se calcule sur le HT."],["6,00 €",!1,"C’est la commission RunSphere (12 %)."],["4,50 €",!1,"C’est la logistique MarketOne."]]},{t:"single",q:"Contribution par commande avec la logistique MarketOne ?",o:[["15,50 €",!0,"50 − 7,50 − 21 − 1,50 − 4,50."],["14,20 €",!1,"C’est si TempoRun expédie (5,80 €)."],["16,30 €",!1,"C’est RunSphere."],["20,00 €",!1,"Oubli de l’emballage et de la logistique."]]},{t:"tf",q:"La contribution de 15,50 € par commande est le bénéfice net de TempoRun.",o:_(!1,"Le dossier le précise : les contributions ne sont pas des bénéfices nets (abonnement, publicité, retours, personnel, frais généraux non déduits).")},{t:"single",q:"Une unité fabriquée en production accélérée, vendue avec la logistique MarketOne, dégage…",o:[["13,00 €, sous le seuil de 14 € exigé par la direction.",!0,"15,50 − 2,50 = 13,00 €."],["15,50 €, la production accélérée ne change rien.",!1,"Elle coûte 2,50 € de plus par unité."],["18,00 €.",!1,"Le surcoût se retranche."],["14,20 €.",!1,"Confusion avec l’expédition par TempoRun."]]},{t:"single",q:"La prévision de 120 commandes par mois est…",o:[["une estimation commerciale dont la méthode n’a pas été communiquée.",!0,"À clarifier ; à ne pas transformer en garantie."],["un engagement contractuel de MarketOne.",!1,"Le dossier précise qu’aucune vente n’est garantie."],["un chiffre issu des ventes passées de TempoRun.",!1,"TempoRun vend 65 unités/mois sur son site."],["un minimum que TempoRun doit livrer.",!1,"Non."]]},{t:"multi",q:"Quels éléments sont présentés comme discutables (sous réserve de validation) ?",o:[["Un test de lancement de trois mois",!0,"Cité."],["L’accompagnement technique",!0,"Cité."],["Le calendrier de lancement",!0,"Cité."],["Le suivi de performance",!0,"Cité."],["Le taux de commission",!1,"Non négociable individuellement."],["Le tarif de la publicité sponsorisée",!1,"Non négociable individuellement."]]},{t:"single",q:"La publicité sponsorisée de MarketOne (350 € HT/mois) est-elle compatible avec les consignes internes de TempoRun ?",o:[["Non : budget maximal de 200 € HT/mois et pas d’engagement payant avant d’avoir mesuré un test.",!0,"Annexe TempoRun. La publicité étant optionnelle, TempoRun peut la refuser pendant le test."],["Oui, si MarketOne accorde une remise.",!1,"Les tarifs standards ne sont pas négociables individuellement."],["Oui, car elle garantit la visibilité.",!1,"Elle est « sans garantie de résultat »."],["Oui, elle est obligatoire.",!1,"Elle est optionnelle."]]},{t:"single",q:"Quelle est la solution de repli (BATNA) de TempoRun ?",o:[["La proposition indicative de RunSphere (non acceptée, volume non garanti).",!0,"Annexe confidentielle, partie 4."],["Une baisse de la commission MarketOne.",!1,"Ce n’est pas une alternative, et ce n’est pas négociable."],["Augmenter le prix public.",!1,"Non."],["Aucune.",!1,"Elle en a une : RunSphere (et son propre site)."]]}],Zt=[{t:"single",q:"Quel principe traverse les séances 2, 3 et 4 ?",o:[["Une concession doit être liée à une contrepartie.",!0,"S2 : pas de concession sans contrepartie ; S3 : contre quoi ? ; S4 : si vous nous accordez…"],["Le moins cher gagne toujours.",!1,"Contredit par la séance 2 (pondération) et la séance 4 (prix ≠ valeur)."],["Le distributeur décide seul.",!1,"Non."],["L’information est toujours équilibrée.",!1,"Non."]]},{t:"single",q:"MESORE (séance 1) et BATNA (séance 3) désignent…",o:[["la même idée : la solution de repli si aucun accord n’est trouvé.",!0,"Les deux sigles renvoient à la meilleure solution de rechange."],["deux types d’appel d’offres.",!1,"Non."],["le prix plancher et le prix plafond.",!1,"Non."],["deux étapes du processus de référencement.",!1,"Non."]]}],me=(e,t)=>t.map((s,n)=>({id:`q-${e}-${String(n+1).padStart(2,"0")}`,s:e,...s})),N=[...me("s1",Kt),...me("s2",_t),...me("s3",Wt),...me("s4",Xt),...me("cas",Yt),...me("x",Zt)];var en=[{s:"s1",type:"factuelle",q:"Définissez la négociation commerciale, puis la négociation spécifique.",keys:["Plusieurs parties aux intérêts au moins partiellement divergents","Recherche d’un accord / échanges sur les conditions de l’accord","Propositions, contre-propositions, concessions et contreparties","Accord acceptable pour les parties","Négociation spécifique : modalités fortement influencées par les caractéristiques du contexte"],model:"<p>Une <strong>négociation commerciale</strong> réunit plusieurs parties dont les intérêts sont au moins partiellement divergents et qui recherchent un accord. Les parties échangent sur les conditions de cet accord en mobilisant des propositions, des contre-propositions, des concessions et des contreparties. Le résultat recherché est un accord acceptable pour chacune d’elles.</p><p>Une <strong>négociation spécifique</strong> est une négociation dont les modalités sont fortement influencées par les caractéristiques du contexte dans lequel elle se déroule : le contexte n’est pas un simple décor, il influence la manière dont la négociation est organisée et conduite. C’est pourquoi le négociateur doit d’abord analyser la situation.</p>",pitfalls:["Définir la négociation spécifique comme une négociation « difficile » ou « dans un secteur particulier ».","Oublier que les intérêts ne sont que partiellement divergents (il existe aussi un intérêt commun à conclure)."]},{s:"s1",type:"factuelle",q:"Présentez les quatre dimensions qui permettent de caractériser le contexte d’une négociation.",keys:["Cadre : relativement libre ↔ fortement encadré (règles, délais, procédures)","Temporalité : ponctuelle ↔ processus formalisé (étapes, on ne les maîtrise pas toutes)","Acteurs : individuelle ↔ multi-acteurs (qui participe, qui décide, rôles)","Information : relativement équilibrée ↔ asymétrique (« Qui sait quoi ? »)","Un exemple pour au moins une dimension"],model:"<ul><li><strong>Le cadre</strong> : une négociation peut être relativement libre (interlocuteurs, rythme, sujets et propositions peuvent évoluer) ou fortement encadrée (une partie du processus est définie à l’avance : règles, délais, procédures ou conditions de réponse, comme dans un appel d’offres ou une enchère inversée).</li><li><strong>La temporalité</strong> : négociation ponctuelle (prise de contact → échanges → accord → contractualisation) ou processus formalisé en plusieurs étapes (préparation → candidature/réponse → sélection → négociation → décision → contractualisation), dont le négociateur ne maîtrise pas toutes les étapes.</li><li><strong>Les acteurs</strong> : négociation individuelle (un vendeur, un acheteur) ou multi-acteurs (un vendeur face à un comité d’achat), voire mise en concurrence de plusieurs vendeurs. Il faut identifier qui participe, qui influence et qui décide.</li><li><strong>L’information</strong> : relativement équilibrée (informations proches, sans être identiques) ou asymétrique (une partie détient une information importante que l’autre n’a pas, comme le budget maximal de l’acheteur ou le coût de revient du vendeur). Question clé : « Qui sait quoi ? »</li></ul>",pitfalls:["Confondre les dimensions avec les variables négociables (prix, volume…).","Présenter les pôles comme des cases exclusives : une situation se situe plus ou moins près de chaque pôle."]},{s:"s1",type:"factuelle",q:"Citez les cinq contextes spécifiques étudiés et l’indice qui permet de reconnaître chacun.",keys:["Appel d’offres : procédure + cahier des charges + échéance","Multi-acteurs : plusieurs interlocuteurs impliqués dans la décision","Référencement : référencement + acheteur/centrale + conditions imposées ou discutées","Enchère inversée : mise en concurrence + mécanisme d’enchère","Sous contraintes : une contrainte forte pèse directement sur la négociation"],model:"<table><thead><tr><th>Contexte</th><th>Indice</th></tr></thead><tbody><tr><td>Appel d’offres</td><td>Procédure + cahier des charges + échéance</td></tr><tr><td>Négociation multi-acteurs</td><td>Plusieurs interlocuteurs impliqués dans la décision</td></tr><tr><td>Grande distribution / référencement</td><td>Référencement + acheteur/centrale + conditions imposées ou discutées</td></tr><tr><td>Enchère inversée</td><td>Mise en concurrence + mécanisme d’enchère</td></tr><tr><td>Sous contraintes</td><td>Une contrainte forte (délai, budget, urgence, réglementation, capacité…) qui pèse directement sur la négociation</td></tr></tbody></table><p>Le cours précise qu’il ne faut pas se contenter d’un mot-clé : l’identification repose sur les caractéristiques de la situation.</p>",pitfalls:["Citer « l’agent sportif » parmi les cinq contextes de la séance 1 (c’est l’objet de la séance 4).","Donner le nom du contexte sans l’indice."]},{s:"s1",type:"factuelle",q:"Citez les neuf questions de la grille d’analyse et ce que chacune permet de chercher.",keys:["Qui ? (parties prenantes, décideurs, influenceurs) et Pourquoi ? (objectifs et intérêts)","Avec quelles règles ? (cadre, procédure) et Avec quelles informations ? (disponibles/manquantes)","Quels enjeux ? (gagner/perdre) et Quel rapport de force ? (dépendances, pouvoir)","Quelles contraintes ? (budget, délai, réglementation)","Quelles alternatives ? (solutions de repli, MESORE) et Quelles variables négociables ? (prix, volume, délai, service, exclusivité)"],model:"<ol><li><strong>Qui ?</strong> — parties prenantes, décideurs, influenceurs.</li><li><strong>Pourquoi ?</strong> — objectifs et intérêts de chacun.</li><li><strong>Avec quelles règles ?</strong> — cadre et procédure.</li><li><strong>Avec quelles informations ?</strong> — informations disponibles / manquantes.</li><li><strong>Quels enjeux ?</strong> — ce que chacun risque de gagner ou perdre.</li><li><strong>Quel rapport de force ?</strong> — dépendances, pouvoir de négociation.</li><li><strong>Quelles contraintes ?</strong> — budget, délai, réglementation…</li><li><strong>Quelles alternatives ?</strong> — solutions de repli, MESORE.</li><li><strong>Quelles variables négociables ?</strong> — prix, volume, délai, service, exclusivité…</li></ol>",pitfalls:["Oublier « Quels enjeux ? » ou « Quelles contraintes ? ».","Appliquer la grille à une seule partie."]},{s:"s1",type:"ouverte",q:"Pourquoi le cours affirme-t-il que « le contexte n’est pas un simple décor » ? Illustrez avec deux situations.",keys:["Le contexte influence l’organisation et la conduite de la négociation","Il détermine les règles, le déroulement, les acteurs et l’information","Exemple 1 contrasté (ex. échange libre avec une PME)","Exemple 2 contrasté (ex. appel d’offres : procédure, critères, échéance)","Conséquence : analyser la situation avant de choisir sa manière de négocier"],model:"<p>Le contexte n’est pas un simple décor car il <strong>modifie la manière même de négocier</strong> : il fixe les règles du jeu, le déroulement dans le temps, le nombre d’interlocuteurs et la répartition de l’information.</p><p>Comparons deux situations du cours. Lorsqu’un commercial rencontre directement le responsable d’une PME pour discuter du prix, des quantités et du délai, la négociation est relativement libre : les sujets, le rythme et les propositions peuvent évoluer au fil de l’échange. À l’inverse, lorsqu’une collectivité publie un dossier précisant ses besoins, les conditions de réponse et une date limite, le cadre est fortement encadré : le vendeur doit répondre à un cahier des charges, respecter une procédure et une échéance, et ne peut pas forcément discuter librement.</p><p>Dans le premier cas, le commercial peut construire l’accord par échanges successifs ; dans le second, sa marge de manœuvre dépend d’abord de ce que la procédure autorise. C’est pourquoi l’idée centrale du module est que le négociateur doit <strong>d’abord analyser la situation</strong> avant de choisir sa manière de négocier.</p>",pitfalls:["Répondre par une définition sans illustration.","Choisir deux exemples trop proches qui ne montrent pas l’effet du contexte."]},{s:"s1",type:"ouverte",q:"Expliquez la notion d’information asymétrique et montrez comment le négociateur peut l’exploiter dans sa préparation.",keys:["Définition : une partie détient une information importante à laquelle l’autre n’a pas accès","Exemples : budget maximal de l’acheteur ; coût de revient et marge minimale du vendeur","Question clé « Qui sait quoi ? »","Préparation : repérer ses informations manquantes et préparer des questions","Protéger ses propres informations sensibles sans déformer les faits"],model:"<p>L’information est <strong>asymétrique</strong> lorsqu’une partie possède des informations importantes auxquelles l’autre n’a pas accès : l’acheteur connaît son budget maximal, le vendeur connaît son coût de revient et sa marge minimale. Elle s’oppose à une information relativement équilibrée, où les parties ont des informations proches (sans savoir exactement la même chose).</p><p>Pour le négociateur, la question clé est « <strong>Qui sait quoi ?</strong> ». Dans sa préparation, il doit : identifier ce qu’il ignore et qui pèse sur sa décision (c’est la question 4 de la grille : informations disponibles / manquantes) ; préparer des questions pour réduire cette incertitude (comprendre les priorités, le budget, les critères réels) ; repérer, à l’inverse, les informations qu’il détient et qu’il n’a pas intérêt à révéler automatiquement (son seuil minimal, par exemple).</p><p>Le cas MarketOne / TempoRun l’illustre : TempoRun connaît ses coûts et son seuil de 14 € par commande, MarketOne connaît la méthode de sa prévision de 120 commandes. TempoRun doit questionner MarketOne sur cette méthode, sans révéler automatiquement ses informations internes — mais sans déformer les faits ni cacher une contrainte directement pertinente.</p>",pitfalls:["Confondre information asymétrique et mensonge.","Oublier que l’asymétrie joue dans les deux sens."]},{s:"s1",type:"ouverte",q:"Un client doit remplacer en 48 heures une machine en panne qui bloque sa production. Analysez le contexte de cette négociation et indiquez comment il influence les marges de manœuvre de chaque partie.",keys:["Identifier une négociation sous contrainte (délai / urgence)","Indice : contrainte forte qui pèse directement sur la négociation","Effet pour le client : marge réduite, alternatives limitées par le délai","Effet pour le fournisseur : position renforcée s’il est disponible, mais capacité à vérifier","Préciser la contrainte et ses effets ; ne pas négliger la relation / l’exécution"],model:"<p><strong>Analyse du contexte.</strong> Il s’agit d’une <strong>négociation sous contrainte</strong> : une contrainte particulièrement forte — le délai de 48 heures et l’urgence liée à l’arrêt de production — pèse directement sur la négociation (indice du cours). Elle est sans doute ponctuelle et relativement libre, mais la contrainte domine tout le reste.</p><p><strong>Effets sur les marges de manœuvre.</strong> Pour le client, la contrainte réduit ses alternatives : peu de fournisseurs peuvent livrer en 48 heures, ce qui affaiblit sa capacité à faire jouer la concurrence ; ses priorités se déplacent vers la disponibilité et le délai plutôt que vers le prix. Pour le fournisseur capable de livrer, la position est renforcée ; mais il doit vérifier sa capacité réelle (stock, transport, installation) car promettre un délai intenable compromettrait l’exécution.</p><p><strong>Comment négocier.</strong> Le client a intérêt à identifier précisément la contrainte (48 heures pour quoi : livraison, installation, mise en service ?) et à négocier les variables qui comptent (délai garanti, service, conditions de paiement) plutôt que le seul prix. Le fournisseur peut valoriser sa disponibilité, mais une exploitation excessive de l’urgence fragiliserait la relation commerciale à long terme.</p>",pitfalls:["Se contenter de nommer le contexte sans analyser ses effets sur chaque partie.","Oublier la question de la capacité réelle à tenir le délai."]},{s:"s2",type:"factuelle",q:"Qu’est-ce qu’un appel d’offres ? Pourquoi n’est-ce pas une simple demande de prix ?",keys:["Procédure de mise en concurrence de plusieurs fournisseurs","Pour satisfaire un besoin défini","L’acheteur attend une réponse structurée à un besoin","Respect de règles et de critères préalablement définis","Critères multiples : prix, qualité, valeur technique, délais, sécurité, fiabilité, environnement, accompagnement"],model:"<p>Un appel d’offres est une <strong>procédure par laquelle un acheteur met plusieurs fournisseurs en concurrence afin de satisfaire un besoin défini</strong>. Il peut porter sur un produit, une prestation de service, des travaux, une solution technique ou une prestation globale.</p><p>Ce n’est pas une simple demande de prix : l’acheteur attend une <strong>réponse structurée à son besoin</strong>, dans le respect de <strong>règles et de critères préalablement définis</strong>. Les offres sont comparées sur plusieurs critères — prix, qualité, valeur technique, délais, sécurité, fiabilité, performance environnementale, accompagnement — avec une pondération. C’est donc à la fois une opportunité commerciale et un cadre de contraintes.</p>",pitfalls:["Oublier la notion de mise en concurrence.","Réduire les critères au prix."]},{s:"s2",type:"factuelle",q:"Expliquez la logique « Go / No-Go » et les trois vérifications qui la fondent.",keys:["Évaluer si l’effort de réponse est justifié","Go / No-Go / Go sous conditions (avec informations à obtenir)","Vérifier la capacité (compétences, moyens, personnel, certifications, références, zone)","Vérifier la rentabilité (coûts, pénalités, trésorerie, marge)","Évaluer les chances de réussite (adéquation, références, concurrence, poids du prix, différenciation, information)"],model:"<p>Avant de répondre, l’entreprise doit évaluer si l’effort de réponse est justifié. Trois décisions sont possibles : <strong>Go</strong> (elle répond), <strong>No-Go</strong> (elle renonce) ou <strong>Go sous conditions</strong> (elle poursuit l’analyse mais doit obtenir certaines informations avant de décider définitivement).</p><p>La décision repose sur trois vérifications :</p><ul><li><strong>La capacité</strong> : compétences, équipements, personnel mobilisable, qualifications ou certifications, références, zone géographique. Une entreprise peut être intéressée par un marché sans être capable de l’exécuter.</li><li><strong>La rentabilité</strong> : coûts de production ou d’exécution, transport, personnel, préparation, sous-traitance, pénalités, trésorerie, marge prévisible. Le chiffre d’affaires ne suffit pas : un marché gagné peut être déficitaire.</li><li><strong>Les chances de réussite</strong> : adéquation au besoin, références, avantages concurrentiels, concurrence probable, poids du prix dans la notation, possibilité de se différencier, qualité de l’information.</li></ul>",pitfalls:["Oublier le « Go sous conditions ».","Ne parler que du chiffre d’affaires."]},{s:"s2",type:"factuelle",q:"Quelles sont les quatre catégories d’éléments que l’entreprise doit distinguer dans une consultation ? Donnez un exemple pour chacune.",keys:["Exigence obligatoire (ex. qualification, norme, délai maximal, assurance)","Critère d’évaluation (ex. prix 40 %, valeur technique 40 %, délais 20 %)","Élément différenciant (ex. interlocuteur unique, suivi en ligne, disponibilité élargie)","Variable négociable (ex. prix, périmètre, paiement — si la procédure le permet)","Une exigence obligatoire ne se présente pas comme négociable"],model:"<ul><li><strong>Exigence obligatoire</strong> : condition à respecter impérativement (une qualification, une norme, un délai maximal, une assurance). Une offre qui ne la respecte pas peut être écartée, même si son prix est intéressant : il ne faut jamais la présenter comme négociable.</li><li><strong>Critère d’évaluation</strong> : élément sur lequel l’acheteur compare les offres, avec sa pondération (par exemple prix 40 %, valeur technique 40 %, délais 20 %). La pondération oriente la stratégie.</li><li><strong>Élément différenciant</strong> : ce qui rend l’offre plus attractive (interlocuteur unique, outil de suivi en ligne, intervention préventive, disponibilité élargie, formation des utilisateurs), à condition de répondre à un besoin réel.</li><li><strong>Variable négociable</strong> : ce qui peut être discuté si la procédure le permet (prix, quantités, périmètre, délais, modalités d’exécution, options, conditions de paiement, niveau de service…). C’est à vérifier dans le dossier.</li></ul>",pitfalls:["Classer un délai maximal imposé comme « variable négociable ».","Proposer une innovation sans lien avec un besoin de l’acheteur."]},{s:"s2",type:"factuelle",q:"Que doit connaître l’entreprise avant de proposer un prix, et quels objectifs doit-elle fixer avant la négociation ?",keys:["Coût de revient","Marge minimale","Prix cible et prix maximal acceptable pour l’acheteur","Coûts liés aux éventuelles concessions (et risques du marché intégrés au prix)","Objectif idéal / cible réaliste / seuil minimal acceptable"],model:"<p>Avant de proposer un prix, l’entreprise doit connaître son <strong>coût de revient</strong>, sa <strong>marge minimale</strong>, son <strong>prix cible</strong>, le <strong>prix maximal acceptable pour l’acheteur</strong> et les <strong>coûts liés aux éventuelles concessions</strong>. Le prix doit aussi intégrer les risques du marché : un délai d’intervention très court peut exiger du personnel d’astreinte, des stocks, des véhicules supplémentaires ou une organisation spécifique.</p><p>Avant la négociation, elle fixe trois niveaux d’objectifs : l’<strong>objectif idéal</strong>, la <strong>cible réaliste</strong> et le <strong>seuil minimal acceptable</strong>, en dessous duquel elle ne conclut pas.</p>",pitfalls:["Oublier le coût des concessions.","Confondre prix cible et seuil minimal."]},{s:"s2",type:"ouverte",q:"Le prix compte pour 40 % de la note d’un appel d’offres. Une entreprise doit-elle chercher à être la moins chère ? Argumentez.",keys:["La pondération donne une indication sur la stratégie","Pas nécessairement : 60 % de la note porte sur d’autres critères","Leviers : organisation, délais, méthode, assistance, suivi","Mais le prix pèse quand même : rester compétitif tout en préservant la marge","Risque d’une offre gagnée mais déficitaire / différenciation liée à un besoin réel"],model:"<p><strong>Analyse.</strong> Dans un appel d’offres, la pondération des critères donne une indication sur la stratégie à adopter. Si le prix ne représente que 40 % de la note, 60 % se jouent sur d’autres critères (valeur technique, délais…).</p><p><strong>Réponse.</strong> L’entreprise ne doit donc pas nécessairement chercher à être la moins chère. Elle peut améliorer sa note grâce à une meilleure organisation, des délais plus courts, une méthode plus fiable, une assistance plus performante ou une meilleure qualité de suivi. Par exemple, une offre un peu plus chère mais nettement meilleure sur la valeur technique et les délais peut obtenir une note globale supérieure.</p><p><strong>Nuances.</strong> Le prix compte tout de même pour 40 % : l’offre doit rester compétitive. Surtout, chercher à être le moins cher fait courir le risque d’une offre remportée mais déficitaire si le prix est trop bas ou les contraintes mal évaluées. La différenciation doit enfin répondre à un besoin réel de l’acheteur : une innovation inutile n’apportera pas de points.</p>",pitfalls:["Répondre « non » sans expliquer les leviers alternatifs.","Oublier que le prix reste un critère important."]},{s:"s2",type:"ouverte",q:"Expliquez pourquoi « une offre peut être remportée mais se révéler déficitaire ». Comment l’entreprise peut-elle s’en prémunir ?",keys:["Le chiffre d’affaires attendu ne suffit pas","Prix trop faible ou contraintes mal évaluées","Coûts à estimer : exécution, transport, personnel, préparation, sous-traitance, pénalités, trésorerie","Intégrer les risques au prix (délai court → astreinte, stocks, véhicules…)","Connaître coût de revient, marge minimale, seuil ; possibilité de No-Go"],model:"<p>Gagner un appel d’offres ne garantit pas de gagner de l’argent. Le chiffre d’affaires attendu ne suffit pas : si le prix proposé est trop faible ou si les contraintes ont été mal évaluées, les coûts réels d’exécution dépassent les recettes. Un marché important peut ainsi être déficitaire si le chiffrage est insuffisant.</p><p>Pour s’en prémunir, l’entreprise doit, dès l’étape Go / No-Go, estimer tous ses coûts : production ou exécution, transport, personnel, préparation de la réponse, sous-traitance, éventuelles pénalités, besoins de trésorerie, et en déduire la marge prévisible. Au moment de construire l’offre, elle doit connaître son coût de revient, sa marge minimale et le coût de ses éventuelles concessions, et intégrer les risques du marché au prix (un délai d’intervention très court suppose personnel d’astreinte, stocks, véhicules, organisation spécifique). Enfin, elle fixe un seuil minimal acceptable : si le marché ne peut pas être rentable au prix compétitif, un No-Go peut être la bonne décision — sauf intérêt stratégique réel justifiant une rentabilité modérée.</p>",pitfalls:["Parler seulement du prix sans lister les coûts.","Oublier la possibilité du No-Go."]},{s:"s2",type:"ouverte",q:"Un acheteur public demande à un candidat de réduire son prix de 6 % lors d’une phase de négociation autorisée. Comment le candidat doit-il réagir ?",keys:["Vérifier que la négociation est autorisée et sur quoi elle peut porter","Ne pas accorder de concession gratuite : contrepartie","Poser des questions pour comprendre les priorités réelles de l’acheteur","Proposer d’autres variables (périmètre, modalités, options, paiement, niveau de service)","Respecter son seuil minimal et ne jamais toucher aux exigences obligatoires"],model:"<p><strong>Analyse.</strong> Le contexte est un appel d’offres avec phase de négociation autorisée : le cadre est encadré, la négociation ne peut porter que sur ce que la procédure prévoit. Le candidat a préparé son objectif idéal, sa cible réaliste et son seuil minimal.</p><p><strong>Réaction.</strong> Il ne doit pas accorder immédiatement les 6 % : une concession ne doit pas être accordée gratuitement. Il commence par <strong>poser des questions</strong> pour comprendre les priorités de l’acheteur (budget contraint ? écart avec un concurrent ? attentes non couvertes ?) afin de négocier sur les véritables enjeux plutôt que de réduire immédiatement le prix. Il peut ensuite proposer d’agir sur d’autres variables si la procédure le permet : ajuster le périmètre ou les options, les modalités d’exécution, les conditions de paiement, le niveau de service — chaque concession étant reliée à une contrepartie.</p><p><strong>Limites.</strong> Toute baisse doit être chiffrée par rapport au coût de revient et au seuil minimal ; et il ne faut jamais « gagner » de la marge en dégradant une exigence obligatoire, sous peine de voir l’offre écartée.</p>",pitfalls:["Accepter la baisse pour « garder le marché ».","Proposer de réduire une prestation obligatoire."]},{s:"s2",type:"ouverte",q:"Qu’est-ce qu’un argument efficace selon le cours ? Transformez la caractéristique « nous disposons d’un outil de suivi en ligne » en argument.",keys:["Argument relié aux attentes de l’acheteur","Montrer le bénéfice pour l’acheteur, pas seulement une caractéristique","Lien avec un besoin réel (différenciation utile)","Exemple transformé avec bénéfice concret","Lien possible avec un critère d’évaluation (valeur technique, suivi)"],model:"<p>Selon le cours, un argument efficace est <strong>relié aux attentes de l’acheteur</strong> : il ne se contente pas de présenter une caractéristique de l’entreprise, il <strong>montre le bénéfice pour l’acheteur</strong>. Il doit aussi répondre à un besoin réel, sinon il n’apporte pas d’avantage commercial.</p><p>« Nous disposons d’un outil de suivi en ligne » est une caractéristique. Transformée : « Grâce à notre outil de suivi en ligne, vos services techniques voient en temps réel l’état de chaque intervention et l’historique des pannes : ils n’ont plus à relancer nos équipes et peuvent justifier facilement le respect des délais auprès de leur direction. » L’argument répond ici à une attente de suivi et de contrôle, et peut valoir des points sur la valeur technique.</p>",pitfalls:["Reformuler la caractéristique sans bénéfice.","Inventer un besoin que l’acheteur n’a pas exprimé."]},{s:"s3",type:"factuelle",q:"Définissez référencement, assortiment et implantation.",keys:["Référencement : décision d’intégrer un fournisseur et/ou ses produits dans l’offre","Assortiment : références effectivement proposées","Implantation : présence concrète du produit dans les magasins","Question centrale : le produit répond-il aux besoins des clients de l’enseigne ?"],model:"<p>Le <strong>référencement</strong> est la décision d’intégrer un fournisseur et/ou ses produits dans l’offre d’une enseigne. L’<strong>assortiment</strong> désigne les références effectivement proposées. L’<strong>implantation</strong> correspond à la présence concrète du produit dans les magasins. Être référencé ne garantit donc pas d’être présent partout en rayon. La question centrale est : le produit répond-il aux besoins des clients de l’enseigne ?</p>",pitfalls:["Confondre référencement et implantation."]},{s:"s3",type:"factuelle",q:"Qu’est-ce que le trade marketing ? Quel est son enjeu dans un référencement ?",keys:["Démarche visant à développer les ventes avec le distributeur","En tenant compte du circuit","Actions : promotion, animation, communication, opération de lancement","Enjeu : transformer le référencement en développement commercial"],model:"<p>Le <strong>trade marketing</strong> est une démarche qui vise à développer les ventes <strong>avec le distributeur</strong>, en tenant compte du circuit. Le fournisseur peut proposer une promotion, une animation, une action de communication ou une opération de lancement. L’enjeu est de <strong>transformer le référencement en développement commercial</strong> : être référencé ne suffit pas, il faut que le produit se vende. Dans la négociation, ces a

ctions constituent aussi une monnaie d’échange contre des contreparties (emplacement, élargissement…).</p>",pitfalls:["Définir le trade marketing comme « faire de la publicité »."]},{s:"s3",type:"factuelle",q:"Décrivez le processus de référencement et expliquez le rôle de la convention.",keys:["Préparer l’offre → présenter les produits → analyser les attentes","Négocier les conditions → décider du référencement","Formaliser (convention) → suivre l’accord","La convention formalise le résultat de la négociation et les conditions de la relation","Accord acceptable, économiquement viable et réalisable"],model:"<p>Le référencement suit un processus organisé en sept étapes : préparer l’offre → présenter les produits → analyser les attentes → négocier les conditions → décider du référencement → formaliser l’accord (convention) → suivre l’accord. La négociation n’est donc qu’une étape d’une relation commerciale plus large.</p><p>La <strong>convention</strong> formalise notamment le résultat de la négociation et les conditions de la relation commerciale. Le négociateur doit anticiper ce que l’entreprise devra réellement exécuter : un accord doit être acceptable, économiquement viable et réalisable.</p>",pitfalls:["Oublier l’étape de suivi.","Négliger la dimension « réalisable »."]},{s:"s3",type:"ouverte",q:"Le distributeur est-il toujours en position de force face à un fournisseur ? Argumentez à partir de l’exemple des fournisseurs A et B.",keys:["Le distributeur contrôle l’accès au réseau mais n’est pas automatiquement en position de force","« Qui dépend le plus de l’autre ? »","Facteurs : dépendance, alternatives, attractivité de l’offre","Fournisseur A (40 %, pas d’autre distribution) → fragile ; B (10 %, plusieurs distributeurs) → solide","Rôle de la BATNA : plus l’alternative est crédible, moins on dépend"],model:"<p><strong>Analyse.</strong> Le distributeur contrôle l’accès à son réseau, ce qui lui donne un poids important. Mais le cours souligne qu’il <strong>n’est pas automatiquement en position de force</strong> : le rapport de force dépend de la question « Qui dépend le plus de l’autre ? », c’est-à-dire de la <strong>dépendance</strong>, des <strong>alternatives</strong> et de l’<strong>attractivité de l’offre</strong>.</p><p><strong>Illustration.</strong> Le fournisseur A réalise 40 % de son chiffre d’affaires avec l’enseigne et n’a quasiment aucune autre possibilité de distribution : sa forte dépendance le place en position fragile. Le fournisseur B ne réalise que 10 % de son activité avec elle et travaille déjà avec plusieurs distributeurs : ses alternatives crédibles lui donnent une position solide. Face à la même enseigne, les deux fournisseurs ne négocient donc pas du tout avec le même pouvoir.</p><p><strong>Conclusion.</strong> La BATNA — solution de repli en cas d’absence d’accord — est une source de pouvoir : plus une alternative est crédible, moins la partie dépend de son interlocuteur. L’enseigne aussi a des alternatives (autres fournisseurs, produits substituables), mais un produit très attractif ou difficilement substituable rééquilibre le rapport de force.</p>",pitfalls:["Répondre « oui car l’enseigne est plus grande ».","Citer l’exemple sans en tirer la règle (dépendance, alternatives)."]},{s:"s3",type:"ouverte",q:"Une enseigne demande à un fournisseur de passer son prix de 10 € à 9 €. Comment doit-il raisonner ?",keys:["Pas seulement « puis-je accepter 9 € ? »","Mesurer ce que rapporte la concession : volumes, référencement, développement des ventes","Raisonner sur l’économie globale de la relation","Comparer la valeur de la contrepartie au coût réel de la concession","Formuler une concession conditionnelle (« si vous vous engagez sur… »)"],model:"<p>Le fournisseur ne doit pas se demander seulement « puis-je accepter 9 € ? ». Il doit <strong>mesurer ce que rapporte la concession</strong> : un volume plus important, un référencement élargi (plus de références ou de magasins), un développement des ventes (mise en avant, opération commerciale)… C’est le principe du cours : <strong>raisonner sur l’économie globale de la relation</strong> et comparer la valeur de la contrepartie au coût réel de la concession.</p><p>Concrètement, il chiffre ce que coûte un euro de moins sur sa marge unitaire, puis cherche une contrepartie qui compense au moins cette perte. Il formule alors une concession conditionnelle : « Si vous vous engagez sur tel volume (ou sur l’élargissement à telle référence), je peux envisager telle condition. » La baisse de prix devient ainsi une variable d’échange et non une baisse gratuite. Si aucune contrepartie ne compense la perte et que le prix franchit son seuil, il doit pouvoir refuser — d’autant plus facilement qu’il dispose d’alternatives crédibles.</p>",pitfalls:["Accepter ou refuser sans calcul.","Oublier de demander une contrepartie."]},{s:"s3",type:"ouverte",q:"Comparez la logique du fournisseur et celle du distributeur dans un référencement. Comment construire un accord entre les deux ?",keys:["Fournisseur : maximiser le développement de son offre (références, magasins, volumes, rentabilité, marque)","Distributeur : optimiser l’offre proposée à ses clients (pertinence, espace, demande, conditions, positionnement)","Exemple des jus : 3 références partout vs 1 référence en test","Espace de négociation : référencement progressif, élargissement selon résultats","Hiérarchiser ses priorités ; concessions contre contreparties"],model:"<p>Le <strong>fournisseur</strong> cherche à <strong>maximiser le développement de son offre</strong> : développer ses ventes, faire référencer plusieurs références, être présent dans un maximum de magasins, atteindre des volumes importants, préserver sa rentabilité, développer sa marque. Le <strong>distributeur</strong> cherche à <strong>optimiser l’offre proposée à ses clients</strong> : sélectionner les références les plus pertinentes, maîtriser l’assortiment et l’espace, s’assurer que les volumes correspondent à la demande, obtenir des conditions compatibles avec son modèle, respecter son positionnement.</p><p>Ces logiques semblent s’opposer, comme dans l’exemple des jus : le fournisseur veut 3 références dans un maximum de magasins, l’enseigne veut tester 1 référence dans une partie du réseau. Mais elles partagent un intérêt commun — vendre. L’espace de négociation est alors un <strong>référencement progressif</strong>, avec élargissement éventuel selon les résultats. Pour y parvenir, le négociateur hiérarchise ses priorités (qu’est-ce qui compte le plus : le nombre de références, de magasins, le prix ?), prépare ses concessions et les contreparties recherchées (par exemple accepter le test contre des critères d’élargissement écrits dans la convention), et vérifie que l’accord sera réalisable.</p>",pitfalls:["Présenter les deux logiques comme irréconciliables.","Oublier l’exemple des jus."]},{s:"s4",type:"factuelle",q:"Quelles sont les deux relations fondamentales de l’agent sportif et les deux négociations qui en découlent ?",keys:["Agent ↔ sportif : obtenir et sécuriser le mandat","Agent ↔ club / sponsor / partenaire : utiliser le mandat pour défendre les intérêts du sportif","Première négociation : démontrer sa valeur, comprendre les objectifs, négocier les conditions de la relation","Deuxième négociation : défendre le client, comprendre l’autre partie, variables, accord","Négocier au nom et dans l’intérêt du mandant"],model:"<p>L’agent sportif est un intermédiaire et un représentant, engagé dans deux relations fondamentales :</p><ul><li><strong>Agent ↔ sportif</strong> : il doit obtenir et sécuriser son mandat. C’est une première négociation, où il démontre sa valeur, comprend les objectifs du sportif, présente son offre et négocie les conditions de la relation (apport, attentes, durée, exclusivité, engagements, rémunération).</li><li><strong>Agent ↔ club / sponsor / partenaire / organisateur</strong> : il utilise ce mandat pour défendre les intérêts du sportif. C’est la deuxième négociation, où il comprend les intérêts de l’autre partie, identifie les variables négociables et construit un accord.</li></ul><p>Il passe ainsi d’une logique de vente de ses services à une logique de représentation : il négocie au nom et dans l’intérêt de son mandant.</p>",pitfalls:["Ne décrire que la négociation avec le club."]},{s:"s4",type:"factuelle",q:"Que prévoit le Code du sport pour le contrat d’agent sportif, d’après le support de cours ?",keys:["Le contrat précise les services et leur caractère exclusif ou non","Il précise la durée, la rémunération de l’agent et la partie qui le rémunère","Durée maximale : 3 ans","Rémunération maximale : 10 % du contrat ou de l’accord conclu par les parties mises en relation","Les fédérations délégataires peuvent fixer un plafond inférieur"],model:"<p>Selon le support, le Code du sport encadre précisément le contrat d’agent sportif (le support indique « depuis le 5 août 2026 »). Le contrat doit notamment préciser les services, leur caractère exclusif ou non, sa durée, la rémunération de l’agent et la partie qui le rémunère. Sa durée ne peut excéder <strong>trois ans</strong> et la rémunération de l’agent ne peut excéder <strong>10 %</strong> du contrat ou de l’accord conclu par les parties qu’il a mises en relation, les fédérations délégataires pouvant fixer un plafond inférieur. L’agent ne peut donc pas fixer librement la durée de son mandat, sa rémunération et les conditions de sa représentation.</p>",pitfalls:["Inverser les chiffres (10 ans, 3 %).","Oublier le plafond inférieur possible des fédérations."]},{s:"s4",type:"ouverte",q:"En quoi la négociation par représentation diffère-t-elle d’une négociation menée pour soi-même ?",keys:["L’agent négocie au nom et dans l’intérêt d’un mandant","Il doit connaître objectifs, priorités, limites du sportif, ce qu’il peut concéder et exiger","Question : « Cette concession est-elle réellement dans l’intérêt de mon client ? »","Défendre les intérêts globaux, pas seulement une demande","Double relation : mandat à obtenir puis à valoriser ; confiance + engagements définis"],model:"<p>Dans une négociation pour soi-même, le négociateur arbitre selon ses propres intérêts. Dans une <strong>négociation par représentation</strong>, l’agent négocie <strong>au nom et dans l’intérêt de son mandant</strong> : ses choix doivent être guidés par les intérêts du sportif, pas par les siens.</p><p>Cela change la préparation : l’agent doit connaître les objectifs du sportif, ses priorités, ses limites, ce qu’il peut concéder et ce qu’il exige en retour. Cela change aussi chaque concession : en plus de la règle « une concession contre une contrepartie » (« nous pouvons envisager cela si vous nous accordez telle contrepartie »), il doit se demander : « <strong>Cette concession est-elle réellement dans l’intérêt de mon client ?</strong> » C’est précisément ce qui distingue les deux situations.</p><p>Enfin, l’agent défend les intérêts globaux de son client (durée, évolution, place dans le projet sportif…) et non une simple demande. Et la négociation est double : il doit d’abord obtenir et sécuriser le mandat, dans une relation fondée sur la confiance mais avec des engagements clairement définis.</p>",pitfalls:["Oublier la question de l’intérêt du client.","Parler de l’agent comme d’un vendeur classique."]},{s:"s4",type:"ouverte",q:"Une joueuse reçoit deux offres : le club A propose un salaire 30 % plus élevé mais un rôle de remplaçante ; le club B propose moins mais une place de titulaire. Comment son agent doit-il raisonner ?",keys:["Prix ≠ valeur : une offre financièrement supérieure n’est pas forcément meilleure","Partir des objectifs et priorités de la joueuse (intérêts globaux)","Comparer potentiel de développement et contraintes","Utiliser l’offre concurrente crédible pour améliorer l’offre préférée (ex. Jordan / Adidas)","Négocier d’autres variables (primes, durée, conditions d’évolution, place dans le projet)"],model:"<p><strong>Analyse.</strong> L’agent doit éviter de confondre prix et valeur : une proposition financièrement supérieure n’est pas nécessairement meilleure si elle offre moins de potentiel de développement ou impose davantage de contraintes. Il part donc des <strong>objectifs et priorités de sa cliente</strong> : si elle veut progresser, être vue et viser la sélection, le temps de jeu offert par le club B a plus de valeur que le salaire du club A.</p><p><strong>Stratégie.</strong> L’offre du club A n’est pas inutile : c’est une <strong>alternative crédible</strong> qui renforce la capacité de négociation — comme David Falk utilisant l’offre d’Adidas pour améliorer celle de Nike. L’agent peut s’en servir pour améliorer l’offre du club B sur d’autres variables : primes liées aux objectifs, conditions d’évolution du salaire, durée, place dans le projet sportif, certaines clauses.</p><p><strong>Limite.</strong> Chaque concession éventuelle (par exemple une durée plus longue) doit être conditionnée à une contrepartie et passer le test : « est-ce réellement dans l’intérêt de ma cliente ? »</p>",pitfalls:["Choisir automatiquement l’offre la plus chère.","Choisir B sans utiliser l’offre A comme levier."]},{s:"s4",type:"ouverte",q:"Qu’est-ce qu’une proposition de valeur dans la négociation entre un sportif et une marque ? Illustrez.",keys:["Deux questions : ce que le sportif apporte à la marque / ce que la marque apporte au sportif","Relation créatrice de valeur pour les deux parties","Variables au-delà de la rémunération : image, exclusivité, durée, contenus, apparitions, produits, campagnes","Élargir la valeur créée plutôt qu’augmenter le montant","Exemple du cours (Serena Williams, Osaka, Bolt ou Jordan)"],model:"<p>Dans une négociation avec une marque, l’agent construit une <strong>proposition de valeur</strong> en répondant à deux questions : qu’est-ce que le sportif apporte à la marque ? qu’est-ce que la marque peut apporter au sportif ? Il cherche ainsi une relation <strong>créatrice de valeur pour les deux parties</strong>.</p><p>La négociation ne porte donc pas seulement sur la rémunération, mais aussi sur l’utilisation de l’image, l’exclusivité, la durée, la production de contenus, les apparitions, le développement de produits ou la participation à des campagnes. Selon le cours, « une bonne négociation ne consiste pas toujours à augmenter le montant payé : elle consiste à élargir la valeur créée par le partenariat ».</p><p>Exemple : en 2009, Serena Williams devient à la fois ambassadrice et partenaire au capital de Mission Skincare, participe au développement de produits et peut percevoir des royalties. De même, l’accord de Naomi Osaka avec Levi’s (2021) lui permet de concevoir sa propre collection au moins une fois par an.</p>",pitfalls:["Ne parler que d’argent.","Oublier l’une des deux questions."]},{s:"s4",type:"ouverte",q:"Pourquoi la relation entre l’agent et le sportif est-elle elle-même une négociation ? Quel rôle y joue la confiance ?",keys:["Avant de négocier pour un sportif, l’agent doit le convaincre de lui confier sa représentation","Le mandat définit les conditions de la mission (pas une formalité)","Points à clarifier : apport, attentes, durée, exclusivité, engagements, rémunération","La confiance est une ressource de la négociation (ex. Sharapova / Eisenbud)","Mais engagements clairement définis ; qualité de la relation → qualité des négociations extérieures"],model:"<p>Avant de négocier pour un sportif, l’agent doit <strong>réussir à le convaincre de lui confier sa représentation</strong> : c’est une première négociation, où il vend ses services. Le mandat n’est pas une formalité, car il définit les conditions dans lesquelles l’agent pourra exercer sa mission : ce que l’agent apporte, ce que le sportif attend, la durée de la relation, l’exclusivité éventuelle, les engagements respectifs et la rémunération (dans les limites légales présentées par le support : 3 ans, 10 %).</p><p>La <strong>confiance</strong> devient une ressource de la négociation, comme l’illustre la longue relation entre Maria Sharapova et Max Eisenbud. Mais la confiance ne signifie pas que tout doit rester informel : une relation durable nécessite de clarifier les responsabilités et les attentes. « La confiance facilite la relation, mais les engagements doivent être clairement définis. » La qualité de cette relation conditionne ensuite la qualité des négociations menées avec les partenaires extérieurs.</p>",pitfalls:["Dire que la confiance remplace le contrat."]},{s:"x",type:"ouverte",q:"Montrez que le principe « pas de concession sans contrepartie » traverse les séances 2, 3 et 4.",keys:["Séance 2 : une concession ne doit pas être accordée gratuitement ; pas de concession sans contrepartie","Séance 3 : « Si vous vous engagez sur tel volume… » ; « Que puis-je concéder, dans quelles limites, et contre quoi ? »","Séance 3 : comparer la valeur de la contrepartie au coût réel de la concession","Séance 4 : « Nous pouvons envisager cela si vous nous accordez telle contrepartie »","Séance 4 : la concession doit aussi rester dans l’intérêt du mandant"],model:"<p>Le principe apparaît dans chacun des contextes étudiés, avec une nuance propre à chacun :</p><ul><li><strong>Appel d’offres (S2)</strong> : « une concession ne doit pas être accordée gratuitement » ; toute concession doit être reliée à une contrepartie recherchée — et chiffrée, puisque l’entreprise doit connaître le coût de ses concessions avant de proposer un prix.</li><li><strong>Référencement (S3)</strong> : la concession tarifaire devient une variable d’échange (« Si vous vous engagez sur tel volume, je peux envisager telle condition ») ; le négociateur se demande « que puis-je concéder, dans quelles limites, et contre quoi ? » et compare la valeur de la contrepartie au coût réel de la concession.</li><li><strong>Agent sportif (S4)</strong> : la formulation devient « nous pouvons envisager cela si vous nous accordez telle contrepartie », avec un filtre supplémentaire : la concession doit rester cohérente avec les intérêts du mandant.</li></ul><p>Ce fil rouge montre que, quel que soit le contexte, négocier ne consiste pas à céder mais à <strong>échanger</strong>.</p>",pitfalls:["Citer le principe sans montrer la spécificité de chaque séance."]},{s:"x",type:"ouverte",q:"Comparez la négociation dans un appel d’offres et dans un référencement en grande distribution.",keys:["Points communs : contextes encadrés, processus en étapes, analyse préalable, concessions contre contreparties","AO : mise en concurrence sur un besoin défini, critères pondérés, exigences obligatoires, négociation pas toujours autorisée","Référencement : rapport de force fondé sur la dépendance et les alternatives, variables multiples (assortiment, promotion, logistique, trade marketing)","AO : offre conforme, compétitive, rentable / Référencement : accord acceptable, viable, réalisable (convention, suivi)","Conclusion : même méthode (grille), stratégies adaptées au contexte"],model:"<p><strong>Points communs.</strong> Les deux sont des négociations spécifiques fortement encadrées, inscrites dans un processus en étapes, où la négociation n’est qu’un moment d’une démarche plus large. Dans les deux cas, la qualité du résultat dépend de l’analyse préalable, et toute concession doit être liée à une contrepartie.</p><p><strong>Différences.</strong> Dans l’<strong>appel d’offres</strong>, l’acheteur met plusieurs fournisseurs en concurrence pour un besoin défini ; les règles sont fixées à l’avance (cahier des charges, critères pondérés, exigences obligatoires, échéance) et la négociation n’est pas toujours autorisée : la marge de manœuvre se trouve d’abord dans la construction d’une offre conforme, compétitive et rentable. Dans le <strong>référencement</strong>, la négociation se joue avec l’acheteur ou la centrale d’une enseigne ; le rapport de force dépend de la dépendance réciproque, des alternatives et de l’attractivité de l’offre ; les variables sont nombreuses (assortiment, prix, volumes, promotion, logistique, trade marketing) et l’accord se formalise dans une convention puis se suit dans le temps.</p><p><strong>Conclusion.</strong> La méthode (grille d’analyse) est la même ; la stratégie s’adapte au contexte : jouer avec les critères et la conformité en appel d’offres, jouer avec la dépendance et les variables d’échange en référencement.</p>",pitfalls:["Juxtaposer deux résumés sans comparer."]},{s:"x",type:"ouverte",q:"Montrez, à l’aide d’exemples tirés de plusieurs séances, que la négociation ne se réduit pas au prix.",keys:["S2 : la négociation ne consiste pas uniquement à obtenir ou accorder une baisse de prix ; pondération (prix 40 %)","S2 : variables multiples (périmètre, délais, modalités, paiement, niveau de service)","S3 : assortiment, volumes, promotion, logistique, trade marketing ; économie globale (10 € → 9 €)","S4 : prix ≠ valeur ; variables (durée, primes, évolution, image, produits) ; élargir la valeur créée","Exemple précis du cours (Jordan, Serena Williams, ascenseurs, jus…)"],model:"<p>Le cours répète, séance après séance, que le prix n’est qu’une variable parmi d’autres.</p><p>En <strong>appel d’offres</strong> (S2), la conclusion est explicite : la négociation ne consiste pas uniquement à obtenir ou accorder une baisse de prix, mais à rechercher un accord sur les conditions de l’offre en préservant la satisfaction de l’acheteur et la rentabilité de l’entreprise. Quand le prix ne pèse que 40 % de la note, l’entreprise peut gagner sur l’organisation, les délais ou le suivi.</p><p>En <strong>référencement</strong> (S3), on négocie l’assortiment, les volumes, la promotion, la logistique, le trade marketing ; et face à une demande de passer de 10 € à 9 €, il faut raisonner sur l’économie globale de la relation et non sur le seul prix.</p><p>Pour l’<strong>agent sportif</strong> (S4), une offre financièrement supérieure n’est pas forcément la meilleure (prix ≠ valeur) ; l’agent négocie la durée, les primes, l’évolution, la place dans le projet, l’image ou le développement de produits. Le contrat Jordan / Nike associe rémunération, ligne de produits et participation aux revenus, et le partenariat de Serena Williams va jusqu’à une participation au capital : une bonne négociation élargit la valeur créée.</p>",pitfalls:["Ne prendre des exemples que dans une seule séance."]},{s:"x",type:"ouverte",q:"Expliquez le rôle des alternatives (BATNA / MESORE) dans le rapport de force, à l’aide d’exemples de deux séances au moins.",keys:["Définition : solution de repli en cas d’absence d’accord (BATNA = MESORE)","Plus une alternative est crédible, moins on dépend de l’autre","S3 : fournisseur A (fragile) vs B (solide) ; alternatives fournisseur / distributeur","S4 : offre concurrente crédible (Adidas pour Jordan) ; plus d’alternatives → plus de marges","Évaluer la crédibilité (ex. RunSphere : réelle mais non garantie) et celles de l’autre partie"],model:"<p>La <strong>BATNA</strong> (ou MESORE, dans la grille de la séance 1) est la solution de repli en cas d’absence d’accord. Elle détermine en grande partie le rapport de force : <strong>plus une alternative est crédible, moins la partie dépend de son interlocuteur</strong>, et plus elle peut refuser un accord défavorable.</p><p>En <strong>séance 3</strong>, le fournisseur B, qui travaille avec plusieurs distributeurs, est en position solide alors que le fournisseur A, sans autre circuit, est fragile ; l’enseigne, de son côté, a pour alternatives d’autres fournisseurs et des produits substituables. En <strong>séance 4</strong>, « une offre concurrente crédible peut renforcer la capacité de négociation » : David Falk s’appuie sur l’offre d’Adidas pour améliorer celle de Nike, et « plus les alternatives de son client sont crédibles, plus l’agent dispose de marges ».</p><p>Il faut toutefois évaluer la <strong>crédibilité</strong> de chaque alternative, la sienne comme celle de l’autre. Dans le cas TempoRun, RunSphere est une vraie solution de repli, mais son volume n’est pas garanti : la surestimer serait une erreur que MarketOne pourrait exploiter.</p>",pitfalls:["Définir la BATNA sans montrer son effet sur le rapport de force.","Oublier les alternatives de l’autre partie."]}],ns={},U=en.map(e=>(ns[e.s]=(ns[e.s]||0)+1,{id:`qc-${e.s}-${String(ns[e.s]).padStart(2,"0")}`,...e}));var ge={intro:"Le module repose sur une idée : <strong>le négociateur doit d’abord analyser la situation</strong>. Cette méthode transforme la grille d’analyse de la séance 1 et les outils des séances 2 à 4 en une démarche pas à pas, illustrée sur le cas MarketOne / TempoRun. Elle sert pour les cas pratiques, les questions ouvertes… et pour un cas inédit le jour du contrôle.",steps:[{id:"contexte",n:0,title:"Situer le contexte",src:"Séance 1",what:"Identifier le type de négociation spécifique et le placer sur les quatre dimensions, à partir d’indices tirés de l’énoncé (pas d’un mot-clé).",ask:["Quel contexte : appel d’offres, référencement, enchère inversée, multi-acteurs, sous contrainte, représentation (agent) ? Plusieurs à la fois ?","Cadre libre ou encadré ? Négociation ponctuelle ou processus formalisé ?","Individuelle ou multi-acteurs ? Information équilibrée ou asymétrique ?","Quel indice de l’énoncé me le prouve ?"],example:"Référencement sur une marketplace : TempoRun veut entrer dans l’offre de MarketOne. Cadre encadré (tarifs standards non négociables), processus (proposition écrite → préparation → commission contradictoire → test éventuel), information asymétrique (annexes confidentielles).",trap:"Nommer le contexte sans le justifier par des indices."},{id:"qui",n:1,title:"Qui ? — les parties prenantes",src:"Séances 1, 2, 4",what:"Lister toutes les parties, puis pour chacune son rôle : décideur, influenceur, prescripteur, utilisateur, acheteur, mandant… Dans une organisation, la personne en face n’est pas forcément celle qui décide.",ask:["Qui participe à la négociation ? Qui décide vraiment ? Qui influence ?","Qui utilisera le produit ou le service ?","Quelqu’un négocie-t-il pour le compte d’un autre (agent, mandat) ?"],example:"TempoRun (direction : seuil de contribution, budget pub) ; MarketOne (un responsable commercial dont la proposition est « sous réserve de validation » interne). Indirectement : les clients de la marketplace, dont les avis pèsent.",trap:"Oublier le décideur caché ou « l’autre camp » dans l’analyse."},{id:"pourquoi",n:2,title:"Pourquoi ? — objectifs et intérêts",src:"Séances 1, 3, 4",what:"Pour chaque partie, distinguer ce qu’elle demande (sa position) de ce qu’elle cherche vraiment (ses intérêts). Repérer l’intérêt commun qui rend un accord possible.",ask:["Que cherche réellement chaque acteur ?","Quelle est sa logique (ex. fournisseur : développer son offre ; distributeur : optimiser l’offre pour ses clients) ?","Quel intérêt commun pourrait fonder l’accord ?"],example:"TempoRun : nouvelle clientèle, mais rentable et sans dépendance excessive. MarketOne : enrichir la catégorie sport avec un produit qui se vend, sans créer de problèmes de service client. Intérêt commun : un lancement qui fonctionne.",trap:"Ne décrire que ses propres objectifs."},{id:"regles",n:3,title:"Avec quelles règles ? — le cadre",src:"Séances 1, 2, 4",what:"Repérer ce qui est fixé à l’avance et ne se négocie pas : procédure, exigences obligatoires, tarifs standards, cadre légal, calendrier. C’est la frontière de ta marge de manœuvre.",ask:["Qu’est-ce qui est imposé ? Qu’est-ce qui est discutable ?","La négociation est-elle autorisée ? Sur quoi ?","Quelle règle limite les possibilités (procédure, loi, convention) ?"],example:"Commission 15 %, abonnement 49 €, logistique 4,50 €, publicité 350 € : non négociables individuellement. Discutables : test de 3 mois, accompagnement technique, calendrier, suivi.",trap:"Bâtir sa stratégie sur une remise d’un élément non négociable."},{id:"infos",n:4,title:"Avec quelles informations ? — qui sait quoi",src:"Séance 1 + consignes du cas",what:"Trier l’information : commune ou confidentielle ; fait établi, hypothèse ou information manquante. Les informations manquantes deviennent tes questions ; tes informations confidentielles deviennent ce que tu décides (ou non) de révéler.",ask:["Qu’est-ce qui est un fait ? une estimation ? une inconnue ?","Que sait l’autre partie que j’ignore ? Que sais-je qu’elle ignore ?","Quelle information me manque pour décider ?"],example:"Fait : commission 15 %. Hypothèse : 120 commandes/mois (méthode non communiquée). Manquant : périmètre exact de la logistique à 4,50 €. Confidentiel TempoRun : seuil de 14 €, retours 8 %, RunSphere.",trap:"Transformer une estimation en garantie, ou inventer un fait absent de l’énoncé."},{id:"enjeux",n:5,title:"Quels enjeux ? — gagner ou perdre",src:"Séance 1",what:"Mesurer ce que chaque partie risque de gagner ou de perdre : chiffre d’affaires, rentabilité, image, dépendance, références, relation future.",ask:["Que gagne chacun si l’accord est conclu ? Que perd-il sinon ?","Le gain apparent (chiffre d’affaires) est-il un gain réel (rentabilité) ?"],example:"TempoRun peut gagner des ventes et une clientèle nouvelle, mais risque une rentabilité dégradée (coûts fixes, retours, production accélérée) et une saturation de sa capacité. MarketOne risque une référence qui se vend mal ou génère des retours.",trap:"Confondre chiffre d’affaires supplémentaire et rentabilité."},{id:"force",n:6,title:"Quel rapport de force ? — qui dépend de qui",src:"Séances 1, 3, 4",what:"Évaluer la dépendance réciproque, les alternatives, l’attractivité de l’offre (et, pour un sportif, la rareté du profil). Conclure : qui dépend le plus de l’autre, et sur quels points ?",ask:["Qui dépend le plus de l’autre ?","Mon offre est-elle attractive ou facilement substituable ?","L’autre partie a-t-elle des alternatives crédibles ?"],example:"MarketOne a 8 offres comparables dont 3 avec deux porte-bidons : la ceinture est substituable. TempoRun n’est pas dépendante (site + RunSphere), mais son alternative n’est pas garantie. Rapport de force plutôt équilibré, légèrement favorable à MarketOne sur la visibilité.",trap:"Conclure « le plus gros gagne » sans raisonner sur la dépendance et les alternatives."},{id:"contraintes",n:7,title:"Quelles contraintes ?",src:"Séance 1",what:"Identifier précisément les contraintes qui pèsent sur chaque partie (budget, délai, capacité de production, stock, réglementation, disponibilité) et leurs effets sur les marges de manœuvre.",ask:["Quelle contrainte limite ce que je peux promettre ?","Quelle contrainte pèse sur l’autre partie ? Peut-elle devenir un levier ?"],example:"TempoRun : capacité 210 unités/mois tous canaux, 75 unités disponibles, budget pub 200 €, échéance RunSphere à 3 semaines. MarketOne : ne peut garantir ni volume ni classement.",trap:"Promettre un volume ou un délai que la capacité ne permet pas de tenir."},{id:"alternatives",n:8,title:"Quelles alternatives ? — BATNA / MESORE",src:"Séances 1, 3, 4",what:"Pour chaque partie : que fera-t-elle sans accord ? Évaluer la crédibilité de chaque alternative (existe-t-elle vraiment, à temps, que rapporte-t-elle, quels risques ?).",ask:["Quelle est ma meilleure solution de repli ? Est-elle crédible ?","Quelle est celle de l’autre partie ?","Comment utiliser mon alternative sans la surestimer ni la dévoiler entièrement ?"],example:"TempoRun : RunSphere (12 %, sans abonnement, 30–45 commandes non garanties, réponse sous 3 semaines) ou rester sur son site. MarketOne : d’autres vendeurs de ceintures comparables.",trap:"Surestimer son alternative (MarketOne pourrait le relever)."},{id:"variables",n:9,title:"Quelles variables négociables ?",src:"Séances 1 à 4",what:"Dresser la liste de tout ce qui peut bouger, au-delà du prix : volumes, délais, calendrier, périmètre, service, logistique, promotion, durée, exclusivité, image, contenus… et la confronter au cadre (étape 3).",ask:["Que peut-on réellement négocier ?","Qu’est-ce qui coûte peu à l’un et vaut beaucoup pour l’autre ?"],example:"Test de 3 mois, calendrier de lancement, stock mobilisé, contenus de la fiche produit (guide des tailles), accompagnement technique, indicateurs de suivi, choix logistique, publicité (refusée ou différée).",trap:"Réduire la négociation au prix."}],strategy:[{id:"decider",title:"Décider : GO, GO sous conditions ou NO GO",src:"Séance 2 + cas",text:"Après l’analyse, prendre position. Un « GO sous conditions » liste précisément les informations ou engagements à obtenir avant de s’engager.",example:"TempoRun : GO sous conditions — test de 3 mois sans publicité payante, clarification de la prévision et du périmètre logistique, lancement progressif avec le stock disponible, décision finale avant l’échéance RunSphere."},{id:"objectifs",title:"Fixer ses objectifs et ses limites",src:"Séance 2",text:"Objectif idéal, cible réaliste, seuil minimal acceptable. Distinguer une limite économique (marge, contribution) et une limite opérationnelle (capacité, stock, délai).",example:"Limite économique : 14 € de contribution par commande. Limite opérationnelle : ne pas engager plus que le stock disponible et la capacité sans dégrader le canal direct."},{id:"valeur",title:"Construire la proposition de valeur",src:"Séances 2, 3, 4",text:"Pourquoi l’autre partie aurait-elle intérêt à travailler avec nous plutôt qu’avec un concurrent ? Ce que nous lui apportons / ce qu’elle nous apporte ; nos éléments différenciants, à condition qu’ils répondent à un besoin réel ; la pertinence pour ses clients.",example:"Pour MarketOne : un produit qui réunit rangement, hydratation et visibilité, bien noté (4,6/5), avec une fiche produit enrichie (guide des tailles) et un vendeur fiable sur le stock et l’expédition — exactement ce que la catégorie sport recherche."},{id:"concessions",title:"Préparer concessions et contreparties",src:"Séances 2, 3, 4",text:"Tableau « ce que je peux concéder / dans quelle limite / contre quoi ». Chiffrer le coût de chaque concession et vérifier que la contrepartie vaut au moins autant. En représentation, ajouter : est-ce dans l’intérêt de mon client ?",example:"TempoRun concède : un stock dédié, une fiche produit complète, un interlocuteur opérationnel, des engagements d’expédition, le partage d’indicateurs. Contreparties : accompagnement au démarrage, calendrier coordonné, points de suivi, sortie possible après le test."},{id:"arguments",title:"Préparer les arguments",src:"Séance 2",text:"Chaque argument relie une caractéristique à un bénéfice pour l’autre partie, en lien avec ses attentes.",example:"« Le guide des tailles a été refait : moins de questions avant achat, donc moins de sollicitations de votre service client. »"},{id:"questions",title:"Préparer les questions",src:"Séance 2 + cas",text:"Des questions ouvertes pour comprendre les priorités de l’autre et obtenir les informations manquantes, plutôt que de réduire immédiatement le prix.",example:"« Sur quelles données repose l’estimation de 120 commandes, et suppose-t-elle de la publicité ? » ; « Que comprend exactement la logistique à 4,50 € (stockage, retours) ? » ; « Quels indicateurs suivrions-nous pendant le test ? »"},{id:"execution",title:"Anticiper l’exécution",src:"Séance 3",text:"Un accord doit être acceptable, économiquement viable et réalisable. Prévoir la formalisation (convention, conditions du test) et le suivi.",example:"Vérifier que 65 ventes sur le site + les ventes marketplace restent sous la capacité de 210 unités/mois ; ne pas accélérer la production si la contribution passe sous 14 €."}],writing:{factuelle:["Définir précisément avec les mots du cours.","Développer : lister, distinguer, expliquer (étapes, catégories, critères).","Illustrer avec un exemple du cours (ascenseurs, jus, fournisseurs A et B, Jordan…).","Si la question le permet : relier à l’analyse d’une situation et dire comment on agirait."],ouverte:["Analyser : situer le contexte et les notions en jeu.","Répondre : une thèse claire, argumentée par le cours.","Illustrer : un exemple précis, du cours ou de l’énoncé.","Nuancer : limites, conditions, cas où la réponse change.","Conclure en une phrase qui répond à la question."],cas:[["1. Diagnostic du contexte","Type de négociation spécifique, quatre dimensions, indices."],["2. Les parties","Qui ? Pourquoi ? Enjeux — un tableau par partie est efficace."],["3. Rapport de force et alternatives","Dépendances, attractivité, BATNA de chaque partie et leur crédibilité."],["4. Informations","Faits, hypothèses, informations manquantes ; commun / confidentiel ; ce qu’il faut demander."],["5. Recommandation","GO, GO sous conditions ou NO GO ; objectif idéal, cible réaliste, seuil minimal ; calculs justificatifs."],["6. Stratégie","Proposition de valeur, variables, concessions ↔ contreparties, arguments, questions."],["7. Points de vigilance","Exécution, limites, information adverse qui ferait évoluer la recommandation."]]},levels:{question:"TempoRun doit-elle accepter la proposition de MarketOne ?",items:[{label:"Réponse insuffisante",score:"≈ 5/20",text:"« Oui, car MarketOne prévoit 120 commandes par mois, ce qui va presque tripler les ventes de TempoRun. En plus la commission n’est que de 15 %. TempoRun devrait aussi prendre la publicité pour être visible. »",why:"Prend une estimation pour une garantie, ignore les coûts et le seuil de 14 €, propose une publicité qui dépasse le budget, aucune analyse du contexte ni des alternatives."},{label:"Réponse correcte",score:"≈ 11/20",text:"« La contribution avec la logistique MarketOne est de 50 − 7,50 − 21 − 1,50 − 4,50 = 15,50 €, au-dessus du seuil de 14 €. TempoRun peut donc accepter, mais plutôt avec un test de trois mois, sans publicité payante, car son budget est de 200 €. »",why:"Calcul juste et conclusion raisonnable, mais pas d’analyse du contexte, du rapport de force ni de RunSphere ; aucune question à poser, rien sur la capacité, le stock, les retours ni sur les contreparties."},{label:"Réponse excellente",score:"≈ 17/20",text:"« Il s’agit d’un référencement sur une marketplace, dans un cadre encadré (tarifs standards non négociables) et avec une forte asymétrie d’information. La contribution est de 15,50 € avec la logistique MarketOne (14,20 € si TempoRun expédie), au-dessus du seuil de 14 €, mais ce n’est pas un bénéfice : il reste l’abonnement de 49 €, les retours (8 %) et le service client. La prévision de 120 commandes n’est pas garantie et sa méthode est inconnue ; la visibilité sans publicité est incertaine (emplacements sponsorisés). Je recommande un GO sous conditions : test de trois mois sans publicité payante, lancement progressif avec les 75 unités disponibles (sans production accélérée, qui ferait tomber la contribution à 13 €), clarification de la prévision et du périmètre logistique, indicateurs de suivi. En contrepartie de fiches produit complètes, d’un guide des tailles amélioré et d’engagements d’expédition, TempoRun demande un accompagnement au démarrage et un calendrier coordonné. RunSphere (16,30 € par commande, sans abonnement, mais volume non garanti) reste la solution de repli : la décision doit être prise avant son échéance de trois semaines. »",why:"Analyse avant décision, calculs justes et interprétés, distinction faits / hypothèses, BATNA évaluée, recommandation conditionnée, concessions liées à des contreparties, vigilance sur la capacité et la rentabilité."}],note:"Ces notes illustrent l’écart entre niveaux de réponse ; ce n’est pas le barème de ton professeur."},phrases:[["Concéder sous condition","« Nous pourrions envisager … si vous vous engagez sur … »"],["Lier une baisse de prix à un volume","« Si vous vous engagez sur tel volume, je peux envisager telle condition. »"],["Négocier pour un client","« Nous pouvons envisager cela si vous nous accordez telle contrepartie. » (puis vérifier : est-ce dans l’intérêt de mon client ?)"],["Comprendre les priorités","« Qu’est-ce qui compte le plus pour vous dans ce projet ? » ; « Qu’est-ce qui n’a pas fonctionné avec la solution actuelle ? »"],["Tester une estimation","« Sur quelles données repose cette estimation ? Que se passe-t-il si elle n’est pas atteinte ? »"],["Recadrer une condition non négociable","« Je comprends que ce tarif est standard ; discutons plutôt du calendrier et du suivi du lancement. »"],["Utiliser son alternative sans la dévoiler","« Nous étudions plusieurs options de distribution ; pour décider dans les délais, nous avons besoin de clarifier trois points. »"],["Proposer une étape progressive","« Commençons par un test sur trois mois avec des critères d’élargissement écrits dans l’accord. »"],["Transformer une caractéristique en bénéfice","« Grâce à …, vous pourrez … »"]],mistakes:[["Réciter sans analyser","Le cours attend d’abord l’analyse de la situation, puis la solution."],["Analyser une seule partie","Le rapport de force et les alternatives n’ont de sens que comparés des deux côtés."],["Prendre une estimation pour une garantie","Une prévision sans méthode reste une hypothèse : il faut la questionner."],["Concéder sans contrepartie","Toute concession doit être liée à une contrepartie et chiffrée."],["Négocier ce qui ne se négocie pas","Exigence obligatoire d’un appel d’offres, tarif standard d’une plateforme, plafond légal du contrat d’agent."],["Confondre chiffre d’affaires et rentabilité","Un marché gagné peut être déficitaire ; une contribution n’est pas un bénéfice net."],["Oublier l’exécution","Un accord doit être réalisable : capacité, stock, délais, logistique."],["Surestimer sa solution de repli","Une alternative non garantie ne doit pas être présentée comme une certitude."],["Tout révéler ou tout cacher","Ne pas dévoiler automatiquement ses limites, mais ne pas cacher une contrainte directement pertinente ni déformer les faits."],["Confondre prix et valeur","L’offre la plus chère n’est pas forcément la meilleure, l’offre la moins chère non plus."]]};var G=["Négociation commerciale classique","Appel d’offres","Référencement","Enchère inversée","Comité d’achat (multi-acteurs)","Sous contrainte","Représentation (agent)"],D=[{id:"contexte",s:"s1",kind:"Identifier",title:"Quel type de négociation ?",intro:"Les six situations de l’activité du cours, puis des situations inédites. Identifie le contexte principal en t’appuyant sur les caractéristiques de la situation, pas sur un mot-clé.",items:[{type:"single",tag:"Activité du cours",prompt:"Un commercial rencontre directement le responsable d’une PME. Ils discutent du prix, des quantités et du délai de livraison.",options:G,answer:0,explain:"Indice : <strong>échange direct et relativement libre</strong> entre deux interlocuteurs, sans procédure ni mise en concurrence formalisée."},{type:"single",tag:"Activité du cours",prompt:"Une collectivité publie un dossier précisant ses besoins, les conditions de réponse et une date limite.",options:G,answer:1,explain:"Indice : <strong>procédure + cahier des charges + échéance</strong>."},{type:"single",tag:"Activité du cours",prompt:"Une entreprise souhaite vendre ses produits dans une grande enseigne et rencontre l’acheteur de la centrale.",options:G,answer:2,explain:"Indice : <strong>référencement + centrale/acheteur</strong>."},{type:"single",tag:"Activité du cours",prompt:"Un acheteur met plusieurs fournisseurs en concurrence sur une plateforme ; ils peuvent modifier leurs prix pendant une période déterminée.",options:G,answer:3,explain:"Indice : <strong>mise en concurrence + mécanisme d’enchère</strong> (modification des prix pendant une période déterminée)."},{type:"single",tag:"Activité du cours",prompt:"Un commercial présente son offre à l’acheteur, au responsable financier et au responsable technique.",options:G,answer:4,explain:"Indice : <strong>plusieurs interlocuteurs dans la décision</strong>, aux préoccupations différentes (conditions, budget, faisabilité)."},{type:"single",tag:"Activité du cours",prompt:"Un client doit remplacer une machine en panne sous 48 heures.",options:G,answer:5,explain:"Indice : une <strong>contrainte forte</strong> (délai, urgence) influence directement la négociation."},{type:"single",tag:"Situation inédite",prompt:"Un hôpital publie sur une plateforme un avis de consultation pour la fourniture de 2 000 blouses par an pendant trois ans, avec des critères pondérés (prix 50 %, qualité 30 %, délais 20 %) et une date limite de dépôt.",options:G,answer:1,explain:"Besoin défini, critères, date limite : <strong>procédure + cahier des charges + échéance</strong>. C’est un appel d’offres."},{type:"single",tag:"Situation inédite",prompt:"Une PME de cosmétiques bio obtient un rendez-vous avec l’acheteur d’une enseigne de parapharmacie pour faire entrer trois produits dans ses 90 magasins ; l’acheteur évoque déjà une participation aux catalogues promotionnels.",options:G,answer:2,explain:"Intégrer des produits dans l’offre d’une enseigne, conditions commerciales discutées (promotions) : <strong>référencement</strong>."},{type:"single",tag:"Situation inédite",prompt:"Une clinique privée choisit un logiciel de planification : la directrice décidera après l’avis du directeur financier, du responsable informatique et des infirmières qui l’utiliseront.",options:G,answer:4,explain:"<strong>Plusieurs interlocuteurs impliqués dans la décision</strong>, aux rôles différents (décideur, financier, technique, utilisateurs)."},{type:"single",tag:"Situation inédite",prompt:"Le seul fournisseur d’un composant électronique vient d’être racheté et annonce une hausse de 18 %. Le fabricant n’a que six semaines de stock et aucun autre fournisseur homologué.",options:G,answer:5,explain:"Contrainte forte : <strong>dépendance à un fournisseur</strong> et délai (six semaines de stock). Le cours cite explicitement la dépendance à un fournisseur."},{type:"single",tag:"Situation inédite",prompt:"Un agent rencontre une jeune nageuse prometteuse pour la convaincre de lui confier sa représentation ; elle hésite avec une grande agence.",options:G,answer:6,explain:"Première négociation de l’agent : <strong>obtenir et sécuriser le mandat</strong> (séance 4). Il vend ses services avant de négocier pour le compte de la sportive."},{type:"single",tag:"Piège du mot-clé",prompt:"Le gérant d’un restaurant annonce à son fournisseur de vin habituel : « Je lance un appel d’offres ! ». Il n’a publié aucun dossier, ne consulte aucun autre fournisseur et discute directement avec lui du prix et des délais.",options:G,answer:0,explain:"Le mot « appel d’offres » est prononcé, mais aucune caractéristique n’est présente : ni procédure, ni cahier des charges, ni échéance, ni concurrence. C’est un <strong>échange direct et relativement libre</strong>. D’où la consigne du cours : ne pas chercher uniquement un mot-clé."}]},{id:"dimensions",s:"s1",kind:"Analyser",title:"Les quatre dimensions",intro:"Place chaque situation sur les dimensions du cours : cadre, temporalité, acteurs, information.",items:[{type:"grid",scenario:"Une collectivité publie un avis pour l’entretien de ses espaces verts : cahier des charges, critères pondérés, date limite. Les offres sont analysées par le service achats et le service technique, puis une commission choisit. Le prix maximal n’est pas publié.",prompt:"Caractérise ce contexte.",rows:[{label:"Cadre",options:["Relativement libre","Fortement encadré"],answer:1,why:"Règles, délais, procédure et conditions de réponse sont définis à l’avance."},{label:"Temporalité",options:["Ponctuelle","Processus formalisé"],answer:1,why:"Plusieurs étapes organisées : réponse, analyse, sélection, décision."},{label:"Acteurs",options:["Individuelle (1 ↔ 1)","Comité / multi-acteurs","Mise en concurrence (plusieurs vendeurs)"],answer:2,why:"Plusieurs candidats sont mis en concurrence par un acheteur (qui est lui-même composé de plusieurs services)."},{label:"Information",options:["Relativement équilibrée","Asymétrique"],answer:1,why:"Le budget n’est pas publié et chaque candidat ignore les offres des autres : l’information est asymétrique."}]},{type:"grid",scenario:"Le gérant d’une boulangerie négocie avec son fournisseur de farine, qu’il connaît depuis dix ans, une remise pour une commande plus importante. Ils se voient une heure et échangent ouvertement sur les volumes et les prix pratiqués.",prompt:"Caractérise ce contexte.",rows:[{label:"Cadre",options:["Relativement libre","Fortement encadré"],answer:0,why:"Aucune procédure : les sujets et propositions peuvent évoluer."},{label:"Temporalité",options:["Ponctuelle","Processus formalisé"],answer:0,why:"Échanges concentrés sur une période courte : contact → échanges → accord."},{label:"Acteurs",options:["Individuelle (1 ↔ 1)","Comité / multi-acteurs","Mise en concurrence (plusieurs vendeurs)"],answer:0,why:"Un acheteur, un vendeur."},{label:"Information",options:["Relativement équilibrée","Asymétrique"],answer:0,why:"Ils échangent ouvertement et connaissent bien la relation : informations assez proches (sans être identiques)."}]},{type:"grid",scenario:"Un acheteur industriel organise une enchère inversée en ligne de 30 minutes entre six transporteurs présélectionnés. Seul le prix est affiché ; chaque transporteur ne voit que son rang, pas les prix des autres.",prompt:"Caractérise ce contexte.",rows:[{label:"Cadre",options:["Relativement libre","Fortement encadré"],answer:1,why:"Le mécanisme d’enchère fixe les règles, la durée et ce qui est visible."},{label:"Acteurs",options:["Individuelle (1 ↔ 1)","Comité / multi-acteurs","Mise en concurrence (plusieurs vendeurs)"],answer:2,why:"Plusieurs vendeurs face à un acheteur."},{label:"Information",options:["Relativement équilibrée","Asymétrique"],answer:1,why:"Les transporteurs ne voient que leur rang ; l’acheteur voit tout."}]},{type:"grid",scenario:"Une PME présente son logiciel à une clinique privée. La clinique a prévu trois étapes : démonstration, essai d’un mois, décision en comité (directrice, directeur financier, informaticien, cadre infirmier). Elle n’a pas communiqué son budget.",prompt:"Caractérise ce contexte.",rows:[{label:"Temporalité",options:["Ponctuelle","Processus formalisé"],answer:1,why:"Plusieurs étapes organisées par la clinique, que la PME ne maîtrise pas toutes."},{label:"Acteurs",options:["Individuelle (1 ↔ 1)","Comité / multi-acteurs","Mise en concurrence (plusieurs vendeurs)"],answer:1,why:"Un vendeur face à un comité aux préoccupations différentes."},{label:"Information",options:["Relativement équilibrée","Asymétrique"],answer:1,why:"Le budget de l’acheteur n’est pas connu du vendeur : exemple type du cours."}]}]},{id:"grille",s:"s1",kind:"Analyser",title:"À quelle question de la grille ?",intro:"Chaque information d’un dossier répond à l’une des neuf questions de la grille d’analyse. Range-les.",items:[{type:"classify",prompt:"Range chaque information sous la question de la grille à laquelle elle répond.",cats:["Qui ?","Pourquoi ?","Règles ?","Informations ?","Enjeux ?","Rapport de force ?","Contraintes ?","Alternatives ?","Variables ?"],entries:[["Le directeur financier aura le dernier mot sur le choix du fournisseur.",0,"Parties prenantes et décideurs : « Qui ? »."],["L’enseigne veut renforcer son image de produits locaux auprès de ses clients.",1,"Objectif et intérêt d’une partie : « Pourquoi ? »."],["Les offres doivent être déposées sur la plateforme avant le 15 mars, selon le règlement de consultation.",2,"Cadre et procédure : « Avec quelles règles ? »."],["Le fournisseur ne connaît pas le budget maximal de l’acheteur.",3,"Information disponible ou manquante : « Avec quelles informations ? » (asymétrie)."],["Si le contrat est perdu, l’entreprise devra se séparer de deux intérimaires.",4,"Ce que la partie risque de perdre : « Quels enjeux ? »."],["Le fournisseur réalise 45 % de son chiffre d’affaires avec ce distributeur.",5,"Dépendance : « Quel rapport de force ? » (cf. fournisseur A du cours)."],["L’usine ne peut pas produire plus de 2 000 unités par mois.",6,"Capacité de production : « Quelles contraintes ? »."],["Une autre enseigne a déjà proposé de référencer le produit.",7,"Solution de repli : « Quelles alternatives ? » (MESORE / BATNA)."],["La durée du contrat, les délais de paiement et les volumes peuvent être discutés.",8,"Ce qui peut bouger : « Quelles variables négociables ? »."]]}]},{id:"consultation",s:"s2",kind:"Analyser",title:"Décortiquer une consultation",intro:"Un dossier d’appel d’offres inventé pour l’entraînement. Distingue les quatre catégories d’éléments, puis calcule une note pondérée.",items:[{type:"classify",scenario:"<p><strong>Communauté de communes du Val d’Orge (fictive) — Maintenance des chaudières de 12 bâtiments communaux.</strong> Durée : 36 mois. Montant maximal : 180 000 € HT. Critères : prix 40 %, valeur technique (mémoire technique) 40 %, délai d’intervention proposé 20 %. Exigences : attestation d’assurance responsabilité civile professionnelle ; techniciens qualifiés ; intervention en moins de 4 heures pour les pannes urgentes ; visite préventive mensuelle. Le règlement prévoit une négociation avec les trois candidats les mieux classés, portant sur le prix, les délais et les modalités d’exécution.</p>",prompt:"Classe chaque élément.",cats:["Exigence obligatoire","Critère d’évaluation","Élément différenciant","Variable négociable"],entries:[["L’attestation d’assurance responsabilité civile professionnelle",0,"Une assurance exigée : sans elle, l’offre peut être écartée."],["Intervenir en moins de 4 heures pour une panne urgente",0,"Délai maximal imposé : exigence obligatoire (on peut proposer mieux, pas moins bien)."],["La visite préventive mensuelle",0,"Prévue par le dossier : la réduire pour baisser le prix rendrait l’offre non conforme."],["Le prix (40 %)",1,"Critère de comparaison des offres, avec sa pondération."],["Le mémoire technique (40 %)",1,"La valeur technique est notée sur le mémoire."],["Le délai d’intervention proposé (20 %)",1,"Critère noté : un délai plus court que 4 h rapporte des points."],["Un interlocuteur unique pour tout le marché",2,"Rend l’offre plus attractive — exemple cité par le cours."],["Un outil de suivi en ligne des interventions",2,"Exemple de différenciation du cours, utile si les services veulent suivre les pannes."],["Les modalités d’exécution (calendrier des visites, créneaux)",3,"Explicitement ouvertes à la négociation par le règlement."],["Le prix, lors de la phase de négociation avec les trois premiers",3,"Le règlement autorise la négociation sur le prix : variable négociable (dans cette procédure)."]]},{type:"single",prompt:"Un concurrent propose de remplacer la visite mensuelle par une visite trimestrielle « pour être 15 % moins cher ». Que risque-t-il ?",options:["Rien : le prix pèse 40 %, il gagnera des points.","Que son offre soit écartée : la visite mensuelle est une exigence du dossier.","D’être mieux noté sur la valeur technique.","D’obtenir automatiquement une phase de négociation."],answer:1,explain:"« Une offre qui ne respecte pas une exigence essentielle peut être écartée, même si elle présente un prix intéressant. » On ne présente jamais une exigence obligatoire comme négociable."},{type:"numeric",prompt:"Les notes sur 10 de l’offre B sont : prix 6, valeur technique 9, délai d’intervention 8. Avec la pondération 40 / 40 / 20, quelle est sa note globale sur 10 ?",answer:7.6,tol:.05,unit:"/ 10",steps:"0,4 × 6 + 0,4 × 9 + 0,2 × 8 = 2,4 + 3,6 + 1,6 = <strong>7,6</strong>. L’offre A, moins chère (prix 8, technique 6, délai 5), n’obtient que 0,4 × 8 + 0,4 × 6 + 0,2 × 5 = 6,6 : quand le prix ne pèse que 40 %, le moins cher ne gagne pas forcément."}]},{id:"gonogo",s:"s2",kind:"Décider",title:"Go, No-Go ou Go sous conditions ?",intro:"Pour chaque entreprise, prends la décision la plus justifiée au regard de la capacité, de la rentabilité et des chances de réussite.",items:[{type:"single",scenario:"Une PME de nettoyage a les compétences, le personnel et les certifications demandés ; elle intervient déjà dans la zone ; elle a trois références similaires. Le prix pèse 40 %, la valeur technique 60 % ; sa marge prévisible est correcte.",prompt:"Quelle décision ?",options:["Go","No-Go","Go sous conditions"],answer:0,explain:"Capacité vérifiée, rentabilité correcte, chances solides (références, poids élevé de la valeur technique) : <strong>Go</strong>."},{type:"single",scenario:"Une entreprise de 6 salariés vise un marché qui exige 15 techniciens disponibles en permanence et une certification qu’elle ne possède pas. La date limite est dans 8 jours.",prompt:"Quelle décision ?",options:["Go","No-Go","Go sous conditions"],answer:1,explain:"« Une entreprise peut être intéressée par un marché sans être réellement capable de l’exécuter. » Moyens humains et certification manquants, délai trop court pour trouver un partenaire : <strong>No-Go</strong> (le cours évoque la recherche d’un partenaire quand des compétences manquent, mais ici le délai le rend irréaliste)."},{type:"single",scenario:"Le marché correspond parfaitement à l’activité, mais le dossier ne précise pas si les pièces détachées sont incluses dans le forfait, ce qui change complètement la rentabilité. L’acheteur accepte des questions écrites jusqu’à dix jours avant la date limite.",prompt:"Quelle décision ?",options:["Go","No-Go","Go sous conditions"],answer:2,explain:"L’entreprise poursuit l’analyse mais doit <strong>obtenir une information</strong> (périmètre des pièces) avant de décider : c’est la définition du <strong>Go sous conditions</strong>."},{type:"single",scenario:"Un marché d’un hôpital prestigieux offre une marge inférieure à l’habitude mais positive. Il ouvrirait à l’entreprise des références dans le secteur de la santé, qu’elle cherche à conquérir depuis deux ans.",prompt:"Quelle décision ?",options:["Go","No-Go","Go sous conditions"],answer:0,explain:"« L’entreprise peut accepter une rentabilité modérée si l’intérêt stratégique est réel » (potentiel commercial, références) : <strong>Go</strong>, à condition que la marge reste positive après chiffrage complet."},{type:"single",scenario:"Le dossier impose un délai d’intervention d’une heure sur un territoire de 80 km, avec des pénalités très lourdes. L’entreprise est située à 60 km et n’a pas les moyens d’installer une antenne locale.",prompt:"Quelle décision ?",options:["Go","No-Go","Go sous conditions"],answer:1,explain:"Risques contractuels (délais, pénalités) inacceptables et capacité géographique insuffisante : « des contraintes trop fortes peuvent justifier un No-Go »."}]},{id:"faits",s:"cas",kind:"Trier l’information",title:"Fait, hypothèse ou information manquante ?",intro:"Consigne du cas MarketOne / TempoRun : « distinguer systématiquement les faits établis, les hypothèses et les informations manquantes ». À toi.",items:[{type:"classify",prompt:"Classe chaque affirmation.",cats:["Fait établi","Hypothèse","Information manquante"],entries:[["Le prix public envisagé est de 60 € TTC.",0,"Donné dans le dossier commun (CC1, CC2)."],["MarketOne générera 120 commandes par mois.",1,"C’est une estimation évoquée oralement : la transformer en certitude est l’erreur que le dossier interdit."],["La méthode de calcul de la prévision de 120 commandes.",2,"« Non communiquée dans les documents accessibles aux deux parties » : à demander."],["La commission est de 15 % du prix de vente HT.",0,"Proposition commerciale communiquée (CC2)."],["Le détail précis des prestations incluses dans la logistique à 4,50 €.",2,"« Doit être confirmé » : information manquante."],["La ceinture affiche une note de 4,6/5 sur 38 avis sur le site de TempoRun.",0,"Fiche produit publique (CC3)."],["L’amélioration du guide des tailles a fait baisser durablement les retours.",1,"Seulement dix commandes depuis : « ne suffit pas pour conclure »."],["RunSphere vendra 30 à 45 ceintures par mois.",1,"Volume « évoqué », « sans garantie »."],["La position de la ceinture dans les résultats de recherche de MarketOne.",2,"Non garantie et inconnue : la présence au catalogue ne garantit pas une place en haut des résultats."],["Huit offres comparables ont été observées dans la catégorie.",0,"Fait de l’observation (CC4) — mais ponctuelle et non exhaustive : à utiliser avec prudence."]]}]},{id:"reveler",s:"cas",kind:"Gérer l’information",title:"Commun ou confidentiel : que révéler ?",intro:"Tu représentes TempoRun face à MarketOne. Le dossier demande de ne pas révéler automatiquement tes informations internes… sans déformer les faits ni cacher une contrainte directement pertinente.",items:[{type:"single",prompt:"MarketOne demande : « Combien de stock pouvez-vous mobiliser au lancement ? »",options:["« Autant que nécessaire, nous suivrons la demande. »","« 75 unités dès maintenant, puis un réassort avec notre prochain lot de production ; nous préférons un lancement progressif. »","« C’est confidentiel. »","« Nous accélérerons la production autant qu’il le faudra. »"],answer:1,explain:"Le stock est une information confidentielle, mais <strong>directement pertinente</strong> pour l’engagement : la cacher ou l’exagérer ferait échouer l’exécution. Promettre « autant que nécessaire » est faux (capacité 210 unités/mois tous canaux) ; accélérer coûte 2,50 €/unité et fait passer la contribution sous 14 €."},{type:"single",prompt:"MarketOne : « Plusieurs avis parlent de difficultés de taille. Avez-vous beaucoup de retours ? »",options:["« Non, aucun problème. »","« Notre taux de retour a été de 8 % au dernier trimestre, surtout pour des questions de réglage ; nous avons refait le guide des tailles et proposons de suivre les retours pendant le test. »","« Voici tous nos chiffres internes : 8 % de retours, 21 € de coût de fabrication et un seuil de 14 € par commande. »","« Les retours ne vous concernent pas. »"],answer:1,explain:"Le dossier TempoRun demande de « ne pas cacher une contrainte si elle devient directement pertinente » et de préparer « une explication factuelle et une mesure correctrice ». Nier serait déformer les faits ; tout dévoiler (coûts, seuil) affaiblirait inutilement TempoRun."},{type:"single",prompt:"Faut-il dire à MarketOne que la direction exige au moins 14 € de contribution par commande ?",options:["Oui, dès le début, pour être transparent.","Non, pas spontanément : c’est une limite interne de décision ; elle sert à TempoRun pour accepter ou refuser, pas à MarketOne pour construire l’accord.","Oui, pour obtenir une baisse de la commission.","Il faut dire que le seuil est de 20 € pour se protéger."],answer:1,explain:"On ne révèle pas automatiquement ses limites. Demander une baisse de commission est inutile (non négociable dans le cas) ; annoncer un faux seuil serait déformer les faits."},{type:"single",prompt:"Comment utiliser la proposition de RunSphere face à MarketOne ?",options:["Ne jamais en parler.","Annoncer que RunSphere garantit 45 commandes par mois.","Évoquer l’existence d’autres options de distribution, sans en dévoiler les conditions ni la présenter comme certaine, et rappeler qu’une décision doit être prise rapidement.","Transmettre à MarketOne la proposition écrite de RunSphere."],answer:2,explain:"L’alternative renforce la position (séances 3 et 4) à condition de rester crédible : son volume n’est pas garanti. La présenter comme une certitude serait faux — et c’est précisément une faiblesse que MarketOne pourrait relever. L’échéance de trois semaines justifie d’obtenir vite les clarifications."}]},{id:"rapport",s:"s3",kind:"Évaluer",title:"Qui dépend le plus de l’autre ?",intro:"Évalue le rapport de force avec les critères du cours : dépendance, alternatives, attractivité de l’offre, rareté du profil.",items:[{type:"single",tag:"Exemple du cours",prompt:"Fournisseur A : 40 % de son chiffre d’affaires avec l’enseigne, quasiment aucune autre possibilité de distribution. Qui est en position de force ?",options:["Le fournisseur","L’enseigne","Équilibre"],answer:1,explain:"Forte dépendance du fournisseur → <strong>position de négociation fragile</strong>. L’enseigne a des alternatives (autres fournisseurs, produits substituables)."},{type:"single",prompt:"Une fromagerie produit le seul fromage AOP de sa petite région. Une enseigne régionale veut absolument ce produit pour son positionnement « terroir ». La fromagerie vend aussi en direct et à deux autres enseignes.",options:["La fromagerie","L’enseigne","Équilibre"],answer:0,explain:"Produit attractif et difficilement substituable pour le positionnement de l’enseigne, faible dépendance de la fromagerie (vente directe + deux enseignes) : le rapport de force penche vers <strong>la fromagerie</strong>."},{type:"single",prompt:"Une start-up réalise 70 % de son chiffre d’affaires avec une seule enseigne et demande d’élargir son référencement ; l’enseigne dispose de trois produits substituables.",options:["La start-up","L’enseigne","Équilibre"],answer:1,explain:"Dépendance très forte de la start-up et alternatives crédibles de l’enseigne : position fragile pour la start-up."},{type:"single",prompt:"Un club doit remplacer d’urgence son meneur de jeu blessé avant la fin du mercato. Le joueur visé dispose de deux autres offres crédibles.",options:["Le joueur (et son agent)","Le club","Équilibre"],answer:0,explain:"Le club subit une contrainte de délai et a peu d’alternatives ; le joueur a des alternatives crédibles : « plus les alternatives de son client sont crédibles, plus l’agent dispose de marges de négociation »."},{type:"single",prompt:"Une marque hésite entre trois athlètes au profil très proche pour sa campagne ; l’athlète approchée n’a aucune autre proposition.",options:["L’athlète","La marque","Équilibre"],answer:1,explain:"Profil peu rare pour cette marque (trois profils proches), aucune alternative pour l’athlète : la marque est en position de force. L’agent devra travailler la proposition de valeur pour se distinguer."}]},{id:"batna",s:"s3",kind:"Évaluer",title:"Identifier la BATNA",intro:"La BATNA (ou MESORE) est la solution de repli en cas d’absence d’accord. Encore faut-il l’identifier… et juger sa crédibilité.",items:[{type:"single",prompt:"Cas MarketOne : quelle est la BATNA de TempoRun ?",options:["Obtenir une baisse de la commission MarketOne.","La proposition de RunSphere — ou, à défaut, continuer à vendre sur son seul site.","La publicité sponsorisée.","Accélérer la production."],answer:1,explain:"Sans accord avec MarketOne, TempoRun peut accepter RunSphere (proposition indicative non encore acceptée) ou rester sur son canal direct. Les autres réponses ne sont pas des solutions de repli."},{type:"single",prompt:"Cas MarketOne : quelle est la BATNA de MarketOne ?",options:["Référencer d’autres vendeurs de ceintures comparables (huit offres observées, dont trois à deux porte-bidons).","Baisser son abonnement.","Garantir 120 commandes.","Elle n’en a pas."],answer:0,explain:"L’observation du rayon montre des produits substituables : c’est l’alternative du distributeur (« autres fournisseurs et produits substituables »)."},{type:"single",prompt:"Pourquoi TempoRun doit-elle éviter de présenter RunSphere comme une certitude ?",options:["Parce que RunSphere est plus cher.","Parce que son volume (30 à 45 commandes) n’est pas garanti, qu’aucune visibilité n’est assurée et que l’offre n’est pas acceptée : la surestimer serait déformer les faits et MarketOne pourrait le relever.","Parce que c’est interdit par MarketOne.","Parce qu’une BATNA ne sert à rien."],answer:1,explain:"Une alternative pèse par sa crédibilité. La surestimer fragilise la position dès que l’autre partie la questionne."},{type:"multi",prompt:"Selon le cours, quelles sont les alternatives possibles d’un fournisseur ?",options:["D’autres enseignes","D’autres circuits","D’autres clients","Des produits substituables"],answers:[0,1,2],explain:"Fournisseur : autres enseignes, autres circuits, autres clients. Les produits substituables sont l’alternative du distributeur."}]},{id:"concessions",s:"s2",kind:"Négocier",title:"Concession → contrepartie",intro:"Le fil rouge des séances 2, 3 et 4 : une concession ne se donne pas, elle s’échange — et, pour un agent, elle doit rester dans l’intérêt du client.",items:[{type:"single",prompt:"L’acheteur de la centrale : « Il me faut 5 % de remise sur votre gamme. » Quelle réponse respecte le cours ?",options:["« D’accord pour 5 %. »","« Si vous vous engagez sur un volume de 20 000 unités sur l’année et sur la référence de notre nouveauté, je peux envisager 5 % sur cette gamme. »","« Impossible, notre prix est notre prix. »","« Faisons 2,5 % : coupons la poire en deux. »"],answer:1,explain:"« Si vous vous engagez sur tel volume, je peux envisager telle condition » : la concession devient une variable d’échange. Accepter ou couper la poire en deux, c’est concéder sans contrepartie ; refuser par principe ignore l’économie globale de la relation."},{type:"single",prompt:"Dès les premières minutes, avant même d’avoir parlé de ses besoins, l’acheteur demande une remise. Que faire ?",options:["Accorder une petite remise pour créer un bon climat.","Poser des questions pour comprendre ses priorités avant de discuter d’une éventuelle concession.","Quitter la négociation.","Proposer d’emblée son seuil minimal."],answer:1,explain:"Les questions permettent de « négocier sur les véritables enjeux plutôt que de réduire immédiatement le prix ». Révéler son seuil minimal supprimerait toute marge."},{type:"single",prompt:"Pour réduire votre prix, un collègue propose de remplacer la visite mensuelle exigée par le cahier des charges par une visite trimestrielle. Ton avis ?",options:["Bonne idée : c’est une concession sur le périmètre.","Non : c’est une exigence obligatoire, la modifier rendrait l’offre non conforme et elle pourrait être écartée.","Oui si on le compense par un argument commercial.","Oui, à condition d’en informer l’acheteur après la signature."],answer:1,explain:"La conformité est le socle de l’offre : « une entreprise ne peut pas compenser une non-conformité par un argument commercial »."},{type:"single",prompt:"Le fournisseur accepte de passer de 10 € à 9 €. Quelle contrepartie a le plus de valeur pour lui ?",options:["La promesse d’en reparler l’an prochain.","Le référencement de deux références supplémentaires dans 80 magasins, inscrit dans la convention.","L’obligation de livrer en 24 heures.","Une réduction de la durée de l’accord."],answer:1,explain:"Il faut comparer la valeur de la contrepartie au coût réel de la concession : un élargissement formalisé dans la convention rapporte des volumes. Une promesse vague n’engage pas ; livrer en 24 h est un coût supplémentaire, pas une contrepartie."},{type:"single",prompt:"Agent : le club propose +10 % de salaire si ta cliente signe 4 ans au lieu de 2. Elle veut tenter une expérience à l’étranger dans deux ans. Quelle réponse ?",options:["Accepter : +10 % est une bonne affaire.","« Nous pouvons envisager trois ans si le contrat prévoit des conditions d’évolution permettant un départ à l’étranger après deux saisons. »","Refuser toute discussion sur la durée.","Accepter 4 ans et lui conseiller de changer de projet."],answer:1,explain:"Concession conditionnelle (« si vous nous accordez… ») <strong>et</strong> test de l’intérêt du mandant : un contrat long sans porte de sortie contredirait son objectif. Le salaire n’est qu’une variable parmi d’autres."},{type:"single",prompt:"Une marque offre 30 % de rémunération en plus contre une exclusivité « toutes catégories » pendant 5 ans. Ta cliente veut lancer sa propre ligne de vêtements dans deux ans.",options:["Accepter : la rémunération augmente.","Limiter l’exclusivité (catégorie, durée) en échange d’une part de la hausse, car l’exclusivité totale bloquerait un projet qui est dans l’intérêt de ta cliente.","Refuser la marque.","Accepter et renégocier dans 5 ans."],answer:1,explain:"« Cette concession est-elle réellement dans l’intérêt de mon client ? » L’exclusivité est une variable négociable : la limiter protège le mandant tout en laissant à la marque une raison réelle de conclure."}]},{id:"arguments",s:"s2",kind:"Argumenter",title:"Caractéristique → bénéfice",intro:"Un argument efficace est relié aux attentes de l’interlocuteur et montre le bénéfice pour lui. Choisis le meilleur.",items:[{type:"single",scenario:"L’acheteur d’un bailleur social se plaint que les ascenseurs restent en panne tout le week-end, ce qui provoque des réclamations des locataires.",prompt:"Quel argument ?",options:["« Nous sommes leaders du marché depuis 30 ans. »","« Nous avons 25 techniciens. »","« Notre astreinte le week-end permet de remettre un ascenseur en service dans la journée : vos locataires ne restent plus bloqués et vos réclamations diminuent. »","« Nous sommes les moins chers. »"],answer:2,explain:"Caractéristique (astreinte) → bénéfice relié à l’attente exprimée (pannes du week-end, réclamations)."},{type:"single",scenario:"La centrale d’une enseigne cherche à développer son rayon de produits locaux pour se distinguer de ses concurrents.",prompt:"Quel argument pour une PME régionale ?",options:["« Nos biscuits sont fabriqués à 40 km de vos magasins avec du beurre de la région : vous proposez à vos clients une offre locale que vos concurrents n’ont pas. »","« Notre usine a été rénovée en 2024. »","« Nous pouvons vous faire 10 % de remise. »","« Nos biscuits sont bons. »"],answer:0,explain:"Le cours : le fournisseur doit démontrer que son produit répond aux besoins des clients de l’enseigne et à son positionnement."},{type:"single",scenario:"Cas MarketOne : la plateforme craint les demandes de service client liées aux tailles.",prompt:"Quel argument de TempoRun ?",options:["« Notre ceinture est la meilleure du marché. »","« Nous avons refait le guide des tailles et le réglage : la fiche produit répondra aux questions avant l’achat, ce qui limite les sollicitations de votre service client — et nous proposons de suivre ensemble les retours pendant le test. »","« Les retours ne sont pas votre problème. »","« Nous baissons notre prix à 50 € TTC. »"],answer:1,explain:"Il répond à une préoccupation réelle de MarketOne, sans promettre un résultat non prouvé (le suivi des retours permet de le vérifier)."},{type:"single",scenario:"Un sponsor de matériel de trail veut toucher les 18–25 ans, une cible où il manque de crédibilité.",prompt:"Quel argument de l’agent d’une jeune traileuse ?",options:["« Elle a gagné trois courses cette année. »","« Elle veut 40 000 € par an. »","« Sa communauté est composée à 70 % de 18–25 ans très engagés ; avec des contenus mensuels et une collection co-conçue, vous gagnez la crédibilité qui vous manque auprès de cette cible. »","« C’est la meilleure de sa génération. »"],answer:2,explain:"Proposition de valeur : ce que la sportive apporte à la marque, relié à l’attente de la marque (crédibilité auprès des 18–25 ans)."}]},{id:"questions",s:"s2",kind:"Questionner",title:"Questions stratégiques",intro:"Les bonnes questions servent à comprendre les priorités de l’autre et à obtenir les informations qui manquent — pas à dévoiler ses propres limites.",items:[{type:"multi",prompt:"TempoRun prépare la commission contradictoire. Quelles questions faut-il poser à MarketOne ? (trois bonnes réponses)",options:["« Sur quelles données repose l’estimation de 120 commandes, et suppose-t-elle de la publicité sponsorisée ? »","« Que comprend exactement la logistique à 4,50 € : stockage, préparation, expédition, retours ? »","« Pouvez-vous baisser votre commission à 12 % ? »","« Quels indicateurs suivrons-nous pendant le test de trois mois, et à quel rythme ? »","« Saviez-vous que notre seuil de rentabilité est de 14 € ? »"],answers:[0,1,3],explain:"Les questions utiles portent sur les informations manquantes du dossier (méthode de la prévision, périmètre logistique) et sur les modalités discutables (suivi du test). Demander une baisse de commission est inutile (non négociable) ; la dernière dévoile une limite interne."},{type:"multi",prompt:"Phase de négociation d’un appel d’offres de maintenance : quelles questions aident à négocier sur les vrais enjeux ? (deux bonnes réponses)",options:["« Quel est le critère qui pose aujourd’hui le plus de difficultés à vos services ? »","« Quel est le prix de notre concurrent ? »","« Qu’est-ce qui n’a pas fonctionné avec votre prestataire précédent ? »","« Combien voulez-vous que je baisse ? »"],answers:[0,2],explain:"Elles révèlent les priorités de l’acheteur. Demander le prix du concurrent n’obtiendra pas de réponse ; « combien voulez-vous que je baisse ? » ramène tout au prix."},{type:"multi",prompt:"L’agent d’une joueuse rencontre un sponsor. Quelles questions préparer ? (deux bonnes réponses)",options:["« Qui décide, chez vous, du choix des ambassadeurs ? »","« Que cherchez-vous à construire avec un athlète : visibilité, contenus, produits ? »","« Pouvez-vous payer plus que la marque concurrente ? »","« Ma cliente accepterait-elle moins si vous insistez ? »"],answers:[0,1],explain:"Ce sont deux questions de la méthode de l’agent : « Qui décide ? » et « Que recherche le partenaire ? ». La dernière trahirait les intérêts du mandant."}]},{id:"calculs",s:"cas",kind:"Calculer",title:"Calculs de négociation",intro:"Les chiffres du cas MarketOne / TempoRun (et l’exemple 10 € → 9 € de la séance 3). Saisis ta réponse (virgule ou point), puis regarde le raisonnement.",items:[{type:"numeric",tag:"Cas du cours",prompt:"Prix public 60 € TTC, TVA 20 %. Quelle est la commission MarketOne (15 % du prix HT) par commande ?",answer:7.5,tol:.01,unit:"€",steps:"Prix HT = 60 ÷ 1,20 = 50 €. Commission = 15 % × 50 = <strong>7,50 €</strong>. Piège : la calculer sur le TTC (9 €)."},{type:"numeric",tag:"Cas du cours",prompt:"Contribution par commande avec la logistique MarketOne (fabrication 21 €, emballage 1,50 €, logistique 4,50 €) ?",answer:15.5,tol:.01,unit:"€",steps:"50 − 7,50 − 21 − 1,50 − 4,50 = <strong>15,50 €</strong>, avant abonnement, publicité, retours, personnel et frais généraux."},{type:"numeric",tag:"Cas du cours",prompt:"Contribution par commande si TempoRun expédie elle-même (5,80 €) ?",answer:14.2,tol:.01,unit:"€",steps:"50 − 7,50 − 21 − 1,50 − 5,80 = <strong>14,20 €</strong> : à peine au-dessus du seuil de 14 €."},{type:"numeric",tag:"Cas du cours",prompt:"Contribution par commande avec RunSphere (commission 12 %, expédition 5,20 €) ?",answer:16.3,tol:.01,unit:"€",steps:"Commission = 12 % × 50 = 6 €. 50 − 6 − 21 − 1,50 − 5,20 = <strong>16,30 €</strong>, sans abonnement mensuel."},{type:"numeric",tag:"Cas du cours",prompt:"Contribution d’une unité fabriquée en production accélérée (+2,50 €) et vendue avec la logistique MarketOne ?",answer:13,tol:.01,unit:"€",steps:"15,50 − 2,50 = <strong>13,00 €</strong> : <strong>sous le seuil de 14 €</strong> exigé par la direction. Accélérer la production pour suivre un volume non garanti dégrade la rentabilité."},{type:"numeric",tag:"Calcul dérivé du cas",prompt:"Si les 120 commandes mensuelles se réalisaient (logistique MarketOne, sans publicité), quelle contribution mensuelle resterait après l’abonnement de 49 € ?",answer:1811,tol:.5,unit:"€",steps:"120 × 15,50 = 1 860 € ; 1 860 − 49 = <strong>1 811 €</strong>, avant retours, service client, personnel et frais généraux. Rappel : 120 commandes n’est qu’une estimation."},{type:"numeric",tag:"Calcul dérivé du cas",prompt:"Combien de commandes mensuelles faudrait-il sur MarketOne (logistique MarketOne, abonnement de 49 € déduit) pour dégager autant que 30 commandes sur RunSphere ?",answer:35,tol:0,unit:"commandes",steps:"RunSphere : 30 × 16,30 = 489 €. MarketOne : 15,50 × n − 49 ≥ 489 → n ≥ 538 ÷ 15,50 ≈ 34,7 → <strong>35 commandes</strong>. MarketOne n’est plus intéressante que RunSphere que si elle apporte nettement plus de volume : d’où l’importance de questionner la prévision."},{type:"numeric",tag:"Calcul dérivé du cas",prompt:"Avec 65 ventes mensuelles sur le site et 120 commandes MarketOne, quelle part de la capacité mensuelle (210 unités, tous canaux) serait utilisée ? (en %, arrondi à l’unité)",answer:88,tol:.6,unit:"%",steps:"(65 + 120) ÷ 210 = 185 ÷ 210 ≈ <strong>88 %</strong> : « une grande pa

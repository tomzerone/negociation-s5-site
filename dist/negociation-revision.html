rtie de la capacité ». Ajouter RunSphere (30 à 45 commandes) en parallèle dépasserait la capacité."},{type:"numeric",tag:"Séance 3 — illustration",prompt:"Coût de revient hypothétique : 6 €. À 10 €, 1 000 unités rapportent 4 000 € de marge. Combien d’unités faut-il vendre à 9 € pour garder la même marge totale ? (arrondi à l’unité supérieure)",answer:1334,tol:0,unit:"unités",steps:"Marge unitaire à 9 € = 3 €. 4 000 ÷ 3 ≈ 1 333,3 → <strong>1 334 unités</strong>, soit environ +33 % de volume. La contrepartie doit valoir au moins ce que coûte la concession."}]},{id:"valeur",s:"s4",kind:"Arbitrer",title:"Prix ou valeur ?",intro:"Une offre financièrement supérieure n’est pas nécessairement meilleure. Arbitre en partant des intérêts du client.",items:[{type:"single",scenario:"Club A : salaire 30 % plus élevé, rôle de remplaçante. Club B : salaire plus bas, place de titulaire et projet de jeu construit autour d’elle. Objectif prioritaire de la joueuse : intégrer l’équipe nationale dans deux ans.",prompt:"Que doit faire son agent ?",options:["Choisir A : c’est l’offre la plus élevée.","Privilégier B, et utiliser l’offre de A comme alternative crédible pour améliorer B sur d’autres variables (primes, évolution, durée).","Refuser les deux offres.","Demander à A de payer encore plus."],answer:1,explain:"Prix ≠ valeur : le temps de jeu sert l’objectif de la joueuse. L’offre A reste utile comme levier, à la manière d’Adidas pour Jordan face à Nike."},{type:"single",scenario:"Marque X : 50 000 € par an, exclusivité toutes catégories, 5 ans. Marque Y : 35 000 € par an, collection co-conçue avec royalties, 3 ans, exclusivité limitée aux chaussures. L’athlète veut construire sa propre marque.",prompt:"Quelle offre crée le plus de valeur pour elle ?",options:["X, car la rémunération est plus élevée.","Y, car elle développe sa marque (collection, royalties) et préserve sa liberté (exclusivité limitée, durée plus courte).","Aucune différence.","X, car 5 ans c’est plus sûr."],answer:1,explain:"« Une bonne négociation… consiste à élargir la valeur créée par le partenariat » (Osaka et Levi’s, Serena Williams et Mission Skincare). L’exclusivité et la durée de X contraignent son projet."},{type:"single",prompt:"Dans l’exemple Jordan / Nike (1984), qu’est-ce qui a permis à David Falk d’améliorer la proposition de Nike ?",options:["La renommée de Nike.","L’offre concurrente d’Adidas, une alternative existante.","Une baisse de la commission de l’agent.","Un délai très court."],answer:1,explain:"« Une offre concurrente crédible peut renforcer la capacité de négociation. » Le contrat final associe rémunération, ligne de produits et participation aux revenus."},{type:"single",prompt:"Quelle formulation de l’agent construit une proposition de valeur avec une marque ?",options:["« Ma cliente coûte 60 000 €, c’est à prendre ou à laisser. »","« Ma cliente touche les 18–25 ans que vous visez ; avec des contenus mensuels et une capsule co-conçue, vous gagnez en crédibilité, et elle développe sa propre marque. »","« Ma cliente est très connue. »","« Elle signera avec le plus offrant. »"],answer:1,explain:"Elle répond aux deux questions : ce que la sportive apporte à la marque, ce que la marque lui apporte."}]},{id:"ordre",s:"x",kind:"Ordonner",title:"Remettre les étapes dans l’ordre",intro:"Les processus du cours, à remettre dans l’ordre avec les flèches.",items:[{type:"order",tag:"Séance 2",prompt:"La démarche face à un appel d’offres.",steps:["Analyser la consultation","Décider de répondre","Identifier les marges de manœuvre","Construire une offre","Préparer la négociation éventuelle"],explain:"On ne construit pas une offre avant d’avoir décidé de répondre, ni avant d’avoir identifié ce qui est obligatoire et ce qui est négociable."},{type:"order",tag:"Séance 1",prompt:"Un processus formalisé.",steps:["Préparation","Candidature / réponse","Sélection","Négociation","Décision","Contractualisation"],explain:"Dans un processus formalisé, la négociation n’intervient qu’après la sélection, et le négociateur ne maîtrise pas toutes les étapes."},{type:"order",tag:"Séance 3",prompt:"Le processus de référencement.",steps:["Préparer l’offre","Présenter les produits","Analyser les attentes","Négocier les conditions","Décider du référencement","Formaliser (convention)","Suivre l’accord"],explain:"La négociation n’est qu’une étape d’une relation commerciale plus large, qui se poursuit après la convention."},{type:"order",tag:"Séance 1",prompt:"Une négociation ponctuelle.",steps:["Prise de contact","Échanges","Accord","Contractualisation"],explain:"Échanges concentrés sur une période courte."},{type:"order",tag:"Séance 4",prompt:"L’évolution possible du rôle de l’agent.",steps:["Intermédiaire","Représentant","Conseiller","Développeur d’opportunités"],explain:"Le métier ne consiste pas seulement à négocier des contrats existants : l’agent peut créer de nouvelles opportunités (Federer, Godsick, Laver Cup)."}]},{id:"mandat",s:"s4",kind:"Vérifier",title:"Le mandat de l’agent",intro:"La première négociation de l’agent, et le cadre présenté par le support (à retenir tel quel).",items:[{type:"single",prompt:"Un agent propose à un jeune footballeur un mandat exclusif de cinq ans. D’après le support, est-ce possible ?",options:["Oui, si le joueur l’accepte.","Non : la durée du contrat d’agent ne peut excéder trois ans.","Oui, si la rémunération est faible.","Seulement pour un mineur."],answer:1,explain:"Le support : « La durée ne peut excéder trois ans. »"},{type:"single",prompt:"Un agent demande 12 % du contrat qu’il négociera. D’après le support ?",options:["C’est possible si le club paie.","C’est hors cadre : la rémunération ne peut excéder 10 % du contrat conclu par les parties mises en relation (une fédération délégataire peut fixer moins).","C’est la norme.","Il n’y a pas de plafond."],answer:1,explain:"Plafond de 10 %, plafond inférieur possible fixé par les fédérations délégataires."},{type:"multi",prompt:"Que doit préciser le contrat d’agent selon le support ?",options:["Les services","Leur caractère exclusif ou non","La durée","La rémunération de l’agent et la partie qui le rémunère","Le salaire minimum que l’agent garantit au sportif"],answers:[0,1,2,3],explain:"L’agent ne peut pas garantir un résultat ; le contrat précise services, exclusivité, durée, rémunération et qui la paie."},{type:"single",prompt:"Le sportif et l’agent se connaissent depuis longtemps et se font confiance. Peuvent-ils rester sans engagements écrits ?",options:["Oui, la confiance suffit.","Non : « la confiance facilite la relation, mais les engagements doivent être clairement définis ».","Oui, si le sportif est mineur.","Oui, pendant la première année."],answer:1,explain:"La confiance est une ressource, mais une relation durable suppose de clarifier responsabilités et attentes."},{type:"single",prompt:"Avant de négocier un contrat avec un club pour un sportif, que doit d’abord faire l’agent ?",options:["Contacter tous les clubs.","Convaincre le sportif de lui confier sa représentation et sécuriser son mandat.","Fixer le salaire.","Signer avec un sponsor."],answer:1,explain:"« Avant de négocier pour un sportif, l’agent doit réussir à convaincre le sportif de lui confier sa représentation. »"}]}];var zs=["Marge préservée","Relation","Valeur créée","Information obtenue"],oe=[{id:"referencement",s:"s3",title:"Le rendez-vous à la centrale",role:"Tu es commercial(e) de <strong>Verger d’Île-de-France</strong>, PME qui lance une gamme de trois jus de fruits premium (prix habituel : 10 € le carton de 6). Tu rencontres Mme Laurent, acheteuse de la centrale d’une enseigne de 150 supermarchés. Ton objectif : 3 références dans un maximum de magasins. Tes limites : ne pas descendre sous 9 € le carton, et ne pas promettre plus que ta capacité de production.",them:"Mme Laurent, acheteuse",nodes:[{say:"Votre gamme est sympathique, mais mes linéaires de jus sont pleins. Pourquoi devrais-je vous faire de la place ?",choices:[{t:"Nos jus sont pressés à froid, sans sucre ajouté, avec des fruits de vergers franciliens.",react:"Comme beaucoup d’autres. Et alors ?",fb:"Tu décris des caractéristiques sans les relier aux besoins de l’enseigne. Le cours : le fournisseur doit démontrer que le produit répond aux besoins des clients de l’enseigne.",q:"ok",g:[0,0,5,0]},{t:"Avant de vous présenter la gamme : quelles attentes vos clients expriment-ils sur le rayon jus, et qu’est-ce qui manque aujourd’hui à votre offre ?",react:"Nos clients demandent du local et du premium ; nous n’avons qu’une marque nationale sur ce segment.",fb:"Excellent : tu analyses les attentes avant d’argumenter. Tu obtiens une information clé — un manque sur le local premium — qui renforce l’attractivité de ton offre.",q:"good",g:[5,10,10,20]},{t:"Pour vous faire de la place, je peux vous proposer 10 % de remise dès aujourd’hui.",react:"C’est un début… Mais je verrai ce que vous proposez d’autre.",fb:"Concession gratuite, avant même de connaître les besoins : tu baisses ta marge sans rien obtenir. « Une concession doit être associée à une contrepartie. »",q:"bad",g:[-20,0,-5,0]}]},{say:"Bon. Je peux tester une seule référence, dans 20 magasins, pendant trois mois.",choices:[{t:"C’est les trois références dans tous les magasins, ou rien.",react:"Alors ce sera rien. J’ai d’autres fournisseurs qui frappent à la porte.",fb:"Position rigide qui suppose une alternative solide : la PME n’en a pas cité. Le distributeur a, lui, des produits substituables. Hiérarchise tes priorités plutôt que de tout bloquer.",q:"bad",g:[0,-20,-10,0]},{t:"Un test peut nous convenir. Fixons dès maintenant les critères : si la référence atteint un niveau de ventes convenu, nous élargissons à deux autres références et à 60 magasins.",react:"Des critères écrits… Je dois en parler à ma direction, mais c’est envisageable.",fb:"C’est exactement l’espace de négociation du cours : un référencement progressif, avec élargissement selon les résultats. Tu transformes ta concession (le test) en contrepartie future.",q:"good",g:[5,10,20,5]},{t:"D’accord pour une référence dans 20 magasins.",react:"Parfait. On verra pour la suite.",fb:"Accepter le test est raisonnable, mais sans critères d’élargissement, rien ne garantit la suite. Concession sans contrepartie.",q:"ok",g:[0,5,0,0]}]},{say:"Et pour ce test, il me faut un prix à 9 € le carton au lieu de 10 €.",choices:[{t:"Impossible, notre prix est de 10 €.",react:"Dans ce cas, je reste sur la marque nationale.",fb:"Le cours ne dit pas de refuser par principe : il dit de mesurer ce que rapporte la concession et de raisonner sur l’économie globale de la relation.",q:"bad",g:[5,-15,-5,0]},{t:"Je peux envisager 9 € sur la référence test si vous vous engagez sur l’élargissement prévu en cas de résultats et sur une mise en avant en tête de gondole pendant le lancement.",react:"La tête de gondole, je peux le faire sur un mois. Et l’élargissement, on l’écrit si les critères sont atteints.",fb:"« Si vous vous engagez sur…, je peux envisager… » : la remise devient une variable d’échange. Tu restes au-dessus de ton seuil (9 €) et tu obtiens des contreparties qui développent les ventes.",q:"good",g:[0,10,15,5]},{t:"Allez, 9 €, mais c’est bien parce que c’est vous.",react:"Merci. Et si on regardait aussi vos conditions de paiement ?",fb:"Tu cèdes sans contrepartie, et l’acheteuse en profite pour ouvrir un nouveau front. Une concession gratuite en appelle d’autres.",q:"bad",g:[-15,5,-5,0]}]},{say:"Pour le lancement, vous participerez à notre opération « Printemps gourmand » ?",choices:[{t:"Oui : nous proposons deux journées de dégustation dans les magasins du test et des supports en rayon, en échange d’un emplacement visible pendant l’opération.",react:"Des dégustations, nos clients adorent. Je note l’emplacement.",fb:"Trade marketing : promotion, animation, opération de lancement pour transformer le référencement en développement commercial — et toujours une contrepartie.",q:"good",g:[0,10,15,0]},{t:"Non, nous ne faisons pas de promotion.",react:"Dommage, c’est ce qui fait vendre les nouveautés chez nous.",fb:"Refuser tout trade marketing, c’est risquer un test qui échoue faute de visibilité.",q:"bad",g:[5,-10,-10,0]},{t:"Oui, nous financerons une remise supplémentaire de 20 % pendant toute l’opération.",react:"Excellent pour nous !",fb:"Promotion lourde, non chiffrée et sans contrepartie : elle peut faire passer la référence test sous ton seuil de rentabilité.",q:"bad",g:[-20,5,0,0]}]},{say:"Très bien. On formalise tout cela ?",choices:[{t:"Oui : écrivons dans la convention la référence test, les 20 magasins, le prix, la tête de gondole, les dégustations, les critères et le calendrier d’élargissement. Je vérifie aussi avec notre production que nous pouvons livrer les 60 magasins si le test réussit.",react:"Je vous envoie le projet de convention cette semaine.",fb:"Un accord doit être acceptable, économiquement viable et réalisable : formaliser dans la convention et anticiper l’exécution.",q:"good",g:[5,5,10,5]},{t:"Pas besoin, une poignée de main suffit entre nous.",react:"Comme vous voulez…",fb:"La convention formalise le résultat de la négociation : sans elle, tes contreparties (élargissement, emplacement) ne valent rien.",q:"bad",g:[-5,0,-10,0]},{t:"Oui, et je vous garantis une livraison en 24 heures dans les 150 magasins.",react:"Parfait, je l’ajoute.",fb:"Promesse non vérifiée : le négociateur doit anticiper ce que l’entreprise devra réellement exécuter.",q:"bad",g:[-10,5,0,0]}]}],debrief:"<p>Les réflexes du cours : <strong>analyser les attentes</strong> de l’enseigne avant d’argumenter ; viser un <strong>référencement progressif</strong> avec des critères d’élargissement ; transformer chaque concession en <strong>variable d’échange</strong> (« si vous vous engagez sur… ») ; utiliser le <strong>trade marketing</strong> ; <strong>formaliser</strong> dans la convention un accord acceptable, viable et réalisable.</p>"},{id:"ao",s:"s2",title:"Négociation après remise des offres",role:"Tu es responsable commercial(e) de <strong>Élévation Services</strong> (maintenance d’ascenseurs). Le règlement de consultation d’un bailleur social prévoit une négociation avec les trois candidats les mieux classés, sur le prix, les délais et les modalités d’exécution. Ton offre est la mieux notée sur la valeur technique, mais 6 % plus chère que la moins-disante. Ton seuil minimal acceptable : −3 % sur le prix déposé.",them:"M. Benali, responsable achats",nodes:[{say:"Nous vous recevons demain. Comment préparez-vous ce rendez-vous ?",narr:!0,choices:[{t:"Je définis mon objectif idéal, ma cible réaliste et mon seuil minimal ; je chiffre le coût de chaque concession possible ; je prépare mes arguments et mes questions.",react:"(Ta préparation est prête.)",fb:"« La négociation doit être préparée avant même que l’acheteur propose un échange » : objectifs, arguments, concessions, questions.",q:"good",g:[10,0,5,5]},{t:"Je décide d’accorder les 6 % pour être sûr de gagner.",react:"(Tu arrives avec une concession déjà faite.)",fb:"Tu abandonnes ta marge avant même de connaître les priorités de l’acheteur — et tu franchis ton seuil minimal (−3 %).",q:"bad",g:[-25,0,-5,0]},{t:"J’improviserai selon ses demandes.",react:"(Tu arrives sans plan.)",fb:"Sans seuil fixé à l’avance, tu risques de concéder au-delà de ce qui est viable.",q:"bad",g:[-10,0,0,0]}]},{say:"Votre offre est techniquement la meilleure, mais 6 % plus chère que celle d’un concurrent. Pouvez-vous vous aligner ?",choices:[{t:"Avant de parler du prix, qu’est-ce qui compte le plus pour vous dans ce marché ? Y a-t-il eu des difficultés avec le prestataire actuel ?",react:"Honnêtement, le budget est serré… mais nos élus reçoivent des plaintes sur les pannes du week-end.",fb:"Les questions permettent de « négocier sur les véritables enjeux plutôt que de réduire immédiatement le prix ». Tu découvres le vrai problème de l’acheteur.",q:"good",g:[5,10,5,20]},{t:"D’accord, nous nous alignons.",react:"Très bien, je le note.",fb:"Concession gratuite et au-delà de ton seuil. La meilleure note technique ne pèse plus rien.",q:"bad",g:[-25,5,-10,0]},{t:"Non, notre prix est justifié par notre qualité.",react:"Je comprends, mais je dois défendre le budget.",fb:"Refuser sans comprendre les priorités ferme la discussion. Le prix compte aussi dans la note.",q:"ok",g:[5,-10,0,0]}]},{say:"Les pannes du week-end, c’est notre premier sujet de réclamations.",choices:[{t:"Nous pouvons intégrer une astreinte le week-end, déjà chiffrée dans notre organisation. En contrepartie, nous maintenons notre prix, ou nous consentons −2 % si la durée ferme est de 48 mois.",react:"L’astreinte le week-end, c’est exactement ce qu’il nous faut. Les −2 % avec 48 mois fermes, je dois vérifier, mais c’est intéressant.",fb:"Élément différenciant qui répond à un besoin réel, concession limitée et conditionnée, au-dessus de ton seuil. Tu crées de la valeur au lieu de baisser le prix.",q:"good",g:[5,10,20,5]},{t:"Nous pouvons ajouter une application mobile de réservation des ascenseurs.",react:"Euh… ce n’est pas vraiment notre problème.",fb:"« Une innovation inutile ne constitue pas nécessairement un avantage commercial. » La différenciation doit répondre à un besoin réel.",q:"bad",g:[-5,-5,-5,0]},{t:"Pour baisser le prix, nous pourrions espacer les visites préventives mensuelles prévues au cahier des charges.",react:"Les visites mensuelles sont une exigence du dossier…",fb:"Tu proposes de négocier une exigence obligatoire : l’offre pourrait être écartée. Jamais présenter comme négociable une condition obligatoire.",q:"bad",g:[0,-15,-10,0]}]},{say:"Pourriez-vous aussi ramener le délai d’intervention de 4 heures à 2 heures sur tout le parc ?",choices:[{t:"Oui, bien sûr, sans changement de prix.",react:"Excellent !",fb:"Un délai très court nécessite astreinte, stocks, véhicules, organisation : « ces coûts doivent être pris en compte ». Accepter sans chiffrer, c’est risquer un marché déficitaire.",q:"bad",g:[-20,5,0,0]},{t:"Sur tout le parc, cela supposerait un véhicule et un technicien supplémentaires, que je dois intégrer au prix. En revanche, nous pouvons garantir 2 heures sur les ascenseurs des résidences seniors, sans surcoût.",react:"Les résidences seniors, c’est le plus sensible. Ça me va.",fb:"Tu chiffres le coût de la concession et tu proposes une variante ciblée (modalités d’exécution, périmètre) qui répond au besoin réel sans dégrader ta marge.",q:"good",g:[10,10,15,5]},{t:"Non, ce n’est pas possible.",react:"Dommage.",fb:"Un refus sec, alors qu’une solution ciblée existait.",q:"ok",g:[5,-5,-5,0]}]},{say:"Je vous propose de retenir : prix déposé −2 %, durée ferme 48 mois, astreinte le week-end, 2 heures sur les résidences seniors. Qu’en dites-vous ?",choices:[{t:"C’est au-dessus de notre seuil et cohérent avec nos coûts : nous acceptons, sous réserve que ces modalités figurent dans le marché.",react:"Parfait, nous formalisons.",fb:"Accord acceptable, économiquement viable et réalisable, formalisé. La satisfaction de l’acheteur et la rentabilité de l’entreprise sont préservées : c’est la conclusion de la séance 2.",q:"good",g:[10,10,10,0]},{t:"Ajoutons encore −2 % pour être sûrs d’être retenus.",react:"Volontiers…",fb:"Concession gratuite de plus, sans demande de l’acheteur : tu atteins −4 %, sous ton seuil.",q:"bad",g:[-20,0,-5,0]},{t:"Je dois réfléchir encore une semaine.",react:"Les autres candidats, eux, ont répondu…",fb:"Hésiter alors que l’accord respecte tes limites préparées, c’est prendre un risque inutile dans une procédure à calendrier.",q:"ok",g:[0,-10,0,0]}]}],debrief:"<p>Dans un appel d’offres, la qualité de la négociation dépend d’abord de la <strong>préparation</strong> (objectifs, seuil, coûts des concessions). Questionner l’acheteur révèle ses <strong>vraies priorités</strong> ; un <strong>élément différenciant utile</strong> vaut mieux qu’une baisse de prix ; on ne touche jamais aux <strong>exigences obligatoires</strong> ; chaque concession est <strong>chiffrée et conditionnée</strong>.</p>"},{id:"agent",s:"s4",title:"Agent d’une jeune basketteuse",role:"Tu es agent(e) sportif(ve). <strong>Inès Moreau</strong>, 21 ans, meneuse de jeu prometteuse, cherche un agent. Son objectif prioritaire : jouer beaucoup pour intégrer l’équipe de France d’ici deux ans, puis tenter une expérience à l’étranger. Elle hésite entre toi et une grande agence.",them:"Inès Moreau",nodes:[{say:"« Pourquoi je te confierais ma carrière plutôt qu’à la grande agence ? »",choices:[{t:"Je représente déjà trois internationales et je connais tous les présidents de club.",react:"« Ok… mais tu sais ce que moi, je veux ? »",fb:"Tu vends tes services sans partir des objectifs de la sportive. La première négociation consiste aussi à « comprendre les objectifs du sportif ».",q:"ok",g:[0,0,0,0]},{t:"Dis-moi d’abord ce que tu veux pour les deux prochaines saisons. Ensuite je te montre ce que je t’apporte — mon réseau, l’accès aux décideurs des clubs, mon expertise des contrats — et nous fixons ensemble les règles : missions, durée, exclusivité, rémunération.",react:"« Jouer, être vue par la sélection, et partir à l’étranger ensuite. Ça me parle. »",fb:"Tu démontres ta valeur à partir de ses objectifs et tu proposes de clarifier le mandat : « la relation agent-sportif est elle-même une négociation ».",q:"good",g:[0,15,10,20]},{t:"Je te garantis l’équipe de France dans un an.",react:"« Tu peux vraiment garantir ça ? »",fb:"Promesse impossible : l’agent ne maîtrise pas la sélection. Tu fragilises la confiance, qui est une ressource de la négociation.",q:"bad",g:[0,-15,-5,0]}]},{say:"« Et toi, tu prends combien, et pour combien de temps ? »",choices:[{t:"15 % de tes contrats, mandat exclusif de cinq ans.",react:"« C’est beaucoup… et long. »",fb:"Hors du cadre présenté par le support : la durée ne peut excéder trois ans et la rémunération 10 % du contrat conclu.",q:"bad",g:[0,-15,0,0]},{t:"Un mandat exclusif de deux ans pour la négociation de tes contrats de club, 6 % des contrats que je négocie, payés par toi ; tout est écrit : mes services, la durée, l’exclusivité et qui me rémunère.",react:"« Clair et carré. Je signe. »",fb:"Conforme au support (≤ 3 ans, ≤ 10 %, services, exclusivité, durée, rémunération et partie qui paie précisés) : « la confiance facilite la relation, mais les engagements doivent être clairement définis ».",q:"good",g:[5,15,5,0]},{t:"On verra plus tard, faisons-nous confiance.",react:"« Hmm… et si on n’est pas d’accord un jour ? »",fb:"La confiance ne dispense pas de clarifier les responsabilités et les attentes.",q:"bad",g:[0,-5,-5,0]}]},{say:"Deux offres arrivent. Club A : salaire 30 % plus élevé, rôle de remplaçante. Club B : salaire plus bas, titulaire, projet construit autour d’une jeune meneuse. Que fais-tu ?",narr:!0,choices:[{t:"Je pousse Inès vers le club A : c’est la meilleure offre.",react:"« Mais je vais jouer dix minutes par match… »",fb:"Prix ≠ valeur : une offre financièrement supérieure n’est pas meilleure si elle offre moins de potentiel. Tu défends une demande, pas les intérêts globaux de ta cliente.",q:"bad",g:[5,-10,-15,0]},{t:"Je privilégie le club B, et j’utilise l’offre du club A comme alternative crédible pour améliorer celle de B : primes liées aux objectifs, conditions d’évolution du salaire, place dans le projet.",react:"« Nous ne voulons pas la perdre. Nous pouvons ajouter des primes et une revalorisation en deuxième saison. »",fb:"Comme David Falk avec l’offre d’Adidas : « plus les alternatives de son client sont crédibles, plus l’agent dispose de marges ».",q:"good",g:[10,5,15,10]},{t:"J’invente une troisième offre pour faire monter les enchères.",react:"« Quel club ? Nous avons de bons contacts partout… »",fb:"Une offre inventée n’est pas une alternative : si le bluff est découvert, tu perds ta crédibilité, et ta cliente avec toi. L’offre réelle du club A suffisait.",q:"bad",g:[0,-20,-5,0]}]},{who:"Directeur sportif du club B",say:"« Nous pouvons augmenter le salaire de 10 % si elle signe quatre ans au lieu de deux. »",choices:[{t:"Nous acceptons : 10 % de plus, c’est bon à prendre.",react:"« Parfait. »",fb:"Quatre ans sans porte de sortie empêcheraient le départ à l’étranger dans deux ans. « Cette concession est-elle réellement dans l’intérêt de mon client ? » Non.",q:"bad",g:[5,0,-15,0]},{t:"Nous pouvons envisager trois ans si le contrat prévoit qu’elle puisse partir à l’étranger après deux saisons, selon des conditions définies.",react:"« Trois ans avec une condition de départ… c’est négociable. »",fb:"Concession conditionnelle (« nous pouvons envisager cela si… ») et cohérente avec les intérêts du mandant : la durée et certaines clauses sont des variables négociables.",q:"good",g:[5,5,15,0]},{t:"Non, deux ans, point final.",react:"« Alors on reste sur notre offre initiale. »",fb:"Tu protèges l’objectif de ta cliente, mais tu laisses de la valeur sur la table : une solution intermédiaire existait.",q:"ok",g:[0,-5,0,0]}]},{who:"Responsable partenariats d’une marque d’équipement",say:"« Nous proposons à Inès 20 000 € par an pour de la visibilité. »",choices:[{t:"Je demande 30 000 €.",react:"« C’est au-dessus de notre budget pour une joueuse émergente. »",fb:"Tu réduis la négociation au montant, alors que le cours invite à élargir la valeur créée.",q:"ok",g:[5,-5,0,0]},{t:"Je construis la proposition de valeur : Inès touche une jeune communauté et peut produire des contenus ; vous pourriez co-créer une paire signature locale. En échange : équipement, une rémunération, une part sur la paire, et une exclusivité limitée aux chaussures sur deux ans.",react:"« Une paire signature avec une joueuse qui monte… ça nous intéresse beaucoup. »",fb:"Les deux questions du cours (ce que la sportive apporte à la marque / ce que la marque lui apporte) et des variables au-delà de l’argent : produits, contenus, exclusivité limitée, durée — comme Osaka avec Levi’s ou Serena Williams avec Mission Skincare.",q:"good",g:[10,10,20,5]},{t:"J’accepte une exclusivité toutes catégories pendant cinq ans pour sécuriser le contrat.",react:"« Parfait pour nous ! »",fb:"Une exclusivité totale et longue bloque d’autres partenariats et le projet d’Inès : pas dans l’intérêt de la mandante.",q:"bad",g:[0,5,-15,0]}]}],debrief:"<p>L’agent mène <strong>deux négociations successives</strong> : obtenir le mandat (en partant des objectifs de la sportive et dans le cadre légal présenté par le support), puis le valoriser. Il distingue <strong>prix et valeur</strong>, utilise des <strong>alternatives crédibles</strong>, formule des <strong>concessions conditionnelles</strong> et vérifie toujours qu’elles servent <strong>l’intérêt de sa mandante</strong>.</p>"},{id:"marketone",s:"cas",title:"Commission contradictoire : TempoRun face à MarketOne",role:"Tu représentes <strong>TempoRun</strong> (cas du cours). Tu connais ton annexe confidentielle : seuil de 14 € de contribution par commande, budget publicitaire de 200 €/mois maximum et pas avant un test, 75 unités disponibles, retours de 8 %, proposition RunSphere à confirmer sous trois semaines. Les répliques de MarketOne sont simulées à partir du dossier.",them:"Responsable commercial de MarketOne",nodes:[{say:"Avec 120 commandes par mois, vous allez presque tripler vos ventes ! On démarre quand ?",choices:[{t:"Super, nous préparons la production pour 120 unités par mois.",react:"Parfait, je note.",fb:"Tu transformes une estimation en engagement de production — exactement ce que le dossier interdit. 120 commandes ne sont ni garanties ni justifiées.",q:"bad",g:[-15,5,-5,0]},{t:"Sur quelles données repose cette estimation de 120 commandes ? Suppose-t-elle de la publicité sponsorisée ? Que se passe-t-il si elle n’est pas atteinte ?",react:"C’est une estimation à partir des ventes de la catégorie… avec une mise en avant sponsorisée, en effet. Rien n’est garanti.",fb:"Tu questionnes l’hypothèse et découvres qu’elle suppose de la publicité : information décisive pour ta recommandation.",q:"good",g:[5,5,5,20]},{t:"Votre chiffre est inventé.",react:"Je ne vous permets pas…",fb:"Contester une faiblesse est utile, mais sans agressivité : questionne plutôt la méthode.",q:"ok",g:[0,-15,0,5]}]},{say:"Pour atteindre ce volume, je vous conseille la publicité sponsorisée : 350 € HT par mois.",choices:[{t:"D’accord, prenons-la dès le lancement.",react:"Excellent choix.",fb:"Hors budget (200 € maximum) et contraire à la consigne interne : pas d’engagement publicitaire payant avant d’avoir mesuré un test.",q:"bad",g:[-15,5,0,0]},{t:"Pouvez-vous nous la faire à 200 € ?",react:"Les tarifs standards ne sont pas négociables, vous le savez.",fb:"Le dossier le précise : ne pas bâtir sa stratégie sur une remise hypothétique d’un tarif standard.",q:"bad",g:[0,-5,0,0]},{t:"La publicité étant optionnelle, nous préférons un test de trois mois sans publicité payante, avec des indicateurs de suivi. Nous réexaminerons la question après le test, sur des résultats mesurés.",react:"C’est une démarche prudente. Je peux vous proposer des points de suivi mensuels.",fb:"Tu utilises une variable discutable (le test de trois mois, le suivi) et tu respectes tes limites internes.",q:"good",g:[10,5,10,5]}]},{say:"Quelle quantité pouvez-vous nous garantir au démarrage ?",choices:[{t:"Autant que vous voudrez.",react:"Très bien, je communique 120 unités au lancement.",fb:"Faux et dangereux : 75 unités disponibles, capacité de 210 unités par mois tous canaux. Un accord doit être réalisable.",q:"bad",g:[-10,5,-10,0]},{t:"75 unités tout de suite, puis un réassort avec notre prochain lot de production ; nous proposons un lancement progressif, ajusté selon les ventes du test.",react:"C’est honnête. Un lancement maîtrisé nous convient aussi.",fb:"Information confidentielle mais directement pertinente : tu la partages de façon factuelle, sans t’engager au-delà de ta capacité.",q:"good",g:[5,10,10,0]},{t:"120 unités : nous accélérerons la production.",react:"Parfait.",fb:"Chaque unité accélérée coûte 2,50 € de plus : la contribution tombe à 13 €, sous le seuil de 14 €. Pour un volume qui n’est même pas garanti.",q:"bad",g:[-20,5,0,0]}]},{say:"Les avis de votre site parlent de soucis de taille et de réglage. Cela m’inquiète pour les retours.",choices:[{t:"Il n’y a aucun problème de taille.",react:"Pourtant, les avis…",fb:"Nier une contrainte visible et pertinente, c’est déformer les faits et perdre en crédibilité.",q:"bad",g:[0,-15,0,0]},{t:"Nous avons identifié ces questions de réglage ; le guide des tailles vient d’être refait. Nous proposons de l’intégrer à la fiche produit et de suivre le taux de retour pendant le test.",react:"Une fiche avec un guide des tailles clair, c’est ce que nous demandons à nos vendeurs.",fb:"Explication factuelle + mesure correctrice, comme le prévoit le dossier, sans prétendre que l’amélioration est déjà prouvée (dix commandes seulement).",q:"good",g:[0,10,10,0]},{t:"Voici tout : 8 % de retours, 21 € de coût de fabrication et un seuil de 14 € par commande.",react:"Merci pour cette transparence… très complète.",fb:"Tu révèles des limites internes inutiles à l’accord. Le dossier : ne pas révéler automatiquement toutes ses informations internes.",q:"ok",g:[-5,5,0,0]}]},{say:"Vous parlez d’autres plateformes ? Aucune ne vous apportera notre trafic.",choices:[{t:"RunSphere nous garantit 45 commandes par mois.",react:"Garanti ? Vraiment ? Montrez-moi ça.",fb:"Faux : 30 à 45 commandes « sans garantie ». Surestimer sa BATNA, c’est la faiblesse que MarketOne pouvait exploiter.",q:"bad",g:[0,-15,0,0]},{t:"Nous étudions plusieurs options de distribution et choisirons la plus rentable et la plus sûre. Pour décider dans les prochaines semaines, nous avons besoin de vos réponses sur la prévision, le périmètre logistique et le suivi du test.",react:"Je vous envoie ces éléments d’ici la fin de la semaine.",fb:"Tu utilises ton alternative sans la dévoiler ni la déformer, et l’échéance de RunSphere (trois semaines) devient un levier pour obtenir les informations manquantes.",q:"good",g:[5,5,5,15]},{t:"Vous avez raison, nous ferons tout ce que vous demandez.",react:"Parfait.",fb:"Tu renonces à ta position de négociation alors que tu disposes d’une alternative réelle.",q:"bad",g:[-10,5,-10,0]}]},{say:"Alors, quelle est votre position ?",choices:[{t:"GO sous conditions : test de trois mois sans publicité payante, lancement progressif avec notre stock disponible, clarification écrite de la prévision et du périmètre logistique, indicateurs de suivi et possibilité d’arrêter après le test. En contrepartie, nous fournissons une fiche complète, le nouveau guide des tailles et un interlocuteur opérationnel.",react:"C’est une base solide. Je la fais valider en interne.",fb:"Recommandation argumentée, conditions précises, concessions liées à des contreparties, limites respectées : c’est ce qu’attendait la préparation du cas.",q:"good",g:[10,10,15,5]},{t:"Nous signons un engagement de douze mois dès maintenant.",react:"Excellent !",fb:"Engagement long sans test, sans réponses aux questions, sur la base d’une estimation non garantie.",q:"bad",g:[-10,5,-10,0]},{t:"NO GO : nous partons chez RunSphere.",react:"Dommage…",fb:"Prématuré : la contribution MarketOne (15,50 €) dépasse le seuil et des clarifications restent possibles ; RunSphere n’est pas garanti non plus.",q:"ok",g:[0,-10,-10,0]}]}],debrief:"<p>Le cas MarketOne / TempoRun entraîne à <strong>distinguer faits et hypothèses</strong> (120 commandes), à respecter ce qui n’est <strong>pas négociable</strong> (tarifs standards), à gérer l’<strong>information confidentielle</strong> (partager ce qui est directement pertinent, sans tout révéler ni déformer), à utiliser sa <strong>BATNA</strong> sans la surestimer et à conclure par un <strong>GO sous conditions</strong> argumenté.</p>"}];var Bs={id:"marketone",title:"MarketOne / TempoRun",badge:"Cas du cours",level:3,context:"Référencement d’une PME sur une marketplace",seances:["s1","s3","s2"],pitch:"TempoRun, PME d’accessoires de running, est invitée à vendre sa ceinture sur MarketOne, une marketplace généraliste. Prévision séduisante mais non garantie, tarifs non négociables, seuil de rentabilité interne, stock limité et une solution de repli confidentielle : il faut décider s’il faut y aller, et à quelles conditions.",intro:"Dossier reconstitué à partir des six photographies transmises par le professeur. La mission n’est pas de jouer le rendez-vous : il faut préparer la position de son organisation, les informations à obtenir, les points discutables et les limites à respecter.",commun:[{id:"CC1",title:"CC1 — Contexte partagé",html:"<p>TempoRun commercialise une ceinture de running dotée d’un rangement pour smartphone et clés, de deux porte-bidons souples et de détails réfléchissants. Le prix public envisagé est de <strong>60 € TTC</strong>. La marque vend déjà sur son propre site et cherche à élargir sa distribution.</p><p>MarketOne permet à des vendeurs tiers de proposer leurs produits sur sa marketplace. Elle organise l’accès au catalogue, les commandes, les options publicitaires et, pour les vendeurs qui le choisissent, un service logistique. <strong>Le référencement donne accès à la plateforme, mais ne garantit pas un volume de commandes ni une position précise dans les résultats.</strong></p><p><strong>Prévision communiquée</strong> : le responsable commercial de MarketOne a évoqué un potentiel de <strong>120 commandes par mois</strong>. La méthode de calcul de cette estimation n’a pas été communiquée dans les documents accessibles aux deux parties.</p>"},{id:"CC2",title:"CC2 — Proposition commerciale communiquée",html:'<table class="calc"><tbody><tr><th>Prix public</th><td>60 € TTC, soit 50 € HT (TVA 20 %)</td></tr><tr><th>Commission</th><td>15 % du prix de vente HT, à calculer sur 50 € HT</td></tr><tr><th>Abonnement professionnel</th><td>49 € HT par mois</td></tr><tr><th>Publicité sponsorisée</th><td>350 € HT par mois — optionnelle, non présentée comme obligatoire, sans garantie de résultat</td></tr><tr><th>Logistique MarketOne</th><td>4,50 € par commande — détail précis des prestations incluses à confirmer</td></tr><tr><th>Expédition par le vendeur</th><td>Estimation TempoRun : 5,80 € par commande — vérifier que le périmètre est comparable</td></tr></tbody></table><p>Pour le cas, <strong>la commission, l’abonnement et les tarifs standards de logistique et de publicité ne sont pas négociables individuellement</strong>. Les étudiants ne doivent donc pas bâtir leur stratégie sur une remise hypothétique de ces montants.</p><p>Un <strong>test de lancement sur trois mois</strong>, l’<strong>accompagnement technique</strong>, le <strong>calendrier de lancement</strong> et le <strong>suivi de performance</strong> peuvent être proposés ou discutés sous réserve de validation. Aucune vente, position de classement ou visibilité commerciale n’est garantie dans la proposition écrite.</p>'},{id:"CC3",title:"CC3 — Fiche produit publique TempoRun",html:"<p><strong>Produit</strong> : ceinture de running avec poche pour smartphone/clés et deux porte-bidons souples. <strong>Usage visé</strong> : course à pied et sorties d’entraînement nécessitant un rangement compact et un accès à l’hydratation. <strong>Différenciation mise en avant</strong> : rangement, hydratation et détails réfléchissants réunis dans un seul produit. <strong>Prix public</strong> : 60 € TTC.</p><p><strong>Avis visibles sur le site de TempoRun</strong> : note affichée de <strong>4,6/5 sur 38 avis</strong>. Les commentaires positifs citent la capacité de rangement ; plusieurs avis demandent des indications de réglage/de taille plus claires.</p><p>Cette fiche décrit les informations visibles par un client. Elle ne permet pas à elle seule de conclure sur le taux de retours, la capacité de production ou la rentabilité réelle de l’entreprise.</p>"},{id:"CC4",title:"CC4 — Observation simplifiée du rayon MarketOne",html:"<p>Document fictif établi pour le cas à partir d’une observation ponctuelle de la catégorie ; il ne constitue pas une étude exhaustive du marché.</p><ul><li><strong>Huit offres comparables</strong> sont observées dans la catégorie consultée.</li><li>Prix affichés : environ <strong>25 € à 75 € TTC</strong>.</li><li><strong>Trois produits</strong> observés associent une ceinture à deux porte-bidons.</li><li>Plusieurs produits apparaissent dans des <strong>emplacements sponsorisés</strong> ; la présence dans le catalogue ne garantit pas une place en haut des résultats.</li><li>Les avis mettent en avant le confort, la stabilité de la ceinture, la capacité et la facilité d’accès aux objets.</li></ul>"}],consignes:"<p>Distinguer systématiquement les <strong>faits établis</strong>, les <strong>hypothèses</strong> et les <strong>informations manquantes</strong>. Ne pas transformer une estimation de ventes en garantie commerciale. Ne pas supposer qu’une condition standardisée peut être négociée individuellement. Préparer les questions qui permettraient de sécuriser une décision. Les annexes de rôle contiennent des éléments confidentiels : <strong>ne pas les remettre à l’autre camp avant la commission contradictoire</strong>.</p>",camps:[{id:"B",name:"TempoRun",label:"Camp B — TempoRun",color:"l2",mission:"Déterminer si l’accès à MarketOne est réellement intéressant pour TempoRun, puis préparer les conditions indispensables à la poursuite du projet.",source:"Annexe photographiée — document du professeur.",annexe:'<h3>1. Objectifs et contraintes</h3><p>TempoRun souhaite développer les ventes et toucher une clientèle nouvelle, mais <strong>ne veut pas dépendre excessivement d’une seule plateforme</strong>. La direction refuse de confondre chiffre d’affaires supplémentaire et rentabilité.</p><p>La direction exige une <strong>contribution d’au moins 14 € par commande</strong> après fabrication, emballage, commission et expédition/fulfilment, mais avant abonnement, publicité, retours, frais de personnel et frais généraux. Ce seuil est un garde-fou de gestion, pas une mesure du bénéfice net.</p><p><strong>Budget publicitaire maximal : 200 € HT par mois</strong> pour les trois premiers mois. TempoRun ne souhaite pas prendre d’engagement publicitaire payant avant d’avoir mesuré les résultats d’un test.</p><h3>2. Données économiques internes</h3><p>Prix public : 60 € TTC, soit 50 € HT. Coût de fabrication : <strong>21 €</strong> par unité. Emballage : <strong>1,50 €</strong> par unité. Expédition par TempoRun : coût estimé de 5,80 € par commande ; comparer au fulfilment MarketOne et vérifier que le périmètre est comparable.</p><p>Ventes sur le site : en moyenne <strong>65 unités par mois</strong> au cours des trois derniers mois. Capacité mensuelle totale : <strong>jusqu’à 210 unités</strong>, tous canaux confondus, en rythme normal. Une prévision marketplace de 120 commandes en plus du canal direct utiliserait une grande partie de la capacité.</p><h3>3. Stock, retours et qualité</h3><p>TempoRun dispose actuellement de <strong>75 unités mobilisables</strong> pour un nouveau canal, distinctes du stock réservé aux commandes habituelles du site. Le prochain lot de production standard de <strong>100 unités</strong> sera disponible dans <strong>quatre semaines</strong>. Il est possible d’accélérer la fabrication de <strong>25 unités</strong> destinées au lancement pour les obtenir en deux semaines, mais cela ajouterait <strong>2,50 € de coût par unité accélérée</strong>.</p><p>Le taux de retour sur le site a été de <strong>8 %</strong> au dernier trimestre. Les retours concernent notamment le réglage et la compréhension de la taille. Le guide des tailles et le réglage ont récemment été améliorés ; <strong>seules dix commandes</strong> ont été passées depuis cette amélioration, ce qui ne suffit pas pour conclure à une baisse durable des retours.</p><p><strong>Point stratégique</strong> : ne pas cacher une contrainte si elle devient directement pertinente pour l’engagement envisagé. Préparer une explication factuelle et une mesure correctrice : lancement progressif, information produit améliorée et suivi des retours.</p><h3>4. Solution de repli confidentielle : RunSphere</h3><p>TempoRun a reçu une proposition indicative d’une autre marketplace spécialisée, RunSphere. Cette offre n’a pas encore été acceptée et son volume de ventes n’est pas garanti.</p><table class="calc"><tbody><tr><th>Commission</th><td>12 % du prix de vente HT</td></tr><tr><th>Abonnement</th><td>aucun abonnement mensuel</td></tr><tr><th>Expédition par TempoRun</th><td>5,20 € par commande estimés</td></tr><tr><th>Volume évoqué</th><td>30 à 45 commandes par mois, sans garantie</td></tr><tr><th>Publicité / visibilité</th><td>pas d’emplacement de lancement garanti</td></tr><tr><th>Échéance</th><td>RunSphere demande une réponse sous trois semaines</td></tr></tbody></table><p>Cette proposition constitue une alternative possible, pas une preuve que RunSphere générera les ventes annoncées. Il faut comparer le potentiel, la rentabilité, la visibilité et le risque de chaque option.</p><h3>5. Calculs à effectuer avant toute décision</h3><p>Prix de vente HT : 50 €. Commission MarketOne : 15 % × 50 € = 7,50 € par commande.</p><ul><li>Contribution avec logistique MarketOne : 50 − 7,50 − 21 − 1,50 − 4,50 = <strong>15,50 €</strong> par commande, avant coûts fixes et autres coûts non chiffrés.</li><li>Contribution si TempoRun expédie : 50 − 7,50 − 21 − 1,50 − 5,80 = <strong>14,20 €</strong> par commande.</li><li>Contribution avec RunSphere : 50 − 6 − 21 − 1,50 − 5,20 = <strong>16,30 €</strong> par commande.</li><li>Effet du coût accéléré : <strong>−2,50 €</strong> par unité accélérée.</li></ul><p>Rappel du document : les contributions ne sont pas des bénéfices nets. Les coûts de retours, frais généraux, service client et autres coûts non communiqués ne sont pas tous chiffrés.</p><h3>6. Préparation et commission contradictoire</h3><p>TempoRun doit préparer : sa recommandation (GO, GO sous conditions ou NO GO) ; son objectif prioritaire ; sa limite économique et sa limite opérationnelle ; les informations à obtenir de MarketOne ; ce qui pourrait être concédé et les contreparties attendues ; les conditions d’utilisation de RunSphere.</p><p>Pour la commission contradictoire, le camp TempoRun dispose de <strong>3 minutes</strong> pour présenter sa recommandation, ses calculs et ses conditions. Il doit ensuite questionner MarketOne et contester deux éléments de sa position. Il ne doit pas révéler automatiquement toutes ses informations internes : il doit déterminer ce qui doit être clarifié pour construire un accord viable sans déformer les faits.</p><p><strong>À préparer</strong> : trois questions à poser à MarketOne ; deux faiblesses de la position de MarketOne à examiner ; l’information adverse qui pourrait faire évoluer la recommandation.</p>'},{id:"A",name:"MarketOne",label:"Camp A — MarketOne",color:"l1",simulated:!0,mission:"Déterminer si le référencement de TempoRun est intéressant pour la marketplace, préparer les conditions de lancement et défendre le modèle économique et opérationnel de la plateforme.",source:"Simulation pédagogique : cette annexe n’a pas été fournie dans les photos. Elle est construite comme un rôle miroir plausible ; ce n’est pas le document réel du professeur.",annexe:"<h3>1. Objectifs et contraintes internes simulés</h3><p>MarketOne souhaite enrichir sa catégorie sport et plein air avec des produits spécialisés qui complètent les offres déjà présentes. La ceinture TempoRun semble pertinente parce qu’elle associe rangement et hydratation, mais MarketOne veut éviter d’intégrer une référence qui ne génère pas suffisamment de ventes ou qui crée trop de demandes de service client.</p><p>Objectif commercial interne simulé : obtenir un référencement actif et un lancement opérationnel dans un délai raisonnable. La marketplace souhaite conserver un modèle standardisé pour ses commissions et abonnements afin de traiter les vendeurs de manière cohérente. Les tarifs standards communiqués (15 % de commission, 49 € HT d’abonnement, 4,50 € de logistique par commande et 350 € HT de publicité sponsorisée optionnelle) ne sont pas négociables individuellement dans le cadre du cas.</p><p>MarketOne <strong>ne peut pas garantir 120 commandes mensuelles</strong>, une place dans les premiers résultats ni un volume minimal. La prévision de 120 commandes est une estimation commerciale, pas un engagement contractuel. Sa méthode doit être clarifiée avec prudence ; ne pas la présenter comme une garantie.</p><h3>2. Intérêts opérationnels simulés</h3><p>MarketOne souhaite que le vendeur fournisse des fiches produits complètes, des photographies de bonne qualité, des informations précises sur les tailles et le réglage, des stocks disponibles et un traitement fiable des commandes. Les avis publics signalant des demandes de précisions sur le réglage et la taille constituent un point à traiter avant le lancement.</p><p>MarketOne privilégie un <strong>lancement maîtrisé</strong> : disponibilité du stock, délais d’expédition respectés, taux d’annulation limité, service client réactif et suivi des retours. La plateforme veut éviter de lancer une campagne publicitaire si le produit ou le stock ne sont pas prêts.</p><h3>3. Éléments de négociation possibles dans cette simulation</h3><p>Les tarifs standardisés ne peuvent pas être remisés individuellement. En revanche, sous réserve de validation interne, les parties peuvent discuter du calendrier de lancement, d’un test de trois mois, des étapes d’intégration technique, des informations de reporting, du suivi des performances, des contenus de la fiche produit et du périmètre opérationnel du service logistique.</p><p>MarketOne peut demander à TempoRun de fournir un stock initial suffisant, de clarifier les dimensions et réglages du produit, d’améliorer les contenus de présentation et de définir un interlocuteur opérationnel. En contrepartie, MarketOne peut étudier un accompagnement technique au démarrage, un calendrier de mise en ligne coordonné et des points de suivi réguliers, sans promettre de ventes ni de classement.</p><h3>4. Informations à obtenir de TempoRun</h3><p>Quel stock peut être réellement affecté à la marketplace ? Quelle capacité de réapprovisionnement existe après les premières ventes ? Quels sont les délais de préparation et d’expédition ? Comment TempoRun compte-t-elle réduire les questions liées à la taille et au réglage ? Quel niveau de service client peut-elle assurer ? Quelle est sa capacité à absorber une hausse des commandes sans dégrader le canal direct ? Quels indicateurs accepterait-elle de suivre pendant un test ?</p><h3>5. Position de négociation simulée</h3><p><strong>Position de départ</strong> : proposer le référencement dans les conditions tarifaires standards, sous réserve que TempoRun fournisse les informations produit, le stock et les engagements opérationnels nécessaires. Ne pas garantir un volume de commandes ou une visibilité déterminée. <strong>Objectif</strong> : sécuriser une intégration fiable et un test mesurable. <strong>Variables de discussion</strong> : calendrier, accompagnement, contenu de la fiche, stock mobilisé, modalités de suivi et organisation logistique. <strong>Limites</strong> : pas de remise sur les tarifs standards du cas ; pas de promesse de volume, de classement ou de visibilité non contractualisée.</p><h3>6. Trois questions à poser à TempoRun</h3><p>Quelle quantité pouvez-vous garantir au démarrage et réapprovisionner ensuite ? Comment allez-vous traiter les questions de taille et de réglage soulevées dans les avis ? Quels indicateurs et quel rythme de suivi vous sembleraient pertinents pendant les trois mois de test ?</p><h3>7. Faiblesses possibles de la position TempoRun</h3><p>TempoRun peut surestimer la valeur de son alternative RunSphere alors que le volume annoncé n’est pas garanti et que la visibilité n’est pas assurée. TempoRun peut également sous-estimer le risque opérationnel lié à la capacité disponible, au stock de lancement et aux retours. Ces points sont des axes de questionnement, pas des faits supplémentaires sur l’entreprise.</p><h3>8. Informations adverses susceptibles de faire évoluer la recommandation</h3><p>Une capacité réelle de lancement plus faible que celle annoncée, des difficultés de réapprovisionnement ou un niveau de retours préoccupant pourraient conduire MarketOne à proposer un lancement plus progressif ou à différer le référencement. À l’inverse, une disponibilité de stock fiable, des contenus produit améliorés et des engagements opérationnels crédibles renforceraient l’intérêt du référencement.</p>"}],steps:[{id:"m-contexte",camp:null,title:"Situer le contexte",seances:["s1","s3"],q:"De quel type de négociation spécifique s’agit-il ? Caractérise-la sur les quatre dimensions du cours en citant des indices du dossier.",keys:["Référencement (sur une marketplace) : intégrer un fournisseur dans l’offre d’une plateforme","Cadre plutôt encadré : tarifs standards non négociables, seuls certains points discutables sous réserve de validation","Processus : proposition écrite, préparation, commission contradictoire, test éventuel","Information asymétrique : annexes confidentielles de chaque camp, méthode de la prévision inconnue","Indices cités à partir du dossier"],model:"<p>Il s’agit d’un <strong>référencement</strong> : TempoRun cherche à intégrer son produit dans l’offre de MarketOne, comme un fournisseur face à une enseigne — ici une marketplace qui contrôle l’accès à son catalogue et à sa clientèle.</p><ul><li><strong>Cadre</strong> : plutôt fortement encadré. La commission, l’abonnement, la logistique et la publicité sont des tarifs standards non négociables individuellement ; seuls le test de trois mois, l’accompagnement, le calendrier et le suivi sont discutables, et « sous réserve de validation ».</li><li><strong>Temporalité</strong> : un processus en plusieurs étapes (proposition écrite → préparation → commission contradictoire → éventuel test de lancement → décision).</li><li><strong>Acteurs</strong> : deux organisations ; côté MarketOne, le responsable commercial n’est pas le seul décideur (validation interne).</li><li><strong>Information</strong> : fortement asymétrique. TempoRun connaît ses coûts, son seuil de 14 €, ses retours et RunSphere ; MarketOne connaît la méthode de sa prévision de 120 commandes. Question clé : « Qui sait quoi ? »</li></ul>",pitfalls:["Parler d’appel d’offres : il n’y a ni cahier des charges, ni mise en concurrence formalisée, ni échéance de dépôt.","Oublier que le cadre limite fortement ce qui est négociable."]},{id:"m-faits",camp:null,title:"Faits, hypothèses, informations manquantes",seances:["s1"],q:"À partir du dossier commun uniquement, relève au moins trois faits établis, deux hypothèses et trois informations manquantes. Explique pourquoi ce tri est indispensable avant de négocier.",keys:["Faits : prix 60 € TTC / commission 15 % / abonnement 49 € / note 4,6 sur 38 avis / 8 offres observées…","Hypothèse : 120 commandes par mois (méthode non communiquée)","Hypothèse : la logistique MarketOne serait comparable à l’expédition par TempoRun","Manquants : méthode de la prévision, périmètre exact de la logistique, visibilité sans publicité, taux de retour réel sur la plateforme…","Justification : ne pas transformer une estimation en garantie ; les manques deviennent les questions à poser"],model:"<p><strong>Faits établis</strong> : prix public de 60 € TTC (50 € HT) ; commission de 15 % du HT ; abonnement de 49 € HT/mois ; publicité optionnelle à 350 € HT/mois sans garantie ; note de 4,6/5 sur 38 avis avec des demandes de précisions sur la taille ; huit offres comparables observées (observation ponctuelle, non exhaustive).</p><p><strong>Hypothèses</strong> : le potentiel de 120 commandes par mois (estimation orale, méthode non communiquée) ; l’idée que la logistique MarketOne à 4,50 € couvre le même périmètre que l’expédition par TempoRun à 5,80 € (à vérifier).</p><p><strong>Informations manquantes</strong> : la méthode de la prévision (et si elle suppose de la publicité) ; le détail des prestations logistiques ; la visibilité réelle sans publicité ; les modalités et indicateurs du test ; la durée d’engagement.</p><p>Ce tri est indispensable car le dossier interdit de transformer une estimation en garantie : une décision construite sur 120 commandes « certaines » serait fausse. Les informations manquantes deviennent directement les <strong>questions à poser</strong> lors de la commission contradictoire.</p>",pitfalls:["Classer les 120 commandes parmi les faits.","Utiliser des informations des annexes confidentielles dans le tri du dossier commun."]},{id:"m-calculs",camp:"B",title:"Les calculs avant toute décision",seances:["s2","s3"],q:"Calcule la contribution par commande dans les trois scénarios (logistique MarketOne, expédition par TempoRun, RunSphere) et l’effet d’une unité accélérée. Interprète ces résultats au regard du seuil de 14 €.",keys:["Commission MarketOne 7,50 € (15 % × 50 € HT)","15,50 € avec la logistique MarketOne ; 14,20 € si TempoRun expédie","16,30 € avec RunSphere (commission 6 €, pas d’abonnement)","Unité accélérée : 13,00 € ou 11,70 € → sous le seuil","Interprétation : contributions ≠ bénéfices nets (abonnement, retours, service client non déduits)"],model:'<table class="calc"><thead><tr><th>Scénario</th><th>Calcul</th><th>Contribution</th></tr></thead><tbody><tr><td>Logistique MarketOne</td><td>50 − 7,50 − 21 − 1,50 − 4,50</td><td>15,50 €</td></tr><tr><td>TempoRun expédie</td><td>50 − 7,50 − 21 − 1,50 − 5,80</td><td>14,20 €</td></tr><tr><td>RunSphere</td><td>50 − 6 − 21 − 1,50 − 5,20</td><td>16,30 €</td></tr><tr><td>Unité accélérée (logistique MarketOne)</td><td>15,50 − 2,50</td><td>13,00 €</td></tr><tr><td>Unité accélérée (TempoRun expédie)</td><td>14,20 − 2,50</td><td>11,70 €</td></tr></tbody></table><p><strong>Interprétation</strong> : sans production accélérée, MarketOne respecte le seuil de 14 €, mais de justesse si TempoRun expédie elle-même (14,20 €) : la logistique MarketOne est plus favorable… à condition que son périmètre soit comparable (à vérifier). Toute unité accélérée passe <strong>sous le seuil</strong> : il ne faut pas accélérer la production pour suivre une prévision non garantie. Enfin, ces montants ne sont pas des bénéfices : il reste l’abonnement de 49 € par mois (sur MarketOne uniquement), les retours (8 % sur le site), le service client et les frais généraux. À contribution comparable, RunSphere rapporte plus par commande et n’a pas d’abonnement, mais son volume n’est pas garanti.</p>',pitfalls:["Calculer la commission sur le TTC (9 €).","Présenter 15,50 € comme un bénéfice net.","Oublier l’abonnement mensuel dans la comparaison avec RunSphere."]},{id:"m-force",camp:"B",title:"Rapport de force et alternatives",seances:["s3","s1"],q:"Qui dépend le plus de l’autre ? Identifie la BATNA de chaque partie et évalue sa crédibilité.",keys:["TempoRun peu dépendante : canal direct (65 ventes/mois) et alternative RunSphere","RunSphere : réelle mais indicative, volume non garanti, pas de visibilité garantie, échéance de 3 semaines","MarketOne : produits substituables (8 offres, 3 à deux porte-bidons) = alternatives","Attractivité de l’offre TempoRun : produit différencié et bien noté, mais pas unique","Conclusion argumentée sur le rapport de force (plutôt équilibré, nuancé)"],model:"<p><strong>TempoRun</strong> ne dépend pas de MarketOne : elle vend déjà 65 unités par mois sur son site et dispose d’une alternative, RunSphere (meilleure contribution, sans abonnement). Mais cette BATNA est <strong>fragile</strong> : proposition seulement indicative, volume de 30 à 45 commandes non garanti, aucun emplacement de lancement assuré, et réponse exigée sous trois semaines.</p><p><strong>MarketOne</strong> a aussi des alternatives : l’observation du rayon montre huit offres comparables, dont trois ceintures à deux porte-bidons. La ceinture TempoRun est attractive (rangement + hydratation + réfléchissants, 4,6/5) mais <strong>substituable</strong>.</p><p><strong>Conclusion</strong> : le rapport de force est plutôt équilibré. MarketOne contrôle l’accès à sa clientèle et à la visibilité (emplacements sponsorisés) ; TempoRun n’en dépend pas et peut refuser un accord qui ne respecte pas ses limites. Sa position sera d’autant plus solide qu’elle utilise RunSphere sans le surestimer.</p>",pitfalls:["Affirmer que MarketOne est forcément en position de force car « plus grosse ».","Présenter RunSphere comme une certitude."]},{id:"m-limites",camp:"B",title:"Objectif prioritaire et limites",seances:["s2","s3"],q:"Formule l’objectif prioritaire de TempoRun, sa limite économique et sa limite opérationnelle.",keys:["Objectif : toucher une clientèle nouvelle de façon rentable, sans dépendance excessive (tester le canal)","Limite économique : contribution ≥ 14 € par commande","Limite économique (suite) : pas de publicité payante avant le test, 200 € HT/mois maximum","Limite opérationnelle : stock de 75 unités, lot de 100 dans 4 semaines, capacité 210/mois tous canaux sans dégrader le site","Conséquence : pas de production accélérée ni d’engagement de volume"],model:"<p><strong>Objectif prioritaire</strong> : développer les ventes auprès d’une clientèle nouvelle <strong>sans sacrifier la rentabilité ni créer de dépendance</strong> — donc tester le canal MarketOne dans des conditions maîtrisées avant tout engagement durable.</p><p><strong>Limite économique</strong> : une contribution d’au moins 14 € par commande (respectée à 15,50 € avec la logistique MarketOne, 14,20 € si TempoRun expédie, jamais avec une unité accélérée) ; aucune publicité payante avant d’avoir mesuré un test, et 200 € HT/mois au maximum ensuite — la publicité MarketOne à 350 € est donc exclue pendant le lancement.</p><p><strong>Limite opérationnelle</strong> : 75 unités disponibles tout de suite, un lot de 100 dans quatre semaines, une capacité de 210 unités par mois tous canaux, dont 65 déjà absorbées par le site ; ne pas dégrader le canal direct. TempoRun ne peut donc pas s’engager sur 120 commandes dès le premier mois.</p>",pitfalls:["Donner une limite unique (le prix) sans limite opérationnelle."]},{id:"m-reco",camp:"B",title:"La recommandation",seances:["s2","s3"],q:"Rédige la recommandation de TempoRun (GO, GO sous conditions ou NO GO) et justifie-la.",keys:["GO sous conditions (justifié)","Conditions : test de 3 mois, pas de publicité payante pendant le test","Conditions : clarification de la prévision et du périmètre logistique","Conditions : lancement progressif avec le stock disponible, indicateurs de suivi, possibilité d’arrêter","Lien avec RunSphere et son échéance de 3 semaines"],model:"<p><strong>Recommandation : GO sous conditions.</strong></p><p><strong>Pourquoi pas NO GO ?</strong> La contribution avec la logistique MarketOne (15,50 €) dépasse le seuil de 14 €, la plateforme offre l’accès à une clientèle nouvelle, et un test permet de mesurer le potentiel sans engagement lourd. <strong>Pourquoi pas GO ?</strong> La prévision de 120 commandes n’est ni justifiée ni garantie, la visibilité sans publicité est incertaine, le périmètre logistique est à confirmer et la capacité est limitée.</p><p><strong>Conditions</strong> : (1) un test de trois mois, <strong>sans publicité payante</strong> ; (2) une réponse écrite sur la méthode de la prévision et sur le périmètre de la logistique à 4,50 € ; (3) un lancement progressif avec les 75 unités disponibles puis le lot suivant, sans production accélérée ; (4) des indicateurs de suivi partagés (ventes, conversion, retours, avis, délais) et la possibilité d’arrêter à l’issue du test. Ces réponses doivent arriver <strong>avant l’échéance de RunSphere</strong> (trois semaines), afin de pouvoir choisir en connaissance de cause.</p>",pitfalls:["« GO sous conditions » sans conditions précises.","Recommander la publicité sponsorisée."]},{id:"m-concessions",camp:"B",title:"Concessions et contreparties",seances:["s2","s3"],q:"Que TempoRun peut-elle concéder à MarketOne, et quelles contreparties doit-elle demander ? Présente-le sous forme de tableau.",keys:["Ne pas chercher de remise sur les tarifs standards (non négociables)","Concessions possibles : stock dédié, fiche produit complète et guide des tailles, photos, interlocuteur opérationnel","Concessions possibles : engagements de délais d’expédition, partage d’indicateurs, éventuellement choix de la logistique MarketOne","Contreparties : accompagnement technique, calendrier coordonné, points de suivi, sortie possible après le test","Chaque concession liée à une contrepartie et cohérente avec les limites"],model:'<table class="calc"><thead><tr><th>TempoRun peut concéder</th><th>Contre</th></tr></thead><tbody><tr><td>Un stock dédié au lancement (75 unités) et un réassort planifié</td><td>Un calendrier de mise en ligne coordonné avec sa production</td></tr><tr><td>Une fiche produit complète : photos, guide des tailles et réglage refaits</td><td>Un accompagnement technique au démarrage (intégration du catalogue)</td></tr><tr><td>Un interlocuteur opérationnel et des engagements de délais d’expédition</td><td>Des points de suivi réguliers et un reporting partagé</td></tr><tr><td>L’utilisation de la logistique MarketOne (si le périmètre est confirmé)</td><td>Une description écrite des prestations incluses (stockage, retours)</td></tr><tr><td>Le partage des indicateurs du test (ventes, retours, avis)</td><td>La possibilité d’arrêter ou d’ajuster après trois mois, sans engagement publicitaire</td></tr></tbody></table><p>TempoRun ne demande <strong>aucune remise</strong> sur les tarifs standards : ce serait bâtir sa stratégie sur une hypothèse que le dossier exclut. Ses concessions répondent aux intérêts réels de MarketOne (fiabilité, contenus, stock) — c’est ce qui leur donne de la valeur.</p>',pitfalls:["Demander une baisse de la commission ou de la publicité.","Proposer d’accélérer la production comme concession."]},{id:"m-commission",camp:"B",title:"Préparer la commission contradictoire",seances:["s2","s1"],q:"Prépare trois questions à poser à MarketOne, deux faiblesses de sa position à examiner, et l’information adverse qui pourrait faire évoluer ta recommandation.",keys:["Question sur la méthode de la prévision (données, publicité incluse ?)","Question sur le périmètre de la logistique à 4,50 € (stockage, retours…)","Question sur les modalités du test : indicateurs, rythme de suivi, durée d’engagement","Faiblesses : prévision non justifiée et non garantie ; visibilité non garantie sans publicité (emplacements sponsorisés) ; produits substituables…","Information adverse : ex. prévision fondée sur des ventes réelles sans publicité (plus favorable) ou exigence de stock minimal / logistique excluant les retours (moins favorable)"],model:"<p><strong>Trois questions</strong> : (1) « Sur quelles données repose l’estimation de 120 commandes par mois, et suppose-t-elle une publicité sponsorisée ? » (2) « Que comprend exactement la logistique à 4,50 € : stockage, préparation, expédition, gestion des retours ? » (3) « Quels indicateurs suivrons-nous pendant le test de trois mois, à quel rythme, et quelles sont les conditions de sortie ? »</p><p><strong>Deux faiblesses de la position de MarketOne</strong> : la prévision de 120 commandes n’a pas de méthode communiquée et n’engage pas MarketOne — elle ne peut donc pas justifier un engagement de TempoRun ; la visibilité n’est pas garantie : plusieurs produits apparaissent en emplacements sponsorisés, ce qui laisse penser que, sans publicité à 350 €, la ceinture pourrait rester peu visible.</p><p><strong>Information adverse qui ferait évoluer la recommandation</strong> : si MarketOne démontre que la prévision repose sur des ventes réelles de produits comparables <strong>sans publicité</strong>, la recommandation se renforce (GO plus large) ; si elle révèle que la prévision suppose la publicité, que la logistique exclut les retours ou qu’un stock minimal supérieur à la capacité est exigé, elle se durcit (lancement plus réduit, voire choix de RunSphere).</p>",pitfalls:["Poser des questions dont la réponse est déjà dans le dossier.","Attaquer MarketOne sur des tarifs non négociables."]},{id:"m-runsphere",camp:"B",title:"Les conditions d’utilisation de RunSphere",seances:["s3","s4"],q:"Comment TempoRun doit-elle utiliser l’alternative RunSphere, avant et pendant la négociation ?",keys:["RunSphere = BATNA : base de comparaison (16,30 €, pas d’abonnement)","Ne pas la surestimer : volume non garanti, pas de visibilité garantie","L’évoquer sans en dévoiler les conditions ni la déformer","Échéance de 3 semaines : obtenir les réponses de MarketOne avant","Capacité : les deux canaux ensemble pourraient dépasser 210 unités/mois"],model:"<p>RunSphere est la <strong>solution de repli</strong> de TempoRun : elle sert d’abord de <strong>référence de comparaison</strong>. Avec 16,30 € par commande et sans abonnement, elle reste plus rentable à volume égal ; MarketOne n’a d’intérêt que si elle apporte nettement plus de ventes (par exemple, il faut environ 35 commandes MarketOne pour égaler 30 commandes RunSphere, abonnement compris).</p><p>En négociation, TempoRun peut <strong>évoquer l’existence d’autres options de distribution</strong>, sans en dévoiler les conditions et surtout sans la présenter comme garantie : ce serait déformer les faits, et MarketOne pourrait facilement le contester.</p><p>L’<strong>échéance de trois semaines</strong> impose un calendrier : TempoRun doit obtenir de MarketOne les clarifications (prévision, logistique, test) avant de répondre à RunSphere. Enfin, accepter les deux canaux à plein régime pourrait dépasser la capacité de 210 unités par mois (65 sur le site + 120 + 30 à 45) : le choix doit rester réalisable.</p>",pitfalls:["Annoncer à MarketOne que RunSphere garantit des ventes.","Oublier l’échéance de trois semaines."]},{id:"m-interet",camp:"A",title:"L’intérêt du référencement pour MarketOne",seances:["s3"],q:"Pourquoi la ceinture TempoRun intéresse-t-elle MarketOne, et quels risques la plateforme veut-elle éviter ?",keys:["Enrichir la catégorie sport et plein air avec un produit spécialisé et complémentaire","Produit pertinent : rangement + hydratation + réfléchissants, bien noté","Risque : une référence qui ne se vend pas assez","Risque : trop de demandes de service client (tailles, réglage) et de retours","Besoin : lancement maîtrisé (stock, délais, contenus)"],model:"<p>La ceinture répond à un besoin de la catégorie sport et plein air que MarketOne veut enrichir : elle associe rangement et hydratation, avec des détails réfléchissants, et elle est bien notée (4,6/5). C’est un produit spécialisé qui complète l’offre — la question centrale du référencement (« le produit répond-il aux besoins des clients ? ») reçoit une réponse plutôt positive.</p><p>Mais MarketOne veut éviter deux risques : une référence qui <strong>ne génère pas assez de ventes</strong>, et une référence qui <strong>crée des demandes de service client</strong> — les avis publics sur la taille et le réglage sont un signal d’alerte. D’où sa préférence pour un lancement maîtrisé : stock disponible, délais respectés, fiche produit complète, suivi des retours.</p>",pitfalls:["Raisonner uniquement en commissions encaissées."]},{id:"m-cadreA",camp:"A",title:"Ce qui se discute, ce qui ne se discute pas",seances:["s1","s2"],q:"Distingue ce que MarketOne ne peut pas négocier et ce qu’elle peut discuter avec TempoRun. Pourquoi ne pas garantir 120 commandes ?",keys:["Non négociable : commission 15 %, abonnement 49 €, logistique 4,50 €, publicité 350 €","Non : garantie de volume, de classement ou de visibilité","Discutable : test de 3 mois, calendrier, intégration technique, reporting, fiche produit, périmètre logistique","Les 120 commandes sont une estimation, pas un engagement contractuel","Modèle standardisé = traitement cohérent des vendeurs"],model:"<p><strong>Non négociable</strong> : les tarifs standards (15 % de commission, 49 € d’abonnement, 4,50 € de logistique, 350 € de publicité) — MarketOne veut traiter tous ses vendeurs de manière cohérente ; et toute garantie de volume, de classement ou de visibilité.</p><p><strong>Discutable</strong>, sous réserve de validation interne : le calendrier de lancement, un test de trois mois, les étapes d’intégration technique, le reporting et le suivi des performances, les contenus de la fiche produit et le périmètre opérationnel du service logistique.</p><p>Les 120 commandes sont une <strong>estimation commerciale</strong> : la présenter comme une garantie engagerait MarketOne sur un résultat qu’elle ne maîtrise pas, et fausserait la négociation. Il faut au contraire en expliquer la méthode avec prudence.</p>",pitfalls:["Proposer une remise sur l’abonnement pour convaincre TempoRun."]},{id:"m-questionsA",camp:"A",title:"Questions et faiblesses de TempoRun",seances:["s2","s3"],q:"Prépare trois questions à poser à TempoRun et deux faiblesses de sa position à examiner.",keys:["Question : stock garanti au démarrage et capacité de réapprovisionnement","Question : traitement des questions de taille et de réglage","Question : indicateurs et rythme de suivi pendant le test","Faiblesse : alternative (RunSphere) possiblement surestimée — volume et visibilité non garantis","Faiblesse : risque opérationnel sous-estimé (capacité, stock, retours) — axes de questionnement, pas des faits"],model:"<p><strong>Questions</strong> : « Quelle quantité pouvez-vous garantir au démarrage et réapprovisionner ensuite ? » ; « Comment allez-vous traiter les questions de taille et de réglage soulevées dans les avis ? » ; « Quels indicateurs et quel rythme de suivi vous sembleraient pertinents pendant les trois mois de test ? »</p><p><strong>Faiblesses à examiner</strong> : TempoRun peut surestimer son alternative (si elle en a une, son volume et sa visibilité ne sont probablement pas garantis) ; elle peut sous-estimer le risque opérationnel lié à sa capacité, à son stock de lancement et aux retours. Ce sont des <strong>axes de questionnement</strong>, pas des faits : MarketOne ne connaît pas l’annexe de TempoRun.</p>",pitfalls:["Affirmer comme des faits des informations que MarketOne ne connaît pas."]},{id:"m-propositionA",camp:"A",title:"La proposition de lancement de MarketOne",seances:["s3"],q:"Construis la proposition de MarketOne : position de départ, objectif, variables et contreparties demandées à TempoRun.",keys:["Position de départ : référencement aux conditions standards, sous réserve d’informations produit, de stock et d’engagements","Objectif : intégration fiable et test mesurable","Variables : calendrier, accompagnement, fiche, stock, suivi, logistique","Demandes : stock initial, guide des tailles, contenus, interlocuteur opérationnel","Contreparties offertes : accompagnement au démarrage, calendrier coordonné, points de suivi — sans promesse de ventes"],model:"<p><strong>Position de départ</strong> : référencer TempoRun aux conditions tarifaires standards, sous réserve qu’elle fournisse les informations produit, le stock et les engagements opérationnels nécessaires. <strong>Objectif</strong> : une intégration fiable et un test mesurable sur trois mois.</p><p><strong>Demandes à TempoRun</strong> : un stock initial suffisant et un plan de réapprovisionnement, des informations claires sur les tailles et le réglage, des contenus améliorés (photos, fiche), un interlocuteur opérationnel. <strong>Contreparties offertes</strong> : un accompagnement technique au démarrage, un calendrier de mise en ligne coordonné et des points de suivi réguliers — <strong>sans promettre de ventes ni de classement</strong>.</p><p>MarketOne n’a pas intérêt à pousser la publicité tant que le produit et le stock ne sont pas prêts : un lancement progressif sert aussi ses intérêts.</p>",pitfalls:["Promettre de la visibilité en échange."]}],debrief:{B:"<p><strong>Ce que tu découvres dans l’annexe (simulée) de MarketOne</strong> : la plateforme ne peut garantir ni volume ni classement ; elle privilégie elle aussi un <strong>lancement maîtrisé</strong> et ne veut pas de campagne publicitaire si le produit ou le stock ne sont pas prêts ; elle attend une fiche complète, un guide des tailles clair, un stock fiable et un interlocuteur opérationnel, et peut offrir accompagnement, calendrier coordonné et suivi.</p><p><strong>Conséquence</strong> : ta recommandation « GO sous conditions » rejoint les intérêts de MarketOne. Le test de trois mois sans publicité, le lancement progressif et le suivi des retours ne sont pas des concessions arrachées : ce sont des <strong>intérêts communs</strong>. Ton meilleur levier n’est pas RunSphere, mais la qualité de ta fiche produit et la fiabilité de tes engagements. Attention : MarketOne avait anticipé que tu pourrais surestimer ton alternative et sous-estimer ton risque opérationnel.</p>",A:"<p><strong>Ce que révèle l’annexe de TempoRun</strong> : un seuil de 14 € de contribution par commande (respecté avec la logistique MarketOne, 15,50 €, mais pas avec une production accélérée) ; un budget publicitaire de 200 € maximum et pas avant un test — la publicité à 350 € n’a aucune chance d’être acceptée au lancement ; 75 unités disponibles et une capacité de 210 unités par mois tous canaux — 120 commandes dès le premier mois sont impossibles ; un taux de retour de 8 % lié à la taille ; et une alternative, RunSphere, plus rentable par commande mais non garantie, avec une échéance de trois semaines.</p><p><strong>Conséquence</strong> : pour conclure, MarketOne a intérêt à proposer vite un test progressif, sans publicité imposée, avec un accompagnement sur la fiche produit et un suivi des retours — et à clarifier sa prévision avant que TempoRun ne réponde à RunSphere.</p>"},synthese:"<p><strong>Un accord réaliste</strong> : un test de trois mois aux conditions standards, <strong>sans publicité payante</strong> pendant le test ; un lancement progressif avec les 75 unités disponibles puis le lot suivant (pas de production accélérée) ; la logistique MarketOne si son périmètre (stockage, retours) est confirmé par écrit — elle porte la contribution à 15,50 € contre 14,20 € ; une fiche produit enrichie du nouveau guide des tailles ; un interlocuteur opérationnel et des engagements de délais ; des indicateurs partagés (ventes, conversion, retours, avis, délais) et un point mensuel ; une décision de poursuite à l’issue du test. TempoRun obtient les clarifications sur la prévision avant l’échéance de RunSphere.</p><p>Ce cas illustre toute la méthode : <strong>analyser avant de décider</strong>, distinguer faits et hypothèses, respecter le cadre (tarifs non négociables), raisonner en <strong>rentabilité</strong> et non en chiffre d’affaires, utiliser sa BATNA sans la surestimer, et construire un accord <strong>acceptable, économiquement viable et réalisable</strong>.</p>"};var Hs={id:"velos",title:"Les vélos de service de Montferrand",badge:"Cas d’entraînement",level:2,context:"Appel d’offres avec phase de négociation",seances:["s2","s1"],pitch:"Une ville lance un appel d’offres pour louer et entretenir 50 vélos à assistance électrique. Une PME locale est la mieux notée… mais son prix dépasse le budget que la ville s’est fixé. Phase de négociation autorisée : qui cède quoi, et contre quoi ?",intro:"Cas inventé pour l’entraînement (personnes et organisations fictives). Il applique la démarche de la séance 2 : analyser la consultation, décider, identifier les marges de manœuvre, construire l’offre, préparer la négociation.",commun:[{id:"D1",title:"Avis de consultation (extraits)",html:'<table class="calc"><tbody><tr><th>Acheteur</th><td>Ville de Montferrand-sur-Orge (32 000 habitants), service de la commande publique</td></tr><tr><th>Objet</th><td>Location longue durée et maintenance de <strong>50 vélos à assistance électrique</strong> pour les déplacements professionnels des agents municipaux</td></tr><tr><th>Durée</th><td>36 mois</td></tr><tr><th>Montant maximal</th><td>110 000 € HT sur la durée du marché</td></tr><tr><th>Critères d’attribution</th><td>Prix : <strong>40 %</strong> — valeur technique (mémoire technique : organisation de la maintenance, moyens, formation des agents) : <strong>40 %</strong> — délai de remplacement d’un vélo immobilisé : <strong>20 %</strong></td></tr><tr><th>Exigences</th><td>Remplacement d’un vélo immobilisé sous <strong>72 heures maximum</strong> ; attestation d’assurance responsabilité civile professionnelle ; entretien préventif <strong>trimestriel</strong> de chaque vélo ; livraison des 50 vélos <strong>avant le 1er mars</strong></td></tr><tr><th>Offre financière</th><td>Prix par vélo et par mois, options comprises (casque et antivol, formation)</td></tr><tr><th>Négociation</th><td>Le règlement prévoit une négociation avec les <strong>trois candidats les mieux classés</strong>, portant sur le prix, le délai de remplacement, les modalités d’exécution et les options</td></tr><tr><th>Variantes</th><td>Non autorisées</td></tr></tbody></table>'},{id:"D2",title:"Situation à ce jour",html:"<p>Trois candidats ont été retenus pour la phase de négociation : <strong>CycloPro Mobilités</strong>, <strong>VéloFlotte</strong> et <strong>Mobilia</strong>. CycloPro, PME de 18 salariés installée dans le département, loue et entretient des vélos pour des entreprises ; c’est sa première réponse à un marché public. Son offre déposée : <strong>58 € HT par vélo et par mois</strong>, casque et antivol compris, remplacement sous 48 heures, deux sessions de formation des agents incluses.</p><p>La Ville a convoqué CycloPro à un entretien de négociation la semaine prochaine. Seront présents : la responsable de la commande publique, la responsable du service technique et le DRH.</p>"}],consignes:"<p>Chaque camp prépare la négociation à partir du dossier commun et de son annexe. Distingue ce qui est imposé par la consultation (non négociable) de ce que le règlement permet
